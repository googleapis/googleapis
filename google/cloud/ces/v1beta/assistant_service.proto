syntax = "proto3";

package google.cloud.ces.v1beta;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/ces/v1beta/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "cloud.google.com/go/ces/apiv1beta/cespb;cespb";
option java_multiple_files = true;
option java_outer_classname = "AssistantServiceProto";
option java_package = "com.google.cloud.ces.v1beta";

// The service that manages assistant-related resources in Customer Engagement
// Suite (CES). The assistant, Arc, is a conversational agent embedded in CES
// applications to help users with building their agents.
service AssistantService {
  option (google.api.default_host) = "ces.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/ces,"
      "https://www.googleapis.com/auth/cloud-platform";

  // Lists all assistant sessions in the given app.
  rpc ListAssistantSessions(ListAssistantSessionsRequest)
      returns (ListAssistantSessionsResponse) {
    option (google.api.http) = {
      get: "/v1beta/{parent=projects/*/locations/*/apps/*}/assistantSessions"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of the specified assistant session.
  rpc GetAssistantSession(GetAssistantSessionRequest)
      returns (AssistantSession) {
    option (google.api.http) = {
      get: "/v1beta/{name=projects/*/locations/*/apps/*/assistantSessions/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a new assistant session in the given app.
  rpc CreateAssistantSession(CreateAssistantSessionRequest)
      returns (AssistantSession) {
    option (google.api.http) = {
      post: "/v1beta/{parent=projects/*/locations/*/apps/*}/assistantSessions"
      body: "*"
    };
    option (google.api.method_signature) = "parent,assistant_session_id";
  }

  // Deletes the specified assistant session.
  rpc DeleteAssistantSession(DeleteAssistantSessionRequest)
      returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1beta/{name=projects/*/locations/*/apps/*/assistantSessions/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Runs the assistant agent for the specified assistant session.
  rpc RunAssistant(RunAssistantRequest) returns (RunAssistantResponse) {
    option (google.api.http) = {
      post: "/v1beta/{app=projects/*/locations/*/apps/*}:runAssistant"
      body: "*"
    };
  }

  // Runs Arc, the AI assistant, for the specified assistant session.
  rpc ChatAiAssistant(ChatAiAssistantRequest)
      returns (ChatAiAssistantResponse) {
    option (google.api.http) = {
      post: "/v1beta/{app=projects/*/locations/*/apps/*}:chatAiAssistant"
      body: "*"
    };
  }
}

// The status of the assistant session.
enum AssistantSessionState {
  // The default value. This value is used if the status is not specified.
  ASSISTANT_SESSION_STATE_UNSPECIFIED = 0;

  // The assistant agent is processing the request as a long running task.
  PROCESSING = 1;

  // The assistant agent is idle and does not have any pending requests or
  // response.
  IDLE = 2;

  // The assistant agent is done processing a long running task and has a
  // response ready for the user.
  PENDING_REVIEW = 3;
}

// Request message for
// [AssistantService.ListAssistantSessions][google.cloud.ces.v1beta.AssistantService.ListAssistantSessions].
message ListAssistantSessionsRequest {
  // Required. The app to list assistant sessions from.
  // Format:
  // `projects/{project}/locations/{location}/apps/{app}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "ces.googleapis.com/AssistantSession"
    }
  ];

  // Optional. Requested page size. Server may return fewer items than
  // requested. If unspecified, server will pick an appropriate default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The
  // [next_page_token][google.cloud.ces.v1beta.ListAssistantSessionsResponse.next_page_token]
  // value returned from a previous list
  // [AssistantService.ListAssistantSessions][google.cloud.ces.v1beta.AssistantService.ListAssistantSessions]
  // call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filter to be applied when listing the assistant sessions.
  // See https://google.aip.dev/160 for more details.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for
// [AssistantService.ListAssistantSessions][google.cloud.ces.v1beta.AssistantService.ListAssistantSessions].
message ListAssistantSessionsResponse {
  // The list of assistant sessions.
  repeated AssistantSession assistant_sessions = 1;

  // Optional. A token that can be sent as
  // [ListAssistantSessionsRequest.page_token][google.cloud.ces.v1beta.ListAssistantSessionsRequest.page_token]
  // to retrieve the next page. Absence of this field indicates there are no
  // subsequent pages.
  string next_page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for
// [AssistantService.GetAssistantSession][google.cloud.ces.v1beta.AssistantService.GetAssistantSession].
message GetAssistantSessionRequest {
  // Required. The name of the assistant session to retrieve.
  // Format:
  // `projects/{project}/locations/{location}/apps/{app}/assistantSessions/{assistant_session}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "ces.googleapis.com/AssistantSession"
    }
  ];
}

// Request message for
// [AssistantService.CreateAssistantSession][google.cloud.ces.v1beta.AssistantService.CreateAssistantSession].
message CreateAssistantSessionRequest {
  // Required. The app to create the assistant session in
  // Format:
  // `projects/{project}/locations/{location}/apps/{app}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "ces.googleapis.com/AssistantSession"
    }
  ];

  // Optional. The ID to use for the assistant session, which will become the
  // final component of the assistant session's resource name. If not provided,
  // a unique ID will be automatically assigned for the assistant session.
  string assistant_session_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The messages to seed the assistant session with.
  repeated AssistantMessage assistant_session_messages = 3
      [(google.api.field_behavior) = OPTIONAL];
}

// Request message for
// [AssistantService.DeleteAssistantSession][google.cloud.ces.v1beta.AssistantService.DeleteAssistantSession].
message DeleteAssistantSessionRequest {
  // Required. The name of the assistant session to delete.
  // Format:
  // `projects/{project}/locations/{location}/apps/{app}/assistantSessions/{assistant_session}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "ces.googleapis.com/AssistantSession"
    }
  ];
}

// Request message for
// [AssistantService.RunAssistant][google.cloud.ces.v1beta.AssistantService.RunAssistant].
message RunAssistantRequest {
  // The type of interaction for the message sent to the assistant.
  enum InteractionType {
    // The default value. This value is used if the type is not specified.
    INTERACTION_TYPE_UNSPECIFIED = 0;

    // The message is a user input. User input is provided in the chunk list.
    NEW_MESSAGE = 1;

    // The message is for polling the state of the assistant session.
    POLL = 2;

    // The message is to dismiss the assistant session pending review. This will
    // change the state of the assistant session to idle.
    DISMISS = 3;
  }

  // Required. The app to run assistant for.
  // Format:
  // `projects/{project}/locations/{location}/apps/{app}`
  string app = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ces.googleapis.com/App" }
  ];

  // Required. The assistant session to be used to run the assistant.
  // Format:
  // `projects/{project}/locations/{location}/apps/{app}/assistantSessions/{assistant_session}`
  string assistant_session = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "ces.googleapis.com/AssistantSession"
    }
  ];

  // Required. The message to send to the assistant agent.
  AssistantMessage message = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. Different interaction types for the assistant message.
  InteractionType interaction_type = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for
// [AssistantService.RunAssistant][google.cloud.ces.v1beta.AssistantService.RunAssistant].
message RunAssistantResponse {
  // Required. The output from the assistant agent.
  AssistantOutput output = 1 [(google.api.field_behavior) = REQUIRED];

  // Output only. The status of the assistant session.
  AssistantSessionState state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// An assistant session represents a conversation between a user and the
// assistant agent.
message AssistantSession {
  option (google.api.resource) = {
    type: "ces.googleapis.com/AssistantSession"
    pattern: "projects/{project}/locations/{location}/apps/{app}/assistantSessions/{assistant_session}"
    plural: "assistantSessions"
    singular: "assistantSession"
  };

  // Required. Identifier. The unique identifier of the session.
  // Format:
  // `projects/{project}/locations/{location}/apps/{app}/assistantSessions/{session}`
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (google.api.field_behavior) = REQUIRED
  ];

  // Output only. The user who initiated the session.
  string requestor = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. History of messages in the session.
  repeated AssistantMessage messages = 3
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The status of the assistant session.
  AssistantSessionState state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time the assistant session was created.
  google.protobuf.Timestamp create_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time the assistant session was last updated.
  google.protobuf.Timestamp update_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Suggested user responses from the assistant agent.
  UserResponseSuggestions user_response_suggestions = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The display name of the assistant session.
  string display_name = 8 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Document artifacts (e.g. generated TDDs in markdown) produced
  // by the assistant in this session. Pointers only; the file content lives in
  // the customer's Cloud Storage bucket.
  repeated AssistantSessionArtifact artifacts = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Session checkpoint containing user intent and rolling history
  // summary.
  SessionCheckpoint session_checkpoint = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Attachment info for this session's currently running turn.
  // Unset when no turn is running.
  ActiveTurnInfo active_turn = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Live-attachment info for a session turn that is currently running,
// disconnected from its client, or parked for pickup by another server task.
message ActiveTurnInfo {
  // How the running turn currently relates to clients and server tasks.
  enum Status {
    // Unspecified.
    STATUS_UNSPECIFIED = 0;

    // The turn is executing with at least one client attached.
    RUNNING = 1;

    // The turn is executing with no client attached.
    DISCONNECTED = 2;

    // The turn is parked for pickup: the next attach continues it.
    RESUMING = 3;

    // The turn's server lease has lapsed and no task is driving it; the next
    // read seals it to a committed partial. Not attachable.
    ABANDONED = 4;
  }

  // Identifies the turn; echoed by resume snapshots on the streaming API.
  string turn_id = 1;

  // Current attachment status.
  Status status = 2;

  // Output only. When the turn started.
  google.protobuf.Timestamp start_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the turn last persisted progress.
  google.protobuf.Timestamp last_progress_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the turn will be wound down if no client attaches.
  google.protobuf.Timestamp orphan_deadline_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A document artifact generated by the assistant within a session, stored as
// a file in the customer's Cloud Storage bucket.
message AssistantSessionArtifact {
  // Output only. The unique identifier of the artifact within the session.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The file name shown to the user, e.g. "hotel_booking_tdd.md".
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The Cloud Storage object holding the artifact content.
  // Example:
  // "gs://{project}-agent-assist-artifacts/agent-assist-generated/1_tdd.md"
  string gcs_uri = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The IANA media type of the artifact content, e.g.
  // "text/markdown".
  string mime_type = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the artifact was persisted.
  google.protobuf.Timestamp create_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Index of the message in [AssistantSession.messages] whose turn
  // produced the artifact, for placing the artifact chip when history is
  // restored.
  int32 turn_index = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A chunk of data in an assistant message.
message AssistantChunk {
  // Data in the chunk.
  oneof data {
    // Optional. Text data.
    string text = 1 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Thought generated by the model.
    string thought = 2 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Payload which contains structured responses like the quality
    // report, agent version name, suggested responses etc.
    google.protobuf.Struct payload = 3 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Typed payload which contains structured responses.
    TypedPayload typed_payload = 4 [(google.api.field_behavior) = OPTIONAL];
  }

  // Optional. Timestamp when the chunk was created or emitted.
  google.protobuf.Timestamp create_time = 5
      [(google.api.field_behavior) = OPTIONAL];
}

// The output from the assistant agent.
message AssistantOutput {
  // Required. The response from the assistant agent.
  AssistantMessage message = 1 [(google.api.field_behavior) = REQUIRED];

  // Output only. Suggested user responses from the assistant agent.
  UserResponseSuggestions user_response_suggestions = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A message in an assistant session.
message AssistantMessage {
  // Required. Role within the conversation "user" or  "model".
  string role = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Content of the message as chunks.
  repeated AssistantChunk chunks = 2 [(google.api.field_behavior) = OPTIONAL];

  // Required. Timestamp when the message was sent or received.
  google.protobuf.Timestamp event_time = 3
      [(google.api.field_behavior) = REQUIRED];

  // Optional. Cloud Storage URIs for files uploaded by the user during this
  // turn. This allows attachments to be persisted and rendered in the session
  // history UI. Example: "gs://cxas-transient-uploads/uuid/prd.pdf"
  repeated string attached_gcs_uris = 4
      [(google.api.field_behavior) = OPTIONAL];
}

// Payload with a type.
message TypedPayload {
  // Required. The display name of the payload.
  string display_name = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The type of the payload.
  string type = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The value of the payload.
  google.protobuf.Struct value = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. The metadata of the payload.
  google.protobuf.Struct metadata = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Suggested user responses from the assistant agent.
message UserResponseSuggestions {
  // Required. The assistant suggested user responses. These are suggestions for
  // the user on how to interact with the assistant.
  repeated string suggestions = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for
// [AssistantService.ChatAiAssistant][google.cloud.ces.v1beta.AssistantService.ChatAiAssistant].
message ChatAiAssistantRequest {
  // Required. The app to run assistant for.
  // Format:
  // `projects/{project}/locations/{location}/apps/{app}`
  string app = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "ces.googleapis.com/App" }
  ];

  // Required. The assistant session to be used to run the assistant.
  // Format:
  // `projects/{project}/locations/{location}/apps/{app}/assistantSessions/{assistant_session}`
  string assistant_session = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "ces.googleapis.com/AssistantSession"
    }
  ];

  // Required. The message to send to the assistant agent.
  string message = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. Cloud Storage URIs for files uploaded by the user during this
  // turn. Example: "gs://cxas-transient-uploads/uuid/prd.pdf"
  repeated string attached_gcs_uris = 5
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Opaque onboarding context token returned by
  // [SessionService.GenerateOnboardingSuggestions][google.cloud.ces.v1beta.SessionService.GenerateOnboardingSuggestions].
  // When set and still fresh, the server reuses the onboarding snapshot
  // computed for the zero state instead of recomputing it for the first
  // conversation turn.
  string context_token = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for
// [AssistantService.ChatAiAssistant][google.cloud.ces.v1beta.AssistantService.ChatAiAssistant].
message ChatAiAssistantResponse {
  // The event payload.
  oneof event {
    // Text Token (for streaming Gemini responses word-by-word)
    string text_chunk = 3;

    // Simple status update
    string status_message = 4;

    // Session checkpoint/compaction recap event containing user intent and
    // rolling summary.
    SessionCheckpoint session_checkpoint = 13;
  }

  // Unique identifier for the event.
  string event_id = 1;

  // Timestamp when the event occurred.
  google.protobuf.Timestamp event_time = 2;

  // Optional. UI event payload.
  UiEvent ui_event = 5 [(google.api.field_behavior) = OPTIONAL];
}
