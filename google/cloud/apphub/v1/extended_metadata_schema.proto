syntax = "proto3";

package google.cloud.apphub.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Cloud.AppHub.V1";
option go_package = "cloud.google.com/go/apphub/apiv1/apphubpb;apphubpb";
option java_multiple_files = true;
option java_outer_classname = "ExtendedMetadataSchemaProto";
option java_package = "com.google.cloud.apphub.v1";
option php_namespace = "Google\\Cloud\\AppHub\\V1";
option ruby_package = "Google::Cloud::AppHub::V1";

// ExtendedMetadataSchema represents a schema for extended metadata of a service
// or workload.
message ExtendedMetadataSchema {
  option (google.api.resource) = {
    type: "apphub.googleapis.com/ExtendedMetadataSchema"
    pattern: "projects/{project}/locations/{location}/extendedMetadataSchemas/{extended_metadata_schema}"
    plural: "extendedMetadataSchemas"
    singular: "extendedMetadataSchema"
  };

  // Identifier. Resource name of the schema.
  // Format:
  // projects/<project>/locations/<location>/extendedMetadataSchemas/<schema-id>
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The JSON schema as a string.
  string json_schema = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The version of the schema. New versions are required to be
  // backwards compatible.
  int64 schema_version = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}
