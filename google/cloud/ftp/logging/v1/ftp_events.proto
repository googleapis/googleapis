syntax = "proto3";

package google.cloud.ftp.logging.v1;

import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/rpc/status.proto";

option csharp_namespace = "Google.Cloud.Ftp.Logging.V1";
option go_package = "cloud.google.com/go/ftp/logging/apiv1/loggingpb;loggingpb";
option java_multiple_files = true;
option java_outer_classname = "FtpEventsProto";
option java_package = "com.google.cloud.ftp.logging.v1";
option php_namespace = "Google\\Cloud\\Ftp\\Logging\\V1";
option ruby_package = "Google::Cloud::Ftp::Logging::V1";

// Structured log payload for Cloud FTP administrative, security, and transfer
// events.
message FtpEvent {
  // Detailed authentication telemetry (when event_type = AUTH_ATTEMPT or
  // SESSION_END).
  message AuthDetails {
    // Authentication method used for the session.
    enum AuthMethod {
      // Default unspecified authentication method.
      AUTH_METHOD_UNSPECIFIED = 0;

      // Password-based authentication.
      PASSWORD = 1;

      // SSH public key authentication.
      SSH_PUBLIC_KEY = 2;
    }

    // Reason why the session was disconnected.
    enum DisconnectReason {
      // Default unspecified disconnect reason.
      DISCONNECT_REASON_UNSPECIFIED = 0;

      // Client initiated normal logout.
      CLIENT_LOGOUT = 1;

      // Session rejected or terminated because max concurrent sessions was
      // exceeded.
      MAX_CONCURRENT_SESSIONS_EXCEEDED = 2;
    }

    // Authentication method used for the attempt.
    AuthMethod auth_method = 1;

    // Detailed reason for failure when an AUTH_ATTEMPT fails (for example,
    // "failed to load user configuration" or "failed to impersonate service
    // account") or when a SESSION_END is rejected or terminates abnormally
    // (for example, "maximum concurrent sessions exceeded" or
    // "SignalInterrupt:terminated"). Empty on successful AUTH_ATTEMPT or
    // normal CLIENT_LOGOUT.
    string failure_reason = 2;

    // Reason for disconnect, populated on SESSION_END.
    DisconnectReason disconnect_reason = 5;
  }

  // Detailed filesystem command telemetry (when event_type =
  // COMMAND_EXECUTION).
  message CommandDetails {
    // Standard SFTP protocol status codes (draft-ietf-secsh-filexfer-02
    // Section 7).
    enum SftpStatusCode {
      // Default unspecified SFTP status code.
      SFTP_STATUS_CODE_UNSPECIFIED = 0;

      // Indicates successful completion of the operation.
      SSH_FX_OK = 1;

      // Indicates end-of-file condition.
      SSH_FX_EOF = 2;

      // Reference was made to a file which does not exist.
      SSH_FX_NO_SUCH_FILE = 3;

      // Authenticated user does not have sufficient permissions to perform the
      // operation.
      SSH_FX_PERMISSION_DENIED = 4;

      // Generic catch-all error message for failures without a specific code.
      SSH_FX_FAILURE = 5;

      // Badly formatted packet or protocol incompatibility detected.
      SSH_FX_BAD_MESSAGE = 6;

      // There is no connection to the server.
      SSH_FX_NO_CONNECTION = 7;

      // Connection to the server was lost.
      SSH_FX_CONNECTION_LOST = 8;

      // Attempted an operation that is not supported by the server.
      SSH_FX_OP_UNSUPPORTED = 9;
    }

    // Executed SFTP directory or metadata command (for example, "LIST", "STAT",
    // "LSTAT", "MKDIR", "RMDIR", "RENAME", "REMOVE", "PWD"). File uploads
    // (PUT) and downloads (GET) are emitted as FILE_TRANSFER events instead.
    string command = 1;

    // Target file or directory path relative to the user's root directory (for
    // example, "/my-bucket/dir/file.txt" or "/dir").
    string target_path = 2;

    // Destination path for rename operations relative to the user's root
    // directory (for example, "/my-bucket/dir/new_file.txt").
    string destination_path = 3;

    // Standard SFTP protocol status code returned for the command.
    SftpStatusCode sftp_status_code = 4;

    // Human-readable SFTP status message (for example, "OK" on success, or
    // "No such file or directory" on error).
    string sftp_status_message = 5;
  }

  // Detailed file payload transfer telemetry (when event_type = FILE_TRANSFER).
  message TransferDetails {
    // Direction of the SFTP file transfer.
    enum TransferType {
      // Default unspecified transfer type.
      TRANSFER_TYPE_UNSPECIFIED = 0;

      // SFTP Put (Client -> Cloud Storage).
      UPLOAD = 1;

      // SFTP Get (Cloud Storage -> Client).
      DOWNLOAD = 2;
    }

    // Type of file transfer (upload or download).
    TransferType transfer_type = 1;

    // SFTP file path relative to the user's root directory (for example,
    // "/my-bucket/dir/file.txt" or "/dir/file.txt").
    string file_path = 2;

    // Cloud Storage bucket name without the "gs://" prefix (for example,
    // "my-storage-bucket").
    string gcs_bucket = 3;

    // Cloud Storage object path within the bucket without a leading slash (for
    // example, "dir/file.txt").
    string gcs_object = 4;

    // Bytes transferred in this operation.
    int64 transferred_bytes = 5;

    // Cloud Storage generation ID for versioning and concurrency.
    int64 gcs_object_generation = 6;
  }

  // Type of FTP event recorded.
  enum EventType {
    // Default unspecified event type.
    EVENT_TYPE_UNSPECIFIED = 0;

    // Login attempt (serves as session start when status is OK).
    AUTH_ATTEMPT = 1;

    // Emitted on session disconnect or logout.
    SESSION_END = 2;

    // POSIX file or directory operations (LIST, STAT, MKDIR, RENAME, REMOVE).
    COMMAND_EXECUTION = 3;

    // File payload uploads or downloads (PUT, GET).
    FILE_TRANSFER = 4;
  }

  // Unique identifier (UUIDv4) for the SFTP session.
  string session_id = 1 [(google.api.field_info).format = UUID4];

  // The transfer user account who initiated the action.
  string username = 2;

  // Originating client IP address.
  string client_ip_address = 3 [(google.api.field_info).format = IPV4_OR_IPV6];

  // Originating client port.
  int32 client_port = 13;

  // Full resource name of the server instance, including project and location.
  // Format: `projects/{project}/locations/{location}/servers/{server_id}`
  string server_name = 4
      [(google.api.resource_reference) = { type: "ftp.googleapis.com/Server" }];

  // Type of FTP event recorded.
  EventType event_type = 5;

  // Canonical GCP status (OK, PERMISSION_DENIED, NOT_FOUND,
  // RESOURCE_EXHAUSTED).
  google.rpc.Status rpc_status = 6;

  // Execution latency for the command or auth operation.
  google.protobuf.Duration latency = 12;

  // Detailed authentication telemetry (when event_type = AUTH_ATTEMPT or
  // SESSION_END).
  AuthDetails auth_details = 7;

  // Detailed filesystem command telemetry (when event_type =
  // COMMAND_EXECUTION).
  CommandDetails command_details = 8;

  // Detailed file payload transfer telemetry (when event_type = FILE_TRANSFER).
  TransferDetails transfer_details = 9;

  // Human-readable summary string for quick scanning in Cloud Logging Explorer.
  string summary = 10;
}
