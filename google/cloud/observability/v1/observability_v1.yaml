type: google.api.Service
config_version: 3
name: observability.googleapis.com
title: Observability API

apis:
- name: google.cloud.location.Locations
- name: google.cloud.observability.v1.Observability
- name: google.longrunning.Operations

types:
- name: google.cloud.observability.v1.OperationMetadata

documentation:
  summary: |-
    Provides functionality for configuring the observability scope, which
    controls the log, metric, and trace data that you can view.
  rules:
  - selector: google.cloud.location.Locations.GetLocation
    description: Gets information about a location.

  - selector: google.cloud.location.Locations.ListLocations
    description: |-
      Lists information about the supported locations for this service.

      This method lists locations based on the resource scope provided in
      the [ListLocationsRequest.name][google.cloud.location.ListLocationsRequest.name] field: *
      **Global locations**: If `name` is empty, the method lists the
      public locations available to all projects. * **Project-specific
      locations**: If `name` follows the format
      `projects/{project}`, the method lists locations visible to that
      specific project. This includes public, private, or other
      project-specific locations enabled for the project.

      For gRPC and client library implementations, the resource name is
      passed as the `name` field. For direct service calls, the resource
      name is
      incorporated into the request path based on the specific service
      implementation and version.

http:
  rules:
  - selector: google.cloud.location.Locations.GetLocation
    get: '/v1/{name=projects/*/locations/*}'
    additional_bindings:
    - get: '/v1/{name=folders/*/locations/*}'
    - get: '/v1/{name=organizations/*/locations/*}'
  - selector: google.cloud.location.Locations.ListLocations
    get: '/v1/{name=projects/*}/locations'
    additional_bindings:
    - get: '/v1/{name=folders/*}/locations'
    - get: '/v1/{name=organizations/*}/locations'
  - selector: google.longrunning.Operations.CancelOperation
    post: '/v1/{name=projects/*/locations/*/operations/*}:cancel'
    body: '*'
    additional_bindings:
    - post: '/v1/{name=folders/*/locations/*/operations/*}:cancel'
      body: '*'
    - post: '/v1/{name=organizations/*/locations/*/operations/*}:cancel'
      body: '*'
  - selector: google.longrunning.Operations.DeleteOperation
    delete: '/v1/{name=projects/*/locations/*/operations/*}'
    additional_bindings:
    - delete: '/v1/{name=folders/*/locations/*/operations/*}'
    - delete: '/v1/{name=organizations/*/locations/*/operations/*}'
  - selector: google.longrunning.Operations.GetOperation
    get: '/v1/{name=projects/*/locations/*/operations/*}'
    additional_bindings:
    - get: '/v1/{name=folders/*/locations/*/operations/*}'
    - get: '/v1/{name=organizations/*/locations/*/operations/*}'
  - selector: google.longrunning.Operations.ListOperations
    get: '/v1/{name=projects/*/locations/*}/operations'
    additional_bindings:
    - get: '/v1/{name=folders/*/locations/*}/operations'
    - get: '/v1/{name=organizations/*/locations/*}/operations'

authentication:
  rules:
  - selector: google.cloud.location.Locations.GetLocation
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/cloud-platform
  - selector: google.cloud.location.Locations.ListLocations
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/cloud-platform
  - selector: 'google.cloud.observability.v1.Observability.*'
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/cloud-platform
  - selector: 'google.longrunning.Operations.*'
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/cloud-platform

publishing:
  method_settings:
  - selector: google.cloud.observability.v1.Observability.CreateBucket
    long_running:
      initial_poll_delay: 5s
      poll_delay_multiplier: 1.5
      max_poll_delay: 45s
      total_poll_timeout: 600s
  - selector: google.cloud.observability.v1.Observability.UpdateBucket
    long_running:
      initial_poll_delay: 5s
      poll_delay_multiplier: 1.5
      max_poll_delay: 45s
      total_poll_timeout: 600s
  - selector: google.cloud.observability.v1.Observability.CreateLink
    long_running:
      initial_poll_delay: 5s
      poll_delay_multiplier: 1.5
      max_poll_delay: 45s
      total_poll_timeout: 600s
  - selector: google.cloud.observability.v1.Observability.UpdateLink
    long_running:
      initial_poll_delay: 5s
      poll_delay_multiplier: 1.5
      max_poll_delay: 45s
      total_poll_timeout: 600s
  - selector: google.cloud.observability.v1.Observability.DeleteLink
    long_running:
      initial_poll_delay: 5s
      poll_delay_multiplier: 1.5
      max_poll_delay: 45s
      total_poll_timeout: 600s
  - selector: google.cloud.observability.v1.Observability.UpdateSettings
    long_running:
      initial_poll_delay: 5s
      poll_delay_multiplier: 1.5
      max_poll_delay: 45s
      total_poll_timeout: 600s
  new_issue_uri: https://issuetracker.google.com/issues/new?component=1519295
  documentation_uri: https://cloud.google.com/stackdriver/docs/
  api_short_name: observability
  github_label: 'api: observability'
  doc_tag_prefix: observability
  organization: CLOUD
  library_settings:
  - version: google.cloud.observability.v1
    launch_stage: GA
    java_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    cpp_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    php_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    python_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    node_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    dotnet_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
      renamed_resources:
        cloudtrace.googleapis.com/TraceScope: CloudTraceScope
    ruby_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    go_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
  proto_reference_documentation_uri: https://cloud.google.com/stackdriver/docs/reference/observability/api/rpc
