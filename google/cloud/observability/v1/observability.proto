syntax = "proto3";

package google.cloud.observability.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.Observability.V1";
option go_package = "cloud.google.com/go/observability/apiv1/observabilitypb;observabilitypb";
option java_multiple_files = true;
option java_outer_classname = "ObservabilityProto";
option java_package = "com.google.cloud.observability.v1";
option php_namespace = "Google\\Cloud\\Observability\\V1";
option ruby_package = "Google::Cloud::Observability::V1";

// Service describing handlers for resources
service Observability {
  option (google.api.default_host) = "observability.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/cloud-platform";

  // Gets details of a single Scope.
  rpc GetScope(GetScopeRequest) returns (Scope) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/scopes/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Updates the parameters of a single Scope.
  rpc UpdateScope(UpdateScopeRequest) returns (Scope) {
    option (google.api.http) = {
      patch: "/v1/{scope.name=projects/*/locations/*/scopes/*}"
      body: "scope"
    };
    option (google.api.method_signature) = "scope,update_mask";
  }

  // Get bucket resource.
  rpc GetBucket(GetBucketRequest) returns (Bucket) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/buckets/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // List buckets of a project in a particular location.
  rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/buckets"
    };
    option (google.api.method_signature) = "parent";
  }

  // Create a new bucket.
  rpc CreateBucket(CreateBucketRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/buckets"
      body: "bucket"
    };
    option (google.api.method_signature) = "parent,bucket,bucket_id";
    option (google.longrunning.operation_info) = {
      response_type: "Bucket"
      metadata_type: "OperationMetadata"
    };
  }

  // Update a bucket.
  rpc UpdateBucket(UpdateBucketRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{bucket.name=projects/*/locations/*/buckets/*}"
      body: "bucket"
    };
    option (google.api.method_signature) = "bucket,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "Bucket"
      metadata_type: "OperationMetadata"
    };
  }

  // Get a dataset.
  rpc GetDataset(GetDatasetRequest) returns (Dataset) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/buckets/*/datasets/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // List datasets of a bucket.
  rpc ListDatasets(ListDatasetsRequest) returns (ListDatasetsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/buckets/*}/datasets"
    };
    option (google.api.method_signature) = "parent";
  }

  // Get a view.
  rpc GetView(GetViewRequest) returns (View) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/buckets/*/datasets/*/views/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // List views of a dataset.
  rpc ListViews(ListViewsRequest) returns (ListViewsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/buckets/*/datasets/*}/views"
    };
    option (google.api.method_signature) = "parent";
  }

  // Get a link.
  rpc GetLink(GetLinkRequest) returns (Link) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/buckets/*/datasets/*/links/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // List links of a dataset.
  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/buckets/*/datasets/*}/links"
    };
    option (google.api.method_signature) = "parent";
  }

  // Create a new link.
  rpc CreateLink(CreateLinkRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*/buckets/*/datasets/*}/links"
      body: "link"
    };
    option (google.api.method_signature) = "parent,link,link_id";
    option (google.longrunning.operation_info) = {
      response_type: "Link"
      metadata_type: "OperationMetadata"
    };
  }

  // Update a link.
  rpc UpdateLink(UpdateLinkRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{link.name=projects/*/locations/*/buckets/*/datasets/*/links/*}"
      body: "link"
    };
    option (google.api.method_signature) = "link,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "Link"
      metadata_type: "OperationMetadata"
    };
  }

  // Delete a link.
  rpc DeleteLink(DeleteLinkRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/buckets/*/datasets/*/links/*}"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "OperationMetadata"
    };
  }

  // Get TraceScope resource.
  rpc GetTraceScope(GetTraceScopeRequest) returns (TraceScope) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/traceScopes/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // List TraceScopes of a project in a particular location.
  rpc ListTraceScopes(ListTraceScopesRequest)
      returns (ListTraceScopesResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/traceScopes"
    };
    option (google.api.method_signature) = "parent";
  }

  // Create a new TraceScope.
  rpc CreateTraceScope(CreateTraceScopeRequest) returns (TraceScope) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/traceScopes"
      body: "trace_scope"
    };
    option (google.api.method_signature) = "parent,trace_scope,trace_scope_id";
  }

  // Update a TraceScope.
  rpc UpdateTraceScope(UpdateTraceScopeRequest) returns (TraceScope) {
    option (google.api.http) = {
      patch: "/v1/{trace_scope.name=projects/*/locations/*/traceScopes/*}"
      body: "trace_scope"
    };
    option (google.api.method_signature) = "trace_scope,update_mask";
  }

  // Delete a TraceScope.
  rpc DeleteTraceScope(DeleteTraceScopeRequest)
      returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/traceScopes/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Get Settings
  rpc GetSettings(GetSettingsRequest) returns (Settings) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/settings}"
      additional_bindings { get: "/v1/{name=folders/*/locations/*/settings}" }
      additional_bindings {
        get: "/v1/{name=organizations/*/locations/*/settings}"
      }
    };
    option (google.api.method_signature) = "name";
  }

  // Update Settings
  rpc UpdateSettings(UpdateSettingsRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{settings.name=projects/*/locations/*/settings}"
      body: "settings"
      additional_bindings {
        patch: "/v1/{settings.name=folders/*/locations/*/settings}"
        body: "settings"
      }
      additional_bindings {
        patch: "/v1/{settings.name=organizations/*/locations/*/settings}"
        body: "settings"
      }
    };
    option (google.api.method_signature) = "settings,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "Settings"
      metadata_type: "OperationMetadata"
    };
  }
}

// Settings for configuring CMEK for a bucket.
message CmekSettings {
  // Optional. The resource name for the configured Cloud KMS key. The format
  // is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[KEYRING]/cryptoKeys/[KEY]
  //
  // For example:
  //
  //     projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key
  string kms_key = 1 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The CryptoKeyVersion resource name for the configured Cloud
  // KMS key. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[KEYRING]/cryptoKeys/[KEY]/cryptoKeyVersions/[VERSION]
  //
  // For example:
  //
  //     projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key/cryptoKeyVersions/1
  //
  // This read-only field is used to convey the specific configured
  // CryptoKeyVersion of the `kms_key` that has been configured. It is
  // populated when the CMEK settings are bound to a single key version.
  string kms_key_version = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The service account used to access the key.
  string service_account_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Describes the settings associated with a project, organization, or folder.
message Settings {
  option (google.api.resource) = {
    type: "observability.googleapis.com/Settings"
    pattern: "projects/{project}/locations/{location}/settings"
    pattern: "organizations/{organization}/locations/{location}/settings"
    pattern: "folders/{folder}/locations/{location}/settings"
    plural: "settings"
    singular: "settings"
  };

  // Identifier. The resource name of the settings.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. The location which should be used when any regional resources are
  // provisioned by Google Cloud.
  string default_storage_location = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The service account for the given resource container, such as
  // project or folder. This will be used by Cloud Observability to perform
  // actions in the container's project like access KMS keys or create Links.
  // Always the same service account per resource container regardless of
  // region.
  string service_account_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The resource name for the configured Cloud KMS key.
  //
  // KMS key name format:
  //
  //     "projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[KEYRING]/cryptoKeys/[KEY]"
  //
  // For example:
  //
  //   `"projects/my-project/locations/us-central1/keyRings/my-ring/cryptoKeys/my-key"`
  string kms_key_name = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Bucket configuration for storing observability data.
message Bucket {
  option (google.api.resource) = {
    type: "observability.googleapis.com/Bucket"
    pattern: "projects/{project}/locations/{location}/buckets/{bucket}"
    plural: "buckets"
    singular: "bucket"
  };

  // Identifier. Name of the bucket. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. User friendly display name.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Description of the bucket.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Create timestamp.
  google.protobuf.Timestamp create_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Update timestamp.
  google.protobuf.Timestamp update_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Delete timestamp.
  google.protobuf.Timestamp delete_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp when the bucket in soft-deleted state is purged.
  google.protobuf.Timestamp purge_time = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Settings for configuring CMEK on a bucket.
  CmekSettings cmek_settings = 9 [(google.api.field_behavior) = OPTIONAL];
}

// Request for creating a bucket.
message CreateBucketRequest {
  // Required. Name of the project and location for the bucket. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "observability.googleapis.com/Bucket"
    }
  ];

  // Required. Id of the bucket to create.
  string bucket_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. Bucket to create.
  Bucket bucket = 3 [(google.api.field_behavior) = REQUIRED];
}

// Request for updating a bucket.
message UpdateBucketRequest {
  // Required. The  bucket to update.
  //
  // The name field of bucket identifies the resource to update.
  Bucket bucket = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Request for getting a bucket.
message GetBucketRequest {
  // Required. Name of the bucket to retrieve. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "observability.googleapis.com/Bucket"
    }
  ];
}

// Request for listing buckets.
message ListBucketsRequest {
  // Required. The parent, which owns this collection of buckets. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "observability.googleapis.com/Bucket"
    }
  ];

  // Optional. The maximum number of buckets to return. If unspecified, then at
  // most 100 buckets are returned. The maximum value is 1000; values above 1000
  // are coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListBuckets` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, then the response will include deleted buckets.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing buckets.
message ListBucketsResponse {
  // Optional. The list of buckets.
  repeated Bucket buckets = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A token that can be sent as `page_token` to retrieve the next
  // page. When this field is omitted, there are no subsequent pages.
  string next_page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// A dataset is a collection of data that has a specific configuration. A
// dataset can be backed by multiple tables. One bucket can have multiple
// datasets.
message Dataset {
  option (google.api.resource) = {
    type: "observability.googleapis.com/Dataset"
    pattern: "projects/{project}/locations/{location}/buckets/{bucket}/datasets/{dataset}"
    plural: "datasets"
    singular: "dataset"
  };

  // Identifier. Name of the dataset. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. User friendly display name.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Description of the dataset.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Create timestamp.
  google.protobuf.Timestamp create_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Delete timestamp.
  google.protobuf.Timestamp delete_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp when the dataset in soft-deleted state is purged.
  google.protobuf.Timestamp purge_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request for getting a dataset.
message GetDatasetRequest {
  // Required. Name of the dataset to retrieve. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "observability.googleapis.com/Dataset"
    }
  ];
}

// Request for listing datasets.
message ListDatasetsRequest {
  // Required. The parent bucket that owns this collection of datasets. The
  // format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "observability.googleapis.com/Dataset"
    }
  ];

  // Optional. The maximum number of datasets to return. If unspecified, then at
  // most 100 datasets are returned. The maximum value is 1000; values above
  // 1000 are coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListDatasets` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, then the response will include deleted datasets.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing datasets.
message ListDatasetsResponse {
  // The list of datasets.
  repeated Dataset datasets = 1;

  // A token that can be sent as `page_token` to retrieve the next page. When
  // this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// A view corresponds to a read-only representation of a subset of the data in
// a dataset.
message View {
  option (google.api.resource) = {
    type: "observability.googleapis.com/View"
    pattern: "projects/{project}/locations/{location}/buckets/{bucket}/datasets/{dataset}/views/{view}"
    plural: "views"
    singular: "view"
  };

  // Identifier. Name of the view. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]/views/[VIEW_ID]
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. User friendly display name.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Description of the view.
  string description = 6 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Create timestamp.
  google.protobuf.Timestamp create_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Update timestamp.
  google.protobuf.Timestamp update_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request for getting a view.
message GetViewRequest {
  // Required. Name of the view to retrieve. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]/views/[VIEW_ID]
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "observability.googleapis.com/View"
    }
  ];
}

// Request for listing views.
message ListViewsRequest {
  // Required. Dataset whose views are to be listed. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "observability.googleapis.com/View"
    }
  ];

  // Optional. The maximum number of views to return. If unspecified, then at
  // most 100 views are returned. The maximum value is 1000; values above 1000
  // are coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListViews` call. Provide
  // this to retrieve the subsequent page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response for listing views.
message ListViewsResponse {
  // The list of views.
  repeated View views = 1;

  // Optional. A token that can be sent as `page_token` to retrieve the next
  // page. When this field is omitted, there are no subsequent pages.
  string next_page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// A link lets a dataset be accessible to BigQuery via usage of linked datasets.
message Link {
  option (google.api.resource) = {
    type: "observability.googleapis.com/Link"
    pattern: "projects/{project}/locations/{location}/buckets/{bucket}/datasets/{dataset}/links/{link}"
    plural: "links"
    singular: "link"
  };

  // Identifier. Name of the link. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]/links/[LINK_ID]
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. A user friendly display name.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Description of the link.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Create timestamp.
  google.protobuf.Timestamp create_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request for creating a link.
message CreateLinkRequest {
  // Required. Name of the containing dataset for this link. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "observability.googleapis.com/Link"
    }
  ];

  // Required. Id of the link to create.
  string link_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. Link to create.
  Link link = 3 [(google.api.field_behavior) = REQUIRED];
}

// Request for updating a link.
message UpdateLinkRequest {
  // Required. Link to update.
  //
  // The name field of link identifies the resource to update.
  Link link = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Request for getting a link.
message GetLinkRequest {
  // Required. Name of the link to retrieve. The format is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]/links/[LINK_ID]
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "observability.googleapis.com/Link"
    }
  ];
}

// Request for listing links.
message ListLinksRequest {
  // Required. The parent dataset that owns this collection of links. The format
  // is:
  //
  //     projects/[PROJECT_ID]/locations/[LOCATION]/buckets/[BUCKET_ID]/datasets/[DATASET_ID]
