syntax = "proto3";

package google.cloud.run.v2;

import "google/api/field_behavior.proto";
import "google/cloud/run/v2/k8s.min.proto";

option go_package = "cloud.google.com/go/run/apiv2/runpb;runpb";
option java_multiple_files = true;
option java_outer_classname = "SandboxProto";
option java_package = "com.google.cloud.run.v2";

// Configuration for sandboxes.
message SandboxConfiguration {
  // Required. Sandbox templates that can be launched through the `sandbox` CLI.
  repeated SandboxTemplate templates = 4
      [(google.api.field_behavior) = REQUIRED];
}

// Template for a single sandbox.
message SandboxTemplate {
  // Required. Name of the sandbox specified as a DNS_LABEL (RFC 1123).
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Name of the container image in Dockerhub or Artifact Registry. If
  // the host is not provided, Dockerhub is assumed.
  string image = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. Entrypoint array. Not executed within a shell.
  // The docker image's ENTRYPOINT is used if this is not provided.
  repeated string command = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Arguments to the entrypoint.
  // The docker image's CMD is used if this is not provided.
  repeated string args = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of environment variables to set in the sandbox.
  repeated EnvVar env = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Volume to mount into the container's filesystem.
  repeated VolumeMount volume_mounts = 7
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Container's working directory.
  // If not specified, the container runtime's default will be used, which
  // might be configured in the container image.
  string working_dir = 8 [(google.api.field_behavior) = OPTIONAL];
}
