    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/cloud-platform,
        https://www.googleapis.com/auth/run,
        https://www.googleapis.com/auth/run.readonly
  - selector: google.cloud.run.v2.Builds.SubmitBuild
