syntax = "proto3";

package google.cloud.run.v2;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/api/routing.proto";
import "google/cloud/run/v2/k8s.min.proto";

option go_package = "cloud.google.com/go/run/apiv2/runpb;runpb";
option java_multiple_files = true;
option java_outer_classname = "SourceUploadProto";
option java_package = "com.google.cloud.run.v2";

// The Cloud Run Source Upload API allows you to upload source code to deploy
// Cloud Run resources.
service SourceUpload {
  option (google.api.default_host) = "run.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/cloud-platform,"
      "https://www.googleapis.com/auth/run";

  // Uploads a source archive to a Google Cloud Storage bucket through Cloud
  // Run. The uploaded source object should be used for Cloud Run resource
  // deployments. User is responsible for managing the lifecycle of the uploaded
  // object.
  // If uploading through the Cloud Run API to Cloud Storage is not desired, you
  // can use the IAM Deny Policy to deny the `run.locations.uploadSource`
  // permission for all principals.
  rpc UploadSource(UploadSourceRequest) returns (UploadSourceResponse) {
    option (google.api.http) = {
      post: "/v2/{parent=projects/*/locations/*}:uploadSource"
      body: "*"
    };
    option (google.api.routing) = {
      routing_parameters {
        field: "parent"
        path_template: "projects/*/locations/{location=*}"
      }
    };
    option (google.api.method_signature) = "parent";
  }
}

// The request message for the UploadSource method.
message UploadSourceRequest {
  // Required. The project and location in which the source archive should be
  // uploaded to, specified in the format `projects/*/locations/*`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "locations.googleapis.com/Location"
    }
  ];

  // The Cloud Run resource the upload source archive will be used for.
  oneof target {
    // The name of Cloud Run Service upload source archive will be used for.
    string service = 2 [
      (google.api.resource_reference) = { type: "run.googleapis.com/Service" }
    ];
  }
}

// The response message for the UploadSource method.
message UploadSourceResponse {
  // The Cloud Storage object path the source archive is uploaded to.
  SourceCode.CloudStorageSource cloud_storage_source = 3;
}
