syntax = "proto3";

package google.cloud.agentregistryendpoint.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/cloud/agentregistry/v1/agent.proto";
import "google/cloud/agentregistry/v1/endpoint.proto";
import "google/cloud/agentregistry/v1/mcp_server.proto";

option csharp_namespace = "Google.Cloud.AgentRegistryEndpoint.V1";
option go_package = "cloud.google.com/go/agentregistryendpoint/apiv1/agentregistryendpointpb;agentregistryendpointpb";
option java_multiple_files = true;
option java_outer_classname = "AgentRegistryEndpointServiceProto";
option java_package = "com.google.cloud.agentregistryendpoint.v1";
option php_namespace = "Google\\Cloud\\AgentRegistryEndpoint\\V1";
option ruby_package = "Google::Cloud::AgentRegistryEndpoint::V1";

// The localized dataplane API for Agent Registry.
//
// This service provides access to the local catalog of agents and tools,
// allowing agents at runtime to quickly and securely look up peer agents or
// tools without querying the global control plane.
service AgentRegistryEndpoint {
  option (google.api.default_host) = "agentregistryendpoint.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/agentregistry.read-only,"
      "https://www.googleapis.com/auth/agentregistry.read-write,"
      "https://www.googleapis.com/auth/cloud-platform,"
      "https://www.googleapis.com/auth/cloud-platform.read-only";

  // Gets an MCP server active within the localized dataplane of the AI
  // Application.
  rpc GetAiApplicationMcpServer(GetAiApplicationMcpServerRequest)
      returns (google.cloud.agentregistry.v1.McpServer) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/aiApplications/*/mcpServers/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Gets an endpoint active within the localized dataplane of the AI
  // Application.
  rpc GetAiApplicationEndpoint(GetAiApplicationEndpointRequest)
      returns (google.cloud.agentregistry.v1.Endpoint) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/aiApplications/*/endpoints/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists agents active within the localized dataplane of the AI Application.
  rpc ListAiApplicationAgents(ListAiApplicationAgentsRequest)
      returns (ListAiApplicationAgentsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/aiApplications/*}/agents"
      additional_bindings { get: "/v1/agents" }
    };
    option (google.api.method_signature) = "parent";
  }

  // Lists MCP servers active within the localized dataplane of the AI
  // Application.
  rpc ListAiApplicationMcpServers(ListAiApplicationMcpServersRequest)
      returns (ListAiApplicationMcpServersResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/aiApplications/*}/mcpServers"
      additional_bindings { get: "/v1/mcpServers" }
    };
    option (google.api.method_signature) = "parent";
  }

  // Lists endpoints active within the localized dataplane of the AI
  // Application.
  rpc ListAiApplicationEndpoints(ListAiApplicationEndpointsRequest)
      returns (ListAiApplicationEndpointsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/aiApplications/*}/endpoints"
      additional_bindings { get: "/v1/endpoints" }
    };
    option (google.api.method_signature) = "parent";
  }
}

// Request message for getting an MCP server active within the localized
// dataplane of the AI Application.
message GetAiApplicationMcpServerRequest {
  // Required. The resource name of the MCP server, in the format
  // `projects/{project}/locations/{location}/aiApplications/{ai_application}/mcpServers/{mcp_server}`.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for getting an endpoint active within the localized
// dataplane of the AI Application.
message GetAiApplicationEndpointRequest {
  // Required. The resource name of the endpoint, in the format
  // `projects/{project}/locations/{location}/aiApplications/{ai_application}/endpoints/{endpoint}`.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for listing agents active within the localized dataplane.
message ListAiApplicationAgentsRequest {
  // Required. The parent resource name, in the format
  // `projects/{project}/locations/{location}/aiApplications/{ai_application}`.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The maximum number of agents to return. The service may return
  // fewer than this value. If unspecified or set to `0`, at most 50 agents are
  // returned. The maximum value is 100; values above 100 are coerced to 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListAiApplicationAgents`
  // call. Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to
  // `ListAiApplicationAgents` must match the call that provided the page
  // token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for listing agents active within the localized dataplane.
message ListAiApplicationAgentsResponse {
  // The list of agents.
  repeated google.cloud.agentregistry.v1.Agent agents = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request message for listing MCP servers active within the localized
// dataplane.
message ListAiApplicationMcpServersRequest {
  // Required. The parent resource name, in the format
  // `projects/{project}/locations/{location}/aiApplications/{ai_application}`.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The maximum number of MCP servers to return. The service may
  // return fewer than this value. If unspecified or set to `0`, at most 50 MCP
  // servers are returned. The maximum value is 100; values above 100 are
  // coerced to 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous
  // `ListAiApplicationMcpServers` call. Provide this to retrieve the
  // subsequent page.
  //
  // When paginating, all other parameters provided to
  // `ListAiApplicationMcpServers` must match the call that provided the
  // page token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for listing MCP servers active within the localized
// dataplane.
message ListAiApplicationMcpServersResponse {
  // The list of MCP servers.
  repeated google.cloud.agentregistry.v1.McpServer mcp_servers = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request message for listing endpoints active within the localized
// dataplane.
message ListAiApplicationEndpointsRequest {
  // Required. The parent resource name, in the format
  // `projects/{project}/locations/{location}/aiApplications/{ai_application}`.
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The maximum number of endpoints to return. The service may return
  // fewer than this value. If unspecified or set to `0`, at most 50 endpoints
  // are returned. The maximum value is 100; values above 100 are coerced to
  // 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous
  // `ListAiApplicationEndpoints` call. Provide this to retrieve the
  // subsequent page.
  //
  // When paginating, all other parameters provided to
  // `ListAiApplicationEndpoints` must match the call that provided the
  // page token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for listing endpoints active within the localized
// dataplane.
message ListAiApplicationEndpointsResponse {
  // The list of endpoints.
  repeated google.cloud.agentregistry.v1.Endpoint endpoints = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}
