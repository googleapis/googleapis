type: google.api.Service
config_version: 3
name: agentregistryendpoint.googleapis.com
title: Agent Registry Endpoint API

apis:
- name: google.cloud.agentregistryendpoint.v1.AgentRegistryEndpoint

documentation:
  summary: Agent Registry Endpoint is the localized dataplane API for Agent Registry.

authentication:
  rules:
  - selector: 'google.cloud.agentregistryendpoint.v1.AgentRegistryEndpoint.*'
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/agentregistry.read-only,
        https://www.googleapis.com/auth/agentregistry.read-write,
        https://www.googleapis.com/auth/cloud-platform,
        https://www.googleapis.com/auth/cloud-platform.read-only

publishing:
  new_issue_uri: https://issuetracker.google.com/issues/new?component=2250143
  documentation_uri: https://docs.cloud.google.com/agent-registry/reference/agentregistryendpoint/rest
  api_short_name: agentregistryendpoint
  github_label: 'api: agentregistryendpoint'
  doc_tag_prefix: agentregistryendpoint
  organization: CLOUD
  library_settings:
  - version: google.cloud.agentregistryendpoint.v1
    launch_stage: BETA
    java_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    cpp_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    php_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    python_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    node_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    dotnet_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    ruby_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    go_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
  proto_reference_documentation_uri: https://docs.cloud.google.com/agent-registry/reference/agentregistryendpoint/rpc
