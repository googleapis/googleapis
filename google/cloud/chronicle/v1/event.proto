syntax = "proto3";

package google.cloud.chronicle.v1;

import "backstory/udm.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Cloud.Chronicle.V1";
option go_package = "cloud.google.com/go/chronicle/apiv1/chroniclepb;chroniclepb";
option java_multiple_files = true;
option java_outer_classname = "EventProto";
option java_package = "com.google.cloud.chronicle.v1";
option php_namespace = "Google\\Cloud\\Chronicle\\V1";
option ruby_package = "Google::Cloud::Chronicle::V1";

// Event is a resource that contains information about a telemetry event.
message Event {
  option (google.api.resource) = {
    type: "chronicle.googleapis.com/Event"
    pattern: "projects/{project}/locations/{location}/instances/{instance}/events/{event}"
  };

  // The resource name of the event.
  // Format:
  // projects/{project}/locations/{location}/instances/{instance}/events/{event}
  // where 'event' is URL-encoded Base64. The unencoded value of 'event' can
  // also be found in udm.metadata.id.
  string name = 1;

  // Event data in UDM format.
  backstory.UDM udm = 2;
}
