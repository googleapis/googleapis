syntax = "proto3";

package google.cloud.chronicle.v1beta;

option csharp_namespace = "Google.Cloud.Chronicle.V1Beta";
option go_package = "cloud.google.com/go/chronicle/apiv1beta/chroniclepb;chroniclepb";
option java_multiple_files = true;
option java_outer_classname = "SimulatedDataProto";
option java_package = "com.google.cloud.chronicle.v1beta";
option php_namespace = "Google\\Cloud\\Chronicle\\V1beta";
option ruby_package = "Google::Cloud::Chronicle::V1beta";

// Specifies visibility of simulated data to include. This enum is used in
// multiple protos to filter out simulated data from the data returned by the
// API (like events, detections, and alerts, etc.).
enum SimulatedDataVisibility {
  // If unspecified, simulated data will be excluded.
  SIMULATED_DATA_VISIBILITY_UNSPECIFIED = 0;

  // If specified, simulated data will be included.
  SIMULATED_DATA_INCLUDED = 1;

  // If specified, simulated data will be excluded.
  SIMULATED_DATA_EXCLUDED = 2;
}
