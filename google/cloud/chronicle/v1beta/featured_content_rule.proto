syntax = "proto3";

package google.cloud.chronicle.v1beta;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/chronicle/v1beta/curated_rule.proto";
import "google/cloud/chronicle/v1beta/featured_content_metadata.proto";

option csharp_namespace = "Google.Cloud.Chronicle.V1Beta";
option go_package = "cloud.google.com/go/chronicle/apiv1beta/chroniclepb;chroniclepb";
option java_multiple_files = true;
option java_outer_classname = "FeaturedContentRuleProto";
option java_package = "com.google.cloud.chronicle.v1beta";
option php_namespace = "Google\\Cloud\\Chronicle\\V1beta";
option ruby_package = "Google::Cloud::Chronicle::V1beta";

// This service provides functionality for managing
// FeaturedContentRule.
service FeaturedContentRuleService {
  option (google.api.default_host) = "chronicle.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/chronicle,"
      "https://www.googleapis.com/auth/chronicle.readonly,"
      "https://www.googleapis.com/auth/cloud-platform";

  // Lists FeaturedContentRules
  rpc ListFeaturedContentRules(ListFeaturedContentRulesRequest)
      returns (ListFeaturedContentRulesResponse) {
    option (google.api.http) = {
      get: "/v1beta/{parent=projects/*/locations/*/instances/*/contentHub}/featuredContentRules"
    };
    option (google.api.method_signature) = "parent";
  }
}

// Represents the rule entitlement for FeaturedContentRule.
enum RuleEntitlement {
  // Unspecified entitlement.
  RULE_ENTITLEMENT_UNSPECIFIED = 0;

  // Enterprise entitlement.
  ENTERPRISE = 1;

  // Enterprise Plus entitlement.
  ENTERPRISE_PLUS = 2;
}

// FeaturedContentRule resource.
// Next ID: 16
message FeaturedContentRule {
  option (google.api.resource) = {
    type: "chronicle.googleapis.com/FeaturedContentRule"
    pattern: "projects/{project}/locations/{location}/instances/{instance}/contentHub/featuredContentRules/{featured_content_rule}"
    plural: "featuredContentRules"
    singular: "featuredContentRule"
  };

  // RuleSeverity is an enum representing the severity of the rule.
  enum RuleSeverity {
    // Unspecified severity.
    RULE_SEVERITY_UNSPECIFIED = 0;

    // Rule is set to low severity.
    LOW = 1;

    // Rule is set to medium severity.
    MEDIUM = 2;

    // Rule is set to high severity.
    HIGH = 3;

    // Rule is set to critical severity.
    CRITICAL = 4;
  }

  // Identifier. Full resource name for the FeaturedContentRule.
  // Format:
  // projects/{project}/locations/{location}/instances/{instance}/contentHub/featuredContentRules/{featured_content_rule}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. Metadata for all teams.
  FeaturedContentMetadata content_metadata = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The curated rule content.
  CuratedRule curated_rule_content = 3 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Rule text.
  string rule_text = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Indicates if the curated rule text is hidden because rule is private or
  // customer is missing entitlements.
  bool rule_text_hidden = 5;

  // Output only. The assumption of the rule.
  string rule_assumption = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The severity of the rule.
  RuleSeverity severity = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Alerting status for the curated rule.
  bool alerting_status_enabled = 8;

  // Live status for the curated rule.
  bool live_status_enabled = 9;

  // Indicates the entitlement of the curated rule.
  RuleEntitlement rule_entitlement = 10;

  // Output only. The category pack ID of the curated rule.
  string category_id = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The rule set information for the curated rule.
  RuleSet rule_set = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Indicates if the curated rule is private.
  // If rule is marked as private, the rule text will be hidden.
  bool private_rule = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Indicates if the customer is missing entitlements.
  // If customer is missing entitlements, the rule text will be hidden.
  bool missing_entitlements = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Indicates if the rule is non-upgradable to Chronicle tiers.
  // If rule is non-upgradable, the rule text will be hidden.
  bool non_upgradable = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for ListFeaturedContentRules method.
message ListFeaturedContentRulesRequest {
  // Required. The parent which owns this collection of FeaturedContentRules.
  // Format:
  // projects/{project}/locations/{location}/instances/{instance}/contentHub
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "chronicle.googleapis.com/FeaturedContentRule"
    }
  ];

  // Optional. The maximum number of featured contents to return. The service
  // may return fewer than this value. If unspecified, at most 100 featured
  // contents will be returned. The maximum value is 1000; values above 1000
  // will be coerced to 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListFeaturedContentRules`
  // call. Provide this to retrieve the subsequent page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Only the following filters are allowed:
  // Under HAS operator: Filtering through category names:
  //  - Singular: `category_name:"<category_name>"`
  //  - Multiple: `category_name:"<category_name1>" OR
  //               category_name:"<category_name2>"`
  //    -- You can only use OR operator between multiple category_name filters.
  //
  // Filtering through policy names:
  //  - Singular: `policy_name:"<policy_name>"`
  //  - Multiple: `policy_name:"<policy_name1>" OR
  //               policy_name:"<policy_name2>"`
  //    -- You can only use OR operator between multiple policy_name filters.
  //
  // Filtering through rule IDs:
  //  - Singular: `rule_id:"ur_<id>"`
  //  - Multiple: `rule_id:"ur_<rule_id1>" OR rule_id:"ur_<rule_id2>"`
  //    -- You can only use OR operator between multiple rule_id filters.
  //
  // Filtering through rule precision: `rule_precision:"<rule_precision>"`
  //  -- Rule precision values can be "Precise" or "Broad". If something else
  //     is passed, the rule precision will default to "Unknown". You can only
  //     filter by one rule precision value.
  //
  // Under MATCHES_REGEXP operator: Search through rule name or description
  // (behaves like a string contains): This search is case-insensitive and
  // filters through the rule metadata, specifically the rule_name and
  // description keys. `search_rule_name_or_description=~"<rule_name> or
  // <rule_description>"`. You can only filter by one rule name or description
  // value.
  //
  // Multiple filters can also be used together:
  // Ex 1: `category_name:"<category_name>" AND policy_name:"<policy_name>"`
  // Ex 2: Since category_name and policy_name are repeated fields, we can also
  // use multiple values for each:
  // `(category_name:"<category_name1>" OR category_name:"<category_name2>")
  //  AND policy_name:"<policy_name>"`
  //  -- Note that the AND operator has higher precedence than the OR operator.
  //     Additionally, parentheses must be used to create a valid filter.
  //
  // Requests using filter comparators other than HAS(:) or MATCHES_REGEXP(=~)
  // will result in an InvalidArgument error.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListFeaturedContentRules method.
message ListFeaturedContentRulesResponse {
  // The list of FeaturedContentRules.
  repeated FeaturedContentRule featured_content_rules = 1;

  // Optional. A token, which can be sent as `page_token` to retrieve the next
  // page. If this field is omitted, there are no subsequent pages.
  string next_page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Represents the rule set information for a FeaturedContentRule.
message RuleSet {
  // Output only. The parent CuratedRuleSet that the rule set belongs to.
  // Format:
  // projects/{project}/locations/{location}/instances/{instance}/curatedRuleSetCategories/{category}/curatedRuleSets/{rule_set}
  string curated_rule_set = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The hash of the rule set.
  string id = 2;

  // The human readable name of the rule set.
  string display_name = 3;
}
