syntax = "proto3";

package google.cloud.chronicle.v1beta;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/chronicle/v1beta/rule.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.Chronicle.V1Beta";
option go_package = "cloud.google.com/go/chronicle/apiv1beta/chroniclepb;chroniclepb";
option java_multiple_files = true;
option java_outer_classname = "CuratedRuleProto";
option java_package = "com.google.cloud.chronicle.v1beta";
option php_namespace = "Google\\Cloud\\Chronicle\\V1beta";
option ruby_package = "Google::Cloud::Chronicle::V1beta";

// CuratedRulePrecision is an enum representing the precision level of
// CuratedRules.
enum CuratedRulePrecision {
  // Unspecified precision.
  CURATED_RULE_PRECISION_UNSPECIFIED = 0;

  // Precise rules tend to match relatively few events, but carry a higher
  // significance.
  PRECISE = 1;

  // Broad rules tend to match more events, but may be less significant.
  BROAD = 2;
}

// Represents a rule authored by Chronicle's Google Cloud Threat Intelligence
// (GCTI).
message CuratedRule {
  option (google.api.resource) = {
    type: "chronicle.googleapis.com/CuratedRule"
    pattern: "projects/{project}/locations/{location}/instances/{instance}/curatedRules/{curatedRule}"
  };

  // Required. Full resource name for the curated rule.
  // Format:
  // projects/{project}/locations/{location}/instances/{instance}/curatedRules/{curatedRule}
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Output only. Unique display name of the curated rule.
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The severity of the curated rule.
  Severity severity = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Additional unstructured metadata.
  map<string, string> metadata = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. User-facing type of the curated rule.
  RuleType type = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Precision level of the curated rule.
  CuratedRulePrecision precision = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Mitre tactics covered by the curated rule.
  repeated MitreTactic tactics = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Mitre techniques covered by the curated rule.
  repeated MitreTechnique techniques = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The timestamp of when the curated rule was last updated.
  google.protobuf.Timestamp update_time = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The parent CuratedRuleSet that the rule is listed under.
  // Format:
  // projects/{project}/locations/{location}/instances/{instance}/curatedRuleSetCategories/{category}/curatedRuleSets/{rule_set}
  string curated_rule_set = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
      type: "chronicle.googleapis.com/CuratedRuleSet"
    }
  ];

  // Output only. The description of the curated rule.
  string description = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// MitreTactic represents a MITRE ATT&CK tactic.
message MitreTactic {
  // The ID of the tactic.
  string id = 1;

  // The human-readable name of the tactic.
  string display_name = 2;
}

// MitreTechnique represents a MITRE ATT&CK technique.
message MitreTechnique {
  // The ID of the technique.
  string id = 1;

  // The human-readable name of the technique.
  string display_name = 2;
}
