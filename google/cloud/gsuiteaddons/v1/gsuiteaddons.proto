syntax = "proto3";

package google.cloud.gsuiteaddons.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/apps/script/type/calendar/calendar_addon_manifest.proto";
import "google/apps/script/type/docs/docs_addon_manifest.proto";
import "google/apps/script/type/drive/drive_addon_manifest.proto";
import "google/apps/script/type/gmail/gmail_addon_manifest.proto";
import "google/apps/script/type/meet/meet_addon_manifest.proto";
import "google/apps/script/type/script_manifest.proto";
import "google/apps/script/type/sheets/sheets_addon_manifest.proto";
import "google/apps/script/type/slides/slides_addon_manifest.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Google.Cloud.GSuiteAddOns.V1";
option go_package = "cloud.google.com/go/gsuiteaddons/apiv1/gsuiteaddonspb;gsuiteaddonspb";
option java_multiple_files = true;
option java_outer_classname = "GSuiteAddOnsProto";
option java_package = "com.google.cloud.gsuiteaddons.v1";
option php_namespace = "Google\\Cloud\\GSuiteAddOns\\V1";
option ruby_package = "Google::Cloud::GSuiteAddOns::V1";
option (google.api.resource_definition) = {
  type: "pubsub.googleapis.com/Topic"
  pattern: "projects/{project}/topics/{topic}"
  plural: "topics"
  singular: "topic"
};

// A service for managing Google Workspace add-on deployments.
service GSuiteAddOns {
  option (google.api.default_host) = "gsuiteaddons.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/cloud-platform,"
      "https://www.googleapis.com/auth/cloud-platform.read-only";

  // Gets the authorization information for deployments in a given project.
  rpc GetAuthorization(GetAuthorizationRequest) returns (Authorization) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/authorization}"
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a deployment with the specified name and configuration.
  rpc CreateDeployment(CreateDeploymentRequest) returns (Deployment) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/deployments"
      body: "deployment"
    };
    option (google.api.method_signature) = "parent,deployment,deployment_id";
  }

  // Creates or replaces a deployment with the specified name.
  rpc ReplaceDeployment(ReplaceDeploymentRequest) returns (Deployment) {
    option (google.api.http) = {
      put: "/v1/{deployment.name=projects/*/deployments/*}"
      body: "deployment"
    };
    option (google.api.method_signature) = "deployment";
  }

  // Gets the deployment with the specified name.
  rpc GetDeployment(GetDeploymentRequest) returns (Deployment) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/deployments/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists all deployments in a particular project.
  rpc ListDeployments(ListDeploymentsRequest)
      returns (ListDeploymentsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*}/deployments"
    };
    option (google.api.method_signature) = "parent";
  }

  // Deletes the deployment with the given name.
  rpc DeleteDeployment(DeleteDeploymentRequest)
      returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/deployments/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Installs a deployment to your account for testing. For more information,
  // see [Test your
  // add-on](https://developers.google.com/workspace/add-ons/guides/alternate-runtimes#test_your_add-on)
  rpc InstallDeployment(InstallDeploymentRequest)
      returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/deployments/*}:install"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Uninstalls a test deployment from the user’s account. For more information,
  // see [Test your
  // add-on](https://developers.google.com/workspace/add-ons/guides/alternate-runtimes#test_your_add-on).
  rpc UninstallDeployment(UninstallDeploymentRequest)
      returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/deployments/*}:uninstall"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Gets the install status of a test deployment.
  rpc GetInstallStatus(GetInstallStatusRequest) returns (InstallStatus) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/deployments/*/installStatus}"
    };
    option (google.api.method_signature) = "name";
  }

  // [Developer Preview](https://developers.google.com/workspace/preview):
  // Gets the Chat app configuration of a project. Only Chat apps built as
  // Google Workspace add-ons are supported. Each Google Cloud project has
  // exactly one Chat app configuration.
  //
  // Requires the `gsuiteaddons.chatAppConfigs.get` and `chat.bots.get` IAM
  // permissions on the project.
  rpc GetChatAppConfig(GetChatAppConfigRequest) returns (ChatAppConfig) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/chatAppConfig}"
    };
    option (google.api.method_signature) = "name";
  }

  // [Developer Preview](https://developers.google.com/workspace/preview):
  // Updates the Chat app configuration of a project. Only Chat apps built as
  // Google Workspace add-ons are supported. Each Google Cloud project has
  // exactly one Chat app configuration.
  //
  // Requires the `gsuiteaddons.chatAppConfigs.update`, `chat.bots.update` and
  // `chat.bots.get` IAM permissions on the project.
  rpc UpdateChatAppConfig(UpdateChatAppConfigRequest) returns (ChatAppConfig) {
    option (google.api.http) = {
      patch: "/v1/{chat_app_config.name=projects/*/chatAppConfig}"
      body: "chat_app_config"
    };
    option (google.api.method_signature) = "chat_app_config,update_mask";
  }
}

// Request message to get the Google Workspace add-on authorization information.
message GetAuthorizationRequest {
  // Required. Name of the project for which to get the Google Workspace add-on
  // authorization information.
  //
  // Example: `projects/my_project/authorization`.
  string name = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "gsuiteaddons.googleapis.com/Authorization"
    }
  ];
}

// The authorization information used when invoking deployment endpoints.
message Authorization {
  option (google.api.resource) = {
    type: "gsuiteaddons.googleapis.com/Authorization"
    pattern: "projects/{project}/authorization"
  };

  // The canonical full name of this resource.
  // Example:  `projects/123/authorization`
  string name = 1;

  // The email address of the service account used to authenticate requests to
  // add-on callback endpoints.
  string service_account_email = 2;

  // The OAuth client ID used to obtain OAuth access tokens for a user on the
  // add-on's behalf.
  string oauth_client_id = 3;
}

// Request message to create a deployment.
message CreateDeploymentRequest {
  // Required. Name of the project in which to create the deployment.
  //
  // Example: `projects/my_project`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "cloudresourcemanager.googleapis.com/Project"
    }
  ];

  // Required. The ID to use for this deployment.  The full name of the created
  // resource will be `projects/<project_number>/deployments/<deployment_id>`.
  string deployment_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The deployment to create (deployment.name cannot be set).
  Deployment deployment = 3 [(google.api.field_behavior) = REQUIRED];
}

// Request message to create or replace a deployment.
message ReplaceDeploymentRequest {
  // Required. The deployment to create or replace.
  Deployment deployment = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message to get a deployment.
message GetDeploymentRequest {
  // Required. The full resource name of the deployment to get.
  //
  // Example:  `projects/my_project/deployments/my_deployment`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "gsuiteaddons.googleapis.com/Deployment"
    }
  ];
}

// Request message to list deployments for a project.
message ListDeploymentsRequest {
  // Required. Name of the project in which to create the deployment.
  //
  // Example: `projects/my_project`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "cloudresourcemanager.googleapis.com/Project"
    }
  ];

  // The maximum number of deployments to return. The service might return fewer
  // than this value.
  // If unspecified, at most 1,000 deployments are returned.
  // The maximum possible value is 1,000; values above 1,000 are changed to
  // 1,000.
  int32 page_size = 2;

  // A page token, received from a previous `ListDeployments` call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to `ListDeployments` must
  // match the call that provided the page token.
  string page_token = 3;
}

// Response message to list deployments.
message ListDeploymentsResponse {
  // The list of deployments for the given project.
  repeated Deployment deployments = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

// Request message to delete a deployment.
message DeleteDeploymentRequest {
  // Required. The full resource name of the deployment to delete.
  //
  // Example:  `projects/my_project/deployments/my_deployment`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "gsuiteaddons.googleapis.com/Deployment"
    }
  ];

  // The etag of the deployment to delete.
  // If this is provided, it must match the server's etag.
  string etag = 2;
}

// Request message to install a deployment for testing.
message InstallDeploymentRequest {
  // Required. The full resource name of the deployment to install.
  //
  // Example:  `projects/my_project/deployments/my_deployment`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "gsuiteaddons.googleapis.com/Deployment"
    }
  ];
}

// Request message to uninstall a test deployment.
message UninstallDeploymentRequest {
  // Required. The full resource name of the deployment to install.
  //
  // Example:  `projects/my_project/deployments/my_deployment`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "gsuiteaddons.googleapis.com/Deployment"
    }
  ];
}

// Request message to get the install status of a test deployment.
message GetInstallStatusRequest {
  // Required. The full resource name of the deployment.
  //
  // Example:  `projects/my_project/deployments/my_deployment/installStatus`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "gsuiteaddons.googleapis.com/InstallStatus"
    }
  ];
}

// Install status of a test deployment.
message InstallStatus {
  option (google.api.resource) = {
    type: "gsuiteaddons.googleapis.com/InstallStatus"
    pattern: "projects/{project}/deployments/{deployment}/installStatus"
  };

  // The canonical full resource name of the deployment install status.
  //
  // Example:  `projects/123/deployments/my_deployment/installStatus`.
  string name = 1;

  // True if the deployment is installed for the user.
  google.protobuf.BoolValue installed = 2;
}

// A Google Workspace add-on deployment
message Deployment {
  option (google.api.resource) = {
    type: "gsuiteaddons.googleapis.com/Deployment"
    pattern: "projects/{project}/deployments/{deployment}"
  };

  // The deployment resource name.
  // Example:  `projects/123/deployments/my_deployment`.
  string name = 1;

  // The list of Google OAuth scopes for which to request consent from the end
  // user before executing an add-on endpoint.
  repeated string oauth_scopes = 2;

  // The Google Workspace add-on configuration.
  AddOns add_ons = 3;

  // This value is computed by the server based on the version of the
  // deployment in storage, and may be sent on update and delete requests to
  // ensure the client has an up-to-date value before proceeding.
  string etag = 5;
}

// A Google Workspace add-on configuration.
message AddOns {
  // Configuration that is common across all Google Workspace add-ons.
  google.apps.script.type.CommonAddOnManifest common = 1;

  // Gmail add-on configuration.
  google.apps.script.type.gmail.GmailAddOnManifest gmail = 2;

  // Drive add-on configuration.
  google.apps.script.type.drive.DriveAddOnManifest drive = 5;

  // Calendar add-on configuration.
  google.apps.script.type.calendar.CalendarAddOnManifest calendar = 6;

  // Docs add-on configuration.
  google.apps.script.type.docs.DocsAddOnManifest docs = 7;

  // Meet add-on configuration.
  google.apps.script.type.meet.MeetAddOnManifest meet = 11;

  // Sheets add-on configuration.
  google.apps.script.type.sheets.SheetsAddOnManifest sheets = 8;

  // Slides add-on configuration.
  google.apps.script.type.slides.SlidesAddOnManifest slides = 10;

  // Options for sending requests to add-on HTTP endpoints
  google.apps.script.type.HttpOptions http_options = 15;
}

// Request message to get the Chat app configuration.
// [Developer Preview](https://developers.google.com/workspace/preview).
message GetChatAppConfigRequest {
  // A view that specifies which fields should be populated in the ChatAppConfig
  // resource.
  // [Developer Preview](https://developers.google.com/workspace/preview).
  enum ChatAppConfigView {
    // The default or unset value. Defaults to `BASIC`.
    CHAT_APP_CONFIG_VIEW_UNSPECIFIED = 0;

    // Populates only the basic metadata about the app configuration, without
    // the interactive feature configuration.
    // This is the default value.
    BASIC = 1;

    // Populates all the fields including the interactive feature
    // configurations.
    FULL = 2;
  }

  // Required. Resource name of the Chat app configuration.
  //
  // Format: `projects/{project}/chatAppConfig`, where `{project}` is the Google
  // Cloud project number.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "gsuiteaddons.googleapis.com/ChatAppConfig"
    }
  ];

  // Optional. The view of the ChatAppConfig to return. If unspecified, defaults
  // to `BASIC`.
  ChatAppConfigView view = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateChatAppConfig.
// [Developer Preview](https://developers.google.com/workspace/preview).
message UpdateChatAppConfigRequest {
  // Required. The app configuration to update.
  ChatAppConfig chat_app_config = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The list of fields to update.
  //
  // If omitted, only the fields with non-empty values in the provided Chat app
  // configuration are updated.
  google.protobuf.FieldMask update_mask = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Represents the configuration of a Google Chat app built as a Google Workspace
// add-on.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message ChatAppConfig {
  option (google.api.resource) = {
    type: "gsuiteaddons.googleapis.com/ChatAppConfig"
    pattern: "projects/{project}/chatAppConfig"
    plural: "chatAppConfigs"
    singular: "chatAppConfig"
  };

  // The current state of the Chat app.
  // [Developer Preview](https://developers.google.com/workspace/preview).
  enum AppState {
    // Default value. Unspecified.
    APP_STATE_UNSPECIFIED = 0;

    // Maps to LIVE in the Chat API configuration page.
    // The app is active, it can be found and used by people with visibility.
    ACTIVE = 1;

    // The app is disabled, it can no longer be found by anyone, and nobody can
    // talk to the app any more.
    DISABLED = 2;
  }

  // The markup syntax used to format message text for this Chat app.
  // [Developer Preview](https://developers.google.com/workspace/preview).
  enum MarkupSyntax {
    // Default value. Unspecified. Existing Chat apps created before
    // `markup_syntax` was introduced have this value and use
    // `MARKUP_SYNTAX_CHAT` until explicitly updated.
    MARKUP_SYNTAX_UNSPECIFIED = 0;

    // Uses Google Chat's markup syntax.
    // See
    // https://developers.google.com/workspace/chat/format-messages#format-texts
    // for more information.
    MARKUP_SYNTAX_CHAT = 1;

    // Uses Markdown syntax. This syntax is based on the
    // [CommonMark](https://commonmark.org/help/) specification, with additional
    // extensions.
    // See
    // https://developers.google.com/workspace/chat/format-messages#format-texts
    // for more information.
    MARKUP_SYNTAX_MARKDOWN = 2;
  }

  // Required. Identifier. Resource name of the Chat app configuration.
  //
  // Format: `projects/{project}/chatAppConfig`, where `{project}` is the Google
  // Cloud project number.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IDENTIFIER
  ];

  // Required. The display name of the Chat app. Length should be between 3 and
  // 25 characters.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. The URL for the app's avatar image. Must be an HTTPS URL that
  // hosts a square (aspect ratio of 1:1) PNG image. Recommended minimum size:
  // 256 by 256 pixels. A default app avatar will be used if not specified.
  optional string avatar_uri = 3 [(google.api.field_behavior) = OPTIONAL];

  // Required. A short description of the Chat app.
  // Should be between 1 and 40 characters.
  string description = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. The state of the app. Defaults to `ACTIVE` if not specified.
  optional AppState state = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The settings for interactive features of the app. If this is not
  // provided, the app will be non-interactive, meaning that it can use the Chat
  // API, but users can't interact with the app.
  InteractiveFeatureConfig interactive_feature_config = 6
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether to log errors to Cloud Logging. Defaults to `false` if
  // not specified.
  optional bool error_logging_enabled = 7
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The default markup syntax for messages sent or read by this Chat
  // app. Defaults to `MARKUP_SYNTAX_MARKDOWN` if not specified.
  optional MarkupSyntax markup_syntax = 8
      [(google.api.field_behavior) = OPTIONAL];
}

// Settings for the [interactive
// features](https://developers.google.com/workspace/chat/interact-users-overview)
// of the app.
// [Developer Preview](https://developers.google.com/workspace/preview).
message InteractiveFeatureConfig {
  // Optional. Whether the app can be added to 1:1 human DMs, group chats and
  // spaces. Defaults to `false` if not specified.
  optional bool supports_multiuser_spaces = 1
      [(google.api.field_behavior) = OPTIONAL];

  // Required. How the app receives events from Google Chat.
  ConnectionConfig connection_config = 2
      [(google.api.field_behavior) = REQUIRED];

  // Optional. Configuration for app commands.
  repeated AppCommand app_commands = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Configuration for link previews.
  repeated UrlPattern url_patterns = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The email addresses of users and groups in your Google Workspace
  // domain who can find and use the app.
  repeated string allowlisted_testing_principals = 5
      [(google.api.field_behavior) = OPTIONAL];
}

// How the app receives events.
// [Developer Preview](https://developers.google.com/workspace/preview).
message ConnectionConfig {
  // The type of connection.
  oneof config {
    // HTTP endpoint configuration.
    HttpEndpointConfig http_endpoint_config = 1;

    // Apps Script deployment configuration.
    AppsScriptEndpointConfig apps_script_endpoint_config = 2;

    // Pub/Sub topic configuration.
    CloudPubSubEndpointConfig cloud_pub_sub_endpoint_config = 3;

    // Dialogflow configuration.
    DialogflowEndpointConfig dialogflow_endpoint_config = 4;
  }
}

// HTTP endpoint configuration.
// [Developer Preview](https://developers.google.com/workspace/preview).
message HttpEndpointConfig {
  // The HTTP endpoint URL configuration.
  oneof config {
    // Optional. The HTTPS URL to which Google Chat sends all interactive
    // events.
    string common_url = 1 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Separate HTTPS URLs to which Google Chat sends each type of
    // interactive event.
    HttpPerEventEndpointConfig per_event_endpoint_config = 2
        [(google.api.field_behavior) = OPTIONAL];
  }
}

// HTTP endpoint configuration for specific event types.
// [Developer Preview](https://developers.google.com/workspace/preview).
message HttpPerEventEndpointConfig {
  // Required. HTTPS URL endpoint for app command events.
  string app_command_endpoint = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. HTTPS URL endpoint for added to space events.
  string added_to_space_endpoint = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. HTTPS URL endpoint for message events.
  string message_endpoint = 3 [(google.api.field_behavior) = REQUIRED];

  // Required. HTTPS URL endpoint for removed from space events.
  string removed_from_space_endpoint = 4
      [(google.api.field_behavior) = REQUIRED];
}

// Apps Script endpoint configuration.
// [Developer Preview](https://developers.google.com/workspace/preview).
message AppsScriptEndpointConfig {
  // Required. The Apps Script deployment ID.
  string deployment_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The names of the Apps Script functions that Google Chat calls
  // for each type of interactive event. If not specified, Chat calls the
  // default function for each event type.
  AppsScriptPerEventEndpointConfig per_event_endpoint_config = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Apps Script endpoint configuration for specific event types.
// [Developer Preview](https://developers.google.com/workspace/preview).
message AppsScriptPerEventEndpointConfig {
  // Optional. Function name for app command events. If not specified, the
  // default `onAppCommand` function name will be used.
  optional string app_command_endpoint = 1
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Function name for added to space events. If not specified, the
  // default `onAddedToSpace` function name will be used.
  optional string added_to_space_endpoint = 2
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Function name for message events. If not specified, the default
  // `onMessage` function name will be used.
  optional string message_endpoint = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Function name for removed from space events. If not specified,
  // the default `onRemovedFromSpace` function name will be used.
  optional string removed_from_space_endpoint = 4
      [(google.api.field_behavior) = OPTIONAL];
}

// Pub/Sub endpoint configuration.
// [Developer Preview](https://developers.google.com/workspace/preview).
message CloudPubSubEndpointConfig {
  // Required. The Pub/Sub topic to which Google Chat publishes all interactive
  // events. The topic must be in the same Google Cloud project as the app, and
  // Chat must have permission to publish messages to the topic. For details,
  // see [Build a Google Chat app with
  // Pub/Sub](https://developers.google.com/workspace/chat/quickstart/pub-sub#configure-chat-app).
  //
  // Format: `projects/{project}/topics/{topic}`
  string topic = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "pubsub.googleapis.com/Topic" }
  ];
}

// Dialogflow endpoint configuration.
// [Developer Preview](https://developers.google.com/workspace/preview).
message DialogflowEndpointConfig {
  // Dialogflow edition type.
  // [Developer Preview](https://developers.google.com/workspace/preview).
  enum DialogflowEdition {
    // Default value. Unspecified.
    DIALOGFLOW_EDITION_UNSPECIFIED = 0;

    // Dialogflow ES edition. To use this edition, a Dialogflow ES agent must
    // exist in the same Google Cloud project as the app. Google Chat sends all
    // interactive events to that agent.
    ES = 1;

    // Dialogflow CX edition. To use this edition, a Dialogflow CX agent must
    // exist in the same Google Cloud project as the app and be specified in the
    // `agent` field. Google Chat sends all interactive events to that agent.
    CX = 2;
  }

  // Required. The Dialogflow edition.
  DialogflowEdition dialogflow_edition = 1
      [(google.api.field_behavior) = REQUIRED];

  // Optional. The Dialogflow CX agent or environment name.
  // Required for Dialogflow CX. Do not set for Dialogflow ES.
  //
  // Format: `projects/{project}/locations/{location}/agents/{agent}` or
  // `projects/{project}/locations/{location}/agents/{agent}/environments/{environment}`.
  optional string agent = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Configuration for an [app
// command](https://developers.google.com/workspace/chat/commands).
// [Developer Preview](https://developers.google.com/workspace/preview).
message AppCommand {
  // The type of the App Command.
  // [Developer Preview](https://developers.google.com/workspace/preview).
  enum CommandType {
    // Default value. Unspecified.
    COMMAND_TYPE_UNSPECIFIED = 0;

    // A command invoked by typing a '/' followed by the command name.
    // It may accept additional arguments in the message text.
    SLASH_COMMAND = 1;

    // A quick command invoked from the message compose context menu.
    // Quick commands do not accept additional arguments.
    QUICK_COMMAND = 2;

    // A command invoked from a message context menu.
    MESSAGE_ACTION = 3;
  }

  // Required. The type of this command.
  CommandType command_type = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The ID of the command (1-1000). Must be unique within the app.
  int32 command_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. The name of the command. Required for SLASH_COMMAND, do not set
  // for other command types. Must start with a "/", e.g., "/command".
  string command = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The user-friendly display name of the command. Required for
  // MESSAGE_ACTION and QUICK_COMMAND, do not set for SLASH_COMMAND.
  string display_name = 4 [(google.api.field_behavior) = OPTIONAL];

  // Required. A short description of the command.
  string description = 5 [(google.api.field_behavior) = REQUIRED];

  // Optional. Whether this command should trigger a dialog. Defaults to
  // `false`, if not specified.
  bool dialog_enabled = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A notification to be sent to the user when they trigger the
  // message action. Only supported for MESSAGE_ACTION commands.
  string loading_notification_message = 7
      [(google.api.field_behavior) = OPTIONAL];
}

// Configuration for a [link
// preview](https://developers.google.com/workspace/chat/preview-links).
// [Developer Preview](https://developers.google.com/workspace/preview).
message UrlPattern {
  // Required. The domain to match.
  // Match a specific subdomain, like "subdomain.example.com", or an entire
  // domain by including an asterisk (*) as a leading wildcard character. For
  // example, "*.example.com" matches "https://subdomain.example.com" and
  // "https://any.number.of.subdomains.example.com".
  string host_pattern = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Path prefix appended to the host pattern. If blank, matches all
  // URLs in the host pattern. For example, when paired with the host pattern
  // "subdomain.example.com", specify "path/" to match page URLs that begin with
  // "https://subdomain.example.com/path/".
  string path_prefix = 2 [(google.api.field_behavior) = OPTIONAL];
}
