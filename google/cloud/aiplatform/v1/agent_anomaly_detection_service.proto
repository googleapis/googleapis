  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "aiplatform.googleapis.com/AnalyzedSession"
    }
  ];

  // Optional. The maximum number of analyzed invocations to return.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListAnalyzedInvocations`
  // call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response to list analyzed invocations.
message ListAnalyzedInvocationsResponse {
  // The list of analyzed invocations.
  repeated AnalyzedInvocation analyzed_invocations = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;
}

// Request to aggregate AnalyzedSessions across one or more MonitoredAgents.
// Use the `-` wildcard in the monitored_agent segment of the parent to
// aggregate across all MonitoredAgents in the location.
message AggregateAnalyzedSessionsRequest {
  // Required. The parent MonitoredAgent resource. Use the `-` wildcard
  // for the monitored_agent segment to aggregate across multiple agents in the
  // location.
  // Format:
  // `projects/{project}/locations/{location}/monitoredAgents/{monitored_agent}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "aiplatform.googleapis.com/MonitoredAgent"
    }
  ];

  // Optional. Filter expression restricting which AnalyzedSessions are included
  // in the aggregation. Supports a subset of the
  // `ListAnalyzedSessionsRequest.filter` grammar: a closed `detection_time`
  // window with both bounds required. The `severity` clause is not supported
  // here. If empty, the aggregation covers the last 3 days.
  //
  // Example:
  //
  // ```
  // detection_time >= "2024-01-01T00:00:00Z" AND detection_time <=
  // "2024-01-08T00:00:00Z"
  // ```
  string filter = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The standard list page size. The maximum value is 100; values
  // above 100 will be coerced to 100. If unspecified, at most 10
  // MonitoredAgents will be returned.
  int32 page_size = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The standard list page token.
  string page_token = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Contains aggregated AnalyzedSession statistics, grouped by MonitoredAgent.
message AggregateAnalyzedSessionsResponse {
  // Contains aggregated statistics for one MonitoredAgent.
  message AgentAggregate {
    // The MonitoredAgent resource name.
    // Format:
    // `projects/{project}/locations/{location}/monitoredAgents/{monitored_agent}`
    string monitored_agent = 1;

    // The resource name or identifier of the agent. Matches
    // `AgentResource.agent` on the corresponding `MonitoredAgent`, so the
    // format depends on that agent's `AgentResource.agent_type`. For the
    // format of each agent type, see
    // [AgentResource.agent][google.cloud.aiplatform.v1.AgentResource.agent].
    string agent_resource_name = 2
        [(google.api.resource_reference) = { type: "*" }];

    // Output only. The human-readable display name of the MonitoredAgent.
    string agent_display_name = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The enablement state of the MonitoredAgent (for example,
    // ACTIVE, DISABLED, or ENABLING).
    MonitoredAgent.EnablementState agent_status = 8
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The region of the agent, in the same form as
    // `AgentResource.location` (for example, `us-central1`). Empty when the
    // agent is not enrolled or its location is unknown.
    string location = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The runtime the agent is hosted on (for example,
    // `CLOUD_RUN_SERVICE`).
    //
    // `AGENT_TYPE_UNSPECIFIED` means the runtime is unknown to this service,
    // which is distinct from `AGENT_TYPE_OTHER` (known, and not one of the
    // other enumerated runtimes).
    AgentResource.AgentType agent_type = 10
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // The number of analyzed sessions for this agent matched by the request.
    int32 total_sessions_count = 3;

    // The number of anomalous (SESSION_STATE_FLAGGED) sessions for this agent.
    int32 anomalous_sessions_count = 4;

    // The latest session update_time observed for this agent.
    google.protobuf.Timestamp latest_session_time = 5;

    // Map of severity level (string representation of Severity) to detector
    // summaries aggregated across all sessions for this agent.
    // The key is the string representation of Severity enum:
    // "SEVERITY_UNSPECIFIED", "SEVERITY_CRITICAL", "SEVERITY_HIGH",
    // "SEVERITY_MEDIUM", "SEVERITY_LOW".
    map<string, AnalyzedSession.SeveritySummary> severities = 6;
  }

  // Aggregated statistics — exactly one entry per unique MonitoredAgent
  // matched by the request.
  repeated AgentAggregate agent_aggregates = 1;

  // Overall summary across every MonitoredAgent included in the response.
  ListAnalyzedSessionsResponse.ViewSummary summary = 2;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 3;
}
