// Contains the detailed assessment for an analyzed session.
message Assessment {
  // The details of a detector's assessment within an analyzed session.
  message DetectorFinding {
    // The detector ID.
    string detector_id = 1;

    // The detector display name.
    string display_name = 2;

    // The severity of the finding.
    Severity severity = 3;

    // The explanation of the finding.
    string explanation = 4;

    // The probability that this finding is an anomaly, in the range [0.0, 1.0].
    double probability = 5;

    // The list of recommendations for this detector finding.
    repeated string recommendations = 6;
  }

  // The list of detector findings.
  repeated DetectorFinding detector_findings = 1;
}

// Represents an analyzed session for a monitored agent.
message AnalyzedSession {
  option (google.api.resource) = {
    type: "aiplatform.googleapis.com/AnalyzedSession"
    pattern: "projects/{project}/locations/{location}/monitoredAgents/{monitored_agent}/analyzedSessions/{analyzed_session}"
    plural: "analyzedSessions"
    singular: "analyzedSession"
  };

  // Breaks down anomalies by severity.
  message SeveritySummary {
    // The list of detectors summaries for this severity level.
    repeated string detector_ids = 1;

    // The severity level of the detector.
    Severity severity_level = 2;

    // Output only. The number of distinct sessions whose maximum severity
    // equals `severity_level`. Each session is counted in exactly one bucket
    // (its highest severity).
    //
    // Scope depends on where this appears: a global count on
    // `AggregateAnalyzedSessionsResponse.summary`, per-agent on
    // `agent_aggregates` entries, and page-scoped on
    // `ListAnalyzedSessionsResponse`.
    int32 sessions_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // The analysis state of a session.
  enum SessionState {
    // The session state is unspecified.
    SESSION_STATE_UNSPECIFIED = 0;

    // The session has not yet been analyzed.
    SESSION_STATE_UNANALYZED = 1;

    // The session has been analyzed and no anomalies were flagged.
    SESSION_STATE_NOT_FLAGGED = 2;

    // The session has been analyzed and at least one anomaly was flagged.
    SESSION_STATE_FLAGGED = 3;

    // The session was analyzed by the LLM judge, which did not flag any
    // anomalies.
    SESSION_STATE_LLM_UNFLAGGED = 4;
  }

  // Identifier. The resource name of the AnalyzedSession.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The session ID.
  string session_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The user ID.
  string user_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The resource name or identifier of the agent that ran this
  // session. Matches `AgentResource.agent` on the corresponding
  // `MonitoredAgent`, so the format depends on that agent's
  // `AgentResource.agent_type`. For the format of each agent type, see
  // [AgentResource.agent][google.cloud.aiplatform.v1.AgentResource.agent].
  string agent_resource_name = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = { type: "*" }
  ];

  // Output only. The creation time of the session.
  google.protobuf.Timestamp create_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The latest analyzed time of the session.
  google.protobuf.Timestamp latest_analyzed_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Overall security assessment. Populated only in FULL view.
  Assessment assessment = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Map of the detectors that flagged this session, grouped by
  // severity. The key is the string representation of `Severity`. Populated
  // only for flagged sessions, in both views. In
  // [AgentAnomalyDetectionService.ListAnalyzedSessions][google.cloud.aiplatform.v1.AgentAnomalyDetectionService.ListAnalyzedSessions]
  // responses, the map holds only the session's highest severity.
  map<string, SeveritySummary> severities = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The state of the session.
  SessionState session_state = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The human-readable display name of the MonitoredAgent that
  // owns this session. May be empty when the session's agent is not enrolled
  // as a MonitoredAgent; the `agent_resource_name` is always present and can
  // be used as a fallback identifier.
  string agent_display_name = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The current enablement state of the MonitoredAgent that owns
  // this session (for example, ACTIVE, DISABLED, or ENABLING). Defaults to
  // ENABLEMENT_STATE_UNSPECIFIED when the agent is not enrolled or its state
  // is unknown.
  MonitoredAgent.EnablementState agent_state = 11
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The region of the agent that ran this session, in the same
  // form as `AgentResource.location` (for example, `us-central1`). Empty when
  // the agent is not enrolled or its location is unknown.
  string location = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The runtime that the agent which ran this session is hosted
  // on (for example, `CLOUD_RUN_SERVICE`).
  //
  // `AGENT_TYPE_UNSPECIFIED` means the runtime is unknown to this service --
  // the agent is not enrolled as a `MonitoredAgent`, or was enrolled before its
  // runtime was recorded. That is distinct from `AGENT_TYPE_OTHER`, which means
  // the runtime is known and is not one of the other enumerated runtimes.
  AgentResource.AgentType agent_type = 13
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request to list analyzed sessions.
message ListAnalyzedSessionsRequest {
  // Required. The parent MonitoredAgent resource.
  // Format:
  // `projects/{project}/locations/{location}/monitoredAgents/{monitored_agent}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "aiplatform.googleapis.com/MonitoredAgent"
    }
  ];

  // Optional. The maximum number of analyzed sessions to return.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListAnalyzedSessions`
  // call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filter expression restricting which AnalyzedSessions are
  // returned. Supports a subset of AIP-160: a closed `detection_time` window
  // (both bounds required), an equality on `severity`, an equality on
  // `agent_type`, and an equality on `session_id`, joined by `AND`. Each
  // clause is optional, may appear at most once, and may appear in any order.
  //
  // The `severity` value is the **canonical** `Severity` enum name --
  // `SEVERITY_CRITICAL`, `SEVERITY_HIGH`, `SEVERITY_MEDIUM` or `SEVERITY_LOW`.
  // Short forms such as `"CRITICAL"` are rejected, as is
  // `SEVERITY_UNSPECIFIED`. It matches sessions whose *maximum* severity equals
  // that bucket: a session that fires at both LOW and CRITICAL matches
  // `severity = "SEVERITY_CRITICAL"`, not `severity = "SEVERITY_LOW"`.
  //
  // The `agent_type` value is the canonical `AgentResource.AgentType` enum name
  // -- `REASONING_ENGINE`, `CLOUD_RUN_SERVICE`, `GKE_WORKLOAD`, `GCE_INSTANCE`,
  // `AWS`, `AZURE`, `AGENT_TYPE_OTHER` or `AGENT_TYPE_UNSPECIFIED` -- and
  // matches sessions run by an agent on that runtime.
  //
  // Unlike `severity`, `agent_type` accepts its `UNSPECIFIED` value. The two
  // are not analogous: a session always has a computed severity bucket, so
  // `SEVERITY_UNSPECIFIED` is never returned and filtering on it could only
  // match nothing. `AGENT_TYPE_UNSPECIFIED` *is* returned -- it is what
  // `AnalyzedSession.agent_type` reports for an agent whose runtime was never
  // recorded -- so it must remain filterable.
  //
  // The `session_id` value is a case-sensitive exact match (no substring or
  // prefix matching) on `AnalyzedSession.session_id`. Unlike `severity` and
  // `agent_type` it is not a closed enum, so any non-empty value is accepted;
  // an empty value (`session_id = ""`) is rejected rather than treated as "no
  // filter".
  //
  // Example (time window, severity and runtime):
  //
  // ```
  // detection_time >= "2024-01-01T00:00:00Z" AND detection_time <=
  // "2024-01-08T00:00:00Z" AND severity = "SEVERITY_CRITICAL" AND agent_type =
  // "CLOUD_RUN_SERVICE"
  // ```
  //
  // If empty, results are restricted to the last 7 days with no severity,
  // runtime, or session restriction. Other fields, additional operators, set
  // membership (`IN`), and boolean combinations (`OR`, `NOT`, parentheses) are
  // not yet supported.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Resource view to control which fields are returned.
  AnalyzedSessionView view = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Comma-separated list of fields to sort by, following AIP-132
  // syntax. The default sort direction is ascending; append " desc" to a
  // field to sort descending.
  //
  // Supported fields (any other field yields INVALID_ARGUMENT):
  //
  //   * `latest_detection_time` - the session's most-recent flagged detection
  //     time. `latest_detection_time desc` puts the newest sessions first.
  //   * `max_severity_rank` - the session's bucketed maximum severity, ranked
  //     LOW=1 < MEDIUM=2 < HIGH=3 < CRITICAL=4. `max_severity_rank desc` puts
  //     the most-severe sessions first.
  //   * `agent_display_name` - the MonitoredAgent's display name. Sorted as a
  //     STRING (case-sensitive, code-point order).
  //
  // If empty, defaults to `latest_detection_time desc`. Multi-field sort
  // (for example, `max_severity_rank desc, latest_detection_time desc`) is
  // supported.
  //
  // The `order_by` value MUST match the value used on the call that minted any
  // supplied `page_token` (AIP-158). Mismatches yield INVALID_ARGUMENT.
  string order_by = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response to list analyzed sessions.
message ListAnalyzedSessionsResponse {
  // The view summary.
  message ViewSummary {
    // The list of severity summaries for the analyzed sessions.
    // The key is the string representation of Severity enum:
    // "SEVERITY_UNSPECIFIED", "SEVERITY_CRITICAL", "SEVERITY_HIGH",
    // "SEVERITY_MEDIUM", "SEVERITY_LOW".
    map<string, AnalyzedSession.SeveritySummary> severities = 1;

    // Number of anomalous sessions.
    int32 anomalous_sessions_count = 2;

    // Total number of sessions.
    int32 total_sessions_count = 3;

    // Output only. The number of distinct agents in the request scope with at
    // least one anomalous session in the time window. On
    // `AggregateAnalyzedSessionsResponse.summary` this is a global count; it
    // is not populated on `ListAnalyzedSessionsResponse.summary`.
    int32 anomalous_agents_count = 4
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The number of distinct sessions in the time window that were
    // scanned by the LLM judge.
    int32 llm_scanned_sessions_count = 5
        [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // The list of analyzed sessions.
  repeated AnalyzedSession analyzed_sessions = 1;

  // A token to retrieve the next page of results.
  string next_page_token = 2;

  // Summary statistics computed across the sessions on the current page only.
  // For statistics across the entire result set, use AggregateAnalyzedSessions.
  ViewSummary summary = 3;
}

