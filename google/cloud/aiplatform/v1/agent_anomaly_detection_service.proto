// A service for managing Agent Anomaly Detection for monitored agents.
service AgentAnomalyDetectionService {
  option (google.api.default_host) = "aiplatform.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/cloud-platform";

  // Gets the details of a specific AgentAnomalyDetectionScope.
  rpc GetAgentAnomalyDetectionScope(GetAgentAnomalyDetectionScopeRequest)
      returns (AgentAnomalyDetectionScope) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/agentAnomalyDetectionScopes/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Gets the details of a specific MonitoredAgent.
  rpc GetMonitoredAgent(GetMonitoredAgentRequest) returns (MonitoredAgent) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/monitoredAgents/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists MonitoredAgents in a specific Location.
  rpc ListMonitoredAgents(ListMonitoredAgentsRequest)
      returns (ListMonitoredAgentsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/monitoredAgents"
    };
    option (google.api.method_signature) = "parent";
  }

  // Enables a specific MonitoredAgent.
  rpc EnableMonitoredAgent(EnableMonitoredAgentRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/locations/*/monitoredAgents/*}:enable"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "MonitoredAgent"
      metadata_type: "EnableMonitoredAgentOperationMetadata"
    };
  }

  // Disables a specific MonitoredAgent.
  rpc DisableMonitoredAgent(DisableMonitoredAgentRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/locations/*/monitoredAgents/*}:disable"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "MonitoredAgent"
      metadata_type: "DisableMonitoredAgentOperationMetadata"
    };
  }

  // Deletes a specific AgentAnomalyDetectionScope.
  rpc DeleteAgentAnomalyDetectionScope(DeleteAgentAnomalyDetectionScopeRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/agentAnomalyDetectionScopes/*}"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "DeleteAgentAnomalyDetectionScopeOperationMetadata"
    };
  }

  // Creates a new AgentAnomalyDetectionScope.
  rpc CreateAgentAnomalyDetectionScope(CreateAgentAnomalyDetectionScopeRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/agentAnomalyDetectionScopes"
      body: "agent_anomaly_detection_scope"
    };
    option (google.api.method_signature) =
        "parent,agent_anomaly_detection_scope,agent_anomaly_detection_scope_id";
    option (google.longrunning.operation_info) = {
      response_type: "AgentAnomalyDetectionScope"
      metadata_type: "CreateAgentAnomalyDetectionScopeOperationMetadata"
    };
  }

  // Lists AgentAnomalyDetectionScopes in a Location.
  rpc ListAgentAnomalyDetectionScopes(ListAgentAnomalyDetectionScopesRequest)
      returns (ListAgentAnomalyDetectionScopesResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/agentAnomalyDetectionScopes"
    };
    option (google.api.method_signature) = "parent";
  }

  // Lists AnalyzedSessions in a MonitoredAgent.
  rpc ListAnalyzedSessions(ListAnalyzedSessionsRequest)
      returns (ListAnalyzedSessionsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/monitoredAgents/*}/analyzedSessions"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets the details of a specific AnalyzedSession.
  rpc GetAnalyzedSession(GetAnalyzedSessionRequest) returns (AnalyzedSession) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/monitoredAgents/*/analyzedSessions/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists AnalyzedInvocations in a MonitoredAgent's AnalyzedSession.
  rpc ListAnalyzedInvocations(ListAnalyzedInvocationsRequest)
      returns (ListAnalyzedInvocationsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/monitoredAgents/*/analyzedSessions/*}/analyzedInvocations"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets the details of a specific AnalyzedInvocation.
  rpc GetAnalyzedInvocation(GetAnalyzedInvocationRequest)
      returns (AnalyzedInvocation) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/monitoredAgents/*/analyzedSessions/*/analyzedInvocations/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Aggregates AnalyzedSessions across MonitoredAgents.
  //
  // To aggregate across all MonitoredAgents in a
  // location, use the following format for the parent field:
  // `projects/{project}/locations/{location}/monitoredAgents/-`
  rpc AggregateAnalyzedSessions(AggregateAnalyzedSessionsRequest)
      returns (AggregateAnalyzedSessionsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/monitoredAgents/*}/analyzedSessions:aggregate"
    };
    option (google.api.method_signature) = "parent";
  }

  // Clears (purges) the trained model artifacts derived from a MonitoredAgent's
  // data. The purged model is rebuilt by the next scheduled training run.
  //
  // To clear every MonitoredAgent in a location's scope, use the `-` wildcard
  // agent segment for the name field:
  // `projects/{project}/locations/{location}/monitoredAgents/-`
  //
  // This is the on-demand data-deletion path for customers who have deleted the
  // underlying logs / observability data a model was trained on. It deletes
  // only the derived model artifacts (it does NOT delete the scope or stop
  // monitoring). To stop monitoring an agent entirely, disable it via
  // DisableMonitoredAgent.
  rpc ClearTrainingData(ClearTrainingDataRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/locations/*/monitoredAgents/*}:clearTrainingData"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "ClearTrainingDataResponse"
      metadata_type: "ClearTrainingDataOperationMetadata"
    };
  }
}

// The view options for AnalyzedSession.
enum AnalyzedSessionView {
  // The default view: BASIC.
  ANALYZED_SESSION_VIEW_UNSPECIFIED = 0;

  // Includes every `AnalyzedSession` field except `assessment`.
  ANALYZED_SESSION_VIEW_BASIC = 1;

  // Includes all fields, including the detailed `assessment`.
  // [AgentAnomalyDetectionService.ListAnalyzedSessions][google.cloud.aiplatform.v1.AgentAnomalyDetectionService.ListAnalyzedSessions]
  // omits `assessment` in every view. To get it, call
  // [AgentAnomalyDetectionService.GetAnalyzedSession][google.cloud.aiplatform.v1.AgentAnomalyDetectionService.GetAnalyzedSession]
  // with this view.
  ANALYZED_SESSION_VIEW_FULL = 2;
}

// Severity levels available for Agent Anomaly Detection findings.
// Numeric values are ordered ascending by severity, so comparisons such as
// `severity >= SEVERITY_HIGH` behave as expected.
// Additional values may be added in the future.
enum Severity {
  // Unspecified severity.
  SEVERITY_UNSPECIFIED = 0;

  // Low severity.
  SEVERITY_LOW = 1;

  // Medium severity.
  SEVERITY_MEDIUM = 2;

  // High severity.
  SEVERITY_HIGH = 3;

  // Critical severity.
  SEVERITY_CRITICAL = 4;
}

// Represents an Agent Anomaly Detection Scope.
message AgentAnomalyDetectionScope {
  option (google.api.resource) = {
    type: "aiplatform.googleapis.com/AgentAnomalyDetectionScope"
    pattern: "projects/{project}/locations/{location}/agentAnomalyDetectionScopes/{agent_anomaly_detection_scope}"
    plural: "agentAnomalyDetectionScopes"
    singular: "agentAnomalyDetectionScope"
  };

  // The lifecycle state of an AgentAnomalyDetectionScope.
  enum State {
    // The default value. This value is unused.
    STATE_UNSPECIFIED = 0;

    // The scope is being created and is not yet usable.
    CREATING = 1;

    // The scope is active and usable.
    ACTIVE = 2;

    // The scope is being deleted.
    DELETING = 3;

    // Creation or deletion failed. The scope is not usable and must be deleted
    // before a new scope can be created in the same region.
    FAILED = 4;

    // The scope is being updated.
    UPDATING = 5;
  }

  // Identifier. The resource name of the AgentAnomalyDetectionScope.
  // Format:
  // `projects/{project}/locations/{location}/agentAnomalyDetectionScopes/{agent_anomaly_detection_scope}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. User-provided display name of the AgentAnomalyDetectionScope.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Required. Customer-owned Cloud Logging bucket resource names attached to
  // this scope. Specify exactly one bucket, in the same project as this scope.
  // Format: `projects/{project}/locations/{location}/buckets/{bucket}`.
  repeated string log_buckets = 5 [(google.api.field_behavior) = REQUIRED];

  // Required. Customer-owned Cloud Observability datasets attached to this
  // scope. Each value is the resource name of a dataset in an Observability
  // bucket, such as the `Spans` dataset in the `_Trace` bucket. Specify
  // exactly one dataset, in the same project as this scope.
  // Format:
  // `projects/{project}/locations/{location}/buckets/{bucket}/datasets/{dataset}`.
  repeated string observability_buckets = 6
      [(google.api.field_behavior) = REQUIRED];

  // Optional. When `true`, newly discovered agents that share log and
  // observability buckets with this scope are automatically enrolled as
  // `ACTIVE` MonitoredAgents, up to the project's monitored agent quota. When
  // `false`, newly discovered agents are added as `DISABLED` MonitoredAgents,
  // and you must enable them explicitly through MonitoredAgent operations.
  bool auto_enroll = 7 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The lifecycle state of the scope.
  State state = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Immutable. Specifies the customer-managed encryption key spec for
  // a Scope. If set, this Scope and all sub-resources will be secured by this
  // key.
  //
  // The key is immutable after the Scope is created and must be a multi-region
  // (`us` or `eu`) key in the same region as the Scope.
  EncryptionSpec encryption_spec = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE
  ];
}

// Represents a monitored agent in a specific Location.
message MonitoredAgent {
  option (google.api.resource) = {
    type: "aiplatform.googleapis.com/MonitoredAgent"
    pattern: "projects/{project}/locations/{location}/monitoredAgents/{monitored_agent}"
    plural: "monitoredAgents"
    singular: "monitoredAgent"
  };

  // Represents the detailed status of the MonitoredAgent.
  enum EnablementState {
    // The default value. This value is used if the state is omitted.
    ENABLEMENT_STATE_UNSPECIFIED = 0;

    // The agent is successfully enabled and active.
    ACTIVE = 1;

    // The agent is in the process of being enabled.
    ENABLING = 3;

    // The agent is disabled.
    DISABLED = 6;
  }

  // Identifier. The resource name of the MonitoredAgent.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. The display name of the MonitoredAgent.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Required. The configuration for the agent being monitored.
  AgentResource agent_resource = 3 [(google.api.field_behavior) = REQUIRED];

  // Output only. The current state of the agent's enablement.
  EnablementState state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A brief message explaining the current state.
  string status_message = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time the MonitoredAgent was created.
  google.protobuf.Timestamp create_time = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time the MonitoredAgent was last updated.
  google.protobuf.Timestamp update_time = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Defines the identity of an agent being monitored.
message AgentResource {
  // The runtime type of an agent, describing where the agent is hosted. This is
  // orthogonal to the framework the agent is built with; see `AgentFramework`.
  enum AgentType {
    // The default value, used when the runtime type is unspecified.
    AGENT_TYPE_UNSPECIFIED = 0;

    // The agent runs on the Gemini Enterprise Agent Platform Agent Runtime
    // (Reasoning Engine).
    REASONING_ENGINE = 1;

    // The agent runs as a Google Cloud Run service.
    CLOUD_RUN_SERVICE = 2;

    // The agent runs as a workload on Google Kubernetes Engine.
    GKE_WORKLOAD = 3;

    // The agent runs on a Compute Engine instance.
    GCE_INSTANCE = 4;

    // The agent runs on a runtime that no other value represents, such as a
    // self-hosted or on-premises environment.
    AGENT_TYPE_OTHER = 5;

    // The agent runs on Amazon Web Services (AWS), such as on AWS Lambda.
    AWS = 8;

    // The agent runs on Microsoft Azure, such as on Azure Kubernetes Service
    // (AKS) or as a Microsoft Foundry hosted agent.
    AZURE = 9;
  }

  // The framework used to build an agent, such as the Agent Development Kit
  // (ADK). This is orthogonal to the runtime the agent is hosted on; see
  // `AgentType`.
  enum AgentFramework {
    // The default value, used when the framework is unspecified.
    AGENT_FRAMEWORK_UNSPECIFIED = 0;

    // The agent is built with the Agent Development Kit (ADK).
    ADK = 1;
  }

  // Required. The runtime type of the agent.
  AgentType agent_type = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The resource name or identifier of the agent to monitor. The
  // format depends on `agent_type`:
  //
  // * `REASONING_ENGINE`:
  //   `//aiplatform.googleapis.com/projects/{project}/locations/{location}/reasoningEngines/{reasoning_engine}`
  // * `CLOUD_RUN_SERVICE`: the full resource name of the Cloud Run service,
  //   `//run.googleapis.com/projects/{project}/locations/{location}/services/{service}`
  // * `GKE_WORKLOAD`: the full resource name of the Google Kubernetes Engine
  //   cluster followed by the agent's OpenTelemetry `service.name`,
  //   `//container.googleapis.com/projects/{project}/locations/{location}/clusters/{cluster}/{service}`.
  //   For a zonal cluster, `zones/{zone}` replaces `locations/{location}`.
  //   Some names end in
  //   `k8s/namespaces/{namespace}/apps/deployments/{deployment}` instead of
  //   `{service}`.
  // * `GCE_INSTANCE`: the full resource name of the Compute Engine instance
  //   followed by the agent's OpenTelemetry `service.name`,
  //   `//compute.googleapis.com/projects/{project}/zones/{zone}/instances/{instance}/{service}`,
  //   where `{instance}` is the numeric instance ID.
  // * `AWS` and `AZURE`: an identifier built from the agent's OpenTelemetry
  //   resource attributes, usually `{platform}:{account}:{region}:{name}`.
  //   `{platform}` is the `cloud.platform` value. `{account}` is
  //   `cloud.account.id`, or the ID of the Google Cloud project that receives
  //   the telemetry if `cloud.account.id` isn't set. `{region}` is
  //   `cloud.region`. `{name}` is `faas.name`, or the Kubernetes cluster name
  //   followed by `/k8s/namespaces/{namespace}/apps/deployments/{deployment}`
  //   or `/{service}`. For example,
  //   `aws_lambda:123456789012:us-east-2:inventory-agent`.
  // * `AGENT_TYPE_OTHER`: a stable identifier for the agent, such as the full
  //   resource name of its runtime or its OpenTelemetry `service.name`.
  string agent = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "*" }
  ];

  // Output only. The region of the agent resource: a Google Cloud location
  // (for example, `us-central1`), or for an `AWS` or `AZURE` agent, the region
  // in that cloud (for example, `us-east-2`).
  string location = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The framework used to build the agent, orthogonal to the runtime
  // `agent_type`.
  AgentFramework agent_framework = 4 [(google.api.field_behavior) = OPTIONAL];
}

