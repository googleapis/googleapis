  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "aiplatform.googleapis.com/AnalyzedSession"
    }
  ];

  // Optional. Resource view to control which fields are returned.
  AnalyzedSessionView view = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Represents an analyzed invocation for a monitored agent's session.
message AnalyzedInvocation {
  option (google.api.resource) = {
    type: "aiplatform.googleapis.com/AnalyzedInvocation"
    pattern: "projects/{project}/locations/{location}/monitoredAgents/{monitored_agent}/analyzedSessions/{analyzed_session}/analyzedInvocations/{analyzed_invocation}"
    plural: "analyzedInvocations"
    singular: "analyzedInvocation"
  };

  // State of the invocation.
  enum InvocationState {
    // Unspecified state.
    INVOCATION_STATE_UNSPECIFIED = 0;

    // The invocation is anomalous.
    INVOCATION_STATE_ANOMALOUS = 1;

    // The invocation is not anomalous.
    INVOCATION_STATE_NOT_ANOMALOUS = 2;
  }

  // Identifier. The resource name of the AnalyzedInvocation.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The invocation ID.
  string invocation_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The assessment of the invocation.
  Assessment assessment = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The state of the invocation.
  InvocationState invocation_state = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request to get the details of a specific analyzed invocation.
message GetAnalyzedInvocationRequest {
  // Required. The name of the AnalyzedInvocation resource.
  // Format:
  // `projects/{project}/locations/{location}/monitoredAgents/{monitored_agent}/analyzedSessions/{analyzed_session}/analyzedInvocations/{analyzed_invocation}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
