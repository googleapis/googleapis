syntax = "proto3";

package google.cloud.oracledatabase.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/oracledatabase/v1/common.proto";

option csharp_namespace = "Google.Cloud.OracleDatabase.V1";
option go_package = "cloud.google.com/go/oracledatabase/apiv1/oracledatabasepb;oracledatabasepb";
option java_multiple_files = true;
option java_outer_classname = "FlexComponentProto";
option java_package = "com.google.cloud.oracledatabase.v1";
option php_namespace = "Google\\Cloud\\OracleDatabase\\V1";
option ruby_package = "Google::Cloud::OracleDatabase::V1";

// Details of the Flex Component resource.
message FlexComponent {
  option (google.api.resource) = {
    type: "oracledatabase.googleapis.com/FlexComponent"
    pattern: "projects/{project}/locations/{location}/flexComponents/{flex_component}"
    plural: "flexComponents"
    singular: "flexComponent"
  };

  // Identifier. Specifies the name of the Flex Component resource with the
  // format:
  // projects/{project}/locations/{region}/flexComponents/{flex_component}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The properties of the Flex Component.
  FlexComponentProperties properties = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The properties of the Flex Component.
message FlexComponentProperties {
  // HardwareType enum
  enum HardwareType {
    // Unspecified default
    HARDWARE_TYPE_UNSPECIFIED = 0;

    // COMPUTE
    COMPUTE = 1;

    // CELL
    CELL = 2;
  }

  // Output only. The name of the Flex Component used for the DB system.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The hardware type of the DB (Compute) or Storage (Cell) Server
  // for this Flex Component.
  HardwareType hardware_type = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The name of the DB system shape for this Flex Component.
  string shape = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The maximum number of CPU cores that can be enabled on the DB
  // system for this shape.
  int32 available_core_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The maximum memory size that can be enabled on the DB Server
  // for this Flex Component.
  int32 available_memory_gb = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The maximum local storage that can be enabled on the DB Server
  // for this Flex Component.
  int32 available_local_storage_gb = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The maximum storage that can be enabled on the Storage Server
  // for this Flex Component.
  int32 available_db_node_storage_per_node_gb = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The minimum number of CPU cores that can be enabled on the DB
  // Server for this Flex Component.
  int32 minimum_core_count = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The runtime minimum number of CPU cores that can be enabled
  // for this Flex Component.
  int32 runtime_minimum_core_count = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The description summary for this Flex Component.
  string description_summary = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The compute model of the DB Server for this Flex Component.
  ComputeModel compute_model = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Message for listing FlexComponents.
message ListFlexComponentsRequest {
  // Required. Parent value for ListFlexComponentsRequest
  // Format: projects/{project}/locations/{location}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "oracledatabase.googleapis.com/FlexComponent"
    }
  ];

  // Optional. Requested page size. Server may return fewer items than
  // requested. If unspecified, server will pick an appropriate default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A token identifying a page of results the server should return.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An expression for filtering the results of the request. Only the
  // `shape` field is supported in the following format: `shape="{shape}"`.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Message for response to listing FlexComponents
message ListFlexComponentsResponse {
  // The list of FlexComponent
  repeated FlexComponent flex_components = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;

  // Unordered list. Locations that could not be reached.
  repeated string unreachable = 3
      [(google.api.field_behavior) = UNORDERED_LIST];
}
