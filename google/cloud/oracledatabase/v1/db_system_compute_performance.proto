syntax = "proto3";

package google.cloud.oracledatabase.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/oracledatabase/v1/common.proto";

option csharp_namespace = "Google.Cloud.OracleDatabase.V1";
option go_package = "cloud.google.com/go/oracledatabase/apiv1/oracledatabasepb;oracledatabasepb";
option java_multiple_files = true;
option java_outer_classname = "DbSystemComputePerformanceProto";
option java_package = "com.google.cloud.oracledatabase.v1";
option php_namespace = "Google\\Cloud\\OracleDatabase\\V1";
option ruby_package = "Google::Cloud::OracleDatabase::V1";

// Details of the DbSystem compute performance resource.
message DbSystemComputePerformance {
  option (google.api.resource) = {
    type: "oracledatabase.googleapis.com/DbSystemComputePerformance"
    pattern: "projects/{project}/locations/{location}/dbSystemComputePerformances/{db_system_compute_performance}"
    plural: "dbSystemComputePerformances"
    singular: "dbSystemComputePerformance"
  };

  // Identifier. The name of the DbSystemComputePerformance resource with the
  // format:
  // projects/{project}/locations/{location}/dbSystemComputePerformances/{db_system_compute_performance}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The shape of the DB system.
  string shape = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. List of Compute performance details for the specified DB
  // system shape.
  repeated ComputePerformance compute_performances = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Parameters detailing the compute performance for a specified DB system shape.
message ComputePerformance {
  // Output only. The number of CPU cores available.
  int32 cpu_core_count = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The compute model for Base Database Service.
  ComputeModel compute_model = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The number of compute servers for the DB system.
  int32 compute_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The amount of memory allocated for the VMDB System in GBs.
  double memory_in_gbs = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Message for listing DbSystemComputePerformances.
message ListDbSystemComputePerformancesRequest {
  // Required. Parent value for ListDbSystemComputePerformancesRequest
  // Format: projects/{project}/locations/{location}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "oracledatabase.googleapis.com/DbSystemComputePerformance"
    }
  ];

  // Optional. Requested page size. Server may return fewer items than
  // requested. If unspecified, server will pick an appropriate default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A token identifying a page of results the server should return.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An expression for filtering the results of the request. Only the
  // `db_system_shape` field is supported in the following format:
  // `db_system_shape="{db_system_shape}"`.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Message for response to listing DbSystemComputePerformances
message ListDbSystemComputePerformancesResponse {
  // The list of DbSystemComputePerformance.
  repeated DbSystemComputePerformance db_system_compute_performances = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;

  // Unordered list. Locations that could not be reached.
  repeated string unreachable = 3
      [(google.api.field_behavior) = UNORDERED_LIST];
}
