syntax = "proto3";

package google.cloud.apihub.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/apihub/v1/common_fields.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.ApiHub.V1";
option go_package = "cloud.google.com/go/apihub/apiv1/apihubpb;apihubpb";
option java_multiple_files = true;
option java_outer_classname = "AddonServiceProto";
option java_package = "com.google.cloud.apihub.v1";
option php_namespace = "Google\\Cloud\\ApiHub\\V1";
option ruby_package = "Google::Cloud::ApiHub::V1";

// This service is used for managing addons inside the API Hub.
service ApiHubAddon {
  option (google.api.default_host) = "apihub.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/apihub.readonly,"
      "https://www.googleapis.com/auth/apihub.readwrite,"
      "https://www.googleapis.com/auth/cloud-platform";

  // Get an addon.
  rpc GetAddon(GetAddonRequest) returns (Addon) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/addons/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Manage addon config.
  // This RPC is used for managing the config of the addon. Calling this RPC
  // moves the addon into an updating state until the long-running operation
  // succeeds.
  rpc ManageAddonConfig(ManageAddonConfigRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/locations/*/addons/*}:manageConfig"
      body: "*"
    };
    option (google.api.method_signature) = "name,config";
    option (google.longrunning.operation_info) = {
      response_type: "Addon"
      metadata_type: "OperationMetadata"
    };
  }

  // List addons.
  rpc ListAddons(ListAddonsRequest) returns (ListAddonsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/addons"
    };
    option (google.api.method_signature) = "parent";
  }
}

// Addon resource.
message Addon {
  option (google.api.resource) = {
    type: "apihub.googleapis.com/Addon"
    pattern: "projects/{project}/locations/{location}/addons/{addon}"
    plural: "addons"
    singular: "addon"
  };

  // Identifier. The name of the addon to enable.
  // Format: `projects/{project}/locations/{location}/addons/{addon}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. The display name of the addon.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. The description of the addon.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Required. The data source on which the addon operates. This determines
  // which field in the `config` oneof is used.
  DataSource data_source = 4 [(google.api.field_behavior) = REQUIRED];

  // Output only. The time at which the addon was created.
  google.protobuf.Timestamp create_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time at which the addon was last updated.
  google.protobuf.Timestamp update_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The configuration of the addon.
  AddonConfig config = 7 [(google.api.field_behavior) = REQUIRED];

  // Output only. The state of the addon.
  AddonState state = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The Vertex AI region where the BoostSpec Gemini model calls
  // run for this API Hub instance. Populated only for the SpecGen addon
  // (`system-spec-generation`); other addons leave this field empty.
  //
  // `gemini-2.5-flash` is not available in every API Hub region, so the
  // effective region may differ from the API Hub instance's own region.
  // The value follows these semantics:
  //
  //   - `""`: BoostSpec is disabled in this region (the addon is not
  //     SpecGen, or the API Hub instance region has no configured
  //     Gemini endpoint or fallback).
  //   - Equal to the API Hub instance region: BoostSpec calls run
  //     in-region.
  //   - Differs from the API Hub instance region: BoostSpec calls run
  //     in the specified fallback region.
  //
  // Callers rendering this field can derive the three display states
  // from this single field combined with the API Hub instance region.
  string boost_spec_gemini_region_id = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Filter for environments.
message EnvironmentFilter {
  // Optional. Indicates if this filter should match all environments or only
  // a subset of environments.
  // If set to true, all environments are matched.
  bool all_environments = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If provided, only environments in this list are matched. This
  // field is ignored if `all_environments` is true.
  repeated string environments = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Configuration for a gateway plugin.
// This is used to specify configs for different gateways.
message GatewayPluginConfig {
  // The config of the gateway plugin.
  oneof config {
    // Configuration for Apigee X and Apigee Hybrid gateways.
    ApigeeXHybridConfig apigee_x_hybrid_config = 2;

    // Configuration for Apigee Edge gateways.
    ApigeeEdgeConfig apigee_edge_config = 3;

    // Configuration for Apigee OPDK gateways.
    ApigeeOPDKConfig apigee_opdk_config = 4;
  }

  // Required. The name of the gateway plugin instance for which the config is
  // to be specified. Format:
  // projects/{project}/locations/{location}/plugins/{plugin}/instances/{instance}
  string plugin_instance = 1 [(google.api.field_behavior) = REQUIRED];
}

// Configuration for Apigee X and Apigee Hybrid gateways. Applicability of a
// filter is determined by the filter being provided. If none of the filters are
// provided the addon will be enabled for all data brought in by the gateway
// plugin instance.
message ApigeeXHybridConfig {
  // Optional. The filter to apply on the resources managed by the gateway
  // plugin instance. If provided this filter applies environment specific
  // filtering.
  EnvironmentFilter environment_filter = 1
      [(google.api.field_behavior) = OPTIONAL];
}

// Configuration for Apigee Edge gateways. Applicability of a
// filter is determined by the filter being provided. If none of the filters are
// provided the addon will be enabled for all data brought in by the gateway
// plugin instance.
message ApigeeEdgeConfig {
  // Optional. The filter to apply on the resources managed by the gateway
  // plugin instance. If provided this filter applies environment specific
  // filtering.
  EnvironmentFilter environment_filter = 1
      [(google.api.field_behavior) = OPTIONAL];
}

// Configuration for Apigee OPDK gateways. Applicability of a
// filter is determined by the filter being provided. If none of the filters are
// provided the addon will be enabled for all data brought in by the gateway
// plugin instance.
message ApigeeOPDKConfig {
  // Optional. The filter to apply on the resources managed by the gateway
  // plugin instance. If provided this filter applies environment specific
  // filtering.
  EnvironmentFilter environment_filter = 1
      [(google.api.field_behavior) = OPTIONAL];
}

// Configuration for gateway plugin addons.
// This is used to specify the list of gateway plugin configs for which the
// addon is enabled.
message GatewayPluginAddonConfig {
  // Required. The list of gateway plugin configs for which the addon is
  // enabled. Each gateway plugin config should have a unique plugin instance.
  repeated GatewayPluginConfig gateway_plugin_configs = 1
      [(google.api.field_behavior) = REQUIRED];
}

// Configuration for addons which act on all data in the API hub.
// This is used to specify if the addon is enabled for all data in the API hub.
message AllDataAddonConfig {
  // Required. If true, the addon is enabled for all data in the API hub.
  bool enabled = 1 [(google.api.field_behavior) = REQUIRED];
}

// Configuration for the addon.
message AddonConfig {
  // Addon configuration, which varies based on the data_source. Keeping this as
  // a oneof in case we want to add configuration for other data sources in the
  // future.
  oneof config {
    // Configuration for gateway plugin addons.
    GatewayPluginAddonConfig gateway_plugin_addon_config = 1;

    // Configuration for addons which act on all data in the API hub.
    AllDataAddonConfig all_data_addon_config = 2;
  }
}

// The [GetAddon][google.cloud.apihub.v1.ApiHubAddon.GetAddon] method's request.
message GetAddonRequest {
  // Required. The name of the addon to get.
  // Format: `projects/{project}/locations/{location}/addons/{addon}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "apihub.googleapis.com/Addon" }
  ];
}

// The [ManageAddonConfig][google.cloud.apihub.v1.ApiHubAddon.ManageAddonConfig]
// method's request.
message ManageAddonConfigRequest {
  // Required. The name of the addon for which the config is to be managed.
  // Format: `projects/{project}/locations/{location}/addons/{addon}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "apihub.googleapis.com/Addon" }
  ];

  // Required. The config of the addon to be managed. This config will replace
  // the config present in the addon. The type of the config should match the
  // config type already present in the addon.
  AddonConfig config = 2 [(google.api.field_behavior) = REQUIRED];
}

// The [ListAddons][google.cloud.apihub.v1.ApiHubAddon.ListAddons] method's
// request.
message ListAddonsRequest {
  // Required. The parent resource where this addon will be created.
  // Format: `projects/{project}/locations/{location}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "apihub.googleapis.com/Addon"
    }
  ];

  // Optional. An expression that filters the list of addons.
  // The only supported filter is `plugin_instance_name`. It can be used to
  // filter addons that are enabled for a given plugin instance.
  // The format of the filter is `plugin_instance_name =
  // "projects/{project}/locations/{location}/plugins/{plugin}/instances/{instance}"`.
  string filter = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The maximum number of hub addons to return. The service may
  // return fewer than this value. If unspecified, at most 50 hub addons will be
  // returned. The maximum value is 1000; values above 1000 will be coerced to
  // 1000.
  int32 page_size = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListAddons` call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters (except page_size) provided to
  // `ListAddons` must match the call that provided the page token.
  string page_token = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The [ListAddons][google.cloud.apihub.v1.ApiHubAddon.ListAddons] method's
// response.
message ListAddonsResponse {
  // The list of addons.
  repeated Addon addons = 1;

  // A token to retrieve the next page of results, or empty if there are no
  // more results in the list.
  string next_page_token = 2;
}
