syntax = "proto3";

package google.cloud.discoveryengine.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/discoveryengine/v1/common.proto";
import "google/cloud/discoveryengine/v1/schema.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "google/type/datetime.proto";

option csharp_namespace = "Google.Cloud.DiscoveryEngine.V1";
option go_package = "cloud.google.com/go/discoveryengine/apiv1/discoveryenginepb;discoveryenginepb";
option java_multiple_files = true;
option java_outer_classname = "DataConnectorProto";
option java_package = "com.google.cloud.discoveryengine.v1";
option objc_class_prefix = "DISCOVERYENGINE";
option php_namespace = "Google\\Cloud\\DiscoveryEngine\\V1";
option ruby_package = "Google::Cloud::DiscoveryEngine::V1";

// The type of connector.
// New values may be added to this enum in the future.
enum ConnectorType {
  // Default value.
  CONNECTOR_TYPE_UNSPECIFIED = 0;

  // Third party connector to connector to third party application.
  THIRD_PARTY = 1;

  // Data connector connects between FHIR store and VAIS datastore.
  GCP_FHIR = 2;

  // Big query connector.
  BIG_QUERY = 3;

  // Google Cloud Storage connector.
  GCS = 4;

  // Gmail connector.
  GOOGLE_MAIL = 5;

  // Google Calendar connector.
  GOOGLE_CALENDAR = 6;

  // Google Drive connector.
  GOOGLE_DRIVE = 7;

  // Native Cloud Identity connector for people search powered by People API.
  NATIVE_CLOUD_IDENTITY = 8;

  // Federated connector, it is a third party connector that doesn't ingestion
  // data, and search is powered by third party application's API.
  THIRD_PARTY_FEDERATED = 9;

  // Connector utilized for End User Authentication features.
  THIRD_PARTY_EUA = 10;

  // Google Cloud NetApp Volumes connector.
  GCNV = 11;

  // Google Chat connector.
  GOOGLE_CHAT = 12;

  // Google Sites connector.
  GOOGLE_SITES = 13;

  // Remote MCP based connector.
  REMOTE_MCP = 14;

  // Google Workspace connector.
  GOOGLE_WORKSPACE = 15;
}

// Manages the connection to external data sources for all data stores grouped
// under a [Collection][google.cloud.discoveryengine.v1.Collection]. It's a
// singleton resource of
// [Collection][google.cloud.discoveryengine.v1.Collection]. The initialization
// is only supported through
// [DataConnectorService.SetUpDataConnector][google.cloud.discoveryengine.v1.DataConnectorService.SetUpDataConnector]
// method, which will create a new
// [Collection][google.cloud.discoveryengine.v1.Collection] and initialize its
// [DataConnector][google.cloud.discoveryengine.v1.DataConnector].
message DataConnector {
  option (google.api.resource) = {
    type: "discoveryengine.googleapis.com/DataConnector"
    pattern: "projects/{project}/locations/{location}/collections/{collection}/dataConnector"
  };

  // Represents an entity in the data source. For example, the `Account` object
  // in Salesforce.
  message SourceEntity {
    // The parameters for the entity to facilitate data ingestion.
    // E.g. for BigQuery connectors:
    //
    // * Key: `document_id_column`
    // * Value: type STRING. The value of the column ID.
    oneof entity_params {
      // The parameters for the entity to facilitate data ingestion in
      // structured json format.
      google.protobuf.Struct params = 4;

      // The parameters for the entity to facilitate data ingestion in json
      // string format.
      string json_params = 10;
    }

    // The name of the entity. Supported values by data source:
    //
    // * Salesforce: `Lead`, `Opportunity`, `Contact`, `Account`, `Case`,
    //   `Contract`, `Campaign`
    // * Jira: `Issue`
    // * Confluence: `Content`, `Space`
    string entity_name = 1;

    // Attributes for indexing.
    // Key: Field name.
    // Value: The key property to map a field to, such as `title`, and
    // `description`. Supported key properties:
    //
    // * `title`: The title for data record. This would be displayed on search
    //   results.
    // * `description`: The description for data record. This would be displayed
    //   on search results.
    map<string, string> key_property_mappings = 2;

    // Output only. The full resource name of the associated data store for the
    // source entity. Format:
    // `projects/*/locations/*/collections/*/dataStores/*`.
    // When the connector is initialized by the
    // [DataConnectorService.SetUpDataConnector][google.cloud.discoveryengine.v1.DataConnectorService.SetUpDataConnector]
    // method, a [DataStore][google.cloud.discoveryengine.v1.DataStore] is
    // automatically created for each source entity.
    string data_store = 3 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference) = {
        type: "discoveryengine.googleapis.com/DataStore"
      }
    ];

    // Optional. The start schema to use for the
    // [DataStore][google.cloud.discoveryengine.v1.DataStore] created from this
    // SourceEntity. If unset, a default vertical specialized schema will be
    // used.
    //
    // This field is only used by
    // [SetUpDataConnector][google.cloud.discoveryengine.v1.DataConnectorService.SetUpDataConnector]
    // API, and will be ignored if used in other APIs. This field will be
    // omitted from all API responses including
    // [GetDataConnector][google.cloud.discoveryengine.v1.DataConnectorService.GetDataConnector]
    // API. To retrieve a schema of a
    // [DataStore][google.cloud.discoveryengine.v1.DataStore], use
    // [SchemaService.GetSchema][google.cloud.discoveryengine.v1.SchemaService.GetSchema]
    // API instead.
    //
    // The provided schema will be validated against certain rules on schema.
    // Learn more from [this
    // doc](https://cloud.google.com/generative-ai-app-builder/docs/provide-schema).
    Schema starting_schema = 6 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Configuration for `HEALTHCARE_FHIR` vertical.
    HealthcareFhirConfig healthcare_fhir_config = 7
        [(google.api.field_behavior) = OPTIONAL];
  }

  // Any params and credentials used specifically for EUA connectors.
  message EndUserConfig {
    // Authentication configuration for EUA connectors.
    //
    // Both arms hold customer-supplied auth parameters, including PEM private
    // keys. Without a redacting semantic type, `DebugString()` prints the key
    // material in full.
    oneof auth_config {
      // Optional. Any authentication parameters specific to EUA connectors.
      google.protobuf.Struct auth_params = 1
          [(google.api.field_behavior) = OPTIONAL];

      // Optional. Any authentication parameters specific to EUA connectors in
      // json string format.
      string json_auth_params = 4 [(google.api.field_behavior) = OPTIONAL];
    }

    // Optional. Any additional parameters needed for EUA.
    google.protobuf.Struct additional_params = 2
        [(google.api.field_behavior) = OPTIONAL];

    // Optional. The tenant project the connector is connected to.
    Tenant tenant = 3 [(google.api.field_behavior) = OPTIONAL];
  }

  // Any params and credentials used specifically for hybrid connectors
  // supporting FEDERATED mode.
  message FederatedConfig {
    // Authentication configuration for FEDERATED connectors.
    oneof auth_config {
      // Optional. Any authentication parameters specific to FEDERATED
      // connectors.
      google.protobuf.Struct auth_params = 1
          [(google.api.field_behavior) = OPTIONAL];

      // Optional. Any authentication parameters specific to FEDERATED
      // connectors in json string format.
      string json_auth_params = 3 [(google.api.field_behavior) = OPTIONAL];
    }

    // Optional. Any additional parameters needed for FEDERATED.
    google.protobuf.Struct additional_params = 2
        [(google.api.field_behavior) = OPTIONAL];
  }

  // The configuration for realtime sync to store additional params for
  // realtime sync.
  message RealtimeSyncConfig {
    // Streaming error details.
    message StreamingError {
      // Broad types of streaming errors.
      enum StreamingErrorReason {
        // Streaming error reason unspecified.
        STREAMING_ERROR_REASON_UNSPECIFIED = 0;

        // Some error occurred while setting up resources for realtime sync.
        STREAMING_SETUP_ERROR = 1;

        // Some error was encountered while running realtime sync for the
        // connector.
        STREAMING_SYNC_ERROR = 2;

        // Ingress endpoint is required when setting up realtime sync in private
        // connectivity.
        INGRESS_ENDPOINT_REQUIRED = 3;
      }

      // Optional. Streaming error.
      StreamingErrorReason streaming_error_reason = 1
          [(google.api.field_behavior) = OPTIONAL];

      // Optional. Error details.
      google.rpc.Status error = 2 [(google.api.field_behavior) = OPTIONAL];
    }

    // Optional. Webhook url for the connector to specify additional params for
    // realtime sync.
    string webhook_uri = 1 [(google.api.field_behavior) = OPTIONAL];

    // Optional. The ID of the Secret Manager secret used for webhook secret.
    string realtime_sync_secret = 2 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Streaming error details.
    StreamingError streaming_error = 3 [(google.api.field_behavior) = OPTIONAL];
  }

  // User-facing metadata for the connector, shown on the connector detail
  // page (title, description, short_description, author, note).
  message ConnectorMetadata {
    // Optional. Display title of the connector.
    string title = 1 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Human-readable description of the connector, shown on the
    // connector detail page. One connector has a single description.
    string description = 2 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Short, subtitle-length description of the connector (e.g. shown
    // beneath the connector name in list and detail views).
    string short_description = 3 [(google.api.field_behavior) = OPTIONAL];

    // Optional. The party that authored the connector, e.g. "Google" or a
    // third-party provider name. Lets end users see who authored a connector.
    string author = 4 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Free-form, multi-line note about the connector's capabilities
    // or a custom note that can be set for the connector.
    string note = 6 [(google.api.field_behavior) = OPTIONAL];
  }

  // The state of connector.
  enum State {
    // Default value.
    STATE_UNSPECIFIED = 0;

    // The connector is being set up.
    CREATING = 1;

    // The connector is successfully set up and awaiting next sync run.
    ACTIVE = 2;

    // The connector is in error. The error details can be found in
    // [DataConnector.errors][google.cloud.discoveryengine.v1.DataConnector.errors].
    // If the error is unfixable, the
    // [DataConnector][google.cloud.discoveryengine.v1.DataConnector] can be
    // deleted by
    // [CollectionService.DeleteCollection][google.cloud.discoveryengine.v1.CollectionService.DeleteCollection]
    // API.
    FAILED = 3;

    // The connector is actively syncing records from the data source.
    RUNNING = 4;

    // The connector has completed a sync run, but encountered non-fatal errors.
    WARNING = 5;

    // Connector initialization failed. Potential causes include runtime errors
    // or issues in the asynchronous pipeline, preventing the request from
    // reaching downstream services (except for some connector types).
    INITIALIZATION_FAILED = 6;

    // Connector is in the process of an update.
    UPDATING = 7;
  }

  // Defines the data synchronization mode supported by the data connector.
  enum SyncMode {
    // The connector will sync data periodically based on the refresh_interval.
    // Use it with auto_run_disabled to pause the periodic sync, or indicate a
    // one-time sync.
    PERIODIC = 0;

    // The data will be synced in real time.
    STREAMING = 1;

    // Connector that doesn't ingest data will have this value
    UNSPECIFIED = 2;
  }

  // The modes enabled for this connector. INGESTION, ACTIONS, FEDERATED, OR EUA
  enum ConnectorMode {
    // Connector mode unspecified.
    CONNECTOR_MODE_UNSPECIFIED = 0;

    // Connector utilized for data ingestion.
    DATA_INGESTION = 1;

    // Connector utilized for actions.
    ACTIONS = 2;

    // Connector utilized for federated search.
    FEDERATED = 3;

    // Connector utilized for End User Authentication.
    EUA = 4;

    // Hybrid connector utilized for federated search and End User
    // Authentication.
    FEDERATED_AND_EUA = 5;
  }

  // User actions that must be completed before the connector can
  // start syncing data.
  enum BlockingReason {
    // Default value.
    BLOCKING_REASON_UNSPECIFIED = 0;

    // Connector requires customer to allowlist static IPs.
    ALLOWLIST_STATIC_IP = 1;

    // Connector requires customer to allowlist our project in their service
    // attachment.
    ALLOWLIST_IN_SERVICE_ATTACHMENT = 2;

    // Connector requires customer to allowlist service account in their
    // project.
    ALLOWLIST_SERVICE_ACCOUNT = 3;
  }

  // Params needed to access the source in the format of (Key, Value) pairs.
  // String values with the format
  // `projects/*/[locations/*/]secrets/*/versions/*` will be read from Secret
  // Manager.
  //
  // Required parameters for all data sources:
  //
  // * Key: `instance_uri`
  // * Value: type STRING. The uri to access the data source.
  //
  // Required parameters for sources that support OAUTH, i.e. `salesforce`:
  //
  // * Key: `client_id`
  // * Value: type STRING. The client ID for the third party service provider to
  //   identify your application.
  // * Key: `client_secret`
  // * Value:type STRING. The client secret generated by the third party
  // authorization server.
  // * Key: `access_token`
  // * Value: type STRING. OAuth token for UCS to access to the protected
  //   resource.
  // * Key: `refresh_token`
  // * Value: type STRING. OAuth refresh token for UCS to obtain a new access
  //   token without user interaction.
  //
  // Required parameters for sources that support basic API token auth, i.e.
  // `jira`, `confluence`:
  //
  // * Key: `user_account`
  // * Value: type STRING. The username or email with the source.
  // * Key: `api_token`
  // * Value: type STRING. The API token generated for the source account, that
  //   is used for authenticating anywhere where you would have used a password.
  //
  // Example:
  //
  // ```json
  // {
  //   "instance_uri": "https://xxx.atlassian.net",
  //   "user_account": "xxxx.xxx@xxx.com",
  //   "api_token": "test-token"
  // }
  // ```
  // Optional parameter to specify the authorization type to use for multiple
  // authorization types support:
  //
  // * Key: `auth_type`
  // * Value: type STRING. The authorization type for the data source.
  //   Supported values: `BASIC_AUTH`, `OAUTH`, `OAUTH_ACCESS_TOKEN`,
  //   `OAUTH_TWO_LEGGED`, `OAUTH_JWT_BEARER`, `OAUTH_PASSWORD_GRANT`, `JWT`,
  //   `API_TOKEN`, `FEDERATED_CREDENTIAL`, `NO_AUTH`.
  oneof data_connector_params {
    // Required data connector parameters in structured json format.
    google.protobuf.Struct params = 4;

    // Required data connector parameters in json string format.
    string json_params = 43;
  }

  // Identifier. The full resource name of the Data Connector.
  // Format:
  // `projects/*/locations/*/collections/*/dataConnector`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. State of the connector.
  State state = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The identifier for the data source.
  // For the full, up-to-date list of supported connectors and their values,
  // see
  // [Connect a third-party data
  // source](https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-third-party-data-source#sources-by-launch-stage).
  string data_source = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. Specifies keys to be removed from the 'params' field.
  // This is only active when 'params' is included in the 'update_mask'
  // in an UpdateDataConnectorRequest.
  // Deletion takes precedence if a key is both in 'remove_param_keys'
  // and present in the 'params' field of the request.
  repeated string remove_param_keys = 38
      [(google.api.field_behavior) = OPTIONAL];

  // Required. The refresh interval for data sync. If duration is set to 0, the
  // data will be synced in real time. The streaming feature is not supported
  // yet. The minimum is 30 minutes and maximum is 7 days. When the refresh
  // interval is set to the same value as the incremental refresh interval,
  // incremental sync will be disabled.
  google.protobuf.Duration refresh_interval = 5
      [(google.api.field_behavior) = REQUIRED];

  // Defines the scheduled time for the next data synchronization. This field
  // requires hour , minute, and time_zone from the
  // [IANA Time Zone Database](https://www.iana.org/time-zones). This is
  // utilized when the data connector has a refresh interval greater than 1 day.
  // When the hours or minutes are not specified, we will assume a sync time of
  // 0:00. The user must provide a time zone to avoid ambiguity.
  google.type.DateTime next_sync_time = 22;

  // List of entities from the connected data source to ingest.
  repeated SourceEntity entities = 6;

  // Output only. Timestamp the
  // [DataConnector][google.cloud.discoveryengine.v1.DataConnector] was created
  // at.
  google.protobuf.Timestamp create_time = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The most recent timestamp when this
  // [DataConnector][google.cloud.discoveryengine.v1.DataConnector] was paused,
  // affecting all functionalities such as data synchronization.
  // Pausing a connector has the following effects:
  //
  //   - All functionalities, including data synchronization, are halted.
  //   - Any ongoing data synchronization job will be canceled.
  //   - No future data synchronization runs will be scheduled nor can be
  //   triggered.
  google.protobuf.Timestamp latest_pause_time = 18
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. For periodic connectors only, the last time a data sync was
  // completed.
  google.protobuf.Timestamp last_sync_time = 19
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp the
  // [DataConnector][google.cloud.discoveryengine.v1.DataConnector] was last
  // updated.
  google.protobuf.Timestamp update_time = 20
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The errors from initialization or from the latest connector
  // run.
  repeated google.rpc.Status errors = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // The data synchronization mode supported by the data connector.
  SyncMode sync_mode = 9;

  // Input only. The KMS key to be used to protect the DataStores managed by
  // this connector.
  //
  // Must be set for requests that need to comply with CMEK Org Policy
  // protections.
  //
  // If this field is set and processed successfully, the DataStores created by
  // this connector will be protected by the KMS key.
  string kms_key_name = 32 [(google.api.field_behavior) = INPUT_ONLY];

  // Optional. Any target destinations used to connect to third-party services.
  repeated DestinationConfig destination_configs = 12
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. State of the action connector. This reflects whether the
  // action connector is initializing, active or has encountered errors.
  State action_state = 37 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Action configurations to make the connector support actions.
  ActionConfig action_config = 13 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Any params and credentials used specifically for EUA connectors.
  EndUserConfig end_user_config = 30 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Any params and credentials used specifically for hybrid
  // connectors supporting FEDERATED mode. This field should only be set if the
  // connector is a hybrid connector and we want to enable FEDERATED mode.
  FederatedConfig federated_config = 41
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The modes enabled for this connector. Default state is
  // CONNECTOR_MODE_UNSPECIFIED.
  repeated ConnectorMode connector_modes = 31
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether customer has enabled static IP addresses for this
  // connector.
  bool static_ip_enabled = 15 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The static IP addresses used by this connector.
  repeated string static_ip_addresses = 14
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The static IP addresses used by this connector for OAuth APIs
  // (e.g. end user authentication). These are surfaced separately from
  // `static_ip_addresses` so that customers can apply granular firewall
  // settings for OAuth endpoints. Only populated for connectors that have
  // static IP enabled and are used for actions and/or federated search.
  repeated string oauth_static_ip_addresses = 50
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. User actions that must be completed before the connector can
  // start syncing data.
  repeated BlockingReason blocking_reasons = 16
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // The configuration for the identity data synchronization runs. This contains
  // the refresh interval to sync the Access Control List information
  // for the documents ingested by this connector.
  IdentityScheduleConfig identity_schedule_config = 23;

  // Output only. The tenant project ID associated with private connectivity
  // connectors. This project must be allowlisted by in order for the connector
  // to function.
  string private_connectivity_project_id = 17
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The configuration for establishing a BAP connection.
  BAPConfig bap_config = 24 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The type of connector. Each source can only map to one type.
  //  For example, salesforce, confluence and jira have THIRD_PARTY connector
  //  type. It is not mutable once set by system.
  ConnectorType connector_type = 25 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. real-time sync state
  State realtime_state = 26 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The connector level alert config.
  repeated AlertPolicyConfig alert_policy_configs = 28
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The configuration for realtime sync.
  RealtimeSyncConfig realtime_sync_config = 29
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether the connector will be created with an ACL config.
  // Currently this field only affects Cloud Storage and BigQuery connectors.
  bool acl_enabled = 33 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether the END USER AUTHENTICATION connector is created in SaaS.
  bool create_eua_saas = 34 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Indicates whether the connector is disabled for auto run. It can
  // be used to pause periodical and real time sync. Update: with the
  // introduction of incremental_sync_disabled, auto_run_disabled is used to
  // pause/disable only full syncs
  bool auto_run_disabled = 10 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Indicates whether incremental syncs are paused for this
  // connector. This is independent of auto_run_disabled. Applicable to only 3P
  // connectors. When the refresh interval is set to the same value as the
  // incremental refresh interval, incremental sync will be disabled, i.e. set
  // to true.
  bool incremental_sync_disabled = 35 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The refresh interval specifically for incremental data syncs. If
  // unset, incremental syncs will use the default from env, set to 3hrs. The
  // minimum is 30 minutes and maximum is 7 days. Applicable to only 3P
  // connectors. When the refresh interval is
  // set to the same value as the incremental refresh interval, incremental
  // sync will be disabled.
  google.protobuf.Duration incremental_refresh_interval = 36
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. If the connector is a hybrid connector, determines whether
  // ingestion is enabled and appropriate resources are provisioned during
  // connector creation. If the connector is not a hybrid connector, this field
  // is ignored.
  bool hybrid_ingestion_disabled = 40 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Specifies the data protection policy for the connector.
  DataProtectionPolicy data_protection_policy = 44
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The list of FQDNs of the data connector can egress to. This
  // includes both FQDN derived from the customer provided instance URL and
  // default per connector type FQDNs.
  repeated string egress_fqdns = 45 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether the connector is created with VPC-SC enabled.
  bool vpcsc_enabled = 46 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The dynamic tools fetched for this connector.
  repeated DynamicTool dynamic_tools = 47
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The configuration for establishing a CLI connection.
  CliConfig cli_config = 48 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If set, this value instead of `data_source` is used to fetch the
  // corresponding connector source.
  string connector_source_id = 49 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Immutable. User-facing, version-independent label for this
  // connector. May be shared by multiple connectors under the same
  // (project, location, collection, data_source); tag-based lookup returns
  // the one with the greatest create_time.
  //
  // Optional at Create time. If the caller omits `tag`, the server
  // auto-derives one from the collection_id (falling back to data_source,
  // else a time-based `t-<micros>` sentinel). The auto-derived tag is
  // subject to the same immutability guarantee as a caller-supplied one,
  // so callers who care about the exact tag value should provide it
  // explicitly rather than relying on the server default.
  //
  // Agent Designer resolves connectors via (data_source, tag) when set,
  // falling back to the legacy resource-name lookup when unset, so
  // connectors created before the tag-write launch continue to work
  // without a backfill.
  string tag = 51 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Optional. User-facing metadata for the connector. Populated from the
  // connector's generated metadata / registry `ConnectorSource`.
  ConnectorMetadata metadata = 52 [(google.api.field_behavior) = OPTIONAL];
}

// Defines target endpoints used to connect to third-party sources.
message DestinationConfig {
  // Defines a target endpoint
  message Destination {
    // The endpoint destination.
    oneof destination {
      // Publicly routable host.
      string host = 1;
    }

    // Optional. Target port number accepted by the destination.
    int32 port = 2 [(google.api.field_behavior) = OPTIONAL];
  }

  // Additional parameters for this destination config.
  oneof destination_config_params {
    // Optional. Additional parameters for this destination config in structured
    // json format.
    google.protobuf.Struct params = 3 [(google.api.field_behavior) = OPTIONAL];

    // Additional parameters for this destination config in json string format.
    string json_params = 4;
  }

  // Optional. Unique destination identifier that is supported by the connector.
  string key = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The destinations for the corresponding key.
  repeated Destination destinations = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Informations to support actions on the connector.
message ActionConfig {
  // Stores a list of scopes.
  message ScopeList {
    // Optional. The list of scopes.
    repeated string scopes = 1 [(google.api.field_behavior) = OPTIONAL];
  }

  // Params needed to support actions in the format of (Key, Value) pairs.
  // String values with the format
  // `projects/*/[locations/*/]secrets/*/versions/*` will be read from Secret
  // Manager.
  //
  // Required parameters for sources that support OAUTH, i.e. `gmail`,
  // `google_calendar`, `jira`, `workday`, `salesforce`, `confluence`:
  //
  // * Key: `client_id`
  // * Value: type STRING. The client ID for the service provider to
  //   identify your application.
  // * Key: `client_secret`
  // * Value:type STRING. The client secret generated by the application's
  // authorization server.
  oneof action_config_params {
    // Optional. Action parameters in structured json format.
    google.protobuf.Struct action_params = 2
        [(google.api.field_behavior) = OPTIONAL];

    // Optional. Action parameters in json string format.
    string json_action_params = 6 [(google.api.field_behavior) = OPTIONAL];
  }

  // Output only. The connector contains the necessary parameters and is
  // configured to support actions.
  bool is_action_configured = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The Service Directory resource name
  // (projects/*/locations/*/namespaces/*/services/*)
  // representing a VPC network endpoint used to connect to the data source's
  // `instance_uri`, defined in
  // [DataConnector.params][google.cloud.discoveryengine.v1.DataConnector.params].
  //
  // Required when VPC Service Controls are enabled.
  string service_name = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {
      type: "servicedirectory.googleapis.com/Service"
    }
  ];

  // Optional. Whether to use static secrets for the connector. If true, the
  // secrets provided in the action_params will be ignored.
  bool use_static_secrets = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether to create a BAP connection for the connector.
  bool create_bap_connection = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Mapping from operation name to the list of scopes. Only be
  // populated if there are user specified scopes.
  map<string, ScopeList> user_defined_scopes_mapping = 10
      [(google.api.field_behavior) = OPTIONAL];
}

// The configuration for the identity data synchronization runs.
message IdentityScheduleConfig {
  // Optional. The refresh interval to sync the Access Control List information
  // for the documents ingested by this connector. If not set, the
  // access control list will be refreshed at the default interval of 30
  // minutes. The identity refresh interval can be at least 30 minutes
  // and at most 7 days.
  google.protobuf.Duration refresh_interval = 1
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The UTC time when the next data sync is expected to start for the
  // Data Connector. Customers are only able to specify the hour and minute to
  // schedule the data sync. This is utilized when the data connector has a
  // refresh interval greater than 1 day.
  google.type.DateTime next_sync_time = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// The configuration for the BAP connector.
message BAPConfig {
  // Customer-facing view of the admin-curated toolspec for a BAP
  // connection. Holds the (simplified) per-tool definitions surfaced to
  // and editable by the admin in the Discovery Engine UI.
  //
  // Mirrors the shape of the backend
  // `google.cloud.connectorexecution.v1.ToolspecOverride` message, but
  // is intentionally kept as a separate public type so the Discovery
  // Engine API surface can evolve independently of the fed-API surface
  // (AIP-215). Handlers convert between the two via helpers in
  // //cloud/ml/discoveryengine/external_service/v1main/data_connector_service/lib:bap_custom_tool_util.
  message ToolspecOverride {
    // Required. Tool definitions (one Struct per tool) that the admin has
    // customised on top of the base toolspec returned by the fed API.
    // REQUIRED because it is the only user-editable field in the
    // modify API; the request must carry at least one tool.
    repeated google.protobuf.Struct tools = 1
        [(google.api.field_behavior) = REQUIRED];

    // Required. Base toolspec version against which `tools` were authored. On
    // Update, MUST match the server's current stable toolspec version
    // for the connection; mismatch is rejected with a user-facing error
    // directing the admin to re-download the latest tools first.
    string base_version = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // Use cases supported by this BAP connector.
  enum ConnectorMode {
    // Connector mode unspecified.
    CONNECTOR_MODE_UNSPECIFIED = 0;

    // Connector utilized for data ingestion.
    DATA_INGESTION = 1;

    // Connector utilized for Actions
    ACTIONS = 2;

    // Connector utilized for End User Authentication.
    END_USER_AUTHENTICATION = 3;
  }

  // Required. The supported connector modes for the associated BAP connection.
  repeated ConnectorMode supported_connector_modes = 1
      [(google.api.field_behavior) = REQUIRED];

  // Optional. The actions enabled on the associated BAP connection.
  repeated string enabled_actions = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Custom toolspec overrides for this connection. For Enterprise BAP
  // connectors that support admin-curated tool definitions, this holds the
  // (simplified) per-tool overrides. On Get, populated by the server by
  // merging persisted overrides with live runtime tool definitions and
  // trimming the result for UI consumption. On Update, the supplied value
  // replaces the persisted overrides after server-side validation and
  // merging: the `base_version` field MUST match the server's current base
  // toolspec version (otherwise the request is rejected with a user-facing
  // error directing the admin to re-download the latest tools first).
  ToolspecOverride toolspec_override = 3
      [(google.api.field_behavior) = OPTIONAL];
}

// The configuration for the CLI execution based connectors.
message CliConfig {
  // Optional. The actions enabled on the associated CLI connection.
  repeated string enabled_actions = 1 [(google.api.field_behavior) = OPTIONAL];
}

// The connector level alert config.
message AlertPolicyConfig {
  // The alert enrollment status.
  message AlertEnrollment {
    // The enrollment status enum for the alert.
    enum EnrollStates {
      // Default value. Used for customers who have not responded to the
      // alert policy.
      ENROLL_STATES_UNSPECIFIED = 0;

      // Customer is enrolled in this policy.
      ENROLLED = 1;

      // Customer declined this policy.
      DECLINED = 2;
    }

    // Immutable. The id of an alert.
    string alert_id = 1 [(google.api.field_behavior) = IMMUTABLE];

    // Required. The enrollment status of a customer.
    EnrollStates enroll_state = 5 [(google.api.field_behavior) = REQUIRED];
  }

  // Immutable. The fully qualified resource name of the AlertPolicy.
  string alert_policy_name = 1 [(google.api.field_behavior) = IMMUTABLE];

  // Optional. The enrollment states of each alert.
  repeated AlertEnrollment alert_enrollments = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Tenant information for a connector source. This includes some of the same
// information stored in the Credential message, but is limited to only what is
// needed to provide a list of accessible tenants to the user.
message Tenant {
  // The tenant's instance ID. Examples: Jira
  // ("8594f221-9797-5f78-1fa4-485e198d7cd0"), Slack ("T123456").
  string id = 1;

  // The URI of the tenant, if applicable. For example, the URI of a Jira
  // instance is https://my-jira-instance.atlassian.net, and a Slack tenant does
  // not have a URI.
  string uri = 2;

  // Optional display name for the tenant, e.g. "My Slack Team".
  string display_name = 3;
}

// Configuration for dynamic tools.
message DynamicTool {
  // Required. The name of the tool.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The description of the tool.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether the tool is enabled.
  bool enabled = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The display name of the tool.
  string display_name = 4 [(google.api.field_behavior) = OPTIONAL];
}
