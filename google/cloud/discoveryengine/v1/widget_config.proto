syntax = "proto3";

package google.cloud.discoveryengine.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/discoveryengine/v1/common.proto";
import "google/cloud/discoveryengine/v1/data_connector.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.DiscoveryEngine.V1";
option go_package = "cloud.google.com/go/discoveryengine/apiv1/discoveryenginepb;discoveryenginepb";
option java_multiple_files = true;
option java_outer_classname = "WidgetConfigProto";
option java_package = "com.google.cloud.discoveryengine.v1";
option objc_class_prefix = "DISCOVERYENGINE";
option php_namespace = "Google\\Cloud\\DiscoveryEngine\\V1";
option ruby_package = "Google::Cloud::DiscoveryEngine::V1";

// Selects which "view" of the model selector configuration the backend
// computes for `WidgetConfig.UiSettings.ModelConfigInfo`.
//
// The end-user views (`END_USER_WEB`, `END_USER_MOBILE`) return the
// user-facing model selector for their respective surface; the `ADMIN` view
// returns the set surfaced on the Cloud Console admin "Feature Control" page,
// with `ModelConfigInfo.ResolvedModel.admin_view` populated on each entry.
enum ModelInfoView {
  // Not specified.
  MODEL_INFO_VIEW_UNSPECIFIED = 0;

  // The end-user web model selector view.
  END_USER_WEB = 1;

  // The Cloud Console admin "Feature Control" view that displays model toggles.
  // Returns admin-surfaced models with `ResolvedModel.admin_view` populated.
  ADMIN = 2;

  // The end-user model selector view for the Gemini Enterprise mobile app.
  // Returns only mobile-surfaced models, with the mobile default selected.
  // Set explicitly by the mobile client.
  END_USER_MOBILE = 3;
}

// WidgetConfig captures configs at the Widget level.
message WidgetConfig {
  option (google.api.resource) = {
    type: "discoveryengine.googleapis.com/WidgetConfig"
    pattern: "projects/{project}/locations/{location}/dataStores/{data_store}/widgetConfigs/{widget_config}"
    pattern: "projects/{project}/locations/{location}/collections/{collection}/dataStores/{data_store}/widgetConfigs/{widget_config}"
    pattern: "projects/{project}/locations/{location}/collections/{collection}/engines/{engine}/widgetConfigs/{widget_config}"
  };

  // Facet field that maps to a UI Component.
  message UIComponentField {
    // The visibility of the field on different type of devices.
    enum DeviceVisibility {
      // Default value when not specified. Server returns INVALID_ARGUMENT if
      // used in requests.
      DEVICE_VISIBILITY_UNSPECIFIED = 0;

      // The UI component is visible on Mobile devices.
      MOBILE = 1;

      // The UI component is visible on Browser-based client.
      DESKTOP = 2;
    }

    // Required. Registered field name. The format is `field.abc`.
    string field = 1 [(google.api.field_behavior) = REQUIRED];

    // The field visibility on different types of devices.
    repeated DeviceVisibility device_visibility = 2;

    // The template to customize how the field is displayed. An example value
    // would be a string that looks like: "Price: {value}".
    string display_template = 3;
  }

  // Facet fields that store the mapping of fields to end user widget
  // appearance.
  message FacetField {
    // Required. Registered field name. The format is `field.abc`.
    string field = 1 [(google.api.field_behavior) = REQUIRED];

    // Optional. The field name that end users will see.
    string display_name = 2 [(google.api.field_behavior) = OPTIONAL];
  }

  // UI component configuration for data store.
  message DataStoreUiConfig {
    // The name of the data store. It should be data store resource name
    // Format:
    // `projects/{project}/locations/{location}/collections/{collection_id}/dataStores/{data_store_id}`.
    // For APIs under
    // [WidgetService][google.cloud.discoveryengine.v1.WidgetService], such as
    // [WidgetService.LookupWidgetConfig][google.cloud.discoveryengine.v1.WidgetService.LookupWidgetConfig],
    // the project number and location part is erased in this field.
    string name = 1;

    // Output only. the identifier of the data store, used for widget service.
    // For now it refers to data_store_id, in the future we will migrate the
    // field to encrypted data store name UUID.
    string id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Facet fields that store the mapping of fields to end user widget
    // appearance.
    repeated FacetField facet_field = 3;

    // The key is the UI component. Mock. Currently supported `title`,
    // `thumbnail`, `url`, `custom1`, `custom2`, `custom3`.
    //
    // The value is the name of the field along with its device visibility.
    //
    // The 3 custom fields are optional and can be added or removed. `title`,
    // `thumbnail`, `url` are required UI components that cannot be removed.
    map<string, UIComponentField> fields_ui_components_map = 4;
  }

  // Read-only data store component that contains data stores fields that may be
  // used for filtering, it's the child of `CollectionComponent`.
  message DataStoreComponent {
    // The type of the data store config.
    enum DataStoreConfigType {
      // Default value. This value is unused.
      DATA_STORE_CONFIG_TYPE_UNSPECIFIED = 0;

      // The data store is connected to AlloyDB
      ALLOW_DB_CONFIG = 1;

      // The data store is a connected to a third party data source.
      THIRD_PARTY_OAUTH_CONFIG = 2;

      // The data store is a connected to NotebookLM Enterprise.
      NOTEBOOKLM_CONFIG = 3;
    }

    // The name of the data store. It should be data store resource name
    // Format:
    // `projects/{project}/locations/{location}/collections/{collection_id}/dataStores/{data_store_id}`.
    // For APIs under
    // [WidgetService][google.cloud.discoveryengine.v1.WidgetService], such as
    // [WidgetService.LookupWidgetConfig][google.cloud.discoveryengine.v1.WidgetService.LookupWidgetConfig],
    // the project number and location part is erased in this field.
    string name = 1;

    // Output only. the identifier of the data store, used for widget service.
    // For now it refers to data_store_id, in the future we will migrate the
    // field to encrypted data store name UUID.
    string id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

    // The display name of the data store.
    string display_name = 3;

    // The name of the entity, retrieved from
    // `Collection.data_connector.entities.entityName`.
    string entity_name = 4;

    // Output only. The type of the data store config.
    DataStoreConfigType data_store_config_type = 8
        [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Read-only connector in CollectionComponent auth state.
  message ConnectorAuthState {
    // The authorization state of the data connector.
    enum AuthState {
      // Default value. Also returned for synthetic placeholder
      // `CollectionComponent` entries surfaced by
      // `LookupWidgetConfig` with `view = WITH_AVAILABLE_CONNECTORS` (SaaS /
      // Business only) — those entries represent connectors the caller may
      // attach but has not yet attached.
      AUTH_STATE_UNSPECIFIED = 0;

      // The user has authorized the data connector.
      AUTHORIZED = 1;

      // The user authorization for the data connector has expired.
      EXPIRED = 2;

      // The user can still make search requests but actions need to be enabled.
      ACTIONS_DISABLED = 3;

      // The data connector does not require any authorization. Also used for
      // placeholder entries whose underlying connector does not require user
      // OAuth.
      NO_AUTH = 4;
    }

    // Output only. The authorization state of the data connector.
    AuthState auth_state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The authorization uri for the data connector.
    //
    // For synthetic placeholder `CollectionComponent` entries (returned by
    // `LookupWidgetConfig` with `view = WITH_AVAILABLE_CONNECTORS` on SaaS /
    // Business engines), this field is left empty. The widget should call
    // `WidgetService.WidgetBuildAuthorizationUrl` on the user's "Connect"
    // click to obtain a freshly-built authorization URL.
    string authorization_uri = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The authorization state update timestamp.
    google.protobuf.Timestamp update_time = 4
        [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Describes the batch authorization status for a batch_authorization_group.
  message BatchAuthStatus {
    // Output only. It is the batch authorization group placeholder full
    // resource name. This is not a real data connector resource. E.g.
    // projects/{project}/locations/{location}/collections/oauth_placeholder_google_workspace/dataStores/dataConnector.
    string placeholder = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The batch authorization group the placeholder belongs to.
    string batch_authorization_group = 2
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The current authorization state for this connector.
    ConnectorAuthState connector_auth_state = 3
        [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Read-only collection component that contains data store collections fields
  // that may be used for filtering.
  //
  // For SaaS / Business engines, when `LookupWidgetConfig` is called with
  // `view = WITH_AVAILABLE_CONNECTORS`, instances of this message are also
  // used to represent synthetic placeholder entries for connectors the caller
  // may attach but has not yet attached. Placeholder entries have
  // `connector_auth_state.auth_state == AUTH_STATE_UNSPECIFIED` (or
  // `NO_AUTH`), an empty `connector_auth_state.authorization_uri` (the
  // widget calls `WidgetBuildAuthorizationUrl` on the user's "Connect"
  // click), and synthetic placeholder values in `name` / `id` (see field
  // comments). Fields that only make sense for materialized connectors
  // (`data_store_components`, `tenant`, `action_connector`) are left unset
  // for placeholder entries.
  message CollectionComponent {
    // The name of the collection. It should be collection resource name.
    // Format:
    // `projects/{project}/locations/{location}/collections/{collection_id}`.
    // For APIs under
    // [WidgetService][google.cloud.discoveryengine.v1.WidgetService], such as
    // [WidgetService.LookupWidgetConfig][google.cloud.discoveryengine.v1.WidgetService.LookupWidgetConfig],
    // the project number and location part is erased in this field.
    //
    // For synthetic placeholder entries (see message-level comment) this
    // carries a synthetic placeholder collection id that does not correspond
    // to a real collection. Callers must not attempt to resolve / GET this
    // resource until the user authorizes the connector.
    string name = 1;

    // Output only. the identifier of the collection, used for widget service.
    // For now it refers to collection_id, in the future we will migrate the
    // field to encrypted collection name UUID.
    //
    // For synthetic placeholder entries (see message-level comment) this is a
    // synthetic placeholder id, not a real collection_id.
    string id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

    // The display name of the collection.
    string display_name = 3;

    // For the data store collection, list of the children data stores.
    repeated DataStoreComponent data_store_components = 4;

    // The name of the data source, retrieved from
    // `Collection.data_connector.data_source`.
    string data_source = 5;

    // Output only. The version of the connector definition backing this
    // collection, mirroring `DataConnector.data_source_version`.
    double data_source_version = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The display name of the data source.
    string data_source_display_name = 9
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The end-user-facing display name of the data source, sourced
    // from `ConnectorSource.end_user_display_name`. When unset, clients fall
    // back to `data_source_display_name`.
    string data_source_end_user_display_name = 15
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The icon link of the connector source.
    string connector_icon_link = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The auth uri of the connector source.
    ConnectorAuthState connector_auth_state = 8
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. User-facing connector metadata (`title`, `description`,
    // `short_description`, `author`, `note`), retrieved from the registry
    // `ConnectorSource.metadata` (joined by data source). Shown on the
    // connector detail page.
    DataConnector.ConnectorMetadata metadata = 13
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Whether this is a first-party (Google-owned) connector, as
    // opposed to a third-party connector.
    bool is_first_party = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The version-independent label of the connector backing this
    // collection, mirroring `DataConnector.tag`. Unlike the version-pinned data
    // store id it survives a connector version upgrade, so an upgraded
    // connector keeps the same tag.
    //
    // Not a unique key. As `DataConnector.tag` documents, several connectors
    // may share a tag under the same (project, location, collection,
    // data_source), and tag-based lookup resolves to the one with the greatest
    // create_time. Clients must not treat this as a connector identifier.
    //
    // Empty when the connector was created before the tag-write launch, and
    // for synthetic placeholder entries, which have no underlying
    // `DataConnector`. Populated only when
    // `ConnectorsFeature.enable_connector_tag` is on.
    string tag = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Describes general widget (or web app) UI settings as seen
  // in the cloud console UI configuration page.
  message UiSettings {
    // Describes configuration for generative answer.
    message GenerativeAnswerConfig {
      // Source of image returned in the answer.
      enum ImageSource {
        // Unspecified image source (multimodal feature is disabled by default)
        IMAGE_SOURCE_UNSPECIFIED = 0;

        // Behavior when service determines the pick from all available sources.
        ALL_AVAILABLE_SOURCES = 1;

        // Include image from corpus in the answer.
        CORPUS_IMAGE_ONLY = 2;

        // Triggers figure generation in the answer.
        FIGURE_GENERATION_ONLY = 3;
      }

      // The number of top results to generate the answer from. Up to 10.
      int32 result_count = 3;

      // The model version used to generate the answer.
      string model_version = 4;

      // Text at the beginning of the prompt that instructs the model that
      // generates the answer.
      string model_prompt_preamble = 5;

      // Max rephrase steps.
      // The max number is 5 steps.
      // If not set or set to < 1, it will be set to 1 by default.
      int32 max_rephrase_steps = 6;

      // Language code for Summary. Use language tags defined by
      // [BCP47](https://www.rfc-editor.org/rfc/bcp/bcp47.txt).
      // Note: This is an experimental feature.
      string language_code = 7;

      // Whether generated answer contains suggested related questions.
      bool disable_related_questions = 8;

      // Optional. Specifies whether to filter out queries that are not
      // answer-seeking. The default value is `false`.
      //
      // No answer is returned if the search query is classified as a
      // non-answer seeking query. If this field is set to `true`, we skip
      // generating answers for non-answer seeking queries and return
      // fallback messages instead.
      bool ignore_non_answer_seeking_query = 9
          [(google.api.field_behavior) = OPTIONAL];

      // Optional. Specifies whether to filter out queries that are adversarial.
      bool ignore_adversarial_query = 10
          [(google.api.field_behavior) = OPTIONAL];

      // Optional. Specifies whether to filter out queries that are not relevant
      // to the content.
      bool ignore_low_relevant_content = 11
          [(google.api.field_behavior) = OPTIONAL];

      // Optional. Source of image returned in the answer.
      ImageSource image_source = 12 [(google.api.field_behavior) = OPTIONAL];
    }

    // The resolved, server-side view of model selector configuration for the
    // end-user. The backend computes this per-request by applying, in order:
    // Mendel flag evaluation, regional availability rules based on the
    // engine's location, and admin-panel overrides from `model_configs`.
    //
    // The backend is the single source of truth for this configuration;
    // clients should render `resolved_models` directly in the model selector
    // dropdown, in the order provided, without applying their own filtering,
    // ordering, or localization.
    message ModelConfigInfo {
      // A single model that is resolved to be available to the end-user in the
      // model selector, with all of its localized display metadata.
      message ResolvedModel {
        // Admin-surface metadata. Populated only when the request originates
        // from the Cloud Console admin "Feature Control" page; left unset for
        // end-user surfaces (Web, Mobile). Lets the admin page render its
        // toggle table directly from the backend instead of a hardcoded
        // client-side registry.
        message AdminView {
          // Output only. Whether the admin can toggle this model's
          // enabled/disabled state via `UiSettings.model_configs`. Derived from
          // `MODEL_TAG_ADMIN_OVERRIDABLE`. When false, the model is "forced"
          // and its state is governed by `enabled_by_default`.
          bool admin_overridable = 1
              [(google.api.field_behavior) = OUTPUT_ONLY];

          // Output only. Whether the model is enabled when the admin has set no
          // explicit override in `UiSettings.model_configs`. Derived from
          // `MODEL_TAG_ENABLED_BY_DEFAULT`.
          bool enabled_by_default = 2
              [(google.api.field_behavior) = OUTPUT_ONLY];

          // Output only. Regions where this model is launched.
          repeated string regions = 3
              [(google.api.field_behavior) = OUTPUT_ONLY];
        }

        // Output only. Unique identifier of the model
        // (e.g. `gemini-2.5-flash`, `gemini-3.1-pro-preview`).
        //
        // This is the same identifier that clients pass back to the assistant
        // service to select this model. Virtual / "pseudo" models (e.g.
        // `gemini-fast`) are also valid values here; they are resolved to the
        // underlying concrete model on the backend.
        string model_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

        // Output only. Localized display name of the model (e.g. `Gemini 3.1
        // Pro`). Localized server-side based on the
        // [LookupWidgetConfigRequest.language_code][google.cloud.discoveryengine.v1.LookupWidgetConfigRequest.language_code]
        // and
        // [LookupWidgetConfigRequest.region_code][google.cloud.discoveryengine.v1.LookupWidgetConfigRequest.region_code]
        // of the request.
        string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

        // Output only. GM3-compatible icon token associated with the model
        // (e.g. `rocket_launch`, `bolt`, `graph_5`).
        string icon = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

        // Output only. Localized description text (e.g. `State-of-the-art
        // reasoning`). Localized using the same locale as `display_name`.
        string description = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

        // Output only. Whether the model is currently in preview. Clients
        // should surface this via a "Preview" badge in the selector UI.
        bool is_preview = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

        // Output only. Short label shown in the compact selector bar chip (e.g.
        // `3.x Flash`) as opposed to the full `display_name` (`Gemini 3.x
        // Flash`). Falls back to `display_name` when the backend registry does
        // not specify a distinct short label.
        string label = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

        // Output only. Admin-surface metadata; populated only for the Console
        // admin Feature Control page (see `AdminView`). Unset for end-user
        // surfaces.
        AdminView admin_view = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

        // Output only. Whether this model should be promoted in the GE chat
        // homepage banner.
        bool promoted = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

        // Output only. Absolute URL of a brand mark to render instead of
        // `icon`, for models whose vendor logo is not a GM3 glyph.
        //
        // `icon` stays populated as the fallback, so a client that does not
        // render images, or that fails to fetch this one, shows the glyph
        // instead of nothing.
        string icon_url = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

        // Output only. Groups models that render together in the selector.
        // Models sharing a value form one group; empty means the model belongs
        // to no group.
        //
        // Compared for equality only -- never parsed, and never shown to a
        // user, so it is not localized.
        string family = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
      }

      // Output only. The list of models that are available to the end-user in
      // the model selector, in the order in which they should be displayed.
      repeated ResolvedModel resolved_models = 1
          [(google.api.field_behavior) = OUTPUT_ONLY];

      // Output only. The `model_id` of the model that should be selected by
      // default in the model selector when the end-user has not made an
      // explicit choice. The value is always one of the `model_id`s present in
      // `resolved_models`.
      string default_model_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

      // Output only. The `model_id` a client must send when the end-user picks
      // the "Auto" entry (the empty `model_id`).
      //
      // Populated only for surfaces known to have no true "Auto" mode, where
      // leaving the model unset would fall back to a platform default rather
      // than a backend-chosen model. Empty on every other surface, where
      // "Auto" is resolved server-side, and when none of the surface's ranked
      // models is available. When set, it is always one of the non-empty
      // `model_id`s present in `resolved_models`.
      string auto_model_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
    }

    // SearchAddonSpec is used to disable add-ons for search. By default, if
    // this field is not specified, add-ons are enabled wherever applicable.
    message SearchAddonSpec {
      // Optional. If true, semantic add-on is disabled. Semantic add-on
      // includes embeddings and jetstream.
      bool semantic_add_on_disabled = 1
          [(google.api.field_behavior) = OPTIONAL];

      // Optional. If true, disables event re-ranking and personalization to
      // optimize KPIs & personalize results.
      bool kpi_personalization_add_on_disabled = 2
          [(google.api.field_behavior) = OPTIONAL];

      // Optional. If true, generative answer add-on is disabled. Generative
      // answer add-on includes natural language to filters and simple answers.
      bool generative_answer_add_on_disabled = 3
          [(google.api.field_behavior) = OPTIONAL];
    }

    // Describes interaction type.
    enum InteractionType {
      // Not specified. Defaults to SEARCH_ONLY.
      INTERACTION_TYPE_UNSPECIFIED = 0;

      // Search without a generative answer.
      SEARCH_ONLY = 1;

      // Search with the generative answer.
      SEARCH_WITH_ANSWER = 2;

      // Search with the generative answer that supports follow up questions.
      // Also known as multi-turn search.
      SEARCH_WITH_FOLLOW_UPS = 3;
    }

    // The state of the feature for the engine.
    enum FeatureState {
      // The feature state is unspecified.
      FEATURE_STATE_UNSPECIFIED = 0;

      // The feature is turned on to be accessible.
      FEATURE_STATE_ON = 1;

      // The feature is turned off to be inaccessible.
      FEATURE_STATE_OFF = 2;
    }

    // The state of the model for the engine.
    enum ModelState {
      // The model state is unspecified.
      MODEL_STATE_UNSPECIFIED = 0;

      // The model is enabled by admin.
      MODEL_ENABLED = 1;

      // The model is disabled by admin.
      MODEL_DISABLED = 2;
    }

    // Describes widget (or web app) interaction type
    InteractionType interaction_type = 1;

    // Describes generative answer configuration.
    GenerativeAnswerConfig generative_answer_config = 2;

    // Controls whether result extract is display and how (snippet or
    // extractive answer). Default to no result if unspecified.
    ResultDisplayType result_description_type = 3;

    // Whether or not to enable autocomplete.
    bool enable_autocomplete = 4;

    // Whether to enable safe search.
    bool enable_safe_search = 5;

    // Turn on or off collecting the search result quality feedback from end
    // users.
    bool enable_quality_feedback = 6;

    // Whether to enable search-as-you-type behavior for the search widget.
    bool enable_search_as_you_type = 7;

    // The default ordering for search results if specified.
    //
    // Used to set SearchRequest#order_by on applicable requests.
    // https://cloud.google.com/generative-ai-app-builder/docs/reference/rest/v1alpha/projects.locations.dataStores.servingConfigs/search#request-body
    string default_search_request_order_by = 8;

    // Per data store configuration.
    repeated DataStoreUiConfig data_store_ui_configs = 9;

    // If set to true, the widget will not collect user events.
    bool disable_user_events_collection = 10;

    // If set to true, the widget will enable visual content summary on
    // applicable search requests. Only used by healthcare search.
    bool enable_visual_content_summary = 11;

    // Optional. If set to true, the widget will enable people search.
    bool enable_people_search = 12 [(google.api.field_behavior) = OPTIONAL];

    // Optional. If set to true, the widget will enable the create agent button.
    bool enable_create_agent_button = 13
        [(google.api.field_behavior) = OPTIONAL];

    // Output only. Feature config for the engine to opt in or opt out of
    // features. Supported keys:
    //
    // * `agent-gallery`
    // * `no-code-agent-builder`
    // * `prompt-gallery`
    // * `model-selector`
    // * `notebook-lm`
    // * `people-search`
    // * `people-search-org-chart`
    // * `bi-directional-audio`
    // * `speech-to-text`
    // * `feedback`
    // * `session-sharing`
    // * `personalization-memory`
    // * `personalization-suggested-highlights`
    // * `mobile-app-access`
    // * `disable-agent-sharing`
    // * `disable-image-generation`
    // * `disable-video-generation`
    // * `disable-onedrive-upload`
    // * `disable-talk-to-content`
    // * `disable-google-drive-upload`
    // * `disable-welcome-emails`
    // * `disable-canvas`
    // * `canvas-workspace`
    // * `canvas-app-builder`
    // * `skills`
    // * `skill-sharing`
    // * `skill-sharing-without-admin-approval`
    // * `disable-projects`
    // * `sobi`
    // * `enable-end-user-sharing-with-groups`
    // * `single-agent-orchestration`
    // * `multi-agent-orchestration`
    // * `cross-product-intelligence`
    // * `workflow-agents`
    // * `in-app-notifications`
    // * `code-extraction`
    // * `remote-vm`
    // * `license-tier-badge`
    map<string, FeatureState> features = 30
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Maps a model name to its specific configuration for this
    // engine. This allows admin users to turn on/off individual models. This
    // only stores models whose states are overridden by the admin.
    //
    // When the state is unspecified, or model_configs is empty for this
    // model, the system will decide if this model should be available or not
    // based on the default configuration. For example, a preview model
    // should be disabled by default if the admin has not chosen to enable it.
    map<string, ModelState> model_configs = 45
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Optional. SearchAddonSpec is used to disable add-ons for search.
    // This field is only supported for search requests.
    SearchAddonSpec search_addon_spec = 31
        [(google.api.field_behavior) = OPTIONAL];

    // Output only. Whether the OneDrive file picker is available to end-users.
    // Computed by the backend from admin connector enablement (Business
    // edition) or attached OneDrive connectors (Enterprise edition), combined
    // with the existing `disable-onedrive-upload` admin feature.
    //
    // Declared `optional` so an explicitly-computed `false` is serialized with
    // field presence. A plain proto3 `bool` drops a default `false` on the
    // wire, which prevented clients from distinguishing "picker disabled"
    // (`false`) from "field not populated" (unset).
    optional bool onedrive_picker_enabled = 48
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Whether the Google Drive file picker is available to
    // end-users. Declared `optional` for the same field-presence reason as
    // `onedrive_picker_enabled` above.
    optional bool google_drive_picker_enabled = 49
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The resolved, server-side view of model selector
    // configuration. Holds both the ordered list of models that should appear
    // in the model selector dropdown and the model that should be selected by
    // default.
    //
    // Clients should render this directly without applying their own
    // filtering, ordering, or localization. The legacy `model_configs` map
    // above is retained for backward compatibility with clients that have not
    // yet migrated to consuming this field.
    ModelConfigInfo model_config_info = 50
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Optional. Whether to show the admin-configured display name for data
    // connectors in the widget sources UI (instead of the connector kind).
    // Opt-in; defaults to false.
    bool source_admin_display_name_enabled = 51
        [(google.api.field_behavior) = OPTIONAL];
  }

  // Describes widget access settings.
  message AccessSettings {
    // Whether public unauthenticated access is allowed.
    bool allow_public_access = 1;

    // List of domains that are allowed to integrate the search widget.
    repeated string allowlisted_domains = 2;

    // Whether web app access is enabled.
    bool enable_web_app = 3;

    // Optional. The workforce identity pool provider used to access the widget.
    string workforce_identity_pool_provider = 4
        [(google.api.field_behavior) = OPTIONAL];

    // Optional. Language code for user interface. Use language tags defined by
    // [BCP47](https://www.rfc-editor.org/rfc/bcp/bcp47.txt).
    // If unset, the default language code is "en-US".
    string language_code = 5 [(google.api.field_behavior) = OPTIONAL];
  }

  // Options to store an image.
  message Image {
    // Various ways to store an image, i.e., as a URL or base64 encoded string.
    oneof storage_method {
      // Image URL.
      string url = 1;
    }
  }

  // Describes widget UI branding settings.
  message UiBrandingSettings {
    // Logo image.
    Image logo = 1;
  }

  // Describes the homepage setting of the widget. It includes all homepage
  // related settings and configurations, such as shortcuts.
  message HomepageSetting {
    // Describes an entity of shortcut (aka pinned content) on the homepage.
    // The home page will render these shortcuts in the same order as what the
    // API returns. If a customer wants to reorder or remove a shortcut, the UI
    // should always provide the new full list of shortcuts.
    message Shortcut {
      // Optional. Title of the shortcut.
      string title = 1 [(google.api.field_behavior) = OPTIONAL];

      // Optional. Icon URL of shortcut.
      Image icon = 2 [(google.api.field_behavior) = OPTIONAL];

      // Optional. Destination URL of shortcut.
      string destination_uri = 3 [(google.api.field_behavior) = OPTIONAL];
    }

    // Optional. The shortcuts to display on the homepage.
    repeated Shortcut shortcuts = 1 [(google.api.field_behavior) = OPTIONAL];
  }

  // Describes the assistant settings of the widget.
  message AssistantSettings {
    // The type of web grounding to use.
    enum WebGroundingType {
      // Default, unspecified setting. This is the same as disabled.
      WEB_GROUNDING_TYPE_UNSPECIFIED = 0;

      // Web grounding is disabled.
      WEB_GROUNDING_TYPE_DISABLED = 1;

      // Grounding with Google Search is enabled.
      WEB_GROUNDING_TYPE_GOOGLE_SEARCH = 2;

      // Grounding with Enterprise Web Search is enabled.
      WEB_GROUNDING_TYPE_ENTERPRISE_WEB_SEARCH = 3;
    }

    // Optional. The type of web grounding to use.
    WebGroundingType web_grounding_type = 2
        [(google.api.field_behavior) = OPTIONAL];

    // Output only. This field controls the default web grounding toggle for end
    // users if `web_grounding_type` is set to
    // `WEB_GROUNDING_TYPE_GOOGLE_SEARCH` or
    // `WEB_GROUNDING_TYPE_ENTERPRISE_WEB_SEARCH`.
    // By default, this field is set to false. If `web_grounding_type` is
    // `WEB_GROUNDING_TYPE_GOOGLE_SEARCH` or
    // `WEB_GROUNDING_TYPE_ENTERPRISE_WEB_SEARCH`, end users will have web
    // grounding enabled by default on UI. If true, grounding toggle will be
    // disabled by default on UI. End users can still enable web grounding in
    // the UI if web grounding is enabled.
    bool default_web_grounding_toggle_off = 3
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Optional. Output only. Whether to disable user location context.
    bool disable_location_context = 5 [
      (google.api.field_behavior) = OPTIONAL,
      (google.api.field_behavior) = OUTPUT_ONLY
    ];
  }

  // Customer provided configurations.
  message CustomerProvidedConfig {
    // Customer type.
    enum CustomerType {
      // Default customer type.
      DEFAULT_CUSTOMER = 0;

      // Government customer type. Some features are disabled for government
      // customers due to legal requirements.
      GOVERNMENT_CUSTOMER = 1;
    }

    // Assured Workloads compliance level of the customer's project.
    //
    // Not frozen: further levels may be added as more compliance regimes are
    // supported, so a client must treat an unrecognized value as
    // government-restricted rather than as unrestricted.
    enum ComplianceLevel {
      // The project has no Assured Workloads compliance level, or reports one
      // that this API version does not model.
      COMPLIANCE_LEVEL_UNSPECIFIED = 0;

      // FedRAMP High compliance level.
      COMPLIANCE_LEVEL_FEDRAMP_HIGH = 1;

      // Impact Level 4 (IL4) compliance level.
      COMPLIANCE_LEVEL_IL4 = 2;

      // Impact Level 5 (IL5) compliance level.
      COMPLIANCE_LEVEL_IL5 = 3;
    }

    // Customer type.
    CustomerType customer_type = 1;

    // Output only. The customer's Assured Workloads compliance level.
    //
    // `customer_type` collapses every compliance level into a single
    // `GOVERNMENT_CUSTOMER` value, so a client that gates a feature on one
    // specific level rather than on government status as a whole must read
    // this field instead.
    ComplianceLevel compliance_level = 2
        [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Represents a single reusable computational or logical unit.
  message Node {
    // Identifies the type of the node in the agent flow.
    enum Type {
      // Unspecified type.
      TYPE_UNSPECIFIED = 0;

      // Trigger type.
      TRIGGER = 1;

      // Flow type.
      FLOW = 2;

      // Connector type.
      CONNECTOR = 3;
    }

    // Output only. A human readable name for the node.
    string display_name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. An identifier or URL pointing to an icon representing this
    // node type.
    string icon_url = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. A detailed description of what the node does.
    string description = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The parameter schema of the tool.
    //
    // This schema is expected to conform to the OpenAPI Schema standard (see
    // https://spec.openapis.org/oas/v3.0.3.html and AIP-146). It describes the
    // expected structure of the parameters that this node accepts.
    google.protobuf.Struct parameter_schema = 4
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The output schema of the tool.
    //
    // This schema is expected to conform to the OpenAPI Schema standard (see
    // https://spec.openapis.org/oas/v3.0.3.html/ and AIP-146). It describes the
    // structure of the output produced by this node.
    google.protobuf.Struct output_schema = 5
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The type of the node.
    Type type = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // The type of the widget's parent data store.
  enum DataStoreType {
    // Unspecified data store type.
    DATA_STORE_TYPE_UNSPECIFIED = 0;

    // The parent data store contains a site search engine.
    SITE_SEARCH = 1;

    // The parent data store contains a search engine for structured data.
    STRUCTURED = 2;

    // The parent data store contains a search engine for unstructured data.
    UNSTRUCTURED = 3;

    // The parent data store is served for blended search with multiple data
    // stores.
    BLENDED = 4;
  }

  // The type of result to display in the ucs widget.
  enum ResultDisplayType {
    // Unspecified display type (default to showing snippet).
    RESULT_DISPLAY_TYPE_UNSPECIFIED = 0;

    // Display results from the snippet field.
    SNIPPET = 1;

    // Display results from extractive answers field.
    EXTRACTIVE_ANSWER = 2;
  }

  // Immutable. The full resource name of the widget config.
  // Format:
  // `projects/{project}/locations/{location}/collections/{collection_id}/dataStores/{data_store_id}/widgetConfigs/{widget_config_id}`.
  //
  // This field must be a UTF-8 encoded string with a length limit of 1024
  // characters.
  string name = 1 [(google.api.field_behavior) = IMMUTABLE];

  // Required. The human readable widget config display name. Used in Discovery
  // UI.
  //
  // This field must be a UTF-8 encoded string with a length limit of 128
  // characters. Otherwise, an INVALID_ARGUMENT error is returned.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Output only. Timestamp the
  // [WidgetConfig][google.cloud.discoveryengine.v1.WidgetConfig] was created.
  google.protobuf.Timestamp create_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp the
  // [WidgetConfig][google.cloud.discoveryengine.v1.WidgetConfig] was updated.
  google.protobuf.Timestamp update_time = 15
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The type of the parent data store.
  DataStoreType data_store_type = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Unique obfuscated identifier of a
  // [WidgetConfig][google.cloud.discoveryengine.v1.WidgetConfig].
  string config_id = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Immutable. Specifies the solution type that this WidgetConfig can
  // be used for.
  SolutionType solution_type = 14 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Output only. The industry vertical that the WidgetConfig registers.
  // The WidgetConfig industry vertical is based on the associated
  // [Engine][google.cloud.discoveryengine.v1.Engine].
  IndustryVertical industry_vertical = 26
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether LLM is enabled in the corresponding data store.
  bool llm_enabled = 20 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether to show the result score.
  bool enable_result_score = 21;

  // Output only. Whether the customer accepted data use terms.
  bool minimum_data_term_accepted = 25
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Collection components that lists all collections and child
  // data stores associated with the widget config, those data sources can be
  // used for filtering in widget service APIs, users can return results that
  // from selected data sources.
  //
  // For SaaS / Business engines, when `LookupWidgetConfig` is called with
  // `view = WITH_AVAILABLE_CONNECTORS`, this list is additionally augmented
  // with synthetic placeholder entries for connectors the caller may attach
  // but has not yet attached (see `CollectionComponent` for the placeholder
  // contract). The frontend can therefore render a unified list of
  // already-attached and available-to-attach sources by iterating this single
  // field. For Enterprise engines and for the default `view`, only
  // already-attached connectors are returned (today's behavior).
  repeated CollectionComponent collection_components = 29
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Describes general widget search settings as seen in cloud console
  // widget configuration page. Replaces top deprecated top level properties.
  UiSettings ui_settings = 33;

  // Will be used for all widget access settings seen in cloud console
  // integration page. Replaces top deprecated top level properties.
  AccessSettings access_settings = 34;

  // Describes search widget UI branding settings, such as the widget title,
  // logo, favicons, and colors.
  UiBrandingSettings ui_branding = 35;

  // Optional. Describes the homepage settings of the widget.
  HomepageSetting homepage_setting = 38
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Output only. Describes the assistant settings of the widget.
  AssistantSettings assistant_settings = 39 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Optional. Output only. Describes the customer related configurations,
  // currently only used for government customers. This field cannot be modified
  // after project onboarding.
  CustomerProvidedConfig customer_provided_config = 40 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Optional. Output only. Whether to enable private knowledge graph.
  bool enable_private_knowledge_graph = 42 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Output only. Whether the subscription is gemini bundle or not.
  bool gemini_bundle = 44 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The batch authorization statuses for the widget's connectors.
  repeated BatchAuthStatus batch_auth_statuses = 48
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The nodes associated with the Widget Config.
  repeated Node nodes = 46 [(google.api.field_behavior) = OUTPUT_ONLY];
}
