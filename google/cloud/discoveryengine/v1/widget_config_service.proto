syntax = "proto3";

package google.cloud.discoveryengine.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/discoveryengine/v1/widget_config.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Google.Cloud.DiscoveryEngine.V1";
option go_package = "cloud.google.com/go/discoveryengine/apiv1/discoveryenginepb;discoveryenginepb";
option java_multiple_files = true;
option java_outer_classname = "WidgetConfigServiceProto";
option java_package = "com.google.cloud.discoveryengine.v1";
option objc_class_prefix = "DISCOVERYENGINE";
option php_namespace = "Google\\Cloud\\DiscoveryEngine\\V1";
option ruby_package = "Google::Cloud::DiscoveryEngine::V1";

// Service for managing
// [WidgetConfig][google.cloud.discoveryengine.v1.WidgetConfig] configuration.
service WidgetConfigService {
  option (google.api.default_host) = "discoveryengine.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/cloud-platform,"
      "https://www.googleapis.com/auth/discoveryengine.assist.readwrite,"
      "https://www.googleapis.com/auth/discoveryengine.readwrite,"
      "https://www.googleapis.com/auth/discoveryengine.serving.readwrite";

  // Gets a [WidgetConfig][google.cloud.discoveryengine.v1.WidgetConfig].
  rpc GetWidgetConfig(GetWidgetConfigRequest) returns (WidgetConfig) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/dataStores/*/widgetConfigs/*}"
      additional_bindings {
        get: "/v1/{name=projects/*/locations/*/collections/*/dataStores/*/widgetConfigs/*}"
      }
      additional_bindings {
        get: "/v1/{name=projects/*/locations/*/collections/*/engines/*/widgetConfigs/*}"
      }
    };
    option (google.api.method_signature) = "name";
  }

  // Update a WidgetConfig.
  rpc UpdateWidgetConfig(UpdateWidgetConfigRequest) returns (WidgetConfig) {
    option (google.api.http) = {
      patch: "/v1/{widget_config.name=projects/*/locations/*/dataStores/*/widgetConfigs/*}"
      body: "widget_config"
      additional_bindings {
        patch: "/v1/{widget_config.name=projects/*/locations/*/collections/*/dataStores/*/widgetConfigs/*}"
        body: "widget_config"
      }
      additional_bindings {
        patch: "/v1/{widget_config.name=projects/*/locations/*/collections/*/engines/*/widgetConfigs/*}"
        body: "widget_config"
      }
    };
    option (google.api.method_signature) = "widget_config,update_mask";
  }
}

// Request for
// [WidgetConfigService.GetWidgetConfig][google.cloud.discoveryengine.v1.WidgetConfigService.GetWidgetConfig]
// method.
message GetWidgetConfigRequest {
  // Options for GetWidgetConfigRequest.
  message GetWidgetConfigRequestOption {
    // Optional. Whether to turn off collection_components in WidgetConfig to
    // reduce latency and data transmission.
    bool turn_off_collection_components = 1
        [(google.api.field_behavior) = OPTIONAL];
  }

  // Required. Full WidgetConfig resource name. Format:
  // `projects/{project}/locations/{location}/collections/{collection_id}/dataStores/{data_store_id}/widgetConfigs/{widget_config_id}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "discoveryengine.googleapis.com/WidgetConfig"
    }
  ];

  // Optional. Whether it's acceptable to load the widget config from cache. If
  // set to true, recent changes on widget configs may take a few minutes to
  // reflect on the end user's view. It's recommended to set to true for
  // maturely developed widgets, as it improves widget performance. Set to false
  // to see changes reflected in prod right away, if your widget is under
  // development.
  bool accept_cache = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Options for GetWidgetConfigRequest.
  GetWidgetConfigRequestOption get_widget_config_request_option = 3
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. BCP-47 language tag (e.g. "en", "fr-CA"). Used to localize
  // human-readable strings in the response, such as the model selector
  // `display_name` / `description` on
  // `WidgetConfig.UiSettings.ModelConfigInfo`. Empty / unset falls back to
  // the default language (English).
  string language_code = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Selects which view of `WidgetConfig.UiSettings.ModelConfigInfo`
  // the backend computes. `ADMIN` is set by the Cloud Console admin "Feature
  // Management" page to receive the admin-surfaced
  // model set with `ResolvedModel.admin_view` populated; `END_USER_MOBILE` is
  // set by the Gemini Enterprise mobile app to receive the mobile model set;
  // unset / `END_USER_WEB` returns the end-user web selector.
  ModelInfoView model_info_view = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Request for
// [WidgetConfigService.UpdateWidgetConfig][google.cloud.discoveryengine.v1.WidgetConfigService.UpdateWidgetConfig]
// method.
message UpdateWidgetConfigRequest {
  // Required. The [WidgetConfig][google.cloud.discoveryengine.v1.WidgetConfig]
  // to update.
  //
  // If the caller does not have permission to update the
  // [WidgetConfig][google.cloud.discoveryengine.v1.WidgetConfig], then a
  // PERMISSION_DENIED error is returned.
  //
  // If the [WidgetConfig][google.cloud.discoveryengine.v1.WidgetConfig] to
  // update does not exist, a NOT_FOUND error is returned.
  WidgetConfig widget_config = 1 [(google.api.field_behavior) = REQUIRED];

  // Indicates which fields in the provided
  // [WidgetConfig][google.cloud.discoveryengine.v1.WidgetConfig] to update. The
  // following are the only supported fields:
  //
  // * [WidgetConfig.enable_autocomplete][google.cloud.discoveryengine.v1.WidgetConfig.enable_autocomplete]
  //
  // If not set, all supported fields are updated.
  google.protobuf.FieldMask update_mask = 2;
}
