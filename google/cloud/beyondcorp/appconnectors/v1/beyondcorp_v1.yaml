type: google.api.Service
config_version: 3
name: beyondcorp.googleapis.com
title: BeyondCorp API

apis:
- name: google.cloud.beyondcorp.appconnectors.v1.AppConnectorsService
- name: google.cloud.location.Locations
- name: google.iam.v1.IAMPolicy
- name: google.longrunning.Operations

types:
- name: google.cloud.beyondcorp.appconnectors.v1.AppConnectorOperationMetadata
- name: google.cloud.beyondcorp.appconnectors.v1.ContainerHealthDetails
- name: google.cloud.beyondcorp.appconnectors.v1.RemoteAgentDetails

documentation:
  summary: |-
    Chrome Enterprise Premium is a secure enterprise browsing solution that
    provides secure access to applications and resources, and offers
    integrated threat and data protection. It adds an extra layer of security
    to safeguard your Chrome browser environment, including Data Loss
    Prevention (DLP), real-time URL and file scanning, and Context-Aware
    Access for SaaS and web apps.
  rules:
  - selector: google.cloud.location.Locations.GetLocation
    description: Gets information about a location.

  - selector: google.cloud.location.Locations.ListLocations
    description: |-
      Lists information about the supported locations for this service.

      This method lists locations based on the resource scope provided in
      the [ListLocationsRequest.name][google.cloud.location.ListLocationsRequest.name] field: *
      **Global locations**: If `name` is empty, the method lists the
      public locations available to all projects. * **Project-specific
      locations**: If `name` follows the format
      `projects/{project}`, the method lists locations visible to that
      specific project. This includes public, private, or other
      project-specific locations enabled for the project.

      For gRPC and client library implementations, the resource name is
      passed as the `name` field. For direct service calls, the resource
      name is
      incorporated into the request path based on the specific service
      implementation and version.

  - selector: google.iam.v1.IAMPolicy.GetIamPolicy
    description: |-
      Gets the access control policy for a resource. Returns an empty policy
      if the resource exists and does not have a policy set.

  - selector: google.iam.v1.IAMPolicy.SetIamPolicy
    description: |-
      Sets the access control policy on the specified resource. Replaces
      any existing policy.

      Can return `NOT_FOUND`, `INVALID_ARGUMENT`, and `PERMISSION_DENIED`
      errors.

  - selector: google.iam.v1.IAMPolicy.TestIamPermissions
    description: |-
      Returns permissions that a caller has on the specified resource. If the
      resource does not exist, this will return an empty set of
      permissions, not a `NOT_FOUND` error.

      Note: This operation is designed to be used for building
      permission-aware UIs and command-line tools, not for authorization
      checking. This operation may "fail open" without warning.

http:
  rules:
  - selector: google.cloud.location.Locations.GetLocation
    get: '/v1/{name=projects/*/locations/*}'
  - selector: google.cloud.location.Locations.ListLocations
    get: '/v1/{name=projects/*}/locations'
  - selector: google.iam.v1.IAMPolicy.GetIamPolicy
    get: '/v1/{resource=projects/*/locations/*/appConnections/*}:getIamPolicy'
    additional_bindings:
    - get: '/v1/{resource=projects/*/locations/*/appConnectors/*}:getIamPolicy'
    - get: '/v1/{resource=projects/*/locations/*/appGateways/*}:getIamPolicy'
    - get: '/v1/{resource=projects/*/locations/*/securityGateways/*}:getIamPolicy'
    - get: '/v1/{resource=projects/*/locations/*/securityGateways/*/applications/*}:getIamPolicy'
  - selector: google.iam.v1.IAMPolicy.SetIamPolicy
    post: '/v1/{resource=projects/*/locations/*/appConnections/*}:setIamPolicy'
    body: '*'
    additional_bindings:
    - post: '/v1/{resource=projects/*/locations/*/appConnectors/*}:setIamPolicy'
      body: '*'
    - post: '/v1/{resource=projects/*/locations/*/appGateways/*}:setIamPolicy'
      body: '*'
    - post: '/v1/{resource=projects/*/locations/*/securityGateways/*}:setIamPolicy'
      body: '*'
    - post: '/v1/{resource=projects/*/locations/*/securityGateways/*/applications/*}:setIamPolicy'
      body: '*'
  - selector: google.iam.v1.IAMPolicy.TestIamPermissions
    post: '/v1/{resource=projects/*/locations/*/appConnections/*}:testIamPermissions'
    body: '*'
    additional_bindings:
    - post: '/v1/{resource=projects/*/locations/*/appConnectors/*}:testIamPermissions'
      body: '*'
    - post: '/v1/{resource=projects/*/locations/*/appGateways/*}:testIamPermissions'
      body: '*'
    - post: '/v1/{resource=projects/*/locations/*/securityGateways/*}:testIamPermissions'
      body: '*'
    - post: '/v1/{resource=projects/*/locations/*/securityGateways/*/applications/*}:testIamPermissions'
      body: '*'
  - selector: google.longrunning.Operations.CancelOperation
    post: '/v1/{name=projects/*/locations/*/operations/*}:cancel'
    body: '*'
    additional_bindings:
    - post: '/v1/{name=organizations/*/locations/*/operations/*}:cancel'
      body: '*'
  - selector: google.longrunning.Operations.DeleteOperation
    delete: '/v1/{name=projects/*/locations/*/operations/*}'
    additional_bindings:
    - delete: '/v1/{name=organizations/*/locations/*/operations/*}'
  - selector: google.longrunning.Operations.GetOperation
    get: '/v1/{name=projects/*/locations/*/operations/*}'
    additional_bindings:
    - get: '/v1/{name=organizations/*/locations/*/operations/*}'
  - selector: google.longrunning.Operations.ListOperations
    get: '/v1/{name=projects/*/locations/*}/operations'
    additional_bindings:
    - get: '/v1/{name=organizations/*/locations/*}/operations'

authentication:
  rules:
  - selector: 'google.cloud.beyondcorp.appconnectors.v1.AppConnectorsService.*'
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/cloud-platform
  - selector: google.cloud.location.Locations.GetLocation
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/cloud-platform
  - selector: google.cloud.location.Locations.ListLocations
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/cloud-platform
  - selector: 'google.iam.v1.IAMPolicy.*'
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/cloud-platform
  - selector: 'google.longrunning.Operations.*'
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/cloud-platform
