syntax = "proto3";

package google.cloud.backupdr.v1beta;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";

option csharp_namespace = "Google.Cloud.BackupDR.V1Beta";
option go_package = "cloud.google.com/go/backupdr/apiv1beta/backupdrpb;backupdrpb";
option java_multiple_files = true;
option java_outer_classname = "RestoreTemplateCommonProto";
option java_package = "com.google.cloud.backupdr.v1beta";
option php_namespace = "Google\\Cloud\\BackupDR\\V1beta";
option ruby_package = "Google::Cloud::BackupDR::V1beta";
option (google.api.resource_definition) = {
  type: "run.googleapis.com/Job"
  pattern: "projects/{project}/locations/{location}/jobs/{job}"
};

// Configuration for selecting a backup.
message BackupSelectionConfig {
  // The fully qualified URI of the source.
  oneof source {
    // Required. Immutable. The fully qualified URI of the backupdr data source.
    string data_source = 1 [
      (google.api.field_behavior) = REQUIRED,
      (google.api.field_behavior) = IMMUTABLE,
      (google.api.resource_reference) = {
        type: "backupdr.googleapis.com/DataSource"
      }
    ];
  }
}

// Configuration for Pre-Restore.
message PreRestoreConfig {
  // Required. The action to execute.
  oneof pre_restore_action {
    // Cloud Run job action to execute.
    // Format: `projects/{project}/locations/{location}/jobs/{job}`
    string cloud_run_job = 2
        [(google.api.resource_reference) = { type: "run.googleapis.com/Job" }];
  }

  // Optional. The timeout for this phase.
  // If set, the timeout must be positive and less than or equal to 24 hours
  // (86400s).
  google.protobuf.Duration timeout = 1 [(google.api.field_behavior) = OPTIONAL];
}

// Configuration for Post-Restore.
message PostRestoreConfig {
  // Required. The action to execute.
  oneof post_restore_action {
    // Cloud Run job action to execute.
    // Format: `projects/{project}/locations/{location}/jobs/{job}`
    string cloud_run_job = 2
        [(google.api.resource_reference) = { type: "run.googleapis.com/Job" }];
  }

  // Optional. The timeout for this phase.
  // If set, the timeout must be positive and less than or equal to 24 hours
  // (86400s).
  google.protobuf.Duration timeout = 1 [(google.api.field_behavior) = OPTIONAL];
}

// Configuration for Verification.
message VerificationConfig {
  // Required. The action to execute.
  oneof verification_action {
    // Cloud Run job action to execute.
    // Format: `projects/{project}/locations/{location}/jobs/{job}`
    string cloud_run_job = 2
        [(google.api.resource_reference) = { type: "run.googleapis.com/Job" }];
  }

  // Optional. The timeout for this phase.
  // If set, the timeout must be positive and less than or equal to 24 hours
  // (86400s).
  google.protobuf.Duration timeout = 1 [(google.api.field_behavior) = OPTIONAL];
}
