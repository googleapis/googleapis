syntax = "proto3";

package google.cloud.backupdr.v1;

import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/cloud/backupdr/v1/restore_template_common.proto";
import "google/cloud/backupdr/v1/restore_verification_plan.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

option csharp_namespace = "Google.Cloud.BackupDR.V1";
option go_package = "cloud.google.com/go/backupdr/apiv1/backupdrpb;backupdrpb";
option java_multiple_files = true;
option java_outer_classname = "RestoreTemplateExecutionProto";
option java_package = "com.google.cloud.backupdr.v1";
option php_namespace = "Google\\Cloud\\BackupDR\\V1";
option ruby_package = "Google::Cloud::BackupDR::V1";
option (google.api.resource_definition) = {
  type: "run.googleapis.com/Execution"
  pattern: "projects/{project}/locations/{location}/jobs/{job}/executions/{execution}"
};

// A `RestoreTemplateExecution` represents a single historical or active
// execution run.
message RestoreTemplateExecution {
  option (google.api.resource) = {
    type: "backupdr.googleapis.com/RestoreTemplateExecution"
    pattern: "projects/{project}/locations/{location}/restoreTemplates/{restore_template}/executions/{execution}"
    plural: "restoreTemplateExecutions"
    singular: "restoreTemplateExecution"
  };

  // The type of execution.
  enum ExecutionType {
    // Execution type not specified.
    EXECUTION_TYPE_UNSPECIFIED = 0;

    // Scheduled execution.
    SCHEDULED = 1;

    // On-demand execution.
    ON_DEMAND = 2;
  }

  // The phase of execution.
  enum ExecutionPhase {
    // Execution phase not specified.
    EXECUTION_PHASE_UNSPECIFIED = 0;

    // Preparing for execution.
    PREPARING = 1;

    // Executing pre-restore action.
    EXECUTING_PRE_RESTORE_ACTION = 2;

    // Restoring the resource.
    RESTORING = 3;

    // Executing post-restore action.
    EXECUTING_POST_RESTORE_ACTION = 4;

    // Verifying the restored resource.
    VERIFYING = 5;

    // Cleaning up resources.
    CLEANING_UP = 6;

    // Execution completed.
    COMPLETED = 7;
  }

  // State of the execution.
  enum ExecutionState {
    // State not set.
    EXECUTION_STATE_UNSPECIFIED = 0;

    // Execution is running.
    RUNNING = 1;

    // Execution succeeded.
    SUCCEEDED = 2;

    // Execution failed.
    FAILED = 3;

    // Resources are being deleted (cleanup).
    DELETING = 4;
  }

  // Identifier. Resource name of the execution.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The workload resource type being restored.
  // The format is "{service_name}/{resource_kind}", for example,
  // "compute.googleapis.com/Instance".
  string resource_type = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Create time of the execution.
  google.protobuf.Timestamp create_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Update time of the execution.
  google.protobuf.Timestamp update_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The type of the execution.
  ExecutionType type = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The current active phase.
  ExecutionPhase phase = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. State of the execution.
  ExecutionState state = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Info for the prepare phase.
  PreparePhaseInfo prepare_phase_info = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Info for the pre-restore phase.
  PreRestorePhaseInfo pre_restore_phase_info = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Info for the restore phase.
  RestorePhaseInfo restore_phase_info = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Info for the post-restore phase.
  PostRestorePhaseInfo post_restore_phase_info = 11
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Info for the verification phase.
  VerificationPhaseInfo verification_phase_info = 12
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Info for the cleanup phase.
  CleanupPhaseInfo cleanup_phase_info = 13
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Info for Prepare phase execution.
message PreparePhaseInfo {
  // Output only. The state of this phase.
  PhaseState phase_state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Error details if the phase failed.
  google.rpc.Status error = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Start time of the phase.
  google.protobuf.Timestamp start_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. End time of the phase.
  google.protobuf.Timestamp end_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Snapshot of config used in this execution.
  BackupSelectionConfig backup_selection_config = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The source backup used for the restore.
  // The fully qualified URI of the backupdr backup.
  string backup = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = { type: "backupdr.googleapis.com/Backup" }
  ];

  // Output only. Indicates whether the backup was explicitly passed in the
  // request.
  bool is_backup_explicitly_passed = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The restore verification plan association associated with the
  // execution.
  string restore_verification_plan_association = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
      type: "backupdr.googleapis.com/RestoreVerificationPlanAssociation"
    }
  ];
}

// Info for Pre-Restore phase execution.
message PreRestorePhaseInfo {
  // Output only. The state of this phase.
  PhaseState phase_state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Error details if the phase failed.
  google.rpc.Status error = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Start time of the phase.
  google.protobuf.Timestamp start_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. End time of the phase.
  google.protobuf.Timestamp end_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Snapshot of config that will be executed before restore
  // operation.
  PreRestoreConfig pre_restore_config = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // The result of the pre-restore action.
  oneof result {
    // Output only. The fully qualified URI of the Cloud Run Execution triggered
    // for pre-restore actions.
    string cloud_run_execution = 6 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference) = { type: "run.googleapis.com/Execution" }
    ];
  }
}

// Info for Restore phase execution.
message RestorePhaseInfo {
  // Output only. The state of this phase.
  PhaseState phase_state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Error details if the phase failed.
  google.rpc.Status error = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Start time of the phase.
  google.protobuf.Timestamp start_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. End time of the phase.
  google.protobuf.Timestamp end_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Snapshot of environment config used during restore of this
  // RestoreTemplateExecution.
  google.protobuf.Struct restore_properties = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The resource created or restored by this execution.
  string restore_resource = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Time taken to restore the resource.
  google.protobuf.Duration restore_duration = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Info for Post-Restore phase execution.
message PostRestorePhaseInfo {
  // Output only. The state of this phase.
  PhaseState phase_state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Error details if the phase failed.
  google.rpc.Status error = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Start time of the phase.
  google.protobuf.Timestamp start_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. End time of the phase.
  google.protobuf.Timestamp end_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Snapshot of config that will be executed after successful
  // restore operation.
  PostRestoreConfig post_restore_config = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // The result of the post-restore action.
  oneof result {
    // Output only. The fully qualified URI of the Cloud Run Execution triggered
    // for post-restore actions.
    string cloud_run_execution = 6 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference) = { type: "run.googleapis.com/Execution" }
    ];
  }
}

// Info for Verification phase execution.
message VerificationPhaseInfo {
  // Output only. The state of this phase.
  PhaseState phase_state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Error details if the phase failed.
  google.rpc.Status error = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Start time of the phase.
  google.protobuf.Timestamp start_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. End time of the phase.
  google.protobuf.Timestamp end_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Snapshot of config that will be executed after successful post
  // restore validation.
  VerificationConfig verification_config = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // The result of the verification action.
  oneof result {
    // Output only. The fully qualified URI of the Cloud Run Execution triggered
    // for verification.
    string cloud_run_execution = 6 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference) = { type: "run.googleapis.com/Execution" }
    ];
  }
}

// Info for Cleanup phase execution.
message CleanupPhaseInfo {
  // Output only. The state of this phase.
  PhaseState phase_state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Error details if the phase failed.
  google.rpc.Status error = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Start time of the phase.
  google.protobuf.Timestamp start_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. End time of the phase.
  google.protobuf.Timestamp end_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Time taken to perform the cleanup of restored resource.
  google.protobuf.Duration cleanup_duration = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Snapshot of cleanup rule provided for this execution when
  // execution is successful.
  RestoreVerificationCleanupRule success_cleanup_rule = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Snapshot of cleanup rule provided for this execution when
  // execution is failed.
  RestoreVerificationCleanupRule failure_cleanup_rule = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time when the resources will be cleaned up.
  google.protobuf.Timestamp cleanup_time = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for getting a RestoreTemplateExecution instance.
message GetRestoreTemplateExecutionRequest {
  // Required. The name of the restore template execution to retrieve.
  // Format:
  // 'projects/{project_id}/locations/{location}/restoreTemplates/{restore_template_id}/executions/{execution_id}'
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "backupdr.googleapis.com/RestoreTemplateExecution"
    }
  ];
}

// Request message for triggering a restore cleanup.
message TriggerRestoreCleanupRequest {
  // Required. Name of the restore template execution.
  // Format:
  // 'projects/{project_id}/locations/{location}/restoreTemplates/{restore_template_id}/executions/{execution_id}'
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "backupdr.googleapis.com/RestoreTemplateExecution"
    }
  ];

  // Optional. An optional request ID to identify requests. Specify a unique
  // request ID so that if you must retry your request, the server will know to
  // ignore the request if it has already been completed. The server will
  // guarantee that for at least 60 minutes after the first request.
  //
  // The request ID must be a valid UUID with the exception that zero UUID is
  // not supported (00000000-0000-0000-0000-000000000000).
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Request message for listing RestoreTemplateExecutions.
message ListRestoreTemplateExecutionsRequest {
  // Required. The project, location, and restore template for which to retrieve
  // executions information.
  // Format:
  // `projects/{project}/locations/{location}/restoreTemplates/{restore_template}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "backupdr.googleapis.com/RestoreTemplateExecution"
    }
  ];

  // Optional. Requested page size.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A token identifying a page of results.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filtering results.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Hint for how to order the results.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for listing RestoreTemplateExecutions.
message ListRestoreTemplateExecutionsResponse {
  // The list of RestoreTemplateExecution instances.
  repeated RestoreTemplateExecution restore_template_executions = 1;

  // A token identifying a page of results.
  string next_page_token = 2;

  // Locations that could not be reached.
  repeated string unreachable = 3;
}

// Represents the state of a specific phase (RUNNING, SUCCEEDED, FAILED, etc.).
enum PhaseState {
  // Phase state is not set.
  PHASE_STATE_UNSPECIFIED = 0;

  // This phase is pending execution.
  PENDING = 1;

  // The phase is actively executing.
  RUNNING = 2;

  // The phase completed successfully.
  SUCCEEDED = 3;

  // The phase encountered an error and failed.
  FAILED = 4;

  // The phase timed out.
  TIMED_OUT = 5;

  // The phase was skipped.
  SKIPPED = 6;

  // The phase is waiting to be executed.
  WAITING = 7;
}
