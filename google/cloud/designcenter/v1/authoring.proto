syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/apphub/v1/application.proto";
import "google/cloud/apphub/v1/attributes.proto";
import "google/cloud/designcenter/v1/assessment.proto";
import "google/cloud/designcenter/v1/deployment.proto";
import "google/cloud/designcenter/v1/enums.proto";
import "google/cloud/designcenter/v1/export.proto";
import "google/cloud/designcenter/v1/metadata.proto";
import "google/cloud/designcenter/v1/parameters.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "AuthoringResourcesProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// Application template resource.
message ApplicationTemplate {
  option (google.api.resource) = {
    type: "designcenter.googleapis.com/ApplicationTemplate"
    pattern: "projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}"
    plural: "applicationTemplates"
    singular: "applicationTemplate"
  };

  // The IaC format of the application template.
  enum IACFormat {
    // IaC format is unspecified.
    IAC_FORMAT_UNSPECIFIED = 0;

    // IaC format is Terraform.
    TERRAFORM = 1;

    // IaC format is Helm.
    HELM = 2;
  }

  // Identifier. Application template name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. Application template display name.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Application template description.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Application template creation timestamp.
  google.protobuf.Timestamp create_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Application template update timestamp.
  google.protobuf.Timestamp update_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Parameters to apply to all components in an application. You can
  // specify projectID and region.
  repeated Parameter application_parameters = 6
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The IaC format of the application template.
  IACFormat iac_format = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The serialized application template.
  SerializedApplicationTemplate serialized_application_template = 11
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The latest application template revision.
  string latest_revision = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Details of the location where the IaC for this
  // ApplicationTemplate was last successfully exported.
  ArtifactLocation artifact_location = 14
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Immutable. The composition type of the applicationTemplate:
  // STANDARD OR COMPOSITE. This is a create time only param.
  ApplicationCompositionType composition_type = 15 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Optional. Root level input variables of the application template.
  repeated ComponentVariable root_input_variables = 16
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Root level output variables of the application template.
  repeated ComponentVariable root_output_variables = 17
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. SaaS runtime context for the application template.
  SaaSRuntimeContext saas_runtime_context = 18
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The URI of the most recent System Revision generated for this
  // ApplicationTemplate. This ID corresponds to the `name` field in the
  // ApplicationTemplateSystemRevision resource.
  string latest_system_revision_uri = 19 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/ApplicationTemplateSystemRevision"
    }
  ];

  // Output only. Indicates the IaC source format of this application template.
  IACSource iac_source = 20 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The input output variables parsed from the imported terraform
  // code.
  TFBlueprintMetadata template_metadata = 21
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. If true, exposes all inputs as root module variables.
  // This is only supported for STANDARD composition type templates.
  bool inputs_as_root_module_variables = 22
      [(google.api.field_behavior) = OPTIONAL];
}

// Serialized application template.
message SerializedApplicationTemplate {
  // Optional. The application template URI.
  string uri = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The application template display name.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The application template description.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Parameters to apply to all components in the application
  // template.
  repeated Parameter application_parameters = 4
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The IaC format of the application template.
  ApplicationTemplate.IACFormat iac_format = 7
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The application template components.
  repeated SerializedComponent components = 8
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The App Hub application parameters.
  AppHubApplicationParameters apphub_application_parameters = 10
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. Whether the application template is compatible with regional
  // scope.
  bool has_global_resource = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The composition type of the applicationTemplate: STANDARD OR
  // COMPOSITE.
  ApplicationCompositionType composition_type = 12
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Root level input variables of the application template.
  repeated ComponentVariable root_input_variables = 13
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Root level output variables of the application template.
  repeated ComponentVariable root_output_variables = 14
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. SaaS runtime context for the application template.
  SaaSRuntimeContext saas_runtime_context = 15
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. Policies of the application template.
  repeated SerializedPolicy serialized_policies = 16
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Custom provider configurations imported from IaC.
  repeated SerializedProvider providers = 17
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Custom variables imported from variables.tf.
  repeated TerraformInput custom_variables = 18
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Custom variable values imported from terraform.tfvars.
  repeated Parameter custom_tfvars = 19
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, exposes all inputs as root module variables.
  // This is only supported for STANDARD composition type templates.
  bool inputs_as_root_module_variables = 20
      [(google.api.field_behavior) = OPTIONAL];
}

// App Hub application parameters.
message AppHubApplicationParameters {
  // Optional. The App Hub application ID.
  string application_id = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The App Hub application scope.
  google.cloud.apphub.v1.Scope scope = 2
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The App Hub application attributes.
  google.cloud.apphub.v1.Attributes attributes = 3
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The App Hub application location. Only used for applications with
  // REGIONAL scope.
  string location = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The host project ID where the App Hub application is created.
  string host_project_id = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Input variable alias mapping for a component in a composite application
// template.
message InputVariableAlias {
  // Required. Name of the input variable inside the component's underlying
  // template or module.
  string variable = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Alias for the variable name to be exposed at the root level of
  // the composite template.
  string alias = 2 [(google.api.field_behavior) = REQUIRED];
}

// Serialized component.
message SerializedComponent {
  // Optional. The component URI.
  string uri = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The shared template used to generate the component.
  string shared_template_revision_uri = 2
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The component parameters.
  repeated Parameter parameters = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The component connections.
  repeated SerializedConnection connections = 4
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. IAM roles required by the service account to deploy the
  // component.
  repeated string roles = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. APIs required to be enabled to deploy the component, in the form
  // of "*.googleapis.com".
  repeated string apis = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The component display name.
  string display_name = 7 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The connection parameters of the component.
  repeated ConnectionParameters connections_parameters = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The component parameter schema, which includes possible
  // parameter values.
  repeated ComponentParameterSchema component_parameter_schema = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The application associated with the component.
  ComponentApplicationInfo application_info = 10
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether the component is exported as a separate terraform root
  // module in a composite application template. If this is false, then native
  // components will be exported as a submodule of a separate terraform root
  // module.
  bool use_as_root_module = 11 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Input variable aliases defined for this serialized component.
  repeated InputVariableAlias input_variable_aliases = 12
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The application template revision used to generate the component.
  string application_template_revision_uri = 13
      [(google.api.field_behavior) = OPTIONAL];
}

// Serialized connection.
message SerializedConnection {
  // Optional. The connection URI.
  string uri = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The destination component URI used to generate the connection.
  string destination_component_uri = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The parameters of the connection associated with the source
  // component.
  repeated Parameter source_component_parameters = 4
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The parameters of the connection associated with the destination
  // component.
  repeated Parameter destination_component_parameters = 5
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The type of the connection (data or logical).
  ConnectionDependencyType dependency_type = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Serialized policy.
message SerializedPolicy {
  // The serialized policy type.
  enum PolicyType {
    // Default.
    POLICY_TYPE_UNSPECIFIED = 0;

    // Compliance framework policy.
    COMPLIANCE_FRAMEWORK = 1;
  }

  // Source uri of the policy or the policy revision.
  oneof source_uri {
    // Optional. URI of the policy.
    string policy_uri = 5 [(google.api.field_behavior) = OPTIONAL];

    // Optional. URI of the policy revision.
    string policy_revision_uri = 6 [(google.api.field_behavior) = OPTIONAL];
  }

  // Required. The uri of the policy in application template.
  // Format:
  // `projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/policies/{policy}`
  string uri = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The serialized policy display name.
  // The number of characters should be less than 128 characters.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The serialized policy description.
  // At most 2048 characters.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Required. Policy type will be used to determine the domain of the policy.
  PolicyType policy_type = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. The serialized policy apply conditions.
  repeated ApplyCondition apply_conditions = 7
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Stored parameter values grouped by cloud control.
  repeated CloudControlConfig cloud_control_configs = 8
      [(google.api.field_behavior) = OPTIONAL];
}

// Application template revision resource.
message ApplicationTemplateRevision {
  option (google.api.resource) = {
    type: "designcenter.googleapis.com/ApplicationTemplateRevision"
    pattern: "projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/revisions/{revision}"
    plural: "applicationTemplateRevisions"
    singular: "applicationTemplateRevision"
  };

  // Identifier. The application template revision name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The application template revision creation timestamp.
  google.protobuf.Timestamp create_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The serialized application template.
  SerializedApplicationTemplate snapshot = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Details of the location where the IaC for this
  // ApplicationTemplate Revision was last successfully exported.
  ArtifactLocation artifact_location = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The input output variables parsed from the imported terraform
  // code.
  TFBlueprintMetadata template_metadata = 21
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The values provided for the input variables.
  repeated Parameter application_parameters = 22
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. Indicates the IaC source format of this application template
  // revision.
  IACSource iac_source = 23 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Application template system revision resource.
message ApplicationTemplateSystemRevision {
  option (google.api.resource) = {
    type: "designcenter.googleapis.com/ApplicationTemplateSystemRevision"
    pattern: "projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/systemRevisions/{system_revision}"
    plural: "applicationTemplateSystemRevisions"
    singular: "applicationTemplateSystemRevision"
  };

  // Identifier. The application template system revision name.
  // Format:
  // projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/systemRevisions/{system_revision}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The application template system revision creation timestamp.
  google.protobuf.Timestamp create_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Annotations from agentic workflows or other system processes.
  // For example:
  // {
  //   "designcenter.googleapis.com/agent_id": "gemini-3-flash-v1",
  //   "designcenter.googleapis.com/llm_agent_summary": "Added a Cloud SQL
  //   instance", "designcenter.googleapis.com/external_ref_id":
  //   "trace-uuid-88921-xyz"
  // }
  map<string, string> annotations = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The serialized application template snapshot at this revision.
  SerializedApplicationTemplate snapshot = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Component resource.
message Component {
  option (google.api.resource) = {
    type: "designcenter.googleapis.com/Component"
    pattern: "projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/components/{component}"
    plural: "components"
    singular: "component"
  };

  // Identifier. The component name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. Immutable. The shared template used to generate the component.
  string shared_template_revision_uri = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Optional. The component parameters.
  repeated Parameter parameters = 3 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The component creation timestamp.
  google.protobuf.Timestamp create_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The component update timestamp.
  google.protobuf.Timestamp update_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. IAM roles required by the service account to deploy the
  // component.
  repeated string roles = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. APIs required to be enabled to deploy the component, in the
  // form of "*.googleapis.com".
  repeated string apis = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The component display name.
  string display_name = 8 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The connection parameters of the component.
  repeated ConnectionParameters connections_parameters = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The component parameter schema, which includes possible
  // parameter values. values.
  repeated ComponentParameterSchema component_parameter_schema = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The application associated with the component.
  ComponentApplicationInfo application_info = 11
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether the component is exported as a separate terraform root
  // module in a composite application template. If this is false, then native
  // components will be exported as a submodule of a separate terraform root
  // module.
  bool use_as_root_module = 12 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Input variable aliases defined on this live component.
  repeated InputVariableAlias input_variable_aliases = 13
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The application template revision used to generate the component.
  string application_template_revision_uri = 14
      [(google.api.field_behavior) = OPTIONAL];
}

// Connection resource.
message Connection {
  option (google.api.resource) = {
    type: "designcenter.googleapis.com/Connection"
    pattern: "projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/components/{component}/connections/{connection}"
    plural: "connections"
    singular: "connection"
  };

  // Identifier. The connection name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. The destination component URI used to generate the connection.
  // Format is
  // `projects/$project/locations/$location/spaces/$space/applicationTemplates/$application_template/components/$component`
  string destination_component_uri = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/Component"
    }
  ];

  // Output only. The connection creation timestamp.
  google.protobuf.Timestamp create_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The connection update timestamp.
  google.protobuf.Timestamp update_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The parameters of the connection associated with the source
  // component.
  repeated Parameter source_component_parameters = 6
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The parameters of the connection associated with the destination
  // component.
  repeated Parameter destination_component_parameters = 7
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The type of the connection (data or logical).
  ConnectionDependencyType dependency_type = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents a serialized Terraform provider configuration.
message SerializedProvider {
  // Required. Name of the provider (e.g., `"google"`, `"google-beta"`,
  // `"google-nightly"`).
  string provider = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Optional alias for the provider (supports multi-region setups).
  string provider_alias = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Configuration parameters of the provider. Reuses the standard
  // Parameter message.
  repeated Parameter parameters = 3 [(google.api.field_behavior) = OPTIONAL];
}
