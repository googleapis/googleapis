syntax = "proto3";

package google.cloud.designcenter.v1;

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "EnumsProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// Represents the type of operation to perform on an application.
enum ApplicationOperation {
  // The default value. This value is unused.
  APPLICATION_OPERATION_UNSPECIFIED = 0;

  // Creates a new application.
  APPLICATION_OPERATION_CREATE = 1;

  // Updates an existing application.
  APPLICATION_OPERATION_UPDATE = 2;

  // Previews a deployment of an application.
  APPLICATION_OPERATION_PREVIEW = 3;

  // Deploys an application.
  APPLICATION_OPERATION_DEPLOY = 4;

  // Gets an application.
  APPLICATION_OPERATION_GET = 5;

  // Generates IaC for an application.
  APPLICATION_OPERATION_GENERATE_IAC = 6;
}

// Represents the type of operation to perform on an application template.
enum ApplicationTemplateOperation {
  // The default value. This value is unused.
  APPLICATION_TEMPLATE_OPERATION_UNSPECIFIED = 0;

  // Creates a new application template.
  APPLICATION_TEMPLATE_OPERATION_CREATE = 1;

  // Updates an existing application template.
  APPLICATION_TEMPLATE_OPERATION_UPDATE = 2;

  // Commits an application template to create a new revision.
  APPLICATION_TEMPLATE_OPERATION_COMMIT = 3;

  // Generates IaC for an application template.
  APPLICATION_TEMPLATE_OPERATION_GENERATE_IAC = 4;

  // Gets an application template.
  APPLICATION_TEMPLATE_OPERATION_GET = 5;

  // Imports an application template from IaC.
  APPLICATION_TEMPLATE_OPERATION_IMPORT_IAC = 6;

  // Updates component parameters from IaC.
  APPLICATION_TEMPLATE_OPERATION_UPDATE_COMPONENT_PARAMETERS = 7;
}

// Supported categories in Application Design Center.
enum TemplateCategory {
  // Unspecified category.
  TEMPLATE_CATEGORY_UNSPECIFIED = 0;

  // Component template.
  COMPONENT_TEMPLATE = 1;

  // Application template.
  APPLICATION_TEMPLATE = 2;

  // Imported as a single, complex unit without disassembling into components.
  COMPOSITE_SOLUTION_TEMPLATE = 3 [deprecated = true];

  // Instance template.
  INSTANCE_TEMPLATE = 4;
}

// The composition type of the applicationTemplate or application: STANDARD OR
// COMPOSITE.
enum ApplicationCompositionType {
  // ApplicationCompositionType is UNSPECIFIED.
  APPLICATION_COMPOSITION_TYPE_UNSPECIFIED = 0;

  // ApplicationCompositionType is STANDARD. The applicationTemplate or
  // application is composed of components only of type service/workload/asset
  // and has a single root module in terraform code.
  STANDARD = 1;

  // ApplicationCompositionType is COMPOSITE. The template is composed of
  // STANDARD applicationTemplate(s) and might be having multiple root modules
  // in terraform code.
  COMPOSITE = 2;
}

// Assembly template types.
enum TemplateType {
  // Default.
  TEMPLATE_TYPE_UNSPECIFIED = 0;

  // A service template is an App Hub service.
  SERVICE = 1;

  // A workload template is an App Hub workload.
  WORKLOAD = 2;

  // An asset template can be used to provision resources that are not services
  // or workloads.
  ASSET = 3;

  // An application template is a composition of workload/service/asset
  // templates.
  APPLICATION = 4 [deprecated = true];

  // A Jumpstart Solution template.
  JSS_SOLUTION = 5 [deprecated = true];

  // A service data source template.
  SERVICE_DATA_SOURCE = 6 [deprecated = true];

  // A helm chart based template.
  HELM_APPLICATION = 7 [deprecated = true];

  // A standard application template.
  STANDARD_APPLICATION_TEMPLATE = 8;

  // A composite application template.
  COMPOSITE_APPLICATION_TEMPLATE = 9;

  // A helm chart based template.
  HELM_CHART = 10;
}

// Alternate default value type.
// Allows you to define an alternative value for predefined use cases, such as
// security. If specified, this value can be used instead of the default value
// in BlueprintVariable.
enum DisplayVariableAlternateType {
  // Default
  DISPLAY_VARIABLE_ALTERNATE_TYPE_UNSPECIFIED = 0;

  // A more secure default.
  DISPLAY_VARIABLE_ALTERNATE_TYPE_SECURITY = 1;

  // A default specifically needed for Application Design center.
  DISPLAY_VARIABLE_ALTERNATE_TYPE_DC = 2;
}

// Visibility defines how the output is exposed.
enum DisplayVariableVisibility {
  // Default
  DISPLAY_VARIABLE_VISIBILITY_UNSPECIFIED = 0;

  // Expose output as root module output.
  DISPLAY_VARIABLE_VISIBILITY_ROOT = 1;
}

// The IaC format to generate.
enum IACFormat {
  // IaC format is unspecified.
  IAC_FORMAT_UNSPECIFIED = 0;

  // IaC format is Terraform.
  TERRAFORM = 1;

  // IaC format is HELM.
  HELM = 2;
}

// The type of the application.
enum ApplicationType {
  // Application type is unspecified.
  APPLICATION_TYPE_UNSPECIFIED = 0;

  // Application type is terraform application.
  TERRAFORM_APP = 1;

  // Application type is helm application.
  HELM_APP = 2;
}

// Enum to specify the source format of the IaC.
enum IACSource {
  // The source is not specified.
  IAC_SOURCE_UNSPECIFIED = 0;

  // The IaC source is SAT. This is used to generate equivalent Terraform.
  IAC_SOURCE_SAT = 1;

  // The IaC source is Terraform.
  IAC_SOURCE_TERRAFORM = 2;
}

// Indicates the dependency type of the connection.
enum ConnectionDependencyType {
  // The dependency type is unspecified.
  CONNECTION_DEPENDENCY_TYPE_UNSPECIFIED = 0;

  // Data dependency: output parameter of one module is input to another.
  CONNECTION_DEPENDENCY_TYPE_DATA = 1;

  // Logical dependency: explicitly declared execution order dependency
  // (depends_on).
  CONNECTION_DEPENDENCY_TYPE_LOGICAL = 2;
}
