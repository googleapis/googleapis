syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";
import "google/cloud/designcenter/v1/parameters.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "AssessmentProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// The assessment report for each domain.
message DomainAssessmentReport {
  // Information on how to redirect to domain.
  message DomainRedirectInfo {
    // Required. URL to the domain page.
    string url = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. Text to display in UI on the redirect URL.
    string url_text = 2 [(google.api.field_behavior) = REQUIRED];

    // Optional. Flag to open the URL in new tab. Default: false.
    bool open_in_same_tab = 3 [(google.api.field_behavior) = OPTIONAL];
  }

  // Status of domain assessment report.
  enum Status {
    // No status specified.
    STATUS_UNSPECIFIED = 0;

    // Pending domain assessment.
    PENDING = 1;

    // Complete domain assessment.
    COMPLETED = 2;

    // Failed domain assessment.
    FAILED = 3;
  }

  // Optional. The report name as per Application Design Center.
  string report_name = 1 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The ID of the domain.
  string domain_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time at which the report was created.
  google.protobuf.Timestamp create_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time at which the report was last updated.
  google.protobuf.Timestamp update_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Status of assessment report.
  Status status = 5 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Specific information and metadata.
  AdcMetadata adc_metadata = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. List of frameworks assessed and their findings.
  repeated AssessedFramework assessed_frameworks = 14
      [(google.api.field_behavior) = REQUIRED];

  // Optional. Additional information about the report.
  string additional_info = 11 [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of asset types skipped during assessment.
  repeated string skipped_asset_types = 12
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Information on how to redirect to domain.
  DomainRedirectInfo domain_redirect_info = 13
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. Score card associated with the report.
  ScoreCard report_score = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Score card associated with the report.
message ScoreCard {
  // Required. Calculated score of the report.
  int32 report_score = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Maximum score of the report.
  // For example, for a score of 75/100, report_score is 75 and max_score is
  // 100.
  int32 max_score = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. Minimum score required to pass assessment.
  int32 min_score_required = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Average score for similar reports.
  int32 average_score = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Condition for applying the policy. Accepts the `criticality`
// and `environment` parameters from the application template.
message ApplyCondition {
  // Required. The key of the parameter for the condition.
  string condition_key = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The value of the parameter for the condition.
  string condition_value = 2 [(google.api.field_behavior) = REQUIRED];
}

// Domains skipped during the best practice assessment.
message SkippedDomain {
  // Reason for skipping the domain from assessment.
  enum Reason {
    // No reason specified.
    REASON_UNSPECIFIED = 0;

    // Domain is unavailable.
    UNAVAILABLE = 1;

    // Domain assessment failed.
    FAILURE = 2;

    // Domain assessment timed out.
    TIMEOUT = 3;
  }

  // Output only. Details of the domain skipped.
  Domain domain = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Reason for skipping the domain from assessment.
  Reason skip_reason = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Domain for assessment.
message Domain {
  // Required. The domain name. Uniquely identifies the domain.
  string domain_name = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The domain display name is user friendly name used for UI.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The domain description.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The frameworks that are applicable in this domain.
  repeated Framework frameworks = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether the domain is inactive.
  // Default: false.
  bool inactive = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Framework for assessment.
message Framework {
  // Enum for deployment status of a framework.
  enum DeploymentStatus {
    // Deployment status unspecified.
    DEPLOYMENT_STATUS_UNSPECIFIED = 0;

    // Framework is deployed.
    DEPLOYED = 1;

    // Framework is undeployed.
    UNDEPLOYED = 2;
  }

  // Required. The framework name.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The major revision id of the framework.
  int32 major_revision_id = 11 [(google.api.field_behavior) = OPTIONAL];

  // Required. The domain to which this framework belongs.
  Domain parent_domain = 9 [(google.api.field_behavior) = REQUIRED];

  // Optional. The framework display name.
  string display_name = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The framework description.
  string description = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The URL to a framework.
  string url = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether the framework is active.
  bool active = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The cloud controls that are associated with the framework.
  repeated CloudControl cloud_control_details = 12
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The deployment status of the framework.
  DeploymentStatus deployment_status = 10
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. Indicates if the framework is defined in the managed project.
  // Only managed-project frameworks can be manually attached.
  bool managed_project_applicable = 13
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Cloud control for a framework.
message CloudControl {
  // Enum for enforcement mode of a cloud control.
  enum EnforcementMode {
    // Enforcement type unspecified.
    ENFORCEMENT_MODE_UNSPECIFIED = 0;

    // The cloud control is enforced to prevent non-compliance.
    PREVENTIVE = 1;

    // The cloud control is enforced to detect non-compliance.
    DETECTIVE = 2;

    // The cloud control is enforced to audit for non-compliance.
    AUDIT = 3;
  }

  // Required. The name of the cloud control.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The description of the cloud control.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];

  // Required. The major revision id of the cloud control.
  int32 major_revision_id = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. The enforcement mode of the cloud control.
  EnforcementMode enforcement_mode = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The specifications of the parameters supported by the cloud
  // control.
  repeated ParameterSpec parameter_specs = 5
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The parameter values that are already configured for the cloud
  // control, if any. Used to pre-populate the parameter values presented to the
  // user.
  repeated Parameter parameters = 6 [(google.api.field_behavior) = OPTIONAL];
}

// The specification of a parameter that can be configured on a cloud control
// or a framework.
message ParameterSpec {
  // The type of value that the parameter accepts.
  enum ValueType {
    // Default. This value is unused.
    VALUE_TYPE_UNSPECIFIED = 0;

    // A string value.
    STRING = 3;

    // A boolean value.
    BOOLEAN = 4;

    // A list of string values.
    STRINGLIST = 5;

    // A numeric value.
    NUMBER = 6;

    // Exactly one of the sub-parameters must be provided.
    ONEOF = 7;
  }

  // Required. The key of the parameter, matching
  // [Parameter.key][google.cloud.designcenter.v1.Parameter.key] of the
  // value supplied for it.
  string key = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The parameter display name, which is a user friendly name used
  // for UI.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The parameter description.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether a value must be provided for the parameter.
  bool required = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The type of value that the parameter accepts.
  ValueType value_type = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The default value of the parameter, used when the user does not
  // provide one.
  google.protobuf.Value default_value = 6
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The specifications of the sub-parameters. Only set when
  // `value_type` is `ONEOF`.
  repeated ParameterSpec sub_parameter_specs = 8
      [(google.api.field_behavior) = OPTIONAL];
}

// Application Design Center specific information and metadata.
message AdcMetadata {
  // Application or ApplicationTemplate URI
  oneof app_uri {
    // Output only. Application URI
    string application_uri = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. ApplicationTemplate URI
    string application_template_uri = 2
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Space URI
    string space_uri = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. CatalogTemplateRevision URI
    string catalog_template_revision_uri = 4
        [(google.api.field_behavior) = OUTPUT_ONLY];
  }
}

// Framework assessed and their findings.
message AssessedFramework {
  // Required. The framework that was assessed.
  Framework framework = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. A list of every Finding found during the assessment.
  repeated AssessmentFinding findings = 2
      [(google.api.field_behavior) = REQUIRED];

  // Optional. Score card associated with the report.
  ScoreCard score_card = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether the framework was skipped during assessment.
  bool skipped = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Reason for skipping the framework during assessment.
  string skipped_reason = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Details of an Assessment Finding.
message AssessmentFinding {
  // Metadata related to the Application Design Center with the finding.
  message FindingADCMetadata {
    // Output only. Component the finding belongs to.
    string component_name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // The type of finding.
  enum Type {
    // Default value. This value is unused.
    TYPE_UNSPECIFIED = 0;

    // Warning finding. Deployment will not be blocked.
    WARNING = 1;

    // Error finding. Deployment will be blocked on ERROR.
    ERROR = 2;
  }

  // The severity of a finding.
  enum Severity {
    // Default value. This value is unused.
    SEVERITY_UNSPECIFIED = 0;

    // Critical severity.
    CRITICAL = 1;

    // High severity.
    HIGH = 2;

    // Medium severity.
    MEDIUM = 3;

    // Low severity.
    LOW = 4;
  }

  // Next steps related to the findings.
  oneof next_step {
    // Optional. A description of the steps that users can take to fix the
    // finding.
    RemediationStep remediation_step = 6
        [(google.api.field_behavior) = OPTIONAL];
  }

  // Additional details about the finding.
  oneof additional_details {
    // Optional. A description of the additional details about finding.
    string additional_notes = 10 [(google.api.field_behavior) = OPTIONAL];
  }

  // Output only. The Finding ID.
  string id = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The framework that was assessed.
  string assessed_framework_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Metadata related to the Application Design Center with the
  // finding.
  FindingADCMetadata adc_metadata = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The type of the finding. Findings can be informational,
  // warning, or error.
  Type finding_type = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. The severity of the finding.
  Severity severity = 5 [(google.api.field_behavior) = OPTIONAL];

  // Required. Details of the Cloud Asset Inventory asset that was assessed.
  AssetDetails assessed_asset = 7 [(google.api.field_behavior) = REQUIRED];

  // Optional. Details of the framework that was assessed.
  Framework assessed_framework = 8 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Description of the finding.
  string description = 9 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Link to the findings, if persisted by the domain.
  string findings_uri = 11 [(google.api.field_behavior) = OPTIONAL];

  // Output only. SCC related metadata for the finding.
  SCCMetadata scc_metadata = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// SCC metadata for the assessment finding.
message SCCMetadata {
  // Optional. The SCC finding class. Also known as category.
  string finding_class = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The SCC finding type.
  string finding_type = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Details of a Cloud Asset Inventory asset that caused the finding.
message AssetDetails {
  // Required. Information about the Cloud Asset Inventory asset that the
  // framework is assessed against. The full resource name of the asset in CAIS
  // format.
  //
  // For details about the format of the full resource name for each asset type,
  // see [Resource name
  // format]
  // (https://cloud.google.com/asset-inventory/docs/resource-name-format).
  string asset_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The type of Cloud Asset Inventory asset. For a list of asset
  // types, see [Supported asset
  // types](https://cloud.google.com/asset-inventory/docs/supported-asset-types).
  string asset_type = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Remediation steps that can be taken to rectify the finding.
message RemediationStep {
  // Required. A description of the steps that users can take to remediate the
  // findings.
  repeated string remediation_steps = 1
      [(google.api.field_behavior) = REQUIRED];

  // Optional. Remediation documentation URL.
  string remediation_documentation_url = 2
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Any other note related to the remediation.
  string note = 3 [(google.api.field_behavior) = OPTIONAL];
}
