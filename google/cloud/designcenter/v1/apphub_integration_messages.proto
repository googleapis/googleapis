syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/designcenter/v1/apphub_integration.proto";

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "ApphubIntegrationRpcMessagesProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// Request message for RegisterAppHubApplicationResources method.
message RegisterAppHubApplicationResourcesRequest {
  // The Terraform state (tfstate) source.
  oneof tfstate_source {
    // Optional. The Terraform state (tfstate) content as a raw string.
    // For large state files exceeding 10MB, use the 'tfstate_signed_gcs_uri'
    // field instead.
    string tfstate_content = 2 [(google.api.field_behavior) = OPTIONAL];

    // Optional. A securely signed Cloud Storage URI pointing to the tfstate
    // file. The URI must be signed to grant the service temporary read access
    // to the state file. Application Design Center imposes a limit on the
    // maximum size of the state file accessed via this URI.
    string tfstate_signed_gcs_uri = 3 [(google.api.field_behavior) = OPTIONAL];
  }

  // Required. The parent location.
  // Format: projects/{project}/locations/{location}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "locations.googleapis.com/Location"
    }
  ];

  // Required. The name of the AppHub Application.
  // Format:
  // projects/{project}/locations/{location}/applications/{application}
  string apphub_application = 4 [(google.api.field_behavior) = REQUIRED];
}

// Response message for RegisterAppHubApplicationResources method.
message RegisterAppHubApplicationResourcesResponse {
  // The response for the registration of deployed resources of a given AppHub
  // application.
  DeployedResourceResponse response = 1;
}

// Common response message for the resource registration methods.
message DeployedResourceResponse {
  // The App Hub application name.
  string apphub_application = 1;

  // The list of successfully registered GCP resources.
  repeated string registered_resources = 2;

  // The list of unregistered GCP resources with error details.
  repeated UnregisteredResource unregistered_resources = 3;
}
