syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";
import "google/cloud/designcenter/v1/enums.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "MetadataProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// Terraform input and output metadata.
message TFBlueprintMetadata {
  // Output only. Terraform inputs.
  repeated TerraformInput terraform_input = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Terraform outputs.
  repeated TerraformOutput terraform_output = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. APIs that must be enabled to deploy the template, in the form
  // of "compute.googleapis.com".
  repeated string apis = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. IAM roles required by the service account deploying the
  // template, in the form of "roles/compute.admin".
  repeated string roles = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The time estimate for deploying the blueprint.
  google.protobuf.Duration deployment_duration = 6
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The icon URI for the blueprint.
  string icon_uri = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Union of all the Terraform input connections.
  repeated TerraformInputConnections connections = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. UI metadata for the blueprint.
  TerraformBlueprintUiMetadata ui_metadata = 11
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Provider versions required to deploy the blueprint.
  repeated ProviderVersion provider_versions = 12
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ProviderVersion defines the required version for a provider.
message ProviderVersion {
  // Output only. The provider source in the format:
  // [hostname]/[namespace]/[name]. Hostname is optional, and defaults to the
  // Terraform registry.
  string source = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Version constraint string.
  string version = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Terraform inputs.
message TerraformInput {
  // Output only. Input variable name present in Terraform.
  string terraform_input_variable = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Terraform variable description.
  string description = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The Terraform input data type.
  string type = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The default value of the Terraform input variable.
  google.protobuf.Value default_value = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Terraform input connections.
  repeated TerraformInputConnections connections = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Indicates if input is required.
  bool is_required = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Indicates if the Terraform variable is sensitive.
  bool sensitive = 7 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Optional validation rules defined on the variable.
  repeated TerraformVariableValidation validation_rules = 8
      [(google.api.field_behavior) = OPTIONAL];
}

// Represents a custom validation rule defined on a Terraform input variable.
message TerraformVariableValidation {
  // Optional. The HCL expression for the validation condition (e.g.,
  // "length(var.image_id) > 4").
  string condition = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The error message displayed when the condition is false.
  string error_message = 2 [(google.api.field_behavior) = OPTIONAL];
}

// TerraformInputConnections
message TerraformInputConnections {
  // Output only. List of other templates that can be connected to.
  string cft_template_uri = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Version of the other template that can be connected to.
  string cft_template_version = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Output variable name present in Terraform.
  string output_var = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Input path of the other template that can be connected to.
  string input_path = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Terraform outputs.
message TerraformOutput {
  // Output only. Type of Terraform output.
  google.protobuf.Value type = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Output variable name present in Terraform.
  string terraform_output_variable = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Description of the Terraform varaiable.
  string description = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Terraform blueprint UI metadata.
message TerraformBlueprintUiMetadata {
  // Output only. Terraform UI inputs.
  TerraformUiInput terraform_ui_input = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Terraform UI outputs.
  TerraformUiOutput terraform_ui_output = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Alternate default for a UI input.
message AlternateDefault {
  // Output only. Type of alternate default.
  DisplayVariableAlternateType type = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Value of the alternate default.
  google.protobuf.Value value = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Value label for a UI input.
message ValueLabel {
  // Output only. Value of the enum.
  string value = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Label of the enum.
  string label = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Display variable toggle.
message DisplayVariableToggle {
  // Toogle variable type enum.
  enum ToggleVariableType {
    // Default
    TOGGLE_VARIABLE_TYPE_UNSPECIFIED = 0;

    // Boolean
    TOGGLE_VARIABLE_TYPE_BOOLEAN = 1;

    // String
    TOGGLE_VARIABLE_TYPE_STRING = 2;

    // Integer
    TOGGLE_VARIABLE_TYPE_INTEGER = 3;
  }

  // Output only. The name of the variable used to toggle the display of another
  // variable.
  string variable = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The value of the variable used to toggle the display of
  // another variable.
  repeated string variable_values = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The type of the variable used to toggle the display of another
  // variable.
  ToggleVariableType variable_type = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Terraform blueprint UI input.
message TerraformUiInput {
  // Output only. Terraform UI inputs.
  map<string, TerraformUiInputDisplayVariable> terraform_ui_inputs = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Terraform blueprint UI input display variable.
message TerraformUiInputDisplayVariable {
  // Output only. Display name of the input.
  string display_name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Title of the input.
  string title = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Alternate defaults for the input.
  repeated AlternateDefault alternate_defaults = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Regex based validation rules for the variable.
  string regex_validation = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Minimum value for numeric types.
  float min = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Maximum value for numeric types.
  float max = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Text describing the validation rules for the property.
  // Typically shown after an invalid input. Optional. UTF-8 text. No markup. At
  // most 128 characters.
  string validation = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Labels for enum values.
  // Values must be UTF-8 text with no markup, and at most 64 characters.
  repeated ValueLabel enum_value_labels = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Indicates the "advanced" level of the input property. Level 0
  // (default) will always be shown. Level 1 corresponds to one expansion (user
  // clicks "show advanced options" or "more options"). Higher levels correspond
  // to further expansions, or they may be collapsed to level 1 by the UI
  // implementation.
  // Optional.
  int32 level = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Property subtext, displayed below the title.
  string subtext = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Variables used to toggle the display of another variable.
  repeated DisplayVariableToggle toggle_using_variables = 12
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A map that defines all fields of the input variable.
  map<string, TerraformUiInputDisplayVariable> properties = 13
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Terraform blueprint UI output.
message TerraformUiOutput {
  // Output only. Message to be displayed in the UI.
  string output_message = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Visibility of the output.
  map<string, TerraformUiOutputDisplay> terraform_ui_outputs = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Terraform blueprint UI output display.
message TerraformUiOutputDisplay {
  // Output only. Visibility of the output.
  DisplayVariableVisibility visibility = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Helm Chart metadata.
message HelmChartMetadata {
  // Output only. Helm Chart inputs.
  repeated HelmChartInput helm_input = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Helm Chart outputs.
  repeated HelmChartOutput helm_output = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Helm Chart inputs.
// Documentation: https://helm.sh/docs/
message HelmChartInput {
  // Output only. Input variable name present in Helm Chart values.yaml
  string helm_input_variable = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Input variable description.
  string description = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Input data type.
  string type = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The default value of the input variable.
  google.protobuf.Value default_value = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Indicates if input is required.
  bool is_required = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Contains details of nested inputs.
  map<string, HelmChartInput> nested_inputs = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Helm Chart outputs.
message HelmChartOutput {
  // Output only. Type of output.
  google.protobuf.Value value = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Output variable name present.
  string helm_output_variable = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Description of the variable.
  string description = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Metadata for the input
message MetadataInput {
  // Required. spec containing the metadata
  MetadataInputSpec spec = 1 [(google.api.field_behavior) = REQUIRED];
}

// Specifications for the input
message MetadataInputSpec {
  // Optional. TemplateInfo provides the actuation tool information.
  TemplateInfo info = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. TemplateSchemas provides the input variables lists and connection
  // information.
  TemplateSchema interfaces = 3 [(google.api.field_behavior) = OPTIONAL];

  // Required. TemplateRequirements defines the roles required and the provider
  // versions.
  TemplateRequirements requirements = 4
      [(google.api.field_behavior) = REQUIRED];

  // Optional. TemplateUi defines the UI related information for the Template.
  TemplateUi ui = 5 [(google.api.field_behavior) = OPTIONAL];
}

// TemplateInfo provides the actuation tool information.
message TemplateInfo {
  // Required. IaCFormatInfo defines the actuation tool used to provision the
  // Template.
  IacFormatInfo actuation_tool = 1 [(google.api.field_behavior) = REQUIRED];
}

// IacFormatInfo defines the actuation tool used to provision the
// Template.
message IacFormatInfo {
  // Required. Flavor is the type of the actuation tool.
  string flavor = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Required version for the actuation tool.
  // required_version = ">= 0.13"
  string version = 2 [(google.api.field_behavior) = REQUIRED];
}

// TemplateSchema provides the input variables lists and connection
// information.
message TemplateSchema {
  // Required. All defined variables for the Template
  repeated TemplateVariable variables = 1
      [(google.api.field_behavior) = REQUIRED];
}

// TemplateTerraform inputs.
message TemplateVariable {
  // Required. Input variable name present in Terraform.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Terraform input connections.
  repeated TemplateConnections connections = 2
      [(google.api.field_behavior) = REQUIRED];
}

// TemplateConnections
message TemplateConnections {
  // Required. Source of the connection.
  ConnectionSource source = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Connection specifications.
  ConnectionSpec spec = 2 [(google.api.field_behavior) = REQUIRED];
}

// Defines the source of a connection.
message ConnectionSource {
  // Required. Source of the connection. Defined using the same format as module
  // source of form [hostname]/namespace/name/provider for registry references
  // and unprefixed github.com URLs for github references.
  string source = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Version constraint syntax using the same format as module version
  // constraints.
  string version = 2 [(google.api.field_behavior) = REQUIRED];
}

// Defines the specifications of a connection.
message ConnectionSpec {
  // Required. Output expression identifying output being connected to variable.
  string output_expr = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Optional dot separated attribuite notation to connect to a
  // specific object field of the input variable.
  optional string input_path = 2 [(google.api.field_behavior) = OPTIONAL];
}

// TemplateRequirements defines the roles required and the associated services
// that need to be enabled to provision Template resources.
message TemplateRequirements {
  // Required. All roles required for the component
  repeated TemplateRoles roles = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Required provider versions.
  repeated ProviderVersion provider_versions = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Template Roles provide the level and roles
message TemplateRoles {
  // Required. Level of the role.
  string level = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. List of roles.
  repeated string roles = 2 [(google.api.field_behavior) = REQUIRED];
}

// TemplateUi defines the UI related information for the Template.
message TemplateUi {
  // Required. The top-level input section that defines the list of variables
  // and their sections on the deployment page.
  TemplateUiInput input = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The top-level output section that defines the list of outputs and
  // their visibility on the deployment page.
  TemplateUiOutput runtime = 2 [(google.api.field_behavior) = OPTIONAL];
}

// TemplateUiInput defines the list of variables and their sections on the
// deployment page.
message TemplateUiInput {
  // Required. variables is a map defining all inputs on the UI.
  map<string, DisplayVariable> variables = 1
      [(google.api.field_behavior) = REQUIRED];
}

// TemplateUiOutput defines the list of outputs and their visibility on the
// deployment page.
message TemplateUiOutput {
  // Optional. Message to be displayed in the UI.
  string output_message = 1 [(google.api.field_behavior) = OPTIONAL];

  // Required. outputs is a map defining all outputs on the UI.
  map<string, TemplateUiOutputDisplayVariable> outputs = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Additional display specific Template pertaining to a particular output
// variable.
message TemplateUiOutputDisplayVariable {
  // Required. Visibility of the output.
  DisplayVariableVisibility visibility = 1
      [(google.api.field_behavior) = REQUIRED];
}

// Additional display specific Template pertaining to a particular input
// variable.
message DisplayVariable {
  // Required. The variable name from the corresponding standard Template file.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Visible title for the variable on the UI.
  string title = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. Alternate defaults for the input.
  repeated AlternateDefaultInput alternate_defaults = 3
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Regex based validation rules for the variable.
  string regex_validation = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Minimum value for numeric types.
  optional float min = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Maximum value for numeric types.
  optional float max = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Text describing the validation rules for the property. Typically
  // shown after an invalid input. Optional. UTF-8 text. No markup. At most 128
  // characters.
  string validation = 7 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Labels for enum values.
  // Values must be UTF-8 text with no markup, and at most 64 characters.
  repeated ValueLabelInput enum_value_labels = 8
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Indicates the "advanced" level of the input property. Level 0
  // (default) will always be shown. Level 1 corresponds to one expansion (user
  // clicks "show advanced options" or "more options"). Higher levels correspond
  // to further expansions, or they may be collapsed to level 1 by the UI
  // implementation.
  // Optional.
  int32 level = 9 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Property subtext, displayed below the title.
  string subtext = 10 [(google.api.field_behavior) = OPTIONAL];

  // Optional. properties is a map defining all the fields of the input
  // variable.
  map<string, DisplayVariable> properties = 11
      [(google.api.field_behavior) = OPTIONAL];
}

// Value label input for a UI.
message ValueLabelInput {
  // Optional. Value of the enum.
  string value = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Label of the enum.
  string label = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Alternate default input for a UI.
message AlternateDefaultInput {
  // Optional. Type of alternate default.
  DisplayVariableAlternateType type = 1
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Value of the alternate default.
  google.protobuf.Value value = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Represents a Product Main logical product.
message LogicalProduct {
  // Output only. The resource name of the logical product.
  // Format: logicalProducts/{logical_product}
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The display name of the logical product.
  string title = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A short description of the logical product.
  string short_description = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Inferred metadata.
message InferredMetadata {
  // Output only. Inferred description.
  string description = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Inferred template metadata related to Terraform input and
  // output.
  TFBlueprintMetadata template_metadata = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Inferred metadata creation timestamp.
  google.protobuf.Timestamp create_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Inferred metadata update timestamp.
  google.protobuf.Timestamp update_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents the type of a resource within a component template.
message ResourceType {
  // Output only. The Terraform resource type. For example:
  // "google_compute_instance".
  string tf_resource = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The CAIS resource type.
  string cais_resource = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Top-level message representing a Terraform module and its metadata.
message TerraformModuleMetadata {
  // Optional. The URI of the Terraform module.
  string uri = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Unique identifier for the module version, e.g.,
  // "GoogleCloudPlatform/secret-manager/google/0.9.0"
  string id = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Owner of the module.
  string owner = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Namespace for the module, often the organization.
  string module_namespace = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Name of the module.
  string name = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Semantic version of the module.
  string version = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Primary provider used by the module, e.g., "google".
  string provider = 7 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Description of the module's purpose.
  string description = 9 [(google.api.field_behavior) = OPTIONAL];

  // Optional. URL to the source repository.
  string source = 10 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Git tag or ref for this version.
  string tag = 11 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Details of the root module.
  ModuleDetails root = 15 [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of submodules within this module.
  repeated ModuleDetails submodules = 16
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of examples for this module.
  repeated ModuleDetails examples = 17 [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of provider names used.
  repeated string providers = 18 [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of available versions for this module.
  repeated string versions = 19 [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of available revisions for this module.
  repeated string revisions = 20 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Terraform input connections.
  repeated TerraformInputConnections connections = 21
      [(google.api.field_behavior) = OPTIONAL];
}

// Details about a specific module, submodule, or example.
message ModuleDetails {
  // Optional. Relative path to the module/example.
  string path = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Name of the module/example.
  string name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Content of the README file.
  string readme = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Indicates if the module/example directory is empty of .tf files.
  bool empty = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of input variables.
  repeated ModuleInput inputs = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of outputs.
  repeated ModuleOutput outputs = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of module dependencies.
  repeated ModuleDependency module_dependencies = 7
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of provider dependencies.
  repeated ProviderDependency provider_dependencies = 8
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. List of resources defined.
  repeated ModuleResource resources = 9
      [(google.api.field_behavior) = OPTIONAL];
}

// Represents an input variable for a module.
message ModuleInput {
  // Optional. Name of the input variable.
  string name = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Terraform type of the variable.
  string type = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Description of the variable.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Default value of the variable as a string representation.
  // Using google.protobuf.Value to allow for different types, though a string
  // is common.
  google.protobuf.Value default_value = 4
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether the input variable is required.
  bool required = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Represents an output value from a module.
message ModuleOutput {
  // Optional. Name of the output.
  string name = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Description of the output.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Represents a dependency on another Terraform module.
message ModuleDependency {
  // Optional. Local name of the module instance.
  string name = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Source of the module.
  string source = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Version constraint for the module.
  string version = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Represents a dependency on a Terraform provider.
message ProviderDependency {
  // Optional. Name of the provider.
  string name = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Namespace of the provider (e.g., "hashicorp").
  string provider_namespace = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Source path of the provider.
  string source = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Version constraints for the provider.
  string version = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Represents a resource declared within a module.
message ModuleResource {
  // Optional. Local name of the resource instance.
  string name = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Type of the resource (e.g., "google_secret_manager_secret").
  string type = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListCatalogTemplateRevisionMetadata.
message ListCatalogTemplateRevisionMetadataResponse {
  // List of catalog template revisions.
  repeated CatalogTemplateRevisionMetadata catalog_template_revision_metadata =
      1;

  // If there might be more results than those appearing in this response, then
  // nextPageToken is included. To get the next set of results, call this method
  // again using the value of nextPageToken as pageToken.
  string next_page_token = 2;

  // Locations that could not be reached.
  repeated string unreachable = 3;
}

// Represents metadata of a catalog template revision in the management context.
message CatalogTemplateRevisionMetadata {
  // Output only. The catalog template name in following format:
  // `projects/$project/locations/$location/spaces/$space/catalogs/$catalog/templates/$template`
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The catalog template creation timestamp.
  google.protobuf.Timestamp create_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The catalog template update timestamp.
  google.protobuf.Timestamp update_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The template revisions UUID.
  string uuid = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Latest revision of the template.
  string latest_revision_id = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The display name of the catalog template.
  string display_name = 6 [(google.api.field_behavior) = OPTIONAL];

  // Required. The category of the catalog template.
  TemplateCategory template_category = 7
      [(google.api.field_behavior) = REQUIRED];

  // Optional. The Git source URI where the template repository is hosted.
  string git_source_uri = 8 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The catalog template description.
  string description = 9 [(google.api.field_behavior) = OPTIONAL];
}
