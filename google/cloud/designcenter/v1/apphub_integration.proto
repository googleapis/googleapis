syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "ApphubIntegrationProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// UnregisteredResource represents a GCP resource that failed to register and
// apphub was not able to discover.
message UnregisteredResource {
  // Output only. The deployed GCP resource that failed to register.
  DeployedResource deployed_resource = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The reason for the failure of registration.
  string reason = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// DeployedResource represents a single deployed GCP resource.
message DeployedResource {
  // Required. The full resource name of the deployed GCP resource.
  // Example: projects/my-project/locations/us-central1-a/instances/my-instance
  string resource_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The project ID of the deployed resource.
  string project = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The location of the deployed resource.
  string location = 3 [(google.api.field_behavior) = OPTIONAL];
}
