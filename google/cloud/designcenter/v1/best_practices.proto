syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/designcenter/v1/assessment.proto";
import "google/cloud/designcenter/v1/parameters.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "BestPracticesResourcesProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// Aggregated assessment report from all domains.
message AssessmentReport {
  // Resource associated with the report.
  oneof adc_resource_uri {
    // Output only. Application URI.
    string adc_application_uri = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Application Template URI.
    string adc_application_template_uri = 2
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Catalog Template URI.
    string adc_catalog_template_uri = 3
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Space URI.
    string adc_space_uri = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Output only. Generated best practice reports.
  repeated DomainAssessmentReport domain_assessment_reports = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Skipped domains.
  repeated SkippedDomain skipped_domains = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time at which the report was created.
  google.protobuf.Timestamp create_time = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A Policy is a resource within an Application Template that refers to a Policy
// that you author outside of Application Design Center and attach to an
// application template.
message Policy {
  option (google.api.resource) = {
    type: "designcenter.googleapis.com/Policy"
    pattern: "projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/policies/{policy}"
    plural: "policies"
    singular: "policy"
  };

  // The policy type.
  enum PolicyType {
    // Default.
    POLICY_TYPE_UNSPECIFIED = 0;

    // Compliance framework policy.
    COMPLIANCE_FRAMEWORK = 1;
  }

  // URI of the policy or the policy revision.
  oneof uri {
    // Optional. URI of the policy.
    string policy_uri = 5 [(google.api.field_behavior) = OPTIONAL];

    // Optional. URI of the policy revision.
    string policy_revision_uri = 6 [(google.api.field_behavior) = OPTIONAL];
  }

  // Identifier. The policy name in the following format:
  // `projects/$project/locations/$location/spaces/$space/applicationTemplates/$applicationTemplate/policies/$policy`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. The policy display name.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The policy description.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Required. The policy type.
  // Policy type is used to determine the domain of the policy.
  PolicyType policy_type = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. Conditions for applying the policy. Condition accepts the
  // `criticality` and `environment` parameters from the application template.
  repeated ApplyCondition apply_conditions = 7
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The policy creation timestamp.
  google.protobuf.Timestamp create_time = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The policy update timestamp.
  google.protobuf.Timestamp update_time = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Input only. Parameter values for the cloud controls of the
  // policy's framework, grouped by cloud control. Only honored when framework
  // parameter support is enabled for the project; ignored otherwise.
  //
  // The values are saved with the application template and are not returned on
  // the policy. On update, they replace the saved values. If they are empty,
  // the saved values are cleared if `cloud_control_configs` is named in the
  // update mask. Otherwise, the saved values are kept, unless the policy's
  // framework changes.
  repeated CloudControlConfig cloud_control_configs = 10 [
    (google.api.field_behavior) = INPUT_ONLY,
    (google.api.field_behavior) = OPTIONAL
  ];
}
