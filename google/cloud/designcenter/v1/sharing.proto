syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/designcenter/v1/authoring.proto";
import "google/cloud/designcenter/v1/enums.proto";
import "google/cloud/designcenter/v1/ingestion.proto";
import "google/cloud/designcenter/v1/metadata.proto";
import "google/cloud/designcenter/v1/parameters.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "SharingResourcesProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// A catalog share between spaces.
message Share {
  option (google.api.resource) = {
    type: "designcenter.googleapis.com/Share"
    pattern: "projects/{project}/locations/{location}/spaces/{space}/catalogs/{catalog}/shares/{share}"
    plural: "shares"
    singular: "share"
  };

  // The share status, which indicates whether the catalog is in sync.
  enum State {
    // The state of the share is unknown.
    STATE_UNSPECIFIED = 0;

    // The share is in sync with the shared template catalog.
    IN_SYNC = 1;

    // The share is out of sync with the shared template catalog.
    OUT_OF_SYNC = 2;
  }

  // Identifier. The share name in the following format:
  // `projects/$project/locations/$location/spaces/$space/catalogs/$catalog/shares/$share`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. The space resource path to which the catalog is shared.
  // Format is `projects/$project/locations/$location/spaces/$space`
  string destination_space = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/Space"
    }
  ];

  // Output only. The share creation timestamp.
  google.protobuf.Timestamp create_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The state of the share.
  State state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A read-only template that is shared with a space.
message SharedTemplate {
  option (google.api.resource) = {
    type: "designcenter.googleapis.com/SharedTemplate"
    pattern: "projects/{project}/locations/{location}/spaces/{space}/sharedTemplates/{shared_template}"
    plural: "sharedTemplates"
    singular: "sharedTemplate"
  };

  // Identifier. The shared template name.
  // `projects/$project/locations/$location/spaces/$space/sharedTemplates/$sharedTemplate`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. The shared template display name.
  string display_name = 7 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The shared template description.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The origin template of the shared template.
  string origin_template = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/CatalogTemplate"
    }
  ];

  // Output only. The shared template creation timestamp.
  google.protobuf.Timestamp create_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The shared template update timestamp.
  google.protobuf.Timestamp update_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Latest revision of the shared template.
  string latest_revision_id = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The category of the template.
  TemplateCategory template_category = 8
      [(google.api.field_behavior) = REQUIRED];

  // Optional. The Application Design Center assembly template type.
  TemplateType type = 9 [(google.api.field_behavior) = OPTIONAL];
}

// A read-only template revision that is shared with a space.
message SharedTemplateRevision {
  option (google.api.resource) = {
    type: "designcenter.googleapis.com/SharedTemplateRevision"
    pattern: "projects/{project}/locations/{location}/spaces/{space}/sharedTemplates/{shared_template}/revisions/{revision}"
    plural: "sharedTemplateRevisions"
    singular: "sharedTemplateRevision"
  };

  // The artifact location of the Terraform in the template.
  oneof artifact_location {
    // Optional. The git source.
    GitSource git_source = 5 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Deprecated: Added new field tf_module_gcs_uri.
    // The Cloud Storage URI, which must be in the format gs://[bucket] or
    // gs://[bucket]/[object].
    string gcs_source_uri = 20
        [deprecated = true, (google.api.field_behavior) = OPTIONAL];

    // Optional. The application template revision source.
    string application_template_revision_source = 10 [
      (google.api.field_behavior) = OPTIONAL,
      (google.api.resource_reference) = {
        type: "designcenter.googleapis.com/ApplicationTemplateRevision"
      }
    ];

    // Optional. Configuration for fetching content from source code repository
    // such as GitHub or Bitbucket through Developer Connect.
    DeveloperConnectSourceConfig developer_connect_source_config = 13
        [(google.api.field_behavior) = OPTIONAL];

    // Optional. The Open Container Initiative (OCI) repo source that contains
    // helm charts.
    OciRepo oci_repo = 15 [(google.api.field_behavior) = OPTIONAL];
  }

  // Identifier. The shared template revision name.
  // $sharedTemplate is a server-generated UUID.
  // `projects/$project/locations/$location/spaces/$space/sharedTemplates/$sharedTemplate/revisions/$revision`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. The shared template revision description.
  string description = 12 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The Application Design Center assembly template type.
  TemplateType type = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The shared template metadata.
  TFBlueprintMetadata shared_template_metadata = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The shared template revision refers to the following catalog
  // template revision.
  string origin_template_revision = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/CatalogTemplateRevision"
    }
  ];

  // Output only. The shared template revision creation timestamp.
  google.protobuf.Timestamp create_time = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The serialized application template revision.
  SerializedApplicationTemplate application_template_revision = 11
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The helm chart metadata.
  HelmChartMetadata helm_chart_metadata = 14
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The category of the template.
  TemplateCategory template_category = 16
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The Product Main logical product type information.
  repeated LogicalProduct logical_products = 17
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The annotations of the shared template revision.
  // Key is the annotation name. Value is the annotation value.
  map<string, string> annotations = 18 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Metadata that was automatically inferred from the template
  // content.
  InferredMetadata inferred_metadata = 19
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The resource types present in the template revision.
  repeated ResourceType resource_types = 21
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Indicates the IaC source format of this shared template
  // revision.
  IACSource iac_source = 24 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The values provided for the input variables.
  repeated Parameter application_parameters = 25
      [(google.api.field_behavior) = OPTIONAL];
}
