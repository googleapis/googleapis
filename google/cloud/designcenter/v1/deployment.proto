syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/apphub/v1/application.proto";
import "google/cloud/apphub/v1/attributes.proto";
import "google/cloud/config/v1/config.proto";
import "google/cloud/designcenter/v1/parameters.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "DeploymentProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// Source template information for the deployment.
message DeploymentSource {
  // The source for the IaC deployment.
  oneof source {
    // Application template revision URI.
    string application_template_revision = 4;

    // Shared template revision URI.
    string shared_template_revision_uri = 6;
  }
}

// The error associated with the deployment.
message DeploymentError {
  // Possible values for the deployment error types.
  // This categorization is based on the error code returned by Infrastructure
  // Manager.
  enum ErrorType {
    // Unspecified error type.
    ERROR_TYPE_UNSPECIFIED = 0;

    // Permission related error.
    PERMISSION = 1;

    // Quota related error.
    QUOTA = 2;

    // Resource already exists.
    ALREADY_EXISTS = 3;

    // Resource is unavailable.
    RESOURCE_UNAVAILABLE = 4;

    // Billing related error.
    BILLING = 5;

    // Generic error if error does not fall under any of the above.
    GENERIC = 6;

    // Terraform related error.
    TERRAFORM = 7;

    // Bad input error.
    BAD_INPUT = 8;

    // Platform related error.
    PLATFORM = 9;

    // API enablement error.
    API_ENABLEMENT = 10;

    // Bad request error.
    BAD_REQUEST = 11;
  }

  // Output only. The error type based on the deployment error code.
  ErrorType type = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The deployment error code. Based on Infrastructure Manager
  // error codes.
  google.cloud.config.v1.Deployment.ErrorCode code = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The error message associated with the deployment.
  repeated google.cloud.config.v1.TerraformError tf_errors = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Human readable string that summarizes the deployment error
  // issue.
  string detail = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The call to actions associated with the deployment issue.
  repeated DeploymentFailureResolutionInfo deployment_failure_resolution_info =
      6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Stores errors generated by Infra Manager, as well as all
  // non-internal errors (such as INVALID_ARGUMENT) that occur before
  // initiating the deployment.
  string error_message = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The call to action associated with the deployment issue.
message DeploymentFailureResolutionInfo {
  // Output only. Link for the call to action.
  string resolution_link = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Elaborative error resolution message.
  string resolution_message = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Call to action link text.
  string resolution_link_text = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The application output parameters of the deployment.
message ApplicationOutputParameters {
  // The output parameters of the application.
  oneof parameters {
    // Output only. Helm application output parameters.
    HelmApplicationOutputParameters helm_application_output_parameters = 1
        [(google.api.field_behavior) = OUTPUT_ONLY];
  }
}

// The helm application output parameters of the deployment.
message HelmApplicationOutputParameters {
  // Output only. The output parameters of the helm application.
  repeated Parameter parameters = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The updated template revision, which results in an outdated application.
message UpdatedTemplateRevision {
  // Output only. The details of the updated template revision.
  string template_revision = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time when the template was created.
  google.protobuf.Timestamp create_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The display name of the template. If the display name is not
  // available, the template resource name is used.
  string template_display_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Connection configuration for the application.
message ConnectionConfig {
  // Required. The connection URI.
  string connection_uri = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The parameters of the connection associated with the source
  // component.
  repeated Parameter source_component_parameters = 2
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The parameters of the connection associated with the destination
  // component.
  repeated Parameter destination_component_parameters = 3
      [(google.api.field_behavior) = OPTIONAL];
}

// The deployment target of the application.
message DeploymentTarget {
  // Different deployment targets for the application.
  oneof target {
    // Optional. The GKE deployment target.
    GKEDeploymentTarget gke_deployment_target = 1
        [(google.api.field_behavior) = OPTIONAL];
  }
}

// The GKE deployment target.
message GKEDeploymentTarget {
  // Required. The self link of the cluster where GKE based application is
  // deployed.
  string cluster_self_link = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The namespace where the application is deployed.
  string namespace = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The kubernetes service account that is created within the
  // namespace provided above. Example: default or node-sa
  string kubernetes_service_account = 3
      [(google.api.field_behavior) = REQUIRED];

  // Optional. Whether to create the provided KSA.
  // If true, the KSA will be created in the namespace provided above.
  // If false, the KSA is expected to already exist in the namespace provided
  // above.
  bool kubernetes_service_account_creation = 4
      [(google.api.field_behavior) = OPTIONAL];
}

// Holds parameters that are specific to composite applications.
message CompositeApplicationParameters {
  // Optional. A map from a component's URI to the deployment service account
  // for composite application. key format:
  // projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/components/{component}
  // value format:
  // projects/{project}/serviceAccounts/{email_address}
  map<string, string> service_account_map = 1
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. A map from a component's URI to its project parameters.
  // The key format is:
  // projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/components/{component}
  map<string, ProjectParametersList> project_parameters_map = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Provides the list of project parameters needed to deploy an application.
message ProjectParametersList {
  // Output only. List of project parameters for the application.
  repeated ProjectParameters project_parameters = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Metadata for the infra manager deployment group. A deployment group in
// Infrastructure Manager is a logical grouping of one or more deployments.
message DeploymentGroupMetadata {
  // Output only. The deployment group name.
  // Format:
  // projects/{project}/locations/{location}/deploymentGroup/{deployment_group}
  string deployment_group = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Map of component name to deployment metadata for the
  // component. Key format:
  // projects/{project}/locations/{location}/spaces/{space}/applicationTemplates/{application_template}/components/{component}
  map<string, DeploymentMetadata> deployment_metadata_map = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Deployment information for the application.
message DeploymentMetadata {
  // Output only. The revision of the deployment associated with the
  // Application.
  string revision = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The component output parameters of the deployment.
  repeated ComponentOutputParameters component_output_parameters = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The error associated with the deployment.
  DeploymentError error = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Cloud Build instance UUID associated with this deployment.
  string build = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The user-specified Cloud Build worker pool resource used,
  // which the system uses to deploy the application. Format:
  // `projects/{project}/locations/{location}/workerPools/{workerPoolId}`.
  string worker_pool = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The attempted number of deployment retries.
  int32 retry_attempts = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The application output parameters of the deployment.
  ApplicationOutputParameters application_output_parameters = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The component output parameters of the deployment.
message ComponentOutputParameters {
  // Output only. The component name of the output parameters.
  string component = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The output parameters of the component.
  repeated Parameter parameters = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The ProjectParameters provides the parameters needed to deploy the
// application in the given project.
message ProjectParameters {
  // Output only. The project ID of the project.
  string project_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. IAM roles required by the service account to deploy the
  // application in given project.
  repeated string roles = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. APIs required to be enabled to deploy the application, in the
  // form of "*.googleapis.com".
  repeated string apis = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Information about the component level parameters for an application.
message ComponentParameters {
  // Possible values of deployment state of the component.
  enum State {
    // Unspecified component deployment state.
    STATE_UNSPECIFIED = 0;

    // Component is in draft.
    DRAFT = 1;

    // New deployment is in progress.
    CREATING_DEPLOYMENT = 2;

    // Update is in progress.
    UPDATING_DEPLOYMENT = 3;

    // Deletion is in progress.
    DELETING = 4;

    // Component deployment is completed.
    DEPLOYED = 5;

    // Component deployment is deleted.
    DELETED = 6;

    // Component deployment is failed.
    FAILED = 7;
  }

  // Required. The name of the component parameter.
  string component = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. A list of parameters associated with the component.
  repeated Parameter parameters = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. A list of connections associated with the component.
  repeated ConnectionParameters connections_parameters = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Deployment state of the component.
  State state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The component parameter schema, which includes possible
  // parameter values.
  repeated ComponentParameterSchema component_parameter_schema = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The application associated with the component.
  ComponentApplicationInfo application_info = 6
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The effective application associated with the component. This
  // is the server set application field.
  ComponentApplicationInfo effective_application_info = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// This captures the apphub application details associated with the component.
message ComponentApplicationInfo {
  // Required. The application ID of the apphub application. The ID must be 1-63
  // characters long and should match the regular expression
  // `^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$`.
  string apphub_application_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Display name for the application. The number of characters should
  // be less than 64 characters.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Scope of apphub application.
  google.cloud.apphub.v1.Scope scope = 3
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Attributes of apphub application.
  google.cloud.apphub.v1.Attributes attributes = 4
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Deployment region for the component. If the scope is set to
  // REGIONAL, then the apphub application is created in this region, e.g.
  // `us-central1`.
  string deployment_region = 5 [(google.api.field_behavior) = OPTIONAL];
}

// RoleInfo represents an IAM role along with its origin.
message RoleInfo {
  // Required. IAM role name, such as `roles/editor`.
  string role = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "iam.googleapis.com/Role" }
  ];

  // Output only. When `true`, indicates that this role is automatically added
  // by Application Design Center. When you provide a role, this field is set to
  // `false`.
  bool system_provided = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The list of permissions that this role is recommended for.
  // This includes only the permissions of this role that are part of the
  // recommendation.
  repeated string permissions = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ApiInfo represents an API along with its origin.
message ApiInfo {
  // Required. API name, such as `compute.googleapis.com`.
  string api = 1 [(google.api.field_behavior) = REQUIRED];

  // Output only. When `true`, indicates that this API is automatically added by
  // Application Design Center. When you provide an API, this field is set to
  // `false`.
  bool system_provided = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents configurations required within a specific project to deploy the
// application.
message RolesAndApisConfig {
  // Required. The project ID to which these configurations apply.
  string project_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. IAM roles that the deployment service account needs to deploy
  // the application within this project.
  // Each role must be a valid IAM role name, such as `roles/editor`.
  // The maximum number of roles allowed is 500.
  repeated RoleInfo roles = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. APIs that you must enable in this project before you deploy the
  // application, in the form of "*.googleapis.com". The maximum number of APIs
  // allowed is 500.
  repeated ApiInfo apis = 3 [(google.api.field_behavior) = OPTIONAL];
}
