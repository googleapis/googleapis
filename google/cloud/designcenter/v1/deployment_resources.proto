syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/apphub/v1/application.proto";
import "google/cloud/apphub/v1/attributes.proto";
import "google/cloud/designcenter/v1/authoring.proto";
import "google/cloud/designcenter/v1/deployment.proto";
import "google/cloud/designcenter/v1/enums.proto";
import "google/cloud/designcenter/v1/export.proto";
import "google/cloud/designcenter/v1/metadata.proto";
import "google/cloud/designcenter/v1/parameters.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "DeploymentResourcesProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// Represents the application resource.
message Application {
  option (google.api.resource) = {
    type: "designcenter.googleapis.com/Application"
    pattern: "projects/{project}/locations/{location}/spaces/{space}/applications/{application}"
    plural: "applications"
    singular: "application"
  };

  // Possible values for the application deployment state.
  enum State {
    // Unspecified application deployment state.
    STATE_UNSPECIFIED = 0;

    // Application is in draft.
    DRAFT = 1;

    // New application deployment is in progress.
    CREATING_DEPLOYMENT = 2;

    // Update application deployment is in progress.
    UPDATING_DEPLOYMENT = 3;

    // Delete application deployment is in progress.
    DELETING = 4;

    // Application deployment is completed.
    DEPLOYED = 5;

    // Application deployment is deleted.
    DELETED = 6;

    // Application deployment is failed.
    FAILED = 7;

    // Application deployment is in progress.
    DEPLOYING = 8;
  }

  // Specifies the strategy to use when updating an application.
  enum UpdateStrategy {
    // Retains the existing value for the field.
    UPDATE_STRATEGY_UNSPECIFIED = 0;

    // Replaces the existing field values with the provided ones.
    REPLACE = 2;
  }

  // Identifier. The name of the application.
  // Format:
  // projects/{project}/locations/{location}/spaces/{space}/applications/{application}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. Create timestamp.
  google.protobuf.Timestamp create_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Update timestamp.
  google.protobuf.Timestamp update_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The application deployment source.
  DeploymentSource source = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. A list of parameters to attach to the deployment source object,
  // which is a catalog entry or application template snapshot.
  repeated Parameter app_parameters = 5
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. A list of component parameters to associate with the application.
  repeated ComponentParameters component_parameters = 10
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Your own service account that you use to deploy an application.
  string service_account = 11 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Display name of the application.
  string display_name = 12 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Description of the application.
  string description = 13 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Attributes of the application.
  google.cloud.apphub.v1.Attributes attributes = 14
      [(google.api.field_behavior) = OPTIONAL];

  // Required. Scope of the application.
  google.cloud.apphub.v1.Scope scope = 15
      [(google.api.field_behavior) = REQUIRED];

  // Optional. Import existing resources into the application.
  bool import_existing_resources = 16 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Preview reference for the application.
  string preview_reference = 17 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. [Output only] Optional Infra Manager deployment Id with
  // revision
  string deployment_revision = 18 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The App Hub App associated with the application.
  string apphub_application = 19 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. [Output only] Serialized application template.
  SerializedApplicationTemplate serialized_application_template = 20
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Deployment state of the application.
  State state = 21 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Deployment metadata of the application.
  DeploymentMetadata deployment_metadata = 22
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. List of project parameters for the application.
  repeated ProjectParameters project_parameters = 23
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The region where the application is deployed.
  string deployment_region = 24 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The updated template revision because of which the application
  // is outdated.
  UpdatedTemplateRevision updated_template_revision = 26
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Deployment project of the application.
  string deployment_project = 27 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Connection configuration for the application.
  repeated ConnectionConfig connection_configs = 28
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. Details of the location where the IaC for this application was
  // last successfully exported.
  ArtifactLocation artifact_location = 29
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The type of the application.
  ApplicationType type = 30 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The deployment target of the application.
  DeploymentTarget deployment_target = 31
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The composition type of the application: STANDARD OR
  // COMPOSITE.
  ApplicationCompositionType composition_type = 32
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Parameters that are required for composite applications.
  CompositeApplicationParameters composite_application_parameters = 33
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The deployment group metadata of the application. This is
  // applicable only for composite applications.
  DeploymentGroupMetadata deployment_group_metadata = 34
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Specifies the strategy to use when updating the application
  // parameters while updating the application template revision.
  UpdateStrategy params_update_strategy = 35
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Project-specific configurations required for application
  // deployment, including IAM roles and APIs. The list can contain up to 100
  // items.
  repeated RolesAndApisConfig roles_apis_config = 36
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The input output variables parsed from the imported terraform
  // code.
  TFBlueprintMetadata template_metadata = 37
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Indicates the IaC source format of this application.
  IACSource iac_source = 38 [(google.api.field_behavior) = OUTPUT_ONLY];
}
