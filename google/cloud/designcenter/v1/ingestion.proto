syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "IngestionProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";
option (google.api.resource_definition) = {
  type: "developerconnect.googleapis.com/GitRepositoryLink"
  pattern: "projects/{project}/locations/{location}/connections/{connection}/gitRepositoryLinks/{git_repository_link}"
};

// Defines how to access a Git source.
message GitSource {
  // Required. Location of the git repo to build.
  string repo = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Directory, relative to the source root, in which to run the
  // build. This must be a relative path. If a step's `dir` is specified and is
  // an absolute path, this value is ignored for that step's execution.
  string dir = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The commit SHA of the git repo deduced from given ref_tag.
  string commit_sha = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. This config defines the location of a source through Developer
  // Connect. Used to access private git repos.
  DeveloperConnectConfig developer_connect_config = 4
      [deprecated = true, (google.api.field_behavior) = OPTIONAL];

  // Required. The reference tag of the git repo.
  string ref_tag = 5 [(google.api.field_behavior) = REQUIRED];
}

// This config defines the location of a source through Developer Connect.
message DeveloperConnectConfig {
  // Required. The Developer Connect Git repository link, formatted as
  // `projects/*/locations/*/connections/*/gitRepositoryLink/*`.
  string git_repository_link = 1 [(google.api.field_behavior) = REQUIRED];
}

// This config specifies the location of a source (such as GitHub or Bitbucket)
// through Developer Connect.
message DeveloperConnectSourceConfig {
  // Required. The Developer Connect Git repository link, formatted as
  // `projects/*/locations/*/connections/*/gitRepositoryLinks/*`.
  string developer_connect_repo_uri = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "developerconnect.googleapis.com/GitRepositoryLink"
    }
  ];

  // Required. The reference (for example, a branch, tag, or commit SHA) from
  // which the content should be read.
  GitReference reference = 8 [(google.api.field_behavior) = REQUIRED];

  // Required. The sub-directory within the repository from which to read
  // content. The path must be relative to the repository's root such as
  // dir1/dir2. To read content from the root dir, provide "/" as the value of
  // the field.
  string dir = 5 [(google.api.field_behavior) = REQUIRED];

  // Output only. The SHA of the commit deduced from GitReference.
  string fetched_commit_sha = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// The Git reference. Can be a commit SHA, branch name, or tag name.
message GitReference {
  // The reference from which the content such as Infrastructure as Code (IaC)
  // should be read.
  oneof reference {
    // Optional. The name of the branch from which content should be read.
    // For example: "main"
    string branch = 1 [(google.api.field_behavior) = OPTIONAL];

    // Optional. The reference tag from which content should be read.
    // For example: "v1.2.3"
    string ref_tag = 2 [(google.api.field_behavior) = OPTIONAL];

    // Optional. The full SHA hash of a specific commit from which content
    // should be read.
    string commit_sha = 3 [(google.api.field_behavior) = OPTIONAL];
  }
}

// Open Container Initiative (OCI) repo.
message OciRepo {
  // Required. Path to Open Container Initiative (OCI) repo.
  // Example: oci://us-west1-docker.pkg.dev/nyap-test/helm-repo/my-chart
  string uri = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The version of the helm chart.
  string version = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Field for containing the references to the source from which the
  // OCI repo was created.
  string module_source_uri = 3 [(google.api.field_behavior) = OPTIONAL];
}

// IaCModule represents a single infrastructure as code module.
message IaCModule {
  // Optional. The files in the module.
  repeated IaCFile files = 1 [(google.api.field_behavior) = OPTIONAL];
}

// IaCFile represents a single infrastructure as code file.
message IaCFile {
  // Required. The name of the file.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The content of the file. The content of the file can be read and
  // passed as a string. For example, for a Terraform file, the content is the
  // HCL content of the file.
  string content = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Message representing the error encountered during import.
// Example: A variable with name "name" is expected to be of type string, but is
// provided as number, inside a module named "my_module".
// {
// resource_address: "module.my_module.name"
// file: "gs://my_bucket/main.tf"
// range: {
// start: {
// line: 2
// byte_offset: 1
// column: 2
// }
// end: {
// line: 2
// byte_offset: 10
// column: 10
// }
// }
// description: "Error parsing field: \"name\". Expected type \"string\" but got
// \"number\"."
// type: INVALID
// }
message ImportIaCError {
  // The type of error.
  enum Type {
    // Default.
    TYPE_UNSPECIFIED = 0;

    // The change is invalid.
    // Example: a string value provided for a number input parameter type,
    // which would be caught by Terraform validation.
    INVALID = 1;

    // The change is not supported.
    // Example: a user directly adding a Terraform resource in main.tf
    // that Design Center does not support importing.
    NOT_SUPPORTED = 2;
  }

  // Specific error code for UI and programmatic handling.
  enum ErrorCode {
    // Default.
    ERROR_CODE_UNSPECIFIED = 0;

    // HCL Syntax errors (e.g. unclosed blocks, bad characters)
    ERROR_CODE_SYNTAX_ERROR = 1;

    // Top-level block is e.g. "resource", "data", "locals"
    ERROR_CODE_UNSUPPORTED_BLOCK_TYPE = 2;

    // Attributes defined outside of allowed blocks
    ERROR_CODE_TOP_LEVEL_ATTRIBUTE = 3;

    // Module not present in catalog
    ERROR_CODE_UNSUPPORTED_MODULE = 4;

    // Attribute defined inside module that is not in the shared template
    ERROR_CODE_MODULE_UNSUPPORTED_ATTRIBUTE_ADDED = 5;

    // Mandatory attribute of shared template is missing in module block
    ERROR_CODE_MODULE_REQUIRED_ATTRIBUTE_REMOVED = 6;

    // Value fails shared template schema checks (regex, range, etc.)
    ERROR_CODE_PARAMETER_VALUE_INVALID = 7;

    // Variable in variables.tf is added, removed or schema changed
    ERROR_CODE_UNSUPPORTED_VARIABLE_CHANGE = 8;

    // Output in outputs.tf is added, removed or schema changed
    ERROR_CODE_UNSUPPORTED_OUTPUT_CHANGE = 9;

    // Provider in providers.tf has added blocks or modified attributes
    ERROR_CODE_UNSUPPORTED_PROVIDER_CHANGE = 10;

    // Value modified for variables defined in terraform.tfvars
    ERROR_CODE_UNSUPPORTED_TFVAR_CHANGE = 11;
  }

  // Output only. The resource address of the error.
  string resource_address = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The file where the error has occurred.
  string file = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The code portion where this error occurs.
  CodeRange range = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The description of the error.
  string description = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The type of error.
  Type type = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Specific error code for the import error.
  ErrorCode error_code = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CodeRange represents a portion of code.
message CodeRange {
  // Output only. Start position.
  CodePosition start = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. End position.
  CodePosition end = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CodePosition represents a code location.
message CodePosition {
  // Output only. One-based line count of the relevant position.
  int32 line = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Byte offset in the content.
  int32 byte_offset = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. One-based column count of the relevant position.
  int32 column = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}
