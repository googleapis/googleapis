option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "DeploymentRpcMessagesProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// Message for creating an application.
message CreateApplicationRequest {
  // Required. The parent resource in which to create the application.
  // Format: `projects/$project/locations/$location/spaces/$space`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "designcenter.googleapis.com/Application"
    }
  ];

  // Required. The ID of the application to create.
  string application_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The application to create.
  Application application = 3 [(google.api.field_behavior) = REQUIRED];
}

// Message for getting an application.
message GetApplicationRequest {
  // Required. The application name.
  // Format:
  // `projects/$project/locations/$location/spaces/$space/applications/$application`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/Application"
    }
  ];
}

// Message for requesting a list of applications.
message ListApplicationsRequest {
  // Required. The parent resource from which to request a list of applications.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "designcenter.googleapis.com/Application"
    }
  ];

  // Optional. The maximum number of results to return from this request.
  // Non-positive
  //  values are ignored. The presence of nextPageToken in the response
  //  indicates that more results might be available.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If present, then retrieve the next batch of results from the
  // preceding call to this method. pageToken must be the value of nextPageToken
  // from the previous response. The values of other method parameters should be
  // identical to those in the previous call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A filter that chooses which applications to return.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. How the results should be sorted.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Message for response to listing applications.
message ListApplicationsResponse {
  // The list of applications.
  repeated Application applications = 1;

  // If there might be more results than those appearing in this response, then
  // nextPageToken is included. To get the next set of results, call this method
  // again using the value of nextPageToken as pageToken.
  string next_page_token = 2;

  // Unordered list. Locations that could not be reached.
  repeated string unreachable = 3
      [(google.api.field_behavior) = UNORDERED_LIST];
}

// Message for updating an application.
message UpdateApplicationRequest {
  // Optional. The fields to overwrite in the application update. If you don't
  // provide a mask, all fields are overwritten.
  google.protobuf.FieldMask update_mask = 1
      [(google.api.field_behavior) = OPTIONAL];

  // Required. The application to update.
  Application application = 2 [(google.api.field_behavior) = REQUIRED];
}

// Message for deleting an application.
message DeleteApplicationRequest {
  // Required. The application name.
  // Format:
  // `projects/$project/locations/$location/spaces/$space/applications/$application`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/Application"
    }
  ];

  // Optional. If set to true, the application's children are also deleted. If
  // false, the application is only deleted if it has no children.
  bool force = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Message for deploying an application.
message DeployApplicationRequest {
  // Required. The application name.
  // Format:
  // `projects/$project/locations/$location/spaces/$space/applications/$application`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/Application"
    }
  ];

  // Optional. Flag to update the existing deployment. If not set or false,
  // deploy will fail if application `state` is in the `DEPLOYED` state.
  bool replace = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The user-specified Worker Pool resource in which the Cloud Build
  // job will execute. Format:
  // projects/{project}/locations/{location}/workerPools/{workerPoolId} If this
  // flag is omitted, the worker pool already defined on the application will be
  // used. If no worker pool is defined on the application, the default Cloud
  // Build worker pool is used. The worker pool must exist in the same region as
  // the application.
  string worker_pool = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The email address of the service account to use for this
  // deployment.
  //
  // - If provided, this service account will be used to execute the deployment
  //   process, taking precedence over any service_account specified on the
  //   Application resource.
  // - The caller must have the 'iam.serviceAccounts.actAs' permission on this
  //   service account.
  // - If this field is omitted, the system will use the 'service_account'
  //   defined within the Application resource.
  // - We recommend that you provide a service account here or on the
  //   Application resource. If you don't provide a service account, the
  //   deployment will fail.
  // Format: projects/{PROJECT}/serviceAccounts/{EMAIL_ADDRESS}
  string service_account = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If set to true, the request is validated, but no actual
  // deployment will occur. See https://google.aip.dev/163 for more details.
  bool validate_only = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response for DeployApplication.
message DeployApplicationResponse {
  // Infrastructure Manager deployment.
  google.cloud.config.v1.Deployment deployment = 1;

  // Cloud Build deployment id.
  string build_id = 2;

  // Infrastructure Manager deployment group.
  // Used for composite application deployment response.
  google.cloud.config.v1.DeploymentGroup deployment_group = 3;
}

// Status of the [Resources][]s in the deployment.
message Resource {
  option (google.api.resource) = {
    type: "designcenter.googleapis.com/Resource"
    pattern: "projects/{project}/locations/{location}/spaces/{space}/applications/{application}/resources/{resource}"
    plural: "resources"
    singular: "resource"
  };

  // Possible states of a resource.
  enum State {
    // The default value. This value is used if the state is omitted.
    STATE_UNSPECIFIED = 0;

    // Resource has been planned for reconcile.
    PLANNED = 1;

    // Resource is actively reconciling into the intended state.
    IN_PROGRESS = 2;

    // Resource has reconciled to intended state.
    RECONCILED = 3;

    // Resource failed to reconcile.
    FAILED = 4;

    // Drift is detected in the resourece state.
    DRIFTED = 5;

    // Resource is intended state.
    INTENDED = 6;
  }

  // Output only. Identifier. The name of the resource.
  string name = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IDENTIFIER
  ];

  // Output only. The type of the resource.
  string type = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Current state of the resource.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for GenerateApplicationIaC method.
message GenerateApplicationIaCRequest {
  // Required. The name of the application.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/Application"
    }
  ];

  // Optional. The IaC format to generate.
  IACFormat iac_format = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. DEPRECATED: Use the 'artifact_location' field instead.
  // The Cloud Storage URI to write the generated IaC to.
  string gcs_uri = 3
      [deprecated = true, (google.api.field_behavior) = OPTIONAL];

  // Optional. Specifies the destination for the generated IaC, which can be
  // Cloud Storage or a Developer Connect repository.
  ArtifactLocation artifact_location = 4
      [(google.api.field_behavior) = OPTIONAL];
}

// Response message for GenerateApplicationIaC method.
message GenerateApplicationIaCResponse {
  // DEPRECATED: Use the 'artifact_location' field instead.
  // The Cloud Storage URI of the generated IaC.
  string gcs_uri = 1 [deprecated = true];

  // The destination where the generated IaC was written.
  ArtifactLocation artifact_location = 2;

  // Root modules metadata of the application.
  RootModulesMetadata root_modules_metadata = 3;
}

// Request message for ExportApplicationIaC method.
message ExportApplicationIaCRequest {
  // Required. The name of the application.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/Application"
    }
  ];

  // Optional. The IaC format to generate.
  IACFormat iac_format = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Specifies the destination for the generated IaC, which can be
  // Cloud Storage or a Developer Connect repository.
  ArtifactLocation artifact_location = 3
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Configuration for exporting IaC.
  ExportIaCConfig export_iac_config = 4
      [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ExportApplicationIaC method.
message ExportApplicationIaCResponse {
  // The destination where the generated IaC was written.
  ArtifactLocation artifact_location = 1;

  // Root modules metadata of the application.
  RootModulesMetadata root_modules_metadata = 2;
}

// Request message for ImportApplicationIaC method.
message ImportApplicationIaCRequest {
  // The source location of terraform code.
  oneof source {
    // Optional. The Cloud Storage URI of the terraform code.
    string gcs_uri = 2 [(google.api.field_behavior) = OPTIONAL];

    // Optional. The IaC module to import.
    IaCModule iac_module = 5 [(google.api.field_behavior) = OPTIONAL];
  }

  // Required. The name of the application.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/Application"
    }
  ];

  // Optional. If set to true, partially imports the valid edits in the IaC and
  // ignores the invalid changes. Defaults to false, which means any edits which
  // can't be imported must result in an error.
  bool allow_partial_import = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If set to true, the IaC is validated against the golden terraform
  // without importing. Defaults to false.
  bool validate_iac = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ImportApplicationIaC method.
message ImportApplicationIaCResponse {
  // State of Import.
  enum State {
    // Default.
    STATE_UNSPECIFIED = 0;

    // The import was successful.
    SUCCEEDED = 1;

    // The import failed.
    FAILED = 2;
  }

  // Application template corresponding to the imported IaC.
  Application application = 1;

  // Errors encountered during import.
  repeated ImportIaCError errors = 2;

  // The state of the import.
  State state = 3;
}

// Message for previewing an application.
message PreviewApplicationRequest {
  // Required. The application name in the following format:
  // `projects/$project/locations/$location/spaces/$space/applications/$application`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/Application"
    }
  ];

  // Optional. The user-specified Worker Pool resource in which the Cloud Build
  // job will execute. Format:
  // projects/{project}/locations/{location}/workerPools/{workerPoolId} If this
  // flag is omitted, the worker pool already defined on the application will be
  // used. If no worker pool is defined on the application, the default Cloud
  // Build worker pool is used. The worker pool must exist in the same region as
  // the application.
  string worker_pool = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The email address of the service account to use for this preview
  // operation.
  //
  // - If provided, this service account will be used to execute the preview
  //   process, taking precedence over any service_account specified on the
  //   Application resource.
  // - The caller must have the 'iam.serviceAccounts.actAs' permission on this
  //   service account.
  // - If this field is omitted, the system will use the 'service_account'
  //   defined within the Application resource.
  // - We recommend that you provide a service account here or on the
  //   Application resource. If you don't provide a service account, the preview
  //   will fail.
  // Format: projects/{PROJECT}/serviceAccounts/{EMAIL_ADDRESS}
  string service_account = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response for PreviewApplication.
message PreviewApplicationResponse {
  // Infrastructure Manager preview.
  google.cloud.config.v1.Preview preview = 1;

  // Best practices by Design Assessment report
  AssessmentReport assessment_report = 2;
}

// Request message for `RecommendIAMRoles`.
message RecommendIAMRolesRequest {
  // Required. The name of the application resource for which to recommend IAM
  // roles. Format:
  // projects/$project/locations/$location/spaces/$space/applications/$application
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "designcenter.googleapis.com/Application"
    }
  ];
}

// Response message for `RecommendIAMRoles`.
message RecommendIAMRolesResponse {
  // A list of project configurations containing recommended IAM roles and
  // required APIs for each target Google Cloud project in the application
  // infrastructure.
  repeated RolesAndApisConfig project_configurations = 1;
}

// Request message for ConfigureAndDeployTemplate.
message ConfigureAndDeployTemplateRequest {
  // Required. The parent resource where the template will be deployed.
  // Format: `projects/{project}/locations/{location}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "locations.googleapis.com/Location"
    }
  ];

  // Required. The URI or identifier of the template to configure and deploy.
  string template_uri = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The space ID where the template and application will be created.
  string space_id = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. Template configuration parameters (key-value pairs).
  repeated Parameter template_parameters = 4
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The resource name of the service account to use for this
  // deployment.
  //
  // - If provided, this service account will be used to execute the deployment
  //   process.
  // - The caller must have the `iam.serviceAccounts.actAs` permission on this
  //   service account.
  // - If this field is omitted, a default system service account will be used.
  // Format: projects/{PROJECT}/serviceAccounts/{EMAIL_ADDRESS}
  string service_account = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ConfigureAndDeployTemplate.
// Populated inside Operation.response upon LRO completion.
message ConfigureAndDeployTemplateResponse {
  // The URI of the deployed application.
  string application_uri = 1 [(google.api.resource_reference) = {
    type: "designcenter.googleapis.com/Application"
  }];

  // The URI of the application template.
  string application_template_uri = 2 [(google.api.resource_reference) = {
    type: "designcenter.googleapis.com/ApplicationTemplate"
  }];

  // The deployment metadata of the deployed application.
  DeploymentMetadata deployment_metadata = 3;

  // The deployment state of the deployed application.
  Application.State deployment_state = 4;
}
