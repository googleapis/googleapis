syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/config/v1/config.proto";
import "google/cloud/designcenter/v1/best_practices.proto";
import "google/cloud/designcenter/v1/deployment.proto";
import "google/cloud/designcenter/v1/deployment_resources.proto";
import "google/cloud/designcenter/v1/enums.proto";
import "google/cloud/designcenter/v1/export.proto";
import "google/cloud/designcenter/v1/iac.proto";
import "google/cloud/designcenter/v1/ingestion.proto";
import "google/cloud/designcenter/v1/parameters.proto";
