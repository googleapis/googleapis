// Represents the metadata of the long-running operation.
message OperationMetadata {
  // Metadata about the state of an operation for a particular
  // resource.
  oneof resource_metadata {
    // Output only. The application deployment metadata this operation is
    // associated with.
    DeploymentOperationMetadata deployment_metadata = 8
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The application preview metadata this operation is
    // associated with.
    PreviewOperationMetadata preview_metadata = 9
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The application delete metadata this operation is associated
    // with.
    ApplicationOperationMetadata application_metadata = 10
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The Provision Deployment Group Metadata this operation is
    // associated with.
    ProvisionDeploymentGroupOperationMetadata deployment_group_metadata = 11
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The Generate Assessment Report Metadata this operation is
    // associated with.
    GenerateAssessmentReportOperationMetadata
        generate_assessment_report_metadata = 12
        [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Output only. The time the operation was created.
  google.protobuf.Timestamp create_time = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time the operation finished running.
  google.protobuf.Timestamp end_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The server defined resource path for the target of the
  // operation.
  string target = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Name of the verb executed by the operation.
  string verb = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Human readable status of the operation, if any.
  string status_message = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Identifies whether the user has requested cancellation
  // of the operation. Operations that have been cancelled successfully
  // have [Operation.error][] value with a
  // [google.rpc.Status.code][google.rpc.Status.code] of 1, corresponding to
  // `Code.CANCELLED`.
  bool requested_cancellation = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. API version used to start the operation.
  string api_version = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Ephemeral metadata depicting the state of the preview operation.
message PreviewOperationMetadata {
  // Output only. The current step of the preview.
  // The possible steps a preview may be running as returned by the
  // Infrastructure. Manager.
  string preview_step = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Cloud Build instance UUID associated with the preview
  // operation.
  string preview_build = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Location of the preview operation logs in
  // `gs://{bucket}/{object}` format.
  string preview_logs = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Details of the [Resources][]s in the deployment.
  repeated Resource resources = 8;
}

// Ephemeral metadata depicting the state of assessment report generation.
message GenerateAssessmentReportOperationMetadata {
  // Steps in generating an assessment report.
  enum AssessmentStep {
    // Unspecified step.
    ASSESSMENT_STEP_UNSPECIFIED = 0;

    // Generating Terraform fast plan.
    FAST_PLAN = 1;

    // Generating BPBD assessment report.
    ASSESSMENT_REPORT = 2;

    // Succeeded.
    SUCCEEDED = 3;

    // Failed.
    FAILED = 4;
  }

  // Output only. The current step of the generate assessment report operation.
  AssessmentStep step = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Ephemeral metadata depicting the state of the delete operation.
message ApplicationOperationMetadata {
  // Output only. The current step of the delete operation. Associated with
  // Infrastructure Manager and App Hub.
  string step = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Cloud Build instance UUID associated with the delete
  // operation.
  string build = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents the Provision Deployment Group operation metadata.
message ProvisionDeploymentGroupOperationMetadata {
  // Current Deployment Operation Step
  enum DeploymentStep {
    // Unspecified deployment step.
    DEPLOYMENT_STEP_UNSPECIFIED = 0;

    // Generating Terraform content for the application.
    GENERATING_TERRAFORM_CONTENT = 1;

    // Deploying the application.
    DEPLOYING = 2;

    // Operation was successful.
    SUCCEEDED = 3;

    // Operation failed.
    FAILED = 4;
  }

  // Output only. Current step of deploying composite application
  DeploymentStep deployment_step = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. List of deployment unit deployment progress
  repeated DeploymentUnitProgress deployment_unit_progress = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Single deployment unit progress info
message DeploymentUnitProgress {
  // Output only. Deployment unit ID
  string unit_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Deployment resource of deploying unit ID
  string deployment = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Current deployment unit step
  string deployment_unit_step = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Deployment build uuid
  string deployment_build = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Output only. Current deployment step
  string deployment_step = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Ephemeral metadata depicting the state of the deployment operation.
message DeploymentOperationMetadata {
  // Output only. The name of the deployment associated with the application.
  string deployment = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The current step of the deployment.
  // This will mimic the DeploymentStep enum in the deployment proto.
  string deployment_step = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Cloud Build instance UUID associated with this deployment.
  string deployment_build = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Location of the deployment operation logs in
  // `gs://{bucket}/{object}` format.
  string deployment_logs = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Details of the [Resources][]s in the deployment.
  repeated Resource resources = 8;

  // Previous deployment attempt metadata.
  DeploymentAttemptMetadata previous_attempt = 9;
}

// DeploymentAttemptMetadata represents a previous deployment attempt for an
// operation that failed due to a retryable error.
message DeploymentAttemptMetadata {
  // The sequential number of the attempt (starting from 1).
  int32 attempt = 1;

  // Human readable string that summarizes the deployment error issue.
  string error_detail = 2;

  // The build or execution ID associated with this specific attempt.
  // This can be used to link back to logs or trace information.
  string build = 3;
}
