option ruby_package = "Google::Cloud::DesignCenter::V1";
option (google.api.resource_definition) = {
  type: "iam.googleapis.com/Role"
  pattern: "organizations/{organization}/roles/{role}"
  pattern: "projects/{project}/roles/{role}"
