syntax = "proto3";

package google.cloud.designcenter.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/struct.proto";

option csharp_namespace = "Google.Cloud.DesignCenter.V1";
option go_package = "cloud.google.com/go/designcenter/apiv1/designcenterpb;designcenterpb";
option java_multiple_files = true;
option java_outer_classname = "ParametersProto";
option java_package = "com.google.cloud.designcenter.v1";
option php_namespace = "Google\\Cloud\\DesignCenter\\V1";
option ruby_package = "Google::Cloud::DesignCenter::V1";

// The details of an input/output variable: the variable and the component Uri.
// name.
message ComponentVariable {
  // Required. Name of the variable.
  string variable = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Component to which this variable belongs.
  string component_uri = 2 [(google.api.field_behavior) = REQUIRED];
}

// SaaS runtime context.
message SaaSRuntimeContext {
  // Optional. The SaaS names. Format for each SaaS:
  // projects/{project}/locations/{location}/saas/{saas}
  repeated string saas_names = 1 [(google.api.field_behavior) = OPTIONAL];
}

// Connection level parameters associated with each component within an
// application.
message ConnectionParameters {
  // Required. The name of the connection parameter.
  string connection = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. A list of parameters associated with the connection.
  repeated Parameter parameters = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Component parameter schema, which contains a list of all component
// parameters.
message ComponentParameterSchema {
  // Output only. The key of the parameter.
  string key = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The default value of the parameter.
  google.protobuf.Value default_value = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether the parameter is required.
  bool is_required = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The type of the parameter.
  string type = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Parameter resource.
message Parameter {
  // Required. The key of the parameter.
  string key = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The value of the parameter.
  google.protobuf.Value value = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Indicates if the parameter is read-only (driven by
  // expression).
  bool read_only = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Parameter values stored for a single cloud control of a policy.
message CloudControlConfig {
  // Required. Resource name of the cloud control that these parameter values
  // apply to. Format:
  // organizations/{organization}/locations/{location}/cloudControls/{cloud_control}
  // or projects/{project}/locations/{location}/cloudControls/{cloud_control}
  string cloud_control = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "cloudsecuritycompliance.googleapis.com/CloudControl"
    }
  ];

  // Optional. Parameter values for this specific control.
  repeated Parameter parameters = 2 [(google.api.field_behavior) = OPTIONAL];
}
