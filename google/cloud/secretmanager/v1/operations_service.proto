syntax = "proto3";

package google.cloud.secretmanager.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/cloud/secretmanager/v1/resources.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.SecretManager.V1";
option go_package = "cloud.google.com/go/secretmanager/apiv1/secretmanagerpb;secretmanagerpb";
option java_multiple_files = true;
option java_outer_classname = "OperationsServiceProto";
option java_package = "com.google.cloud.secretmanager.v1";
option objc_class_prefix = "GSM";
option php_namespace = "Google\\Cloud\\SecretManager\\V1";
option ruby_package = "Google::Cloud::SecretManager::V1";
option (google.api.resource_definition) = {
  type: "cloudkms.googleapis.com/CryptoKey"
  pattern: "projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{crypto_key}"
};

// Secret Operations Service
//
// Manages backups of secrets. Implements a REST model with the following
// objects:
//
// * [Backup][google.cloud.secretmanager.v1.Backup]
//
// Note: `SecretOperationsService` is a regional service and must be called
// using regional endpoints (`secretmanager.{location}.rep.googleapis.com`).
service SecretOperationsService {
  option (google.api.default_host) = "secretmanager.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/cloud-platform";

  // Lists Backups in a given project and location.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/backups"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of a single Backup.
  rpc GetBackup(GetBackupRequest) returns (Backup) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/backups/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a new Backup in a given project and location.
  rpc CreateBackup(CreateBackupRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/backups"
      body: "backup"
    };
    option (google.api.method_signature) = "parent,backup,backup_id";
    option (google.longrunning.operation_info) = {
      response_type: "Backup"
      metadata_type: "OperationMetadata"
    };
  }

  // Updates the parameters of a single Backup.
  rpc UpdateBackup(UpdateBackupRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{backup.name=projects/*/locations/*/backups/*}"
      body: "backup"
    };
    option (google.api.method_signature) = "backup,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "Backup"
      metadata_type: "OperationMetadata"
    };
  }

  // Deletes a single Backup.
  rpc DeleteBackup(DeleteBackupRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/backups/*}"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "OperationMetadata"
    };
  }

  // Restores a [Secret][google.cloud.secretmanager.v1.Secret] from the given
  // [Backup][google.cloud.secretmanager.v1.Backup]. This creates a *new*
  // [Secret][google.cloud.secretmanager.v1.Secret] resource. The LRO tracks the
  // restoration process, and the result of the LRO is the newly created Secret.
  rpc RestoreBackup(RestoreBackupRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/locations/*/backups/*}:restore"
      body: "*"
    };
    option (google.api.method_signature) =
        "name,destination_secret_parent,destination_secret_id";
    option (google.longrunning.operation_info) = {
      response_type: "google.cloud.secretmanager.v1.Secret"
      metadata_type: "OperationMetadata"
    };
  }
}

// Request message for
// [SecretOperationsService.ListBackups][google.cloud.secretmanager.v1.SecretOperationsService.ListBackups].
message ListBackupsRequest {
  // Required. The resource name of the location associated with the
  // [Backups][google.cloud.secretmanager.v1.Backup], in the format
  // `projects/{project}/locations/{location}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "secretmanager.googleapis.com/Backup"
    }
  ];

  // Optional. Maximum number of backups to return. The service may return fewer
  // than this value. If unspecified, at most 50 backups will be returned. The
  // maximum value is 1000; values above 1000 will be coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A token identifying a page of results the server should return.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filter expression to restrict the returned
  // [Backups][google.cloud.secretmanager.v1.Backup].
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Field specification for sorting the results in the response.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for
// [SecretOperationsService.ListBackups][google.cloud.secretmanager.v1.SecretOperationsService.ListBackups].
message ListBackupsResponse {
  // The list of [Backups][google.cloud.secretmanager.v1.Backup] in the
  // location.
  repeated Backup backups = 1;

  // A token identifying a page of results the server should return.
  string next_page_token = 2;

  // Unordered list. Resource names of the unreachable locations.
  // Format: `projects/{project}/locations/{location}`
  repeated string unreachable = 3
      [(google.api.field_behavior) = UNORDERED_LIST];
}

// Request message for
// [SecretOperationsService.GetBackup][google.cloud.secretmanager.v1.SecretOperationsService.GetBackup].
message GetBackupRequest {
  // Required. The resource name of the
  // [Backup][google.cloud.secretmanager.v1.Backup], in the format
  // `projects/{project}/locations/{location}/backups/{backup}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "secretmanager.googleapis.com/Backup"
    }
  ];
}

// Request message for
// [SecretOperationsService.CreateBackup][google.cloud.secretmanager.v1.SecretOperationsService.CreateBackup].
message CreateBackupRequest {
  // Required. The resource name of the location where the
  // [Backup][google.cloud.secretmanager.v1.Backup] will be created, in the
  // format `projects/{project}/locations/{location}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "secretmanager.googleapis.com/Backup"
    }
  ];

  // Required. The ID to use for the backup, which will become the final
  // component of the backup's resource name.
  string backup_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The [Backup][google.cloud.secretmanager.v1.Backup] resource to
  // create.
  Backup backup = 3 [(google.api.field_behavior) = REQUIRED];
}

// Request message for
// [SecretOperationsService.UpdateBackup][google.cloud.secretmanager.v1.SecretOperationsService.UpdateBackup].
message UpdateBackupRequest {
  // Optional. Field mask is used to specify the fields to be overwritten in the
  // [Backup][google.cloud.secretmanager.v1.Backup] resource by the update.
  // The fields specified in the `update_mask` are relative to the resource, not
  // the full request. A field will be overwritten if it is in the mask. If the
  // user does not provide a mask then all fields present in the request will be
  // overwritten.
  google.protobuf.FieldMask update_mask = 1
      [(google.api.field_behavior) = OPTIONAL];

  // Required. The [Backup][google.cloud.secretmanager.v1.Backup] resource with
  // updated fields.
  Backup backup = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for
// [SecretOperationsService.DeleteBackup][google.cloud.secretmanager.v1.SecretOperationsService.DeleteBackup].
message DeleteBackupRequest {
  // Required. The resource name of the
  // [Backup][google.cloud.secretmanager.v1.Backup] to delete, in the format
  // `projects/{project}/locations/{location}/backups/{backup}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "secretmanager.googleapis.com/Backup"
    }
  ];

  // Optional. If set, the request will only succeed if it matches the etag of
  // the currently stored [Backup][google.cloud.secretmanager.v1.Backup].
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for
// [SecretOperationsService.RestoreBackup][google.cloud.secretmanager.v1.SecretOperationsService.RestoreBackup].
message RestoreBackupRequest {
  // Required. The resource name of the
  // [Backup][google.cloud.secretmanager.v1.Backup] to restore from. Format:
  // `projects/{project}/locations/{location}/backups/{backup}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "secretmanager.googleapis.com/Backup"
    }
  ];

  // Required. Parent of the new [Secret][google.cloud.secretmanager.v1.Secret]
  // to be created from this backup. Formats:
  // - `projects/{project}/locations/{location}` (for regional secrets)
  // - `projects/{project}` (for global secrets)
  string destination_secret_parent = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "secretmanager.googleapis.com/Secret"
    }
  ];

  // Required. ID of the new [Secret][google.cloud.secretmanager.v1.Secret] to
  // be created from this backup. This must be unique within the project.
  //
  // A secret ID is a string with a maximum length of 255 characters and can
  // contain uppercase and lowercase letters, numerals, and the hyphen (`-`)
  // and underscore (`_`) characters.
  string destination_secret_id = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. The resource name of the Cloud KMS CryptoKey to be used to
  // encrypt the [Secret][google.cloud.secretmanager.v1.Secret].
  // Format:
  // `projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{crypto_key}`
  string kms_key_name = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {
      type: "cloudkms.googleapis.com/CryptoKey"
    }
  ];
}

// Represents the metadata of the long-running operation.
message OperationMetadata {
  // Represents progress information for operations involving multiple secret
  // versions.
  message Progress {
    // Output only. Provides the total number of secret versions to be processed
    // by the operation.
    int32 total_version_count = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Number of secret versions that have been successfully
    // processed so far.
    int32 completed_version_count = 2
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Number of secret versions that failed to process.
    int32 failed_version_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Output only. Time the operation was created.
  google.protobuf.Timestamp create_time = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Time the operation finished running.
  google.protobuf.Timestamp end_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Server-defined resource path for the target of the operation.
  string target = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Name of the verb executed by the operation.
  string verb = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Human-readable status of the operation, if any.
  string status_message = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Identifies whether the user has requested cancellation
  // of the operation. Operations that have been cancelled successfully
  // have
  // [google.longrunning.Operation.error][google.longrunning.Operation.error]
  // value with a [google.rpc.Status.code][google.rpc.Status.code] of `1`,
  // corresponding to `Code.CANCELLED`.
  bool requested_cancellation = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. API version used to start the operation.
  string api_version = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Represents the progress of the operation. This field is
  // populated for operations that involve processing multiple secret versions.
  Progress progress = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A Backup of a Secret.
// Backups are regional resources.
message Backup {
  option (google.api.resource) = {
    type: "secretmanager.googleapis.com/Backup"
    pattern: "projects/{project}/locations/{location}/backups/{backup}"
    plural: "backups"
    singular: "backup"
  };

  // Enum representing the state of the
  // [Backup][google.cloud.secretmanager.v1.Backup].
  enum State {
    // Backup state is unspecified.
    STATE_UNSPECIFIED = 0;

    // The backup is being created.
    CREATING = 1;

    // The backup is active and can be used.
    ACTIVE = 2;

    // The backup is being updated.
    UPDATING = 3;

    // The backup creation or update failed.
    FAILED = 4;
  }

  // Identifier. Resource name of the backup.
  // Format: `projects/{project}/locations/{location}/backups/{backup}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. Immutable. Resource name of the
  // [Secret][google.cloud.secretmanager.v1.Secret] that this backup is for. The
  // source [Secret][google.cloud.secretmanager.v1.Secret] can be in a different
  // region than the [Backup][google.cloud.secretmanager.v1.Backup]. This field
  // is immutable after creation. Formats:
  // - `projects/{project}/locations/{location}/secrets/{secret}` (for regional
  // secrets)
  // - `projects/{project}/secrets/{secret}` (for global secrets)
  string source_secret = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference) = {
      type: "secretmanager.googleapis.com/Secret"
    }
  ];

  // Output only. Time at which the backup resource was created.
  google.protobuf.Timestamp create_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Time at which the backup resource was last updated.
  google.protobuf.Timestamp update_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Creation time of the source
  // [Secret][google.cloud.secretmanager.v1.Secret] at the moment the backup was
  // initiated.
  google.protobuf.Timestamp source_secret_create_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Number of non-destroyed secret versions contained in this
  // backup.
  int32 version_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Labels with user-defined metadata.
  map<string, string> labels = 7 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Current state of the Backup.
  State state = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Used for optimistic concurrency control as a way to help prevent
  // simultaneous updates of a backup from overwriting each other.
  string etag = 11 [(google.api.field_behavior) = OPTIONAL];
}
