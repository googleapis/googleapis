syntax = "proto3";

package google.cloud.agentregistry.v1;

import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.AgentRegistry.V1";
option go_package = "cloud.google.com/go/agentregistry/apiv1/agentregistrypb;agentregistrypb";
option java_multiple_files = true;
option java_outer_classname = "SkillProto";
option java_package = "com.google.cloud.agentregistry.v1";
option php_namespace = "Google\\Cloud\\AgentRegistry\\V1";
option ruby_package = "Google::Cloud::AgentRegistry::V1";

// Represents an Executable Agent Skill or a Composite Tool Suite (Bundle).
// Sibling resource with Agent and McpServer under agentregistry.googleapis.com.
message Skill {
  option (google.api.resource) = {
    type: "agentregistry.googleapis.com/Skill"
    pattern: "projects/{project}/locations/{location}/skills/{skill}"
    plural: "skills"
    singular: "skill"
  };

  // The structural type of the Skill.
  enum Type {
    // Default value. This value is unused.
    TYPE_UNSPECIFIED = 0;

    // A standard, leaf executable skill containing natural language and code.
    SIMPLE = 1;
  }

  // System-managed state.
  enum State {
    // Default value. This value is unused.
    STATE_UNSPECIFIED = 0;

    // The skill is being created. It is not served.
    STATE_CREATING = 1;

    // The skill is in draft, or lacks a valid payload. It is not served.
    STATE_DRAFT = 2;

    // The skill is active and is served.
    STATE_ACTIVE = 3;

    // The skill is disabled and is not served.
    STATE_DISABLED = 4;

    // The skill is deprecated. It is served, but emits warnings.
    STATE_DEPRECATED = 5;

    // The skill is decommissioned and is not served.
    STATE_DECOMMISSIONED = 6;

    // The skill is being deleted. It is not served.
    STATE_DELETING = 7;
  }

  // User-configurable target state.
  enum TargetState {
    // Default value. This value is unused.
    TARGET_STATE_UNSPECIFIED = 0;

    // The skill is in draft and cannot be served.
    TARGET_STATE_DRAFT = 1;

    // The skill is active and can be served.
    TARGET_STATE_ACTIVE = 2;

    // The skill is disabled and cannot be served.
    TARGET_STATE_DISABLED = 3;

    // The skill is deprecated. It can still be served, but emits warnings.
    TARGET_STATE_DEPRECATED = 4;

    // The skill is decommissioned and cannot be served.
    TARGET_STATE_DECOMMISSIONED = 5;
  }

  // Identifier. Resource name of the Skill.
  // Format: `projects/{project}/locations/{location}/skills/{skill}`
  // The `{skill}` segment acts as the resource ID. If the skill is associated
  // with a Publisher, this segment typically uses a hyphenated namespace prefix
  // corresponding to the publisher (e.g., `google-workspace-create-docs`).
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. Universally unique identifier (UUID4) for the logical
  // container.
  string uid = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Optional. Human-readable display name of the skill.
  // Maximum length is 128 characters.
  string display_name = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Brief summary describing the capabilities of the skill.
  // Maximum length is 2048 characters.
  string description = 4 [(google.api.field_behavior) = OPTIONAL];

  // Required. Structural deployment type (SIMPLE leaf vs COMPOSITE bundle).
  Type type = 5 [(google.api.field_behavior) = REQUIRED];

  // Output only. The system-managed state of the skill.
  State state = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. User-managed target state of the skill.
  TargetState target_state = 7 [(google.api.field_behavior) = REQUIRED];

  // Optional. The full resource name of the revision currently served by
  // default (floating track).
  // Format:
  // `projects/{project}/locations/{location}/skills/{skill}/revisions/{revision}`
  string default_revision = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {
      type: "agentregistry.googleapis.com/SkillRevision"
    }
  ];

  // Output only. Lightweight frontmatter metadata attributes copied from the
  // default revision.
  Frontmatter frontmatter = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A stable, globally unique logical identifier for the skill.
  // It is securely constructed by the backend by combining the associated
  // `publisher`'s verified namespace and the skill's resource ID to enforce
  // strict ownership. For example, the prefix `google-` is reserved exclusively
  // for first-party Google publishers to prevent namespace squatting.
  // Example: `urn:skill:google-workspace:create-docs`
  string skill_id = 17 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Create time.
  google.protobuf.Timestamp create_time = 11
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Update time.
  google.protobuf.Timestamp update_time = 12
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The publisher resource associated with this skill.
  // Format: `projects/{project}/locations/{location}/publishers/{publisher}`
  // The publisher dictates the allowed namespace prefixes for the skill's name
  // and logical `skill_id` (e.g., Publisher `google` authorizes the `google-*`
  // prefix).
  string publisher = 15 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {
      type: "agentregistry.googleapis.com/Publisher"
    }
  ];

  // Optional. Input only. Optional nested initial revision payload to support
  // standard one-shot creation. The server processes this field on input during
  // creation but must never return it in responses.
  SkillRevision initial_revision = 14 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = INPUT_ONLY
  ];

  // Optional. Optional. Scanning configuration for the skill.
  ScanningConfig scanning_config = 20 [(google.api.field_behavior) = OPTIONAL];
}

// Configuration for scanning of the skill.
message ScanningConfig {
  // Defines the policy for security scanning.
  //
  // This enum is not frozen; new values may be added in the future.
  enum Policy {
    // Default value. Inherits system default (ENABLED_BLOCKING).
    POLICY_UNSPECIFIED = 0;

    // Bypasses scanning.
    DISABLED = 1;

    // Scans the skill package and blocks download if security or safety issues
    // are found.
    ENABLED_BLOCKING = 2;

    // Scans the skill package in audit mode without blocking downloads.
    ENABLED_NONBLOCKING = 3;
  }

  // Optional. The security scanning policy.
  Policy policy = 1 [(google.api.field_behavior) = OPTIONAL];
}

// Structured metadata attributes extracted from the package's local SKILL.md
// frontmatter.
message Frontmatter {
  // Required. The name of the skill.
  string name = 5 [(google.api.field_behavior) = REQUIRED];

  // Required. Functional description.
  string description = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. License.
  string license = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Environmental dependencies or companion services.
  string compatibility = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Extensible flattened map mapping custom tags, authors, and
  // version parameters.
  map<string, string> metadata = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Direct write-only raw archive payload upload.
message ArchiveUploadSource {
  // Required. Input only. Write-only raw ZIP/TAR archive payload bytes
  // containing the skill package.
  bytes archive_content = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];
}

// Represents an immutable, versioned snapshot of a Skill package.
message SkillRevision {
  option (google.api.resource) = {
    type: "agentregistry.googleapis.com/SkillRevision"
    pattern: "projects/{project}/locations/{location}/skills/{skill}/revisions/{revision}"
    plural: "skillRevisions"
    singular: "skillRevision"
  };

  // Scan result of the skill revision.
  message ScanResult {
    // Represents the lifecycle state of the vulnerability scan.
    enum ScanState {
      // Should not be used.
      SCAN_STATE_UNSPECIFIED = 0;

      // The underlying scanning system failed to execute the scan.
      FAILED = 1;

      // The uploaded artifact format is unsupported by the scanning system.
      UNSUPPORTED_FORMAT = 2;

      // The scan has completed successfully.
      SUCCEEDED = 3;

      // The scan was disabled.
      DISABLED = 4;

      // The scan is running.
      RUNNING = 5;
    }

    // Output only. The state of the vulnerability check.
    ScanState scan_state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The time when the scan was completed.
    google.protobuf.Timestamp scan_time = 2
        [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The error message if the scan failed.
    string error_message = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The finding resource names for the skill revision.
    repeated string findings = 4 [
      (google.api.field_behavior) = OUTPUT_ONLY,
      (google.api.resource_reference) = {
        type: "agentregistry.googleapis.com/Finding"
      }
    ];
  }

  // System-managed computed state.
  enum State {
    // Default value. This value is unused.
    STATE_UNSPECIFIED = 0;

    // The revision is being created.
    CREATING = 1;

    // The revision is active.
    ACTIVE = 2;

    // The revision failed to compile or ingest.
    FAILED = 3;

    // The revision is being deleted.
    DELETING = 4;
  }

  // Output only. The storage location pointer.
  // In standard listing, the raw zip bytes are completely excluded.
  // They are streamed separately via a dedicated GetSkillRevision request with
  // `?alt=media`.
  // The physical source pointing to the executable payload.
  // Exactly one source must be provided during creation; otherwise, the
  // server will return an `INVALID_ARGUMENT` error.
  //
  // Size constraints:
  // - Maximum compressed ZIP size: 500 KB
  // - Maximum total uncompressed size: 10 MB
  // - Maximum individual uncompressed file size: 1 MB
  oneof source {
    // Optional. Immutable. Cloud Storage object generation URI.
    GcsSource gcs_source = 9 [
      (google.api.field_behavior) = IMMUTABLE,
      (google.api.field_behavior) = OPTIONAL
    ];

    // Optional. Immutable. Direct write-only raw archive upload source.
    ArchiveUploadSource archive_upload_source = 12 [
      (google.api.field_behavior) = IMMUTABLE,
      (google.api.field_behavior) = OPTIONAL
    ];
  }

  // Identifier. Resource name of the SkillRevision.
  // Format:
  // `projects/{project}/locations/{location}/skills/{skill}/revisions/{revision}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The system-managed lifecycle state of this revision.
  State state = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Cryptographic SHA-256 integrity and deduplication digest of
  // the payload zip.
  string sha256_hash = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Extracted YAML frontmatter configuration snapshot.
  Frontmatter frontmatter = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Revision creation timestamp.
  google.protobuf.Timestamp create_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Size of the compiled zip payload in bytes (assists client
  // download progress).
  int64 size_bytes = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Universally unique identifier (UUID4) for the skill revision.
  string uid = 14 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Output only. Scan result of the skill revision.
  ScanResult scan_result = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Specifications for Cloud Storage objects.
message GcsSource {
  // Required. Cloud Storage object URI.
  // Format:
  // `gs://{bucket_name}/{object_name}`
  string uri = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Cloud Storage object generation ID. If not specified, the latest
  // generation is used.
  int64 generation = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Represents a verified Publisher of Skills.
// Prepopulated publishers include `publishers/cloud.google.com` and
// `publishers/workspace.google.com`.
message Publisher {
  option (google.api.resource) = {
    type: "agentregistry.googleapis.com/Publisher"
    pattern: "projects/{project}/locations/{location}/publishers/{publisher}"
    plural: "publishers"
    singular: "publisher"
  };

  // Curation tier representing the publisher's level of verification.
  enum PublisherTier {
    // Default value. Unspecified.
    PUBLISHER_TIER_UNSPECIFIED = 0;

    // First-party Google-curated and verified global publishers.
    FIRST_PARTY = 1;

    // Third-party verified enterprise partner publishers.
    THIRD_PARTY = 2;

    // Private publishers within the developer's workspace/project.
    PRIVATE = 3;
  }

  // Identifier. Resource name of the publisher.
  // Format: `projects/{project}/locations/{location}/publishers/{publisher}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. The verified prefix (e.g. "snowflake-", "google-") associated
  // with this publisher. The system uses this prefix to enforce name-squatting
  // rules during Skill registration. Must be globally unique across all
  // publishers.
  string verified_prefix = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. Human readable display name of the publisher.
  string display_name = 3 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The curation tier of the publisher.
  PublisherTier publisher_tier = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. URI pointing to official publisher documentation.
  string documentation_uri = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. URI pointing to the support portal or email.
  string support_uri = 6 [(google.api.field_behavior) = OPTIONAL];
}
