syntax = "proto3";

package google.cloud.agentregistry.v1;

import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.AgentRegistry.V1";
option go_package = "cloud.google.com/go/agentregistry/apiv1/agentregistrypb;agentregistrypb";
option java_multiple_files = true;
option java_outer_classname = "FindingProto";
option java_package = "com.google.cloud.agentregistry.v1";
option php_namespace = "Google\\Cloud\\AgentRegistry\\V1";
option ruby_package = "Google::Cloud::AgentRegistry::V1";

// The severity of the finding.
enum Severity {
  // This value is used for findings when a source doesn't write a severity
  // value.
  SEVERITY_UNSPECIFIED = 0;

  // Critical severity.
  SEVERITY_CRITICAL = 1;

  // High severity.
  SEVERITY_HIGH = 2;

  // Medium severity.
  SEVERITY_MEDIUM = 3;

  // Low severity.
  SEVERITY_LOW = 4;
}

// Represents a security Finding.
message Finding {
  option (google.api.resource) = {
    type: "agentregistry.googleapis.com/Finding"
    pattern: "projects/{project}/locations/{location}/findings/{finding}"
    plural: "findings"
    singular: "finding"
  };

  // File location of the finding.
  message File {
    // Optional. Relative path of the file containing the finding.
    string path = 1 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Line number (1-based), or 0 if whole File / unknown.
    int64 line_number = 2 [(google.api.field_behavior) = OPTIONAL];
  }

  // Represents what kind of Finding it is.
  // For more information on finding classes, see
  // https://cloud.google.com/security-command-center/docs/concepts-vulnerabilities-findings#classes.
  enum FindingClass {
    // Unspecified finding class.
    FINDING_CLASS_UNSPECIFIED = 0;

    // Describes a potential weakness in software that increases risk to
    // Confidentiality & Integrity & Availability.
    VULNERABILITY = 1;

    // Describes a potential security risk due to plaintext credentials,
    // keys, or tokens being exposed in an asset or workload.
    SECRET = 3;
  }

  // Identifier. Resource name of the Finding.
  // Format: `projects/{project}/locations/{location}/findings/{finding}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. Universally unique identifier (UUID4) for the Finding.
  string uid = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Output only. Create time.
  google.protobuf.Timestamp create_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Update time.
  google.protobuf.Timestamp update_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Severity of the finding.
  Severity severity = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Class of the finding.
  FindingClass finding_class = 7 [(google.api.field_behavior) = OPTIONAL];

  // Optional. File associated with the finding.
  repeated File files = 8 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Detailed description of the finding.
  string detail = 10 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The resource that the finding is associated with.
  string resource = 11 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = { type: "*" }
  ];
}
