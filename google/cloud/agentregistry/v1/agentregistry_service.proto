syntax = "proto3";

package google.cloud.agentregistry.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/cloud/agentregistry/v1/agent.proto";
import "google/cloud/agentregistry/v1/ai_application.proto";
import "google/cloud/agentregistry/v1/binding.proto";
import "google/cloud/agentregistry/v1/endpoint.proto";
import "google/cloud/agentregistry/v1/finding.proto";
import "google/cloud/agentregistry/v1/mcp_server.proto";
import "google/cloud/agentregistry/v1/service.proto";
import "google/cloud/agentregistry/v1/skill.proto";
import "google/cloud/agentregistry/v1/skill_encryption_spec.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.AgentRegistry.V1";
option go_package = "cloud.google.com/go/agentregistry/apiv1/agentregistrypb;agentregistrypb";
option java_multiple_files = true;
option java_outer_classname = "AgentRegistryServiceProto";
option java_package = "com.google.cloud.agentregistry.v1";
option php_namespace = "Google\\Cloud\\AgentRegistry\\V1";
option ruby_package = "Google::Cloud::AgentRegistry::V1";

// Service for managing Agent Registry resources.
service AgentRegistry {
  option (google.api.default_host) = "agentregistry.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/agentregistry.read-only,"
      "https://www.googleapis.com/auth/agentregistry.read-write,"
      "https://www.googleapis.com/auth/cloud-platform,"
      "https://www.googleapis.com/auth/cloud-platform.read-only";

  // Lists Agents in a given project and location.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/agents"
    };
    option (google.api.method_signature) = "parent";
  }

  // Searches Agents in a given project and location.
  rpc SearchAgents(SearchAgentsRequest) returns (SearchAgentsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/agents:search"
      body: "*"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of a single Agent.
  rpc GetAgent(GetAgentRequest) returns (Agent) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/agents/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists Endpoints in a given project and location.
  rpc ListEndpoints(ListEndpointsRequest) returns (ListEndpointsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/endpoints"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of a single Endpoint.
  rpc GetEndpoint(GetEndpointRequest) returns (Endpoint) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/endpoints/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists McpServers in a given project and location.
  rpc ListMcpServers(ListMcpServersRequest) returns (ListMcpServersResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/mcpServers"
    };
    option (google.api.method_signature) = "parent";
  }

  // Searches McpServers in a given project and location.
  rpc SearchMcpServers(SearchMcpServersRequest)
      returns (SearchMcpServersResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/mcpServers:search"
      body: "*"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of a single McpServer.
  rpc GetMcpServer(GetMcpServerRequest) returns (McpServer) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/mcpServers/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists Services in a given project and location.
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/services"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of a single Service.
  rpc GetService(GetServiceRequest) returns (Service) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/services/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a new Service in a given project and location.
  rpc CreateService(CreateServiceRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/services"
      body: "service"
    };
    option (google.api.method_signature) = "parent,service,service_id";
    option (google.longrunning.operation_info) = {
      response_type: "Service"
      metadata_type: "OperationMetadata"
    };
  }

  // Updates the parameters of a single Service.
  rpc UpdateService(UpdateServiceRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{service.name=projects/*/locations/*/services/*}"
      body: "service"
    };
    option (google.api.method_signature) = "service,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "Service"
      metadata_type: "OperationMetadata"
    };
  }

  // Deletes a single Service.
  rpc DeleteService(DeleteServiceRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/services/*}"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "OperationMetadata"
    };
  }

  // Lists Bindings in a given project and location.
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/bindings"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of a single Binding.
  rpc GetBinding(GetBindingRequest) returns (Binding) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/bindings/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Creates a new Binding in a given project and location.
  rpc CreateBinding(CreateBindingRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/bindings"
      body: "binding"
    };
    option (google.api.method_signature) = "parent,binding,binding_id";
    option (google.longrunning.operation_info) = {
      response_type: "Binding"
      metadata_type: "OperationMetadata"
    };
  }

  // Updates the parameters of a single Binding.
  rpc UpdateBinding(UpdateBindingRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{binding.name=projects/*/locations/*/bindings/*}"
      body: "binding"
    };
    option (google.api.method_signature) = "binding,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "Binding"
      metadata_type: "OperationMetadata"
    };
  }

  // Deletes a single Binding.
  rpc DeleteBinding(DeleteBindingRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/bindings/*}"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "OperationMetadata"
    };
  }

  // Fetches available Bindings.
  rpc FetchAvailableBindings(FetchAvailableBindingsRequest)
      returns (FetchAvailableBindingsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/bindings:fetchAvailable"
    };
    option (google.api.method_signature) = "parent";
  }

  // =========================================================================
  // # Skills Collection APIs
  //
  // Creates a Skill resource container, optionally publishing the initial
  // SkillRevision inline in a single, atomic CRUD roundtrip.
  rpc CreateSkill(CreateSkillRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/skills"
      body: "skill"
    };
    option (google.api.method_signature) = "parent,skill,skill_id";
    option (google.longrunning.operation_info) = {
      response_type: "Skill"
      metadata_type: "OperationMetadata"
    };
  }

  // Fetches the active configuration and metadata of a Skill.
  rpc GetSkill(GetSkillRequest) returns (Skill) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/skills/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Updates Skill metadata or overrides active pointers/state using REST
  // standard PATCH.
  rpc UpdateSkill(UpdateSkillRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{skill.name=projects/*/locations/*/skills/*}"
      body: "skill"
    };
    option (google.api.method_signature) = "skill,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "Skill"
      metadata_type: "OperationMetadata"
    };
  }

  // Deletes a Skill container along with all its revisions.
  rpc DeleteSkill(DeleteSkillRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/skills/*}"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "OperationMetadata"
    };
  }

  // Lists logical Skills available in a project.
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/skills"
    };
    option (google.api.method_signature) = "parent";
  }

  // Custom deep-search method to filter by frontmatter or query SKILL.md text
  // blobs.
  rpc SearchSkills(SearchSkillsRequest) returns (SearchSkillsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*}/skills:search"
      body: "*"
      additional_bindings {
        get: "/v1/{parent=projects/*/locations/*}/skills:search"
      }
    };
  }

  // Creates a new immutable revision and triggers validation pipelines.
  rpc CreateSkillRevision(CreateSkillRevisionRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/locations/*/skills/*}/revisions"
      body: "skill_revision"
    };
    option (google.api.method_signature) =
        "parent,skill_revision,skill_revision_id";
    option (google.longrunning.operation_info) = {
      response_type: "SkillRevision"
      metadata_type: "OperationMetadata"
    };
  }

  // Gets details of a single immutable Revision.
  rpc GetSkillRevision(GetSkillRevisionRequest) returns (SkillRevision) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/skills/*/revisions/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Deletes a specific revision (restricted to admins to purge accidentally
  // committed secrets).
  rpc DeleteSkillRevision(DeleteSkillRevisionRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      delete: "/v1/{name=projects/*/locations/*/skills/*/revisions/*}"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "OperationMetadata"
    };
  }

  // Lists all revisions belonging to a parent Skill.
  rpc ListSkillRevisions(ListSkillRevisionsRequest)
      returns (ListSkillRevisionsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/skills/*}/revisions"
    };
    option (google.api.method_signature) = "parent";
  }

  // Fetches details of a specific Publisher.
  rpc GetPublisher(GetPublisherRequest) returns (Publisher) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/publishers/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists all Publishers in a location.
  rpc ListPublishers(ListPublishersRequest) returns (ListPublishersResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/publishers"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of a single AI Application.
  rpc GetAiApplication(GetAiApplicationRequest) returns (AiApplication) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/aiApplications/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists AI Applications in a given project and location.
  rpc ListAiApplications(ListAiApplicationsRequest)
      returns (ListAiApplicationsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/aiApplications"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of a single Agent under an AI Application.
  rpc GetAiApplicationAgent(GetAiApplicationAgentRequest) returns (Agent) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/aiApplications/*/agents/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists Agents under an AI Application.
  rpc ListAiApplicationAgents(ListAiApplicationAgentsRequest)
      returns (ListAiApplicationAgentsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/aiApplications/*}/agents"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of a single McpServer under an AI Application.
  rpc GetAiApplicationMcpServer(GetAiApplicationMcpServerRequest)
      returns (McpServer) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/aiApplications/*/mcpServers/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists McpServers under an AI Application.
  rpc ListAiApplicationMcpServers(ListAiApplicationMcpServersRequest)
      returns (ListAiApplicationMcpServersResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/aiApplications/*}/mcpServers"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of a single Finding.
  rpc GetFinding(GetFindingRequest) returns (Finding) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/findings/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists Findings in a given project and location.
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*}/findings"
    };
    option (google.api.method_signature) = "parent";
  }

  // Gets details of a single Endpoint under an AI Application.
  rpc GetAiApplicationEndpoint(GetAiApplicationEndpointRequest)
      returns (Endpoint) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/aiApplications/*/endpoints/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists Endpoints under an AI Application.
  rpc ListAiApplicationEndpoints(ListAiApplicationEndpointsRequest)
      returns (ListAiApplicationEndpointsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=projects/*/locations/*/aiApplications/*}/endpoints"
    };
    option (google.api.method_signature) = "parent";
  }

  // =========================================================================
  // # Skill Encryption Spec Service Methods
  //
  // Gets the customer-managed encryption key (CMEK) configuration for Skills in
  // a specific project and location.
  rpc GetSkillEncryptionSpec(GetSkillEncryptionSpecRequest)
      returns (SkillEncryptionSpec) {
    option (google.api.http) = {
      get: "/v1/{name=projects/*/locations/*/skillEncryptionSpec}"
    };
    option (google.api.method_signature) = "name";
  }

  // Updates the customer-managed encryption key (CMEK) configuration for Skills
  // in a specific project and location.
  //
  // This method is only allowed when no Skills exist in the target project and
  // location. If any Skill already exists in the location, the request fails
  // with `FAILED_PRECONDITION`.
  rpc UpdateSkillEncryptionSpec(UpdateSkillEncryptionSpecRequest)
      returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{skill_encryption_spec.name=projects/*/locations/*/skillEncryptionSpec}"
      body: "skill_encryption_spec"
    };
    option (google.api.method_signature) = "skill_encryption_spec,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "SkillEncryptionSpec"
      metadata_type: "OperationMetadata"
    };
  }
}

// The type of search to perform. Additional search types may be supported in
// the future.
enum SearchType {
  // Invalid search type.
  SEARCH_TYPE_UNSPECIFIED = 0;

  // Search for a keyword across all searchable fields.
  KEYWORD = 1;

  // Search based on the meaning and intent of a natural language query.
  SEMANTIC = 2;
}

// Message for requesting list of Agents
message ListAgentsRequest {
  // Required. Parent value for ListAgentsRequest
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "locations.googleapis.com/Location"
    }
  ];

  // Optional. Requested page size. Server may return fewer items than
  // requested. If unspecified, server will pick an appropriate default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A token identifying a page of results the server should return.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filtering results
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Hint for how to order the results
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Message for response to listing Agents
message ListAgentsResponse {
  // The list of Agents.
  repeated Agent agents = 1;

  // A token identifying a page of results the server should return.
  string next_page_token = 2;
}

// Message for searching Agents
message SearchAgentsRequest {
  // Required. Parent value for SearchAgentsRequest. Format:
  // `projects/{project}/locations/{location}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "locations.googleapis.com/Location"
    }
  ];

  // Optional. Search criteria used to select the Agents to return. If no search
  // criteria is specified then all accessible Agents will be returned.
  //
  // Search expressions can be used to restrict results based upon searchable
  // fields, where the operators can be used along with the suffix wildcard
  // symbol `*`. See
  // [instructions](https://docs.cloud.google.com/agent-registry/search-agents-and-tools)
  // for more details.
  //
  // Allowed operators: `=`, `:`, `NOT`, `AND`, `OR`, and `()`.
  //
  // Searchable fields:
  //
  // | Field              | `=` | `:` | `*` | Keyword Search |
  // |--------------------|-----|-----|-----|----------------|
  // | agentId            | Yes | Yes | Yes | Included       |
  // | name               | No  | Yes | Yes | Included       |
  // | displayName        | No  | Yes | Yes | Included       |
  // | description        | No  | Yes | No  | Included       |
  // | skills             | No  | Yes | No  | Included       |
  // | skills.id          | No  | Yes | No  | Included       |
  // | skills.name        | No  | Yes | No  | Included       |
  // | skills.description | No  | Yes | No  | Included       |
  // | skills.tags        | No  | Yes | No  | Included       |
  // | skills.examples    | No  | Yes | No  | Included       |
  //
  // Examples:
  //
  // * `agentId="urn:agent:projects-123:projects:123:locations:us-central1:aiplatform:reasoningEngines:1234"`
  //   to find the agent with the specified agent ID.
  // * `name:important` to find agents whose name contains `important` as a
  //   word.
  // * `displayName:works*` to find agents whose display name contains words
  //   that start with `works`.
  // * `skills.tags:test` to find agents whose skills tags contain `test`.
  // * `planner OR booking` to find agents whose metadata contains the words
  //   `planner` or `booking`.
  string search_string = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The maximum number of search results to return per page. The page
  // size is capped at `100`, even if a larger value is specified. A negative
  // value will result in an `INVALID_ARGUMENT` error. If unspecified or set to
  // `0`, a default value of `20` will be used. The server may return fewer
  // results than requested.
  int32 page_size = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If present, retrieve the next batch of results from the preceding
  // call to this method. `page_token` must be the value of `next_page_token`
  // from the previous response. The values of all other method parameters, must
  // be identical to those in the previous call.
  string page_token = 7 [(google.api.field_behavior) = OPTIONAL];
}

// Message for response to searching Agents
message SearchAgentsResponse {
  // A list of Agents that match the `search_string`.
  repeated Agent agents = 1;

  // If there are more results than those appearing in this response, then
  // `next_page_token` is included. To get the next set of results, call this
  // method again using the value of `next_page_token` as `page_token`.
  string next_page_token = 2;
}

// Message for getting a Agent
message GetAgentRequest {
  // Required. Name of the resource
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "agentregistry.googleapis.com/Agent"
    }
  ];
}

// Message for getting an Agent under an AI Application.
message GetAiApplicationAgentRequest {
  // Required. Name of the resource.
  // Format:
  // `projects/{project}/locations/{location}/aiApplications/{ai_application}/agents/{agent}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "agentregistry.googleapis.com/Agent"
    }
  ];
}

// Message for requesting list of Agents under an AI Application.
message ListAiApplicationAgentsRequest {
  // Required. Parent value (AI Application) for ListAiApplicationAgentsRequest.
  // Format:
  // `projects/{project}/locations/{location}/aiApplications/{ai_application}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "agentregistry.googleapis.com/AiApplication"
    }
  ];

  // Optional. Requested page size. Server may return fewer items than
  // requested. If unspecified, server will pick an appropriate default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A token identifying a page of results the server should return.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Message for response to listing Agents under an AI Application.
message ListAiApplicationAgentsResponse {
  // The list of Agents.
  repeated Agent agents = 1;

  // A token identifying a page of results the server should return.
  string next_page_token = 2;
}

// Message for requesting list of Endpoints
message ListEndpointsRequest {
  // Required. The project and location to list endpoints in.
  // Expected format: `projects/{project}/locations/{location}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "locations.googleapis.com/Location"
    }
  ];

  // Optional. Requested page size. Server may return fewer items than
  // requested. If unspecified, server will pick an appropriate default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A token identifying a page of results the server should return.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A query string used to filter the list of endpoints returned.
  // The filter expression must follow AIP-160 syntax.
  //
  // Filtering is supported on the `name`, `display_name`, `description`,
  // `version`, and `interfaces` fields.
  //
  // Some examples:
  //
  //   * `name = "projects/p1/locations/l1/endpoints/e1"`
