syntax = "proto3";

package google.cloud.agentregistry.v1;

import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/cloud/apphub/v1/application.proto";
import "google/cloud/apphub/v1/attributes.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Cloud.AgentRegistry.V1";
option go_package = "cloud.google.com/go/agentregistry/apiv1/agentregistrypb;agentregistrypb";
option java_multiple_files = true;
option java_outer_classname = "AiApplicationProto";
option java_package = "com.google.cloud.agentregistry.v1";
option php_namespace = "Google\\Cloud\\AgentRegistry\\V1";
option ruby_package = "Google::Cloud::AgentRegistry::V1";

// Represents an AI Application.
message AiApplication {
  option (google.api.resource) = {
    type: "agentregistry.googleapis.com/AiApplication"
    pattern: "projects/{project}/locations/{location}/aiApplications/{ai_application}"
    plural: "aiApplications"
    singular: "aiApplication"
  };

  // The lifecycle states of an AI Application.
  enum State {
    // Default value. This value is unused.
    STATE_UNSPECIFIED = 0;

    // The resource is being provisioned or created.
    CREATING = 1;

    // The resource is active and ready for use.
    ACTIVE = 2;

    // The resource is in the process of being deleted.
    DELETING = 3;
  }

  // Identifier. Resource name of the AI Application.
  // Format:
  // `projects/{project}/locations/{location}/aiApplications/{ai_application}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. User-defined name for the AI Application.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. User-defined description of the AI Application.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Universally unique identifier (UUID4) for the AI Application.
  string uid = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Output only. Creation time.
  google.protobuf.Timestamp create_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Last update time.
  google.protobuf.Timestamp update_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The current state of the AI Application.
  State state = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Consumer provided attributes.
  google.cloud.apphub.v1.Attributes attributes = 8
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. Properties of an underlying cloud resource that can comprise
  // an AI Application.
  google.cloud.apphub.v1.ApplicationProperties application_properties = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];
}
