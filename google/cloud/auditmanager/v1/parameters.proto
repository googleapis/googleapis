syntax = "proto3";

package google.cloud.auditmanager.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Cloud.AuditManager.V1";
option go_package = "cloud.google.com/go/auditmanager/apiv1/auditmanagerpb;auditmanagerpb";
option java_multiple_files = true;
option java_outer_classname = "ParametersProto";
option java_package = "com.google.cloud.auditmanager.v1";
option php_namespace = "Google\\Cloud\\AuditManager\\V1";
option ruby_package = "Google::Cloud::AuditManager::V1";

// Parameters are key-value pairs that let you provide your custom location
// requirements, environment requirements, or other settings that are
// relevant to the cloud control.
message Parameter {
  // Required. The name or key of the parameter.
  string name = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The value of the parameter.
  ParamValue parameter_value = 2 [(google.api.field_behavior) = REQUIRED];
}

// A list of strings for the parameter value.
message StringList {
  // Required. The strings in the list.
  repeated string values = 1 [(google.api.field_behavior) = REQUIRED];
}

// The possible parameter value types.
message ParamValue {
  // The list of possible parameter value types.
  oneof kind {
    // Optional. A string value.
    string string_value = 3 [(google.api.field_behavior) = OPTIONAL];

    // Optional. A boolean value.
    bool bool_value = 4 [(google.api.field_behavior) = OPTIONAL];

    // Optional. A repeated string.
    StringList string_list_value = 5 [(google.api.field_behavior) = OPTIONAL];

    // Optional. A double value.
    double number_value = 6 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Sub-parameter values.
    Parameter oneof_value = 7 [(google.api.field_behavior) = OPTIONAL];
  }
}

// Wrapper message to associate a list of CSC internal parameter overrides with
// a control name.
message ParameterOverrides {
  // The list of parameter overrides.
  repeated Parameter parameters = 1;
}

// State of a parameter for a cloud control.
message ParameterState {
  // Output only. The parameter key and value.
  Parameter parameter = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether this parameter was overridden by the user.
  bool is_overridden = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Collection of parameter states for a cloud control.
message CloudControlParameterStates {
  // Output only. The parameter states for the cloud control.
  repeated ParameterState parameter_states = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];
}
