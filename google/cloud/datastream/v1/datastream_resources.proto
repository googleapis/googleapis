  // default value of `5 minutes` is used. The duration must be from `5 minutes`
  // to `24 hours`, inclusive.
  google.protobuf.Duration polling_interval = 3
      [(google.api.field_behavior) = REQUIRED];

  // Required. Specifies the polling interval for a full refresh of objects that
  // do not support incremental sync. If not set, a default value of 24 hours is
  // used. The duration must be between 1 and 24 hours, inclusive.
  google.protobuf.Duration full_refresh_polling_interval = 4
      [(google.api.field_behavior) = REQUIRED];
}

// Configuration for syncing data from a ServiceNow source.
message ServiceNowSourceConfig {
  // Optional. The objects to retrieve from the source.
  SourceCatalog include_objects = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The objects to exclude from the stream.
  SourceCatalog exclude_objects = 2 [(google.api.field_behavior) = OPTIONAL];

  // Required. Incremental sync polling interval for all objects. If not set, a
  // default value of `5 minutes` is used. The duration must be from `5 minutes`
  // to `24 hours`, inclusive.
  google.protobuf.Duration polling_interval = 3
      [(google.api.field_behavior) = REQUIRED];
}

// Configuration for syncing data from a Workday source.
message WorkdaySourceConfig {
  // Optional. The objects to retrieve from the source.
  SourceCatalog include_objects = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The objects to exclude from the stream.
  SourceCatalog exclude_objects = 2 [(google.api.field_behavior) = OPTIONAL];

  // Required. Incremental sync polling interval for all objects. If not set, a
  // default value of `5 minutes` is used. The duration must be from `5 minutes`
  // to `24 hours`, inclusive.
  google.protobuf.Duration polling_interval = 3
      [(google.api.field_behavior) = REQUIRED];
}

// Source catalog.
message SourceCatalog {
  // Optional. Source objects in the catalog.
  repeated SourceObject objects = 1 [(google.api.field_behavior) = OPTIONAL];
}

// Source object.
message SourceObject {
  // Required. The object name.
  string object_name = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Source properties. When unspecified as part of include objects,
  // includes everything, when unspecified as part of exclude objects, excludes
  // nothing.
  repeated SourceProperty properties = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Source property.
message SourceProperty {
  // Required. The property name.
  string property_name = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Source properties. When specified, it means that the current
  // property contains nested properties of its own. When unspecified as part of
  // include objects, includes everything, when unspecified as part of exclude
  // objects, excludes nothing.
  repeated SourceProperty properties = 2
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether or not the property is a primary key.
  bool primary_key = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The configuration of the stream source.
message SourceConfig {
  // Required. Source connection profile resource.
  // Format: `projects/{project}/locations/{location}/connectionProfiles/{name}`
  string source_connection_profile = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "datastream.googleapis.com/ConnectionProfile"
    }
  ];

  // Stream configuration that is specific to the data source type.
  oneof source_stream_config {
    // Oracle data source configuration.
    OracleSourceConfig oracle_source_config = 100;

    // MySQL data source configuration.
    MysqlSourceConfig mysql_source_config = 101;

    // PostgreSQL data source configuration.
    PostgresqlSourceConfig postgresql_source_config = 102;

    // SQLServer data source configuration.
    SqlServerSourceConfig sql_server_source_config = 103;

    // Salesforce data source configuration.
    SalesforceSourceConfig salesforce_source_config = 104;

    // MongoDB data source configuration.
    MongodbSourceConfig mongodb_source_config = 105;

    // Spanner data source configuration.
    SpannerSourceConfig spanner_source_config = 106;

    // Dataverse data source configuration.
    DataverseSourceConfig dataverse_source_config = 111;

    // Salesforce Marketing Cloud data source configuration.
    SalesforceMarketingCloudSourceConfig
        salesforce_marketing_cloud_source_config = 116;

    // ServiceNow data source configuration.
    ServiceNowSourceConfig service_now_source_config = 117;

    // Optional. Workday data source configuration.
    WorkdaySourceConfig workday_source_config = 118
        [(google.api.field_behavior) = OPTIONAL];
  }
}

// AVRO file format configuration.
message AvroFileFormat {}

// JSON file format configuration.
message JsonFileFormat {
  // Schema file format.
  enum SchemaFileFormat {
    // Unspecified schema file format.
    SCHEMA_FILE_FORMAT_UNSPECIFIED = 0;

    // Do not attach schema file.
    NO_SCHEMA_FILE = 1;

    // Avro schema format.
    AVRO_SCHEMA_FILE = 2;
  }

  // Json file compression.
  enum JsonCompression {
    // Unspecified json file compression.
    JSON_COMPRESSION_UNSPECIFIED = 0;

    // Do not compress JSON file.
    NO_COMPRESSION = 1;

    // Gzip compression.
    GZIP = 2;
  }

  // The schema file format along JSON data files.
  SchemaFileFormat schema_file_format = 1;

  // Compression of the loaded JSON file.
  JsonCompression compression = 2;
}

// BigQuery clustering configuration.
message BigQueryClustering {
  // Required. Column names to set as clustering columns.
  repeated string columns = 1 [(google.api.field_behavior) = REQUIRED];
}

// Partitioning granularity for time partitions.
enum PartitioningTimeGranularity {
  // Unspecified partitioing interval.
  PARTITIONING_TIME_GRANULARITY_UNSPECIFIED = 0;

  // Hourly partitioning.
  PARTITIONING_TIME_GRANULARITY_HOUR = 1;

  // Daily partitioning.
  PARTITIONING_TIME_GRANULARITY_DAY = 2;

  // Monthly partitioning.
  PARTITIONING_TIME_GRANULARITY_MONTH = 3;

  // Yearly partitioning.
  PARTITIONING_TIME_GRANULARITY_YEAR = 4;
}

// Ingestion time partitioning. see
// https://cloud.google.com/bigquery/docs/partitioned-tables#ingestion_time
message IngestionTimePartition {
  // Optional. Partition granularity
  PartitioningTimeGranularity partitioning_time_granularity = 1
      [(google.api.field_behavior) = OPTIONAL];
}

// Time unit column partitioning. see
// https://cloud.google.com/bigquery/docs/partitioned-tables#date_timestamp_partitioned_tables
message TimeUnitPartition {
  // Required. The partitioning column.
  string column = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Partition granularity.
  PartitioningTimeGranularity partitioning_time_granularity = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Integer range partitioning. see
// https://cloud.google.com/bigquery/docs/partitioned-tables#integer_range
message IntegerRangePartition {
  // Required. The partitioning column.
  string column = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The starting value for range partitioning (inclusive).
  int64 start = 2 [(google.api.field_behavior) = REQUIRED];

  // Required. The ending value for range partitioning (exclusive).
  int64 end = 3 [(google.api.field_behavior) = REQUIRED];

  // Required. The interval of each range within the partition.
  int64 interval = 4 [(google.api.field_behavior) = REQUIRED];
}

// BigQuery partitioning configuration.
message BigQueryPartitioning {
  // Partitioning to apply on the table.
  oneof partitioning {
    // Integer range partitioning.
    IntegerRangePartition integer_range_partition = 100;

    // Time unit column partitioning.
    TimeUnitPartition time_unit_partition = 101;

    // Ingestion time partitioning.
    IngestionTimePartition ingestion_time_partition = 102;
  }

  // Optional. If true, queries over the table require a partition filter.
  bool require_partition_filter = 103 [(google.api.field_behavior) = OPTIONAL];
}

// Google Cloud Storage destination configuration
message GcsDestinationConfig {
  // Path inside the Cloud Storage bucket to write data to.
  string path = 1;

  // The maximum file size to be saved in the bucket.
  int32 file_rotation_mb = 2;

  // The maximum duration for which new events are added before a file is
  // closed and a new file is created. Values within the range of 15-60 seconds
  // are allowed.
  google.protobuf.Duration file_rotation_interval = 3;

  // File Format that the data should be written in.
  oneof file_format {
    // AVRO file format configuration.
    AvroFileFormat avro_file_format = 100;

    // JSON file format configuration.
    JsonFileFormat json_file_format = 101;
  }
}

// BigQuery destination configuration
message BigQueryDestinationConfig {
  // A single target dataset to which all data will be streamed.
  message SingleTargetDataset {
    // The dataset ID of the target dataset.
    // DatasetIds allowed characters:
    // https://cloud.google.com/bigquery/docs/reference/rest/v2/datasets#datasetreference.
    string dataset_id = 1;
  }

  // Destination datasets are created so that hierarchy of the destination data
  // objects matches the source hierarchy.
  message SourceHierarchyDatasets {
    // Dataset template used for dynamic dataset creation.
    message DatasetTemplate {
      // Required. The geographic location where the dataset should reside. See
      // https://cloud.google.com/bigquery/docs/locations for supported
      // locations.
      string location = 1 [(google.api.field_behavior) = REQUIRED];

      // If supplied, every created dataset will have its name prefixed by the
      // provided value. The prefix and name will be separated by an underscore.
      // i.e. <prefix>_<dataset_name>.
      string dataset_id_prefix = 2;

      // Describes the Cloud KMS encryption key that will be used to
      // protect destination BigQuery table. The BigQuery Service Account
      // associated with your project requires access to this encryption key.
      // i.e.
      // projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{cryptoKey}.
      // See https://cloud.google.com/bigquery/docs/customer-managed-encryption
      // for more information.
      string kms_key_name = 3;
    }

    // The dataset template to use for dynamic dataset creation.
    DatasetTemplate dataset_template = 2;

    // Optional. The project id of the BigQuery dataset. If not specified, the
    // project will be inferred from the stream resource.
    optional string project_id = 3 [(google.api.field_behavior) = OPTIONAL];
  }

  // The configuration for BLMT.
  message BlmtConfig {
    // Supported file formats for BigLake managed tables.
    enum FileFormat {
      // Default value.
      FILE_FORMAT_UNSPECIFIED = 0;

      // Parquet file format.
      PARQUET = 1;
    }

    // Supported table formats for BigLake managed tables.
    enum TableFormat {
      // Default value.
      TABLE_FORMAT_UNSPECIFIED = 0;

      // Iceberg table format.
      ICEBERG = 1;
    }

    // Required. The Cloud Storage bucket name.
    string bucket = 1 [(google.api.field_behavior) = REQUIRED];

    // The root path inside the Cloud Storage bucket.
    string root_path = 2;

    // Required. The bigquery connection.
    // Format: `{project}.{location}.{name}`
    string connection_name = 3 [(google.api.field_behavior) = REQUIRED];

    // Required. The file format.
    FileFormat file_format = 4 [(google.api.field_behavior) = REQUIRED];

    // Required. The table format.
    TableFormat table_format = 5 [(google.api.field_behavior) = REQUIRED];
  }

  // AppendOnly mode defines that all changes to a table will be written to the
  // destination table.
  message AppendOnly {}

  // Merge mode defines that all changes to a table will be merged at the
  // destination table.
  message Merge {}

  // Target dataset(s) configuration.
  oneof dataset_config {
    // Single destination dataset.
    SingleTargetDataset single_target_dataset = 201;

    // Source hierarchy datasets.
    SourceHierarchyDatasets source_hierarchy_datasets = 202;
  }

  // The guaranteed data freshness (in seconds) when querying tables created by
  // the stream. Editing this field will only affect new tables created in the
  // future, but existing tables will not be impacted. Lower values mean that
  // queries will return fresher data, but may result in higher cost.
  google.protobuf.Duration data_freshness = 300;

  // Optional. Big Lake Managed Tables (BLMT) configuration.
  BlmtConfig blmt_config = 1 [(google.api.field_behavior) = OPTIONAL];

  // Destination write mode.
  oneof write_mode {
    // The standard mode
    Merge merge = 301;

    // Append only mode
    AppendOnly append_only = 302;
  }
}

// The configuration of the stream destination.
message DestinationConfig {
  // Required. Destination connection profile resource.
  // Format: `projects/{project}/locations/{location}/connectionProfiles/{name}`
  string destination_connection_profile = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "datastream.googleapis.com/ConnectionProfile"
    }
  ];

  // Stream configuration that is specific to the data destination type.
  oneof destination_stream_config {
    // A configuration for how data should be loaded to Cloud Storage.
    GcsDestinationConfig gcs_destination_config = 100;

    // BigQuery destination configuration.
    BigQueryDestinationConfig bigquery_destination_config = 101;
  }
}

// A resource representing streaming data from a source to a destination.
message Stream {
  option (google.api.resource) = {
    type: "datastream.googleapis.com/Stream"
    pattern: "projects/{project}/locations/{location}/streams/{stream}"
  };

  // Stream state.
  enum State {
    // Unspecified stream state.
    STATE_UNSPECIFIED = 0;

    // The stream has been created but has not yet started streaming data.
    NOT_STARTED = 1;

    // The stream is running.
    RUNNING = 2;

    // The stream is paused.
    PAUSED = 3;

    // The stream is in maintenance mode.
    //
    // Updates are rejected on the resource in this state.
    MAINTENANCE = 4;

    // The stream is experiencing an error that is preventing data from being
    // streamed.
    FAILED = 5;

    // The stream has experienced a terminal failure.
    FAILED_PERMANENTLY = 6;

    // The stream is starting, but not yet running.
    STARTING = 7;

    // The Stream is no longer reading new events, but still writing events in
    // the buffer.
    DRAINING = 8;
  }

  // Backfill strategy to automatically backfill the Stream's objects.
  // Specific objects can be excluded.
  message BackfillAllStrategy {
    // List of objects to exclude.
    oneof excluded_objects {
      // Oracle data source objects to avoid backfilling.
      OracleRdbms oracle_excluded_objects = 1;

      // MySQL data source objects to avoid backfilling.
      MysqlRdbms mysql_excluded_objects = 2;

      // PostgreSQL data source objects to avoid backfilling.
      PostgresqlRdbms postgresql_excluded_objects = 3;

      // SQLServer data source objects to avoid backfilling
      SqlServerRdbms sql_server_excluded_objects = 4;

      // Salesforce data source objects to avoid backfilling
      SalesforceOrg salesforce_excluded_objects = 5;

      // MongoDB data source objects to avoid backfilling
      MongodbCluster mongodb_excluded_objects = 6;

      // Spanner data source objects to avoid backfilling.
      SpannerDatabase spanner_excluded_objects = 7;

      // Source catalog data source objects to avoid backfilling. This is mainly
      // used to represent SaaS applications objects.
      SourceCatalog saas_excluded_objects = 9;
    }
  }

  // Backfill strategy to disable automatic backfill for the Stream's objects.
  message BackfillNoneStrategy {}

  // A set of rules to apply to a set of objects.
  message RuleSet {
    // Object filter to apply the rules to.
    message ObjectFilter {
      // The filter to apply.
      oneof filter_type {
        // Specific source object identifier.
        SourceObjectIdentifier source_object_identifier = 1;
      }
    }

    // A customization rule to apply to a set of objects.
    message CustomizationRule {
      // The rule to apply.
      oneof rule {
        // BigQuery partitioning rule.
        BigQueryPartitioning bigquery_partitioning = 1;

        // BigQuery clustering rule.
        BigQueryClustering bigquery_clustering = 2;
      }
    }

    // Required. List of customization rules to apply.
    repeated CustomizationRule customization_rules = 1
        [(google.api.field_behavior) = REQUIRED];

    // Required. Object filter to apply the customization rules to.
    ObjectFilter object_filter = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // Output only. Identifier. The stream's name.
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Output only. The creation time of the stream.
  google.protobuf.Timestamp create_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The last update time of the stream.
  google.protobuf.Timestamp update_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Labels.
  map<string, string> labels = 4;

  // Required. Display name.
  string display_name = 5 [(google.api.field_behavior) = REQUIRED];

  // Required. Source connection profile configuration.
  SourceConfig source_config = 6 [(google.api.field_behavior) = REQUIRED];

  // Required. Destination connection profile configuration.
  DestinationConfig destination_config = 7
      [(google.api.field_behavior) = REQUIRED];

  // The state of the stream.
  State state = 8;

  // Stream backfill strategy.
  oneof backfill_strategy {
    // Automatically backfill objects included in the stream source
    // configuration. Specific objects can be excluded.
    BackfillAllStrategy backfill_all = 101;

    // Do not automatically backfill any objects.
    BackfillNoneStrategy backfill_none = 102;
  }

  // Output only. Errors on the Stream.
  repeated Error errors = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Immutable. A reference to a KMS encryption key.
  // If provided, it will be used to encrypt the data.
  // If left blank, data will be encrypted using an internal Stream-specific
  // encryption key provisioned through KMS.
  optional string customer_managed_encryption_key = 10
      [(google.api.field_behavior) = IMMUTABLE];

  // Output only. If the stream was recovered, the time of the last recovery.
  // Note: This field is currently experimental.
  google.protobuf.Timestamp last_recovery_time = 13
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Reserved for future use.
  optional bool satisfies_pzs = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Reserved for future use.
  optional bool satisfies_pzi = 16 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Rule sets to apply to the stream.
  repeated RuleSet rule_sets = 19 [(google.api.field_behavior) = OPTIONAL];
}

// A specific stream object (e.g a specific DB table).
message StreamObject {
  option (google.api.resource) = {
    type: "datastream.googleapis.com/StreamObject"
    pattern: "projects/{project}/locations/{location}/streams/{stream}/objects/{object}"
  };

  // Output only. Identifier. The object resource's name.
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (google.api.field_behavior) = OUTPUT_ONLY
  ];

  // Output only. The creation time of the object.
  google.protobuf.Timestamp create_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The last update time of the object.
  google.protobuf.Timestamp update_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Display name.
  string display_name = 5 [(google.api.field_behavior) = REQUIRED];

  // Output only. Active errors on the object.
  repeated Error errors = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The latest backfill job that was initiated for the stream object.
  BackfillJob backfill_job = 7;

  // The object identifier in the data source.
  SourceObjectIdentifier source_object = 8;

  // Output only. The customization rules for the object. These rules are
  // derived from the parent Stream's `rule_sets` and represent the intended
  // configuration for the object.
  repeated Stream.RuleSet.CustomizationRule customization_rules = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents an identifier of an object in the data source.
message SourceObjectIdentifier {
  // Oracle data source object identifier.
  message OracleObjectIdentifier {
    // Required. The schema name.
    string schema = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The table name.
    string table = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // PostgreSQL data source object identifier.
  message PostgresqlObjectIdentifier {
    // Required. The schema name.
    string schema = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The table name.
    string table = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // Mysql data source object identifier.
  message MysqlObjectIdentifier {
    // Required. The database name.
    string database = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The table name.
    string table = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // SQLServer data source object identifier.
  message SqlServerObjectIdentifier {
    // Required. The schema name.
    string schema = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The table name.
    string table = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // Salesforce data source object identifier.
  message SalesforceObjectIdentifier {
    // Required. The object name.
    string object_name = 1 [(google.api.field_behavior) = REQUIRED];
  }

  // MongoDB data source object identifier.
  message MongodbObjectIdentifier {
    // Required. The database name.
    string database = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The collection name.
    string collection = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // Spanner data source object identifier.
  message SpannerObjectIdentifier {
    // Optional. The schema name.
    string schema = 1 [(google.api.field_behavior) = OPTIONAL];

    // Required. The table name.
    string table = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // The identifier for an object in the data source.
  oneof source_identifier {
    // Oracle data source object identifier.
    OracleObjectIdentifier oracle_identifier = 1;

    // Mysql data source object identifier.
    MysqlObjectIdentifier mysql_identifier = 2;

    // PostgreSQL data source object identifier.
    PostgresqlObjectIdentifier postgresql_identifier = 3;

    // SQLServer data source object identifier.
    SqlServerObjectIdentifier sql_server_identifier = 4;

    // Salesforce data source object identifier.
    SalesforceObjectIdentifier salesforce_identifier = 5;

    // MongoDB data source object identifier.
    MongodbObjectIdentifier mongodb_identifier = 6;

    // Spanner data source object identifier.
    SpannerObjectIdentifier spanner_identifier = 7;
  }
}

// Represents a backfill job on a specific stream object.
message BackfillJob {
  // State of the stream object's backfill job.
  enum State {
    // Default value.
    STATE_UNSPECIFIED = 0;

    // Backfill job was never started for the stream object (stream has backfill
    // strategy defined as manual or object was explicitly excluded from
    // automatic backfill).
    NOT_STARTED = 1;

    // Backfill job will start pending available resources.
    PENDING = 2;

    // Backfill job is running.
    ACTIVE = 3;

    // Backfill job stopped (next job run will start from beginning).
    STOPPED = 4;

    // Backfill job failed (due to an error).
    FAILED = 5;

    // Backfill completed successfully.
    COMPLETED = 6;

    // Backfill job failed since the table structure is currently unsupported
    // for backfill.
    UNSUPPORTED = 7;
  }

  // Triggering reason for a backfill job.
  enum Trigger {
    // Default value.
    TRIGGER_UNSPECIFIED = 0;

    // Object backfill job was triggered automatically according to the stream's
    // backfill strategy.
    AUTOMATIC = 1;

    // Object backfill job was triggered manually using the dedicated API.
    MANUAL = 2;
  }

  // Output only. Backfill job state.
  State state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Backfill job's triggering reason.
  Trigger trigger = 2;

  // Output only. Backfill job's start time.
  google.protobuf.Timestamp last_start_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Backfill job's end time.
  google.protobuf.Timestamp last_end_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Errors which caused the backfill job to fail.
  repeated Error errors = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The filter for performing a partial backfill.
  EventFilter event_filter = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents a filter for included data on a stream object.
message EventFilter {
  // A filter type.
  oneof filter {
    // An SQL-query Where clause selecting which data should be included, not
    // including the "WHERE" keyword. e.g., `t.key1 = 'value1' AND t.key2 =
    // 'value2'`
    string sql_where_clause = 1;
  }
}

// Represent a user-facing Error.
message Error {
  // A title that explains the reason for the error.
  string reason = 1;

  // A unique identifier for this specific error,
  // allowing it to be traced throughout the system in logs and API responses.
  string error_uuid = 2;

  // A message containing more information about the error that occurred.
  string message = 3;

  // The time when the error occurred.
  google.protobuf.Timestamp error_time = 4;

  // Additional information about the error.
  map<string, string> details = 5;
}

// Contains the current validation results.
message ValidationResult {
  // A list of validations (includes both executed as well as not executed
  // validations).
  repeated Validation validations = 1;
}

// A validation to perform on a stream.
message Validation {
  // Validation execution state.
  enum State {
    // Unspecified state.
    STATE_UNSPECIFIED = 0;

    // Validation did not execute.
    NOT_EXECUTED = 1;

    // Validation failed.
    FAILED = 2;

    // Validation passed.
    PASSED = 3;

    // Validation executed with warnings.
    WARNING = 4;
  }

  // A short description of the validation.
  string description = 1;

  // Output only. Validation execution status.
  State state = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Messages reflecting the validation results.
  repeated ValidationMessage message = 3;

  // A custom code identifying this validation.
  string code = 4;
}

// Represent user-facing validation result message.
message ValidationMessage {
  // Validation message level.
  enum Level {
    // Unspecified level.
    LEVEL_UNSPECIFIED = 0;

    // Potentially cause issues with the Stream.
    WARNING = 1;

    // Definitely cause issues with the Stream.
    ERROR = 2;
  }

  // The result of the validation.
  string message = 1;

  // Message severity level (warning or error).
  Level level = 2;

  // Additional metadata related to the result.
  map<string, string> metadata = 3;

  // A custom code identifying this specific message.
  string code = 4;
}

// The strategy that the stream uses for CDC replication.
message CdcStrategy {
  // CDC strategy to start replicating from the most recent position in the
  // source.
  message MostRecentStartPosition {}

  // CDC strategy to resume replication from the next available position in the
  // source.
  message NextAvailableStartPosition {}

  // CDC strategy to start replicating from a specific position in the source.
  message SpecificStartPosition {
    // Change Data Capture (CDC) read position.
    oneof position {
      // MySQL specific log position to start replicating from.
      MysqlLogPosition mysql_log_position = 101;

      // Oracle SCN to start replicating from.
      OracleScnPosition oracle_scn_position = 102;

      // SqlServer LSN to start replicating from.
      SqlServerLsnPosition sql_server_lsn_position = 103;

      // MySQL GTID set to start replicating from.
      MysqlGtidPosition mysql_gtid_position = 104;

      // MongoDB change stream position to start replicating from.
      MongodbChangeStreamPosition mongodb_change_stream_position = 105;

      // Optional. Spanner change stream position to start replicating from.
      SpannerChangeStreamPosition spanner_change_stream_position = 106
          [(google.api.field_behavior) = OPTIONAL];
    }
  }

  // The position to start reading from when starting, resuming, or recovering
  // the stream.
  // If not set, the system's default value will be used.
  oneof start_position {
    // Optional. Start replicating from the most recent position in the source.
    MostRecentStartPosition most_recent_start_position = 101
        [(google.api.field_behavior) = OPTIONAL];

    // Optional. Resume replication from the next available position in the
    // source.
    NextAvailableStartPosition next_available_start_position = 102
        [(google.api.field_behavior) = OPTIONAL];

    // Optional. Start replicating from a specific position in the source.
    SpecificStartPosition specific_start_position = 103
        [(google.api.field_behavior) = OPTIONAL];
  }
}

// SQL Server LSN position
message SqlServerLsnPosition {
  // Required. Log sequence number (LSN) from where Logs will be read
  string lsn = 1 [(google.api.field_behavior) = REQUIRED];
}

// Oracle SCN position
message OracleScnPosition {
  // Required. SCN number from where Logs will be read
  int64 scn = 1 [(google.api.field_behavior) = REQUIRED];
}

// MySQL log position
message MysqlLogPosition {
  // Required. The binary log file name.
  string log_file = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The position within the binary log file. Default is head of file.
  optional int32 log_position = 2 [(google.api.field_behavior) = OPTIONAL];
}

// MySQL GTID position
message MysqlGtidPosition {
  // Required. The gtid set to start replication from.
  string gtid_set = 1 [(google.api.field_behavior) = REQUIRED];
}

// MongoDB change stream position
message MongodbChangeStreamPosition {
  // Required. The timestamp to start change stream from.
  google.protobuf.Timestamp start_time = 1
      [(google.api.field_behavior) = REQUIRED];
}

// Represents a position in a Spanner change stream from which to start
// replicating.
message SpannerChangeStreamPosition {
  // Required. The timestamp to start change stream queries from.
  // The timestamp must be a positive value.
  google.protobuf.Timestamp start_time = 1
      [(google.api.field_behavior) = REQUIRED];
}
