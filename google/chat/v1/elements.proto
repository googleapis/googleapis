syntax = "proto3";

package google.chat.v1;

import "google/api/field_behavior.proto";
import "google/chat/v1/citation.proto";
import "google/chat/v1/cited_source.proto";

option csharp_namespace = "Google.Apps.Chat.V1";
option go_package = "cloud.google.com/go/chat/apiv1/chatpb;chatpb";
option java_multiple_files = true;
option java_outer_classname = "ElementsProto";
option java_package = "com.google.chat.v1";
option php_namespace = "Google\\Apps\\Chat\\V1";
option ruby_package = "Google::Apps::Chat::V1";

// [Developer Preview](https://developers.google.com/workspace/preview):
// Elements are additional components that may or may not be associated with the
// message text provided during message creation.
message Elements {
  // A list of sources to be displayed under the message as footer links.
  // These are not referenced inline. For inline references, use `citations`.
  repeated CitedSource cited_sources = 1;

  // A list of inline citations referenced within the message text (via
  // `<chat-citation>` tags) that render as interactive hover cards.
  repeated Citation citations = 2;
}
