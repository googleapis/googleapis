syntax = "proto3";

package google.chat.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/chat/v1/message.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Google.Apps.Chat.V1";
option go_package = "cloud.google.com/go/chat/apiv1/chatpb;chatpb";
option java_multiple_files = true;
option java_outer_classname = "ThreadProto";
option java_package = "com.google.chat.v1";
option objc_class_prefix = "DYNAPIProto";
option php_namespace = "Google\\Apps\\Chat\\V1";
option ruby_package = "Google::Apps::Chat::V1";

// Request message for GetThread.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message GetThreadRequest {
  // Required. Resource name of the thread to retrieve.
  //
  // Format: `spaces/{space}/threads/{thread}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "chat.googleapis.com/Thread" }
  ];
}

// Request message for UpdateThread.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message UpdateThreadRequest {
  // Required. The thread with updated fields.
  Thread thread = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The list of fields to update.
  //
  // Currently supported field paths:
  // - `thread_metadata`
  // - `thread_metadata.title`
  // - `thread_metadata.icon`
  google.protobuf.FieldMask update_mask = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Request message for ListThreads.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message ListThreadsRequest {
  // Required. The resource name of the space to list threads from.
  // Format: `spaces/{space}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = { type: "chat.googleapis.com/Space" }
  ];

  // Optional. The maximum number of threads to return. The service may return
  // fewer than this value. If unspecified, at most 50 threads will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token received from a previous `ListThreads` call. Provide
  // this to retrieve the subsequent page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListThreads.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message ListThreadsResponse {
  // List of threads. Ordered in reverse chronological order based on the thread
  // creation timestamp.
  repeated Thread threads = 1;

  // A token that can be sent as `pageToken` to retrieve the next page of
  // results. If empty, there are no subsequent pages.
  string next_page_token = 2;
}
