syntax = "proto3";

package google.chat.v1;

import "google/api/field_behavior.proto";
import "google/apps/card/v1/card.proto";

option csharp_namespace = "Google.Apps.Chat.V1";
option go_package = "cloud.google.com/go/chat/apiv1/chatpb;chatpb";
option java_multiple_files = true;
option java_outer_classname = "IconProto";
option java_package = "com.google.chat.v1";
option php_namespace = "Google\\Apps\\Chat\\V1";
option ruby_package = "Google::Apps::Chat::V1";

// An icon displayed in a prompt or thread.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message Icon {
  // Optional. The alternative text of this icon that's used for accessibility.
  string alt_text = 1 [(google.api.field_behavior) = OPTIONAL];

  // An icon displayed in a prompt.
  oneof icons {
    // Displays one of the [Google Material
    // Icons](https://fonts.google.com/icons).
    //
    // For example, to display a [checkbox
    // icon](https://fonts.google.com/icons?selected=Material%20Symbols%20Outlined%3Acheck_box%3AFILL%400%3Bwght%40400%3BGRAD%400%3Bopsz%4048),
    // use
    // ```
    // "material_icon": {
    //   "name": "check_box"
    // }
    // ```
    google.apps.card.v1.MaterialIcon material_icon = 2;
  }
}
