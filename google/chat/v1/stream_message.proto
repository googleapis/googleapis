syntax = "proto3";

package google.chat.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/chat/v1/citation.proto";
import "google/chat/v1/cited_source.proto";
import "google/chat/v1/markup_syntax.proto";
import "google/chat/v1/message.proto";
import "google/chat/v1/step.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Google.Apps.Chat.V1";
option go_package = "cloud.google.com/go/chat/apiv1/chatpb;chatpb";
option java_multiple_files = true;
option java_outer_classname = "StreamMessageProto";
option java_package = "com.google.chat.v1";
option objc_class_prefix = "DYNAPIProto";
option php_namespace = "Google\\Apps\\Chat\\V1";
option ruby_package = "Google::Apps::Chat::V1";

// A streaming message in a Google Chat space. Stream messages let Chat apps
// display incremental progress updates, steps, citations, and text chunks
// before committing a finalized message.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message StreamMessage {
  option (google.api.resource) = {
    type: "chat.googleapis.com/StreamMessage"
    pattern: "spaces/{space}/streamMessages/{stream_message}"
    plural: "streamMessages"
    singular: "streamMessage"
  };

  // Identifier. Resource name of the stream message.
  // Format: `spaces/{space}/streamMessages/{stream_message}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. The reference that the stream message is anchored to. One of the
  // following is required:
  oneof reference {
    // Resource name of the message that the stream message is referencing, such
    // as the user message that invoked the Chat app. Must belong to the same
    // space and be accessible to the Chat app. The space must have threading
    // enabled.
    //
    // Format: `spaces/{space}/messages/{message}`
    string referenced_message = 2 [
      (google.api.resource_reference) = { type: "chat.googleapis.com/Message" }
    ];
  }

  // Required. Plain-text progress status displayed for the active stream
  // message. Maximum length is 250 characters. Must be non-empty when creating
  // a stream message or when included in `update_mask` during an update.
  string progress_text = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. Input only. A list of chunks that define the content of the
  // stream message.
  repeated StreamContentChunk stream_content_chunks = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = INPUT_ONLY
  ];

  // Optional. Specifies how the server interprets the stream content chunks.
  MarkupSyntax markup_syntax = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Token returned by the server for sequencing subsequent stream
  // requests. Pass this token as `chunk_token` when appending or committing
  // content, or populate `next_chunk_token` when updating the stream message.
  string next_chunk_token = 7 [(google.api.field_behavior) = OPTIONAL];
}

// A chunk of content within a stream message.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message StreamContentChunk {
  // The content of the chunk.
  oneof chunk {
    // Optional. Text content of the stream message. Concatenated across append
    // requests and replaced when `stream_content_chunks` is included in an
    // update request. Supports Markdown formatting when `markup_syntax` is set
    // to `MARKUP_SYNTAX_MARKDOWN`.
    string text = 1 [(google.api.field_behavior) = OPTIONAL];

    // Optional. A step that the Chat app performed while generating the
    // response, such as a reasoning step or tool call.
    Step step = 2 [(google.api.field_behavior) = OPTIONAL];

    // Optional. A
    // [card](https://developers.google.com/workspace/chat/api/reference/rest/v1/cards).
    // Only supported when committing a stream message.
    //
    // To learn how to create a message that contains cards, see [Send a
    // message](https://developers.google.com/workspace/chat/create-messages).
    //
    // [Card builder](https://addons.gsuite.google.com/uikit/builder)
    CardWithId card = 3 [(google.api.field_behavior) = OPTIONAL];

    // Optional. An interactive widget that appears at the bottom of a message.
    // Only supported when committing a stream message.
    //
    // For details, see [Add interactive widgets at the bottom of a
    // message](https://developers.google.com/workspace/chat/create-messages#add-accessory-widgets).
    AccessoryWidget accessory_widget = 4
        [(google.api.field_behavior) = OPTIONAL];

    // Optional. An inline citation referenced within the message text (via
    // `<chat-citation>` tags) that renders as an interactive hover card. Only
    // supported when the stream message's `markup_syntax` is set to
    // `MARKUP_SYNTAX_MARKDOWN`. If a citation with a duplicate `id` is
    // provided, it overwrites the existing citation with the same `id`.
    Citation citation = 5 [(google.api.field_behavior) = OPTIONAL];

    // Optional. A source to be displayed under the message as a footer link.
    // Only supported when committing a stream message.
    CitedSource cited_source = 6 [(google.api.field_behavior) = OPTIONAL];
  }
}

// Request message for creating a stream message.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message CreateStreamMessageRequest {
  // Required. The resource name of the space where the stream message will be
  // created.
  // Format: `spaces/{space}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "chat.googleapis.com/StreamMessage"
    }
  ];

  // Required. The stream message to create.
  StreamMessage stream_message = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for appending content to a stream message.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message AppendStreamMessageContentRequest {
  // Required. The resource name of the stream message to append content to.
  // Format: `spaces/{space}/streamMessages/{stream_message}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "chat.googleapis.com/StreamMessage"
    }
  ];

  // Required. Token for appending the next chunk of content, obtained from the
  // `next_chunk_token` field of the previous stream response.
  string chunk_token = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. Updated plain-text progress status for the stream message.
  // Maximum length is 250 characters. If omitted or empty, the existing
  // `progress_text` is preserved.
  string progress_text = 3 [(google.api.field_behavior) = OPTIONAL];

  // Required. A list of chunks to append to the message.
  repeated StreamContentChunk stream_content_chunks = 4
      [(google.api.field_behavior) = REQUIRED];
}

// Request message for updating a stream message.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message UpdateStreamMessageRequest {
  // Required. The stream message with fields to update, including the latest
  // `next_chunk_token`.
  StreamMessage stream_message = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The field paths to update. Separate multiple values with commas.
  //
  // Currently supported field paths:
  //
  // - `progress_text`
  //
  // - `stream_content_chunks`
  google.protobuf.FieldMask update_mask = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Request message for committing a stream message.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message CommitStreamMessageRequest {
  // Required. The resource name of the stream message to commit.
  // Format: `spaces/{space}/streamMessages/{stream_message}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "chat.googleapis.com/StreamMessage"
    }
  ];

  // Required. Token for committing the stream message, obtained from the
  // `next_chunk_token` field of the previous stream response.
  string chunk_token = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. Any final chunks to append before finalizing the message.
  repeated StreamContentChunk stream_content_chunks = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Response message for committing a stream message.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message CommitStreamMessageResponse {
  // The finalized message.
  Message message = 1;
}

// Request message for deleting a stream message.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message DeleteStreamMessageRequest {
  // Required. The resource name of the stream message to delete.
  // Format: `spaces/{space}/streamMessages/{stream_message}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "chat.googleapis.com/StreamMessage"
    }
  ];
}
