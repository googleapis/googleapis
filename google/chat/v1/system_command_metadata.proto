syntax = "proto3";

package google.chat.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Apps.Chat.V1";
option go_package = "cloud.google.com/go/chat/apiv1/chatpb;chatpb";
option java_multiple_files = true;
option java_outer_classname = "SystemCommandMetadataProto";
option java_package = "com.google.chat.v1";
option php_namespace = "Google\\Apps\\Chat\\V1";
option ruby_package = "Google::Apps::Chat::V1";

// Metadata about a system command that is triggered by the user.
//
// [Developer Preview](https://developers.google.com/workspace/preview).
message SystemCommandMetadata {
  // Command for cancelling an active stream message.
  message CancelStream {
    // Required. The resource name of the stream message on which the cancel
    // command was performed.
    //
    // Format: `spaces/{space}/streamMessages/{stream_message}`
    string stream_message = 1 [
      (google.api.field_behavior) = REQUIRED,
      (google.api.resource_reference) = {
        type: "chat.googleapis.com/StreamMessage"
      }
    ];
  }

  // The system command invoked.
  oneof command {
    // Command for cancelling an active stream message.
    CancelStream cancel_stream = 2;
  }
}
