option csharp_namespace = "Google.Cloud.Spanner.Admin.Omni.V1";
option go_package = "cloud.google.com/go/spanner/admin/omni/apiv1/omnipb;omnipb";
option java_multiple_files = true;
option java_outer_classname = "SpannerOmniAdminProto";
option java_package = "com.google.spanner.admin.omni.v1";
option php_namespace = "Google\\Cloud\\Spanner\\Admin\\Omni\\V1";
option ruby_package = "Google::Cloud::Spanner::Admin::Omni::V1";

// Provides methods for managing locations, location distances, zones, servers,
// deployment settings, external storage, backup imports, rollouts, and internal
// cryptographic keys in a Spanner Omni deployment.
service OmniAdmin {
  option (google.api.default_host) = "spanner.googleapis.com";

  // Creates a new [Location][google.spanner.admin.omni.v1.Location] in the
  // deployment.
  rpc CreateLocation(CreateLocationRequest) returns (Location) {
    option (google.api.method_signature) = "location,location_id";
  }

  // Gets the details of a specific
  // [Location][google.spanner.admin.omni.v1.Location].
  rpc GetLocation(GetLocationRequest) returns (Location) {
    option (google.api.method_signature) = "name";
  }

  // Lists all [Location][google.spanner.admin.omni.v1.Location] resources in
  // the deployment.
  rpc ListLocations(ListLocationsRequest) returns (ListLocationsResponse) {}

  // Deletes a [Location][google.spanner.admin.omni.v1.Location] from the
  // deployment. A location cannot be deleted if any zones are currently
  // assigned to it.
  rpc DeleteLocation(DeleteLocationRequest) returns (google.protobuf.Empty) {
    option (google.api.method_signature) = "name";
  }

  // Creates a new
  // [LocationDistance][google.spanner.admin.omni.v1.LocationDistance]
  // specifying the network latency between two locations.
  rpc CreateLocationDistance(CreateLocationDistanceRequest)
      returns (LocationDistance) {
    option (google.api.method_signature) =
        "parent,location_distance,other_location_id";
  }

  // Gets the details of a specific
  // [LocationDistance][google.spanner.admin.omni.v1.LocationDistance].
  rpc GetLocationDistance(GetLocationDistanceRequest)
      returns (LocationDistance) {
    option (google.api.method_signature) = "name";
  }

  // Lists all [LocationDistance][google.spanner.admin.omni.v1.LocationDistance]
  // resources for a given source location.
  rpc ListLocationDistances(ListLocationDistancesRequest)
      returns (ListLocationDistancesResponse) {
    option (google.api.method_signature) = "parent";
  }

  // Updates the network latency of an existing
  // [LocationDistance][google.spanner.admin.omni.v1.LocationDistance].
  rpc UpdateLocationDistance(UpdateLocationDistanceRequest)
      returns (LocationDistance) {
    option (google.api.method_signature) = "location_distance,update_mask";
  }

  // Deletes a
  // [LocationDistance][google.spanner.admin.omni.v1.LocationDistance].
  rpc DeleteLocationDistance(DeleteLocationDistanceRequest)
      returns (google.protobuf.Empty) {
    option (google.api.method_signature) = "name";
  }

  // Gets the details of a specific [Zone][google.spanner.admin.omni.v1.Zone].
  rpc GetZone(GetZoneRequest) returns (Zone) {
    option (google.api.method_signature) = "name";
  }

  // Lists all [Zone][google.spanner.admin.omni.v1.Zone] resources in the
  // deployment.
  rpc ListZones(ListZonesRequest) returns (ListZonesResponse) {}

  // Lists long-running operations for a given
  // [Zone][google.spanner.admin.omni.v1.Zone].
  rpc ListZoneOperations(ListZoneOperationsRequest)
      returns (ListZoneOperationsResponse) {
    option (google.api.method_signature) = "parent";
  }

  // Creates a new [Zone][google.spanner.admin.omni.v1.Zone] in the deployment.
  // The root servers specified in
  // [CreateZoneRequest][google.spanner.admin.omni.v1.CreateZoneRequest] must
  // already be running with the `--root` flag; otherwise, the RPC fails.
  //
  // The returned long-running operation has a name of the form
  // `<zone_name>/operations/<operation_id>` and can be used to track the
  // progress of the zone creation. The metadata field type is
  // [CreateZoneMetadata][google.spanner.admin.omni.v1.CreateZoneMetadata]. The
  // response field type is [Zone][google.spanner.admin.omni.v1.Zone], if
  // successful.
  rpc CreateZone(CreateZoneRequest) returns (google.longrunning.Operation) {
    option (google.api.method_signature) = "zone,zone_id";
    option (google.longrunning.operation_info) = {
      response_type: "Zone"
      metadata_type: "CreateZoneMetadata"
    };
  }

  // Deletes a [Zone][google.spanner.admin.omni.v1.Zone] from the deployment.
  //
  // The returned long-running operation has a name of the form
  // `<zone_name>/operations/<operation_id>` and can be used to track the
  // progress of the zone deletion. The metadata field type is
  // [DeleteZoneMetadata][google.spanner.admin.omni.v1.DeleteZoneMetadata]. The
  // response field type is [google.protobuf.Empty][google.protobuf.Empty], if
  // successful.
  rpc DeleteZone(DeleteZoneRequest) returns (google.longrunning.Operation) {
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "DeleteZoneMetadata"
    };
  }

  // Creates and registers a new root
  // [Server][google.spanner.admin.omni.v1.Server] in a zone.
  //
  // The returned long-running operation has a name of the form
  // `<server_name>/operations/<operation_id>` and can be used to track the
  // progress of the server creation. The metadata field type is
  // [CreateServerMetadata][google.spanner.admin.omni.v1.CreateServerMetadata].
  // The response field type is [Server][google.spanner.admin.omni.v1.Server],
  // if successful.
  rpc CreateServer(CreateServerRequest) returns (google.longrunning.Operation) {
    option (google.api.method_signature) = "parent,server,server_id";
    option (google.longrunning.operation_info) = {
      response_type: "Server"
      metadata_type: "CreateServerMetadata"
    };
  }

  // Gets the details of a specific
  // [Server][google.spanner.admin.omni.v1.Server].
  rpc GetServer(GetServerRequest) returns (Server) {
    option (google.api.method_signature) = "name";
  }

  // Lists all [Server][google.spanner.admin.omni.v1.Server] resources in a
  // given zone.
  rpc ListServers(ListServersRequest) returns (ListServersResponse) {
    option (google.api.method_signature) = "parent";
  }

  // Deletes a [Server][google.spanner.admin.omni.v1.Server] from a zone after
  // draining its serving traffic and data.
  //
  // The returned long-running operation has a name of the form
  // `<server_name>/operations/<operation_id>` and can be used to track the
  // progress of the server deletion. The metadata field type is
  // [DeleteServerMetadata][google.spanner.admin.omni.v1.DeleteServerMetadata].
  // The response field type is [google.protobuf.Empty][google.protobuf.Empty],
  // if successful.
  rpc DeleteServer(DeleteServerRequest) returns (google.longrunning.Operation) {
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "DeleteServerMetadata"
    };
  }

  // Lists long-running operations for a given
  // [Server][google.spanner.admin.omni.v1.Server].
  rpc ListServerOperations(ListServerOperationsRequest)
      returns (ListServerOperationsResponse) {
    option (google.api.method_signature) = "parent";
  }

  // Creates a new
  // [ExternalStorage][google.spanner.admin.omni.v1.ExternalStorage]
  // configuration for storing or importing database backups.
  rpc CreateExternalStorage(CreateExternalStorageRequest)
      returns (ExternalStorage) {
    option (google.api.method_signature) =
        "external_storage,external_storage_id";
  }

  // Lists metadata for completed backups stored in external storage (for
  // example, Amazon S3 or Cloud Storage).
  //
  // This RPC serves as a discovery mechanism for backups, particularly useful
  // for importing backups when local system metadata is unavailable. It scans
  // the external storage to return the backup file paths and metadata for
  // completed backups.
  rpc ListBackupDescriptors(ListBackupDescriptorsRequest)
      returns (ListBackupDescriptorsResponse) {
    option (google.api.method_signature) = "parent";
  }

  // Gets the details of a specific
  // [ExternalStorage][google.spanner.admin.omni.v1.ExternalStorage] resource.
  rpc GetExternalStorage(GetExternalStorageRequest) returns (ExternalStorage) {
    option (google.api.method_signature) = "name";
  }

  // Deletes an [ExternalStorage][google.spanner.admin.omni.v1.ExternalStorage]
  // resource.
  rpc DeleteExternalStorage(DeleteExternalStorageRequest)
      returns (google.protobuf.Empty) {
    option (google.api.method_signature) = "name";
  }

  // Lists all [ExternalStorage][google.spanner.admin.omni.v1.ExternalStorage]
  // resources in the deployment.
  rpc ListExternalStorages(ListExternalStoragesRequest)
      returns (ListExternalStoragesResponse) {}

  // Gets the access control policy for an
  // [ExternalStorage][google.spanner.admin.omni.v1.ExternalStorage] resource.
  // Returns an empty policy if the external storage resource exists but does
  // not have a policy set.
  //
  // Authorization requires `spanner.externalStorages.getIamPolicy`
  // permission on [resource][google.iam.v1.GetIamPolicyRequest.resource].
  rpc GetIamPolicy(google.iam.v1.GetIamPolicyRequest)
      returns (google.iam.v1.Policy) {}

  // Sets the access control policy on an
  // [ExternalStorage][google.spanner.admin.omni.v1.ExternalStorage] resource.
  // Replaces any existing policy.
  //
  // Authorization requires `spanner.externalStorages.setIamPolicy`
  // permission on [resource][google.iam.v1.SetIamPolicyRequest.resource].
  rpc SetIamPolicy(google.iam.v1.SetIamPolicyRequest)
      returns (google.iam.v1.Policy) {}

  // Imports a backup from a
  // [BackupDescriptor][google.spanner.admin.omni.v1.BackupDescriptor] in
  // external storage into a Spanner instance. The primary use case for this RPC
  // is to import backups whose local metadata is unavailable (for example, when
  // importing into a new Spanner Omni deployment).
  //
  // The returned long-running operation has a name of the form
  // `projects/<project_id>/instances/<instance_id>/backups/<backup_id>/operations/<operation_id>`
  // and can be used to track the progress of the import. The metadata field
  // type is
  // [ImportBackupMetadata][google.spanner.admin.omni.v1.ImportBackupMetadata].
  // The response field type is
  // [google.spanner.admin.database.v1.Backup][google.spanner.admin.database.v1.Backup],
  // if the import is successful.
  rpc ImportBackup(ImportBackupRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "google.spanner.admin.database.v1.Backup"
      metadata_type: "ImportBackupMetadata"
    };
  }

  // Lists the [Rollout][google.spanner.admin.omni.v1.Rollout] history for the
  // deployment.
  rpc ListRollouts(ListRolloutsRequest) returns (ListRolloutsResponse) {}

  // Gets the details of a specific
  // [Rollout][google.spanner.admin.omni.v1.Rollout].
  rpc GetRollout(GetRolloutRequest) returns (Rollout) {
    option (google.api.method_signature) = "name";
  }

  // Schedules a [RolloutPhase][google.spanner.admin.omni.v1.RolloutPhase] to
  // execute immediately or at a specified future time.
  rpc ScheduleRolloutPhase(ScheduleRolloutPhaseRequest) returns (Rollout) {}

  // Terminates a currently `IN_PROGRESS` rollout phase and cancels all future
  // scheduled phases for the specified
  // [Rollout][google.spanner.admin.omni.v1.Rollout].
  rpc AbortRollout(AbortRolloutRequest) returns (Rollout) {}

  // Reverts the changes made by a currently `IN_PROGRESS` phase or the most
  // recently completed phase of the specified
  // [Rollout][google.spanner.admin.omni.v1.Rollout].
  rpc RollbackRollout(RollbackRolloutRequest) returns (Rollout) {}

  // Rotates the internal cryptographic keys used to encrypt and sign tokens.
  // This includes authentication, pagination, and query restart tokens.
  rpc RotateInternalKeys(RotateInternalKeysRequest)
      returns (RotateInternalKeysResponse) {}
}

// Represents a physical location where the machines for one or more zones are
// located.
message Location {
  option (google.api.resource) = {
    type: "spanner.googleapis.com/Location"
    pattern: "locations/{location}"
    plural: "locations"
    singular: "location"
  };

  // The resource name of the location, which must be of the form
  // `locations/<id>`.
  //
  // The ID must start with a letter, end with a letter or a digit, and
  // contain only letters, digits, underscores, and dashes.
  //
  // Optionally, the ID may be preceded with a domain name and a colon.
  //
  // The name `locations/default` is reserved for a location that is
  // automatically created and always exists.
  //
  // Examples:
  //   `locations/my-datacenter`
  //   `locations/cloud.google.com:us-east1`
  string name = 1;
}

// Represents the network distance between two locations.
message LocationDistance {
  option (google.api.resource) = {
    type: "spanner.googleapis.com/LocationDistance"
    pattern: "locations/{location}/distances/{distance}"
    plural: "locationDistances"
    singular: "locationDistance"
  };

  // The resource name of the distance between two locations, which must be of
  // the form `locations/<id>/distances/<other_id>`.
  //
  // Examples:
  //   `locations/my-datacenter/distances/my-other-datacenter`
  //   `locations/cloud.google.com:us-east1/distances/cloud.google.com:us-west1`
  string name = 1;

  // The one-way network latency between the two locations. If omitted, the
  // latency is assumed to be negligible (sub-millisecond).
  //
  // Latency in the real world is not necessarily symmetric, so if both
  // `(src, dest)` and `(dest, src)` are provided, each value is honored for its
  // respective direction. If only one direction is provided, the reverse
  // direction is assumed to have the same latency.
  google.protobuf.Duration latency = 3;
}

// A zone is a grouping of servers that are in the same physical
// [Location][google.spanner.admin.omni.v1.Location]. A database may have a
// replica placed in a zone; a replicated database is replicated across multiple
// zones.
message Zone {
  option (google.api.resource) = {
    type: "spanner.googleapis.com/Zone"
    pattern: "zones/{zone}"
    plural: "zones"
    singular: "zone"
  };

  // Indicates the type of database replica hosted in the zone.
  enum ReplicaType {
    // The replica type is unspecified.
    REPLICA_TYPE_UNSPECIFIED = 0;

    // Read-write replicas store a complete copy of the data, serve read
    // requests, and vote in Paxos quorums. They are eligible to become leaders
    // to propose writes.
    READ_WRITE = 1;

    // Witness replicas vote in Paxos quorums but cannot become leaders. They do
    // not store a full copy of the data and therefore cannot serve read
    // requests. They are useful for maintaining quorum and reducing write
    // latency without full storage overhead.
    WITNESS = 2;

    // Read-only replicas store a complete copy of the data, asynchronously
    // updated by leaders, but cannot become leaders and do not vote in Paxos
    // quorums. They serve read requests to offload read traffic from
    // `READ_WRITE` replicas.
    READ_ONLY = 3;
  }

  // Represents the current lifecycle state of the zone.
  enum State {
    // The state is unspecified.
    STATE_UNSPECIFIED = 0;

    // The zone is fully created and operational.
    READY = 1;

    // The zone is in the process of being created.
    CREATING = 2;

    // The zone is in the process of being deleted.
    DELETING = 3;
  }

  // The resource name of the zone, which must be of the form `zones/<id>`.
  //
  // The ID must start with a letter, end with a letter or a digit, and
  // contain only letters, digits, underscores, and dashes.
  //
  // Optionally, the ID may be preceded with a domain name and a colon.
  //
  // Examples:
  //   `zones/my-datacenter`
  //   `zones/cloud.google.com:us-east1-a`
  string name = 1;

  // The resource name of the [Location][google.spanner.admin.omni.v1.Location]
  // where the zone is physically located. If omitted, the zone is placed in
  // `locations/default`, which is assumed to have zero network distance from
  // other locations.
  string location = 2;

  // Indicates whether this zone is a designated single-server zone. If `true`,
  // the zone can only ever have one root server and no other servers. If
  // `false`, the zone can have multiple root and non-root servers.
  // Single-server zones are suited for development, testing, and permanently
  // low-scale workloads because they eliminate the overhead of replicating zone
  // metadata.
  bool single_server = 3;

  // The root servers in the zone. Root servers store zone metadata and manage
  // membership of other servers in the zone; if a quorum of root servers
  // becomes unavailable, the entire zone becomes unavailable. It is a best
  // practice to configure an odd number of root servers, and generally no more
  // than five. For any zone with more than three servers in total, at least
  // three root servers are recommended.
  repeated Server root_servers = 4;

  // The type of replica hosted in the zone. Defaults to
  // [READ_WRITE][google.spanner.admin.omni.v1.Zone.ReplicaType.READ_WRITE] if
  // unspecified.
  ReplicaType replica_type = 5;

  // Output only. The current lifecycle state of the zone.
  State state = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents a server within a [Zone][google.spanner.admin.omni.v1.Zone].
// Servers can be root servers or non-root servers. Root servers have special
// responsibilities for the upkeep of a zone; every zone must have at least one
// root server, and ideally three. Most servers in large zones should be
// non-root servers.
message Server {
  option (google.api.resource) = {
    type: "spanner.googleapis.com/Server"
    pattern: "zones/{zone}/servers/{server}"
    plural: "servers"
    singular: "server"
  };

  // Represents the current lifecycle state of the server.
  enum State {
    // The state is unspecified.
    STATE_UNSPECIFIED = 0;

    // The server is operational and ready to serve traffic.
    READY = 1;

    // The server is being created and will be ready soon.
    CREATING = 2;

    // The server is being drained and deleted, and will be removed soon.
    DELETING = 3;
  }

  // The resource name of the server, which must be of the form
  // `zones/<id>/servers/<host>:<port_base>`.
  //
  // Examples:
  //   `zones/my-datacenter/servers/10.0.0.1:15000`
  //   `zones/cloud.google.com:us-east1-a/servers/10.0.0.1:15000`
  string name = 1;

  // The hostname or IP address of the server.
  string host = 2;

  // The base port number used by this server. This port serves as the public
  // gRPC port to which Spanner clients connect. Ports in the range
  // `[port_base + 1, port_base + 31]` must be reserved for Spanner's internal
  // use; even if some ports in this range are unused today, they may be
  // required by future versions of the software.
  int32 port_base = 3;

  // Indicates whether this server is a root server. If `true`, this server is
  // a root server and also appears in its zone's
  // [root_servers][google.spanner.admin.omni.v1.Zone.root_servers] list.
  bool root = 4;

  // Output only. The current lifecycle state of the server.
  State state = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents external storage backed by Cloud Storage.
message GcsExternalStorage {
  // Required. The name of the Cloud Storage bucket. Example:
  // `"spanner-test-bucket"`.
  string bucket = 1;
}

// Represents external storage backed by Amazon S3.
message S3ExternalStorage {
  // The authentication configuration for accessing the Amazon S3 bucket. Access
  // can be configured using either of the following mechanisms:
  //
  // 1. `assume_role_arn`: Spanner assumes the specified AWS IAM role to access
  //    the S3 bucket. The Spanner service account must have the
  //    `sts:AssumeRoleWithWebIdentity` permission.
  // 2. `credential_file_path`: Spanner reads AWS credentials from a local file
  //    at the specified path.
  message S3AuthConfig {
    // Optional. The Amazon Resource Name (ARN) of the IAM role that Spanner
    // assumes to access the S3 bucket.
    string assume_role_arn = 1;

    // Optional. The path to the local credential file used for S3 operations.
    // The file must contain the following entries:
    //
    //   `ACCESS_KEY_ID: <access_key_id>`
    //   `ACCESS_KEY_SECRET: <access_key_secret>`
    //
    // When using temporary credentials, the following line must also be
    // included:
    //
    //   `SESSION_TOKEN: <session_token>`
    //
    // * `<access_key_id>` is the unique identifier for the AWS IAM user or
    //   role.
    // * `<access_key_secret>` is the secret cryptographic key paired with
    //   `<access_key_id>` used to sign AWS API requests.
    // * `<session_token>` (optional) must be provided when using temporary
    //   security credentials and omitted when using long-term credentials.
    //
    // Spanner does not automatically refresh credentials in the credential
    // file. If the credentials expire, Spanner is unable to access the S3
    // storage. The Spanner process user must have read permission on the file.
    string credential_file_path = 2;

    // Optional. Custom or regional AWS Security Token Service (STS) endpoint
    // URL (for example, `"https://sts.us-east-1.amazonaws.com"` or a VPC
    // Interface Endpoint URL). If unset, Spanner dynamically resolves the
    // regional STS endpoint matching the S3 bucket's region, or falls back to
    // `"https://sts.amazonaws.com"`.
    string sts_endpoint = 3;

    // Optional. The audience (`aud` claim) requested when fetching the OIDC
    // JWT identity token for AWS STS `AssumeRoleWithWebIdentity`. This value
    // must match one of the client IDs or audiences configured in the target
    // AWS IAM OIDC Identity Provider. Defaults to `"https://sts.amazonaws.com"`
    // if unset.
    string jwt_audience = 4;
  }

  // Required. The name of the Amazon S3 bucket. Example:
  // `"spanner-test-bucket"`.
  string bucket = 1;

  // Required. The authentication configuration for accessing the S3 bucket.
  S3AuthConfig auth_config = 2;

  // Required. The AWS region of the S3 bucket. Example: `"us-east-1"`.
  string region = 3;

  // Optional. Custom S3 endpoint URL (for example,
  // `"https://bucket.vpce-0123456789abcdef0-s3.us-east-1.vpce.amazonaws.com"`
  // or `"https://s3.cn-north-1.amazonaws.com.cn"`). If unset, Spanner defaults
  // to `"https://s3.<region>.amazonaws.com"`.
  string endpoint = 4;
}

// Represents external storage backed by any storage provider compatible with
// Amazon S3 APIs.
message S3CompatibleExternalStorage {
  // The authentication configuration for accessing the S3-compatible storage.
  message S3CompatibleAuthConfig {
    // Required. The path to the local credential file for the S3-compatible
    // storage. The file must contain the following entries:
    //
    //   `ACCESS_KEY_ID: <access_key_id>`
    //   `ACCESS_KEY_SECRET: <access_key_secret>`
    //
    // When using temporary credentials, the following line must also be
    // included:
    //
    //   `SESSION_TOKEN: <session_token>`
    //
    // * `<access_key_id>` is the unique identifier for the IAM user or role.
    // * `<access_key_secret>` is the secret cryptographic key paired with
    //   `<access_key_id>` used to sign S3 API requests.
    // * `<session_token>` (optional) must be provided when using temporary
    //   credentials and omitted when using long-term credentials.
    //
    // Spanner does not automatically refresh credentials in the credential
    // file. If the credentials expire, Spanner is unable to access the
    // S3-compatible storage. The Spanner process user must have read permission
    // on the file.
    string credential_file_path = 1;
  }

  // Required. The name of the S3-compatible storage bucket. Example:
  // `"spanner-test-bucket"`.
  string bucket = 1;

  // Required. The authentication configuration for accessing the S3-compatible
  // storage.
  S3CompatibleAuthConfig auth_config = 2;

  // Required. The endpoint URL of the S3-compatible storage. Example:
  // `"https://my-storage-that-supports-s3-apis.com"`.
  string endpoint = 3;
}

// Represents remote storage outside of the Spanner Omni deployment that can be
// used for storing and importing Spanner database backups.
message ExternalStorage {
  option (google.api.resource) = {
    type: "spanner.googleapis.com/ExternalStorage"
    pattern: "externalStorages/{external_storage}"
    plural: "externalStorages"
    singular: "externalStorage"
  };

  // The resource name of the external storage, which must be of the form
  // `externalStorages/<id>`.
