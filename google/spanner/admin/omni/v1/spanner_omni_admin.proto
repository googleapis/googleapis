// Represents a software rollout for the deployment.
message Rollout {
  option (google.api.resource) = {
    type: "spanner.googleapis.com/Rollout"
    pattern: "rollouts/{rollout}"
    plural: "rollouts"
    singular: "rollout"
  };

  // Enumerates the possible states of a rollout or rollout phase.
  enum State {
    // The state is unspecified.
    STATE_UNSPECIFIED = 0;

    // The rollout or phase is pending execution.
    PENDING = 1;

    // The rollout phase is scheduled to run at a future time.
    SCHEDULED = 2;

    // The rollout or phase is currently active.
    IN_PROGRESS = 3;

    // The rollout or phase completed successfully.
    SUCCEEDED = 4;

    // The rollout or phase encountered an error and failed.
    FAILED = 5;

    // A rollback of the rollout or phase is currently in progress.
    ROLLING_BACK = 6;

    // The rollout or phase has been rolled back.
    ROLLED_BACK = 7;

    // The rollout or phase was aborted.
    ABORTED = 8;
  }

  // Identifier. The resource name of the rollout, of the form
  // `rollouts/<rollout_id>`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Immutable. The target version being deployed.
  string target_version = 2 [(google.api.field_behavior) = IMMUTABLE];

  // Output only. The time when the overall rollout started.
  google.protobuf.Timestamp start_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time when the overall rollout completed.
  google.protobuf.Timestamp end_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The consolidated lifecycle state of the rollout.
  State state = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The sequence of rollout phases executed and scheduled.
  repeated RolloutPhase phases = 6;

  // Immutable. The version deployed before this rollout started.
  string source_version = 7 [(google.api.field_behavior) = IMMUTABLE];
}

// Represents details for a specific phase within a
// [Rollout][google.spanner.admin.omni.v1.Rollout].
message RolloutPhase {
  option (google.api.resource) = {
    type: "spanner.googleapis.com/RolloutPhase"
    pattern: "rollouts/{rollout}/phases/{phase}/rounds/{round}"
  };

  // Identifier. The resource name of the rollout phase, of the form
  // `rollouts/<rollout_id>/phases/<phase_type>/rounds/<round_num>`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The current lifecycle state of this phase.
  Rollout.State state = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time when the phase started execution.
  google.protobuf.Timestamp start_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time when the phase finished execution.
  google.protobuf.Timestamp end_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time when this phase is scheduled to run.
  google.protobuf.Timestamp scheduled_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The detailed execution status of the phase.
  google.rpc.Status status = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

