syntax = "proto3";

package google.ads.googleads.v25.errors;

option csharp_namespace = "Google.Ads.GoogleAds.V25.Errors";
option go_package = "google.golang.org/genproto/googleapis/ads/googleads/v25/errors;errors";
option java_multiple_files = true;
option java_outer_classname = "BusinessProfileLocationSyncErrorProto";
option java_package = "com.google.ads.googleads.v25.errors";
option objc_class_prefix = "GAA";
option php_namespace = "Google\\Ads\\GoogleAds\\V25\\Errors";
option ruby_package = "Google::Ads::GoogleAds::V25::Errors";

// Proto file describing business profile location sync errors.

// Container for enum describing possible Business Profile location sync errors.
message BusinessProfileLocationSyncErrorEnum {
  // Enum describing possible Business Profile location sync errors.
  enum BusinessProfileLocationSyncError {
    // Enum unspecified.
    UNSPECIFIED = 0;

    // The received error code is not known in this version.
    UNKNOWN = 1;

    // The email provided in the LocationSync typed AssetSet is invalid.
    EMAIL_INVALID = 2;

    // The OAuth token in the LocationSync typed AssetSet is invalid.
    OAUTH_TOKEN_INVALID = 3;

    // The email provided in the LocationSync typed AssetSet is removed.
    ACCOUNT_REMOVED = 4;

    // The LocationSync typed AssetSet doesn't have access to location account.
    NO_PERMISSION_TO_ACCESS_LOCATION_ACCOUNT = 5;
  }
}
