syntax = "proto3";

package google.ads.googleads.v25.enums;

option csharp_namespace = "Google.Ads.GoogleAds.V25.Enums";
option go_package = "google.golang.org/genproto/googleapis/ads/googleads/v25/enums;enums";
option java_multiple_files = true;
option java_outer_classname = "BenchmarksCustomerPercentileTierProto";
option java_package = "com.google.ads.googleads.v25.enums";
option objc_class_prefix = "GAA";
option php_namespace = "Google\\Ads\\GoogleAds\\V25\\Enums";
option ruby_package = "Google::Ads::GoogleAds::V25::Enums";

// Proto file describing customer percentile tiers for the Benchmarks Service.

// Container for enum describing customer percentile tiers for the Benchmarks
// Service.
message BenchmarksCustomerPercentileTierEnum {
  // Customer percentile tiers for the Benchmarks Service.
  enum BenchmarksCustomerPercentileTier {
    // Not specified.
    UNSPECIFIED = 0;

    // The value is unknown in this version.
    UNKNOWN = 1;

    // Developing: The customer ranks below the 10th percentile among
    // advertisers scoped by the analysis. Range: [0%, 10%).
    DEVELOPING = 2;

    // Entry level: The customer ranks in the 10th to 25th percentile among
    // advertisers scoped by the analysis. Range: [10%, 25%).
    ENTRY_LEVEL = 3;

    // Emerging Player: The customer ranks in the 25th to 50th percentile among
    // advertisers scoped by the analysis. Range: [25%, 50%).
    EMERGING_PLAYER = 4;

    // Competitor: The customer ranks in the 50th to 75th percentile among
    // advertisers scoped by the analysis. Range: [50%, 75%).
    COMPETITOR = 5;

    // Strong competitor: The customer ranks in the 75th to 90th percentile
    // among advertisers scoped by the analysis. Range: [75%, 90%).
    STRONG_COMPETITOR = 6;

    // Market leader: The customer ranks at or above the 90th percentile among
    // advertisers scoped by the analysis. Range: [90%, 100%].
    MARKET_LEADER = 7;
  }
}
