syntax = "proto3";

package google.ads.googleads.v25.enums;

option csharp_namespace = "Google.Ads.GoogleAds.V25.Enums";
option go_package = "google.golang.org/genproto/googleapis/ads/googleads/v25/enums;enums";
option java_multiple_files = true;
option java_outer_classname = "BenchmarksSupplementalDataProto";
option java_package = "com.google.ads.googleads.v25.enums";
option objc_class_prefix = "GAA";
option php_namespace = "Google\\Ads\\GoogleAds\\V25\\Enums";
option ruby_package = "Google::Ads::GoogleAds::V25::Enums";

// Proto file describing enums for requesting supplemental data in the
// Benchmarks Service.

// Container for enum describing supplemental data for the Benchmarks Service.
message BenchmarksSupplementalDataEnum {
  // Supplemental data for the Benchmarks Service.
  enum BenchmarksSupplementalData {
    // Not specified.
    UNSPECIFIED = 0;

    // The value is unknown in this version.
    UNKNOWN = 1;

    // Populate percentile data in
    // [BenchmarksService.GenerateBenchmarksMetrics][google.ads.googleads.v25.services.BenchmarksService.GenerateBenchmarksMetrics].
    // Percentile data represents the customer's competitive standing among
    // other advertisers scoped by the analysis.
    PERCENTILE_DATA = 2;
  }
}
