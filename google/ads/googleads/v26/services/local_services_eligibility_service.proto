syntax = "proto3";

package google.ads.googleads.v26.services;

import "google/ads/googleads/v26/enums/local_services_lead_type.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";

option csharp_namespace = "Google.Ads.GoogleAds.V26.Services";
option go_package = "google.golang.org/genproto/googleapis/ads/googleads/v26/services;services";
option java_multiple_files = true;
option java_outer_classname = "LocalServicesEligibilityServiceProto";
option java_package = "com.google.ads.googleads.v26.services";
option objc_class_prefix = "GAA";
option php_namespace = "Google\\Ads\\GoogleAds\\V26\\Services";
option ruby_package = "Google::Ads::GoogleAds::V26::Services";

// Proto file describing the Local Services service.

// This service allows eligibility checking and discovery of category/job type
// details for Local Services.
service LocalServicesEligibilityService {
  option (google.api.default_host) = "googleads.googleapis.com";
  option (google.api.oauth_scopes) = "https://www.googleapis.com/auth/adwords";

  // Returns the Local Services eligibility status and valid categories for a
  // given Customer and GBP Listing ID.
  rpc CheckLocalServicesEligibility(CheckLocalServicesEligibilityRequest)
      returns (CheckLocalServicesEligibilityResponse) {
    option (google.api.http) = {
      post: "/v26/customers/{customer_id=*}:checkLocalServicesEligibility"
      body: "*"
    };
    option (google.api.method_signature) = "customer_id,listing_id";
  }
}

// Request message for
// [LocalServicesEligibilityService.CheckLocalServicesEligibility][google.ads.googleads.v26.services.LocalServicesEligibilityService.CheckLocalServicesEligibility].
message CheckLocalServicesEligibilityRequest {
  // Required. The ID of the customer whose eligibility is being checked.
  string customer_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The Google Business Profile listing ID to check eligibility for.
  string listing_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response message for
// [LocalServicesEligibilityService.CheckLocalServicesEligibility][google.ads.googleads.v26.services.LocalServicesEligibilityService.CheckLocalServicesEligibility].
message CheckLocalServicesEligibilityResponse {
  // Overall eligibility status of the customer.
  optional bool eligible = 1;

  // Detailed suggestion reasons for checking eligibility (e.g. licensing
  // issues).
  repeated SuggestionReason suggestion_reasons = 2;

  // List of eligible goals mapped to their categories.
  repeated EligibleGoal eligible_goals = 3;
}

// Suggestion reason details.
message SuggestionReason {
  // Short summary text explaining the reason.
  string short_text = 1;

  // Detailed long text description.
  string long_text = 2;
}

// Eligible goal mapping details.
message EligibleGoal {
  // Eligible lead type.
  google.ads.googleads.v26.enums.LocalServicesLeadTypeEnum.LeadType lead_type =
      1;

  // Eligible categories for this lead type.
  repeated EligibleCategory categories = 2;
}

// Eligible category information.
message EligibleCategory {
  // The unique identifier for the service category. For example,
  // 'xcat:service_area_business_plumber'.
  string category_id = 1;

  // The localized display name of the category. For example, 'Plumber'.
  string display_name = 2;

  // The list of available job type IDs for this category. For example,
  // 'install_faucet', 'drain_cleaning'.
  repeated string job_types = 3;

  // The list of available business callout IDs for this category. For
  // example, 'family_owned', '24_7_service'.
  repeated string callouts = 4;
}
