syntax = "proto3";

package google.ads.googleads.v26.enums;

option csharp_namespace = "Google.Ads.GoogleAds.V26.Enums";
option go_package = "google.golang.org/genproto/googleapis/ads/googleads/v26/enums;enums";
option java_multiple_files = true;
option java_outer_classname = "YoutubeVideoUploadGenerativeContentDisclosureProto";
option java_package = "com.google.ads.googleads.v26.enums";
option objc_class_prefix = "GAA";
option php_namespace = "Google\\Ads\\GoogleAds\\V26\\Enums";
option ruby_package = "Google::Ads::GoogleAds::V26::Enums";

// Proto file describing YouTube video upload generative content disclosure.

// Container for enum describing the generative content disclosure status of a
// YouTube video.
message YouTubeVideoUploadGenerativeContentDisclosureEnum {
  // Describes the generative content disclosure status of a YouTube video.
  enum YouTubeVideoUploadGenerativeContentDisclosure {
    // Not specified.
    UNSPECIFIED = 0;

    // The value is unknown in this version.
    UNKNOWN = 1;

    // The advertiser disclosed the video as non-AI generated.
    NON_GENERATIVE_CONTENT = 2;

    // The advertiser disclosed the video as AI generated.
    GENERATIVE_CONTENT = 3;
  }
}
