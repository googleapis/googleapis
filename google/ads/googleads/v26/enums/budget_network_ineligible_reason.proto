syntax = "proto3";

package google.ads.googleads.v26.enums;

option csharp_namespace = "Google.Ads.GoogleAds.V26.Enums";
option go_package = "google.golang.org/genproto/googleapis/ads/googleads/v26/enums;enums";
option java_multiple_files = true;
option java_outer_classname = "BudgetNetworkIneligibleReasonProto";
option java_package = "com.google.ads.googleads.v26.enums";
option objc_class_prefix = "GAA";
option php_namespace = "Google\\Ads\\GoogleAds\\V26\\Enums";
option ruby_package = "Google::Ads::GoogleAds::V26::Enums";

// Proto file describing reasons why a campaign budget is ineligible for budget
// network settings.

// Container for enum describing reasons why a campaign budget is ineligible for
// budget network settings.
message BudgetNetworkIneligibleReasonEnum {
  // Reasons why a budget is ineligible for waterfall or budget cap allocation.
  enum BudgetNetworkIneligibleReason {
    // Not specified.
    UNSPECIFIED = 0;

    // Used for return value only. Represents value unknown in this version.
    UNKNOWN = 1;

    // Associated campaign(s) use an unsupported bidding strategy.
    UNSUPPORTED_BIDDING_STRATEGY = 2;

    // Shared budget is associated with campaigns of mixed advertising channel
    // types.
    MIXED_CAMPAIGN_TYPES = 3;

    // Associated campaign(s) have active experiments/trials.
    HAS_ENABLED_TRIALS = 4;

    // Budget uses a custom period.
    UNSUPPORTED_BUDGET_PERIOD = 5;

    // Shared budget is associated with campaigns of mixed bidding strategy
    // types.
    MIXED_BIDDING_STRATEGIES = 6;

    // Budget does not have all required network channels enabled.
    INSUFFICIENT_ELIGIBLE_CHANNELS = 7;
  }
}
