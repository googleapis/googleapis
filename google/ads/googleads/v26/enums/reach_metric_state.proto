syntax = "proto3";

package google.ads.googleads.v26.enums;

option csharp_namespace = "Google.Ads.GoogleAds.V26.Enums";
option go_package = "google.golang.org/genproto/googleapis/ads/googleads/v26/enums;enums";
option java_multiple_files = true;
option java_outer_classname = "ReachMetricStateProto";
option java_package = "com.google.ads.googleads.v26.enums";
option objc_class_prefix = "GAA";
option php_namespace = "Google\\Ads\\GoogleAds\\V26\\Enums";
option ruby_package = "Google::Ads::GoogleAds::V26::Enums";

// Proto file describing ReachMetricState enum.

// Container for enum with additional information about reach metrics.
message ReachMetricStateEnum {
  // Enum listing all possible reach metric states.
  enum ReachMetricState {
    // Not specified.
    UNSPECIFIED = 0;

    // Represents unknown value.
    UNKNOWN = 1;

    // The corresponding reach metric is complete. Meaning that there was no
    // suppression due to privacy, quality or any other reason.
    COMPLETE = 2;

    // The reach metrics were suppressed due to privacy reasons.
    PRIVACY_SUPPRESSION = 3;

    // The reach metrics were suppressed due to quality reasons.
    QUALITY_SUPPRESSION = 4;

    // The reach metric is low quality.
    LOW_QUALITY = 5;

    // The reach metrics are unavailable because the selected date range is
    // beyond the data retention period of 3 years.
    DATE_RANGE_BEYOND_RETENTION = 6;
  }
}
