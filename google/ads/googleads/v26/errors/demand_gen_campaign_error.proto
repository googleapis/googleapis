syntax = "proto3";

package google.ads.googleads.v26.errors;

option csharp_namespace = "Google.Ads.GoogleAds.V26.Errors";
option go_package = "google.golang.org/genproto/googleapis/ads/googleads/v26/errors;errors";
option java_multiple_files = true;
option java_outer_classname = "DemandGenCampaignErrorProto";
option java_package = "com.google.ads.googleads.v26.errors";
option objc_class_prefix = "GAA";
option php_namespace = "Google\\Ads\\GoogleAds\\V26\\Errors";
option ruby_package = "Google::Ads::GoogleAds::V26::Errors";

// Proto file describing Demand Gen campaign errors.

// Container for enum describing possible Demand Gen campaign errors.
message DemandGenCampaignErrorEnum {
  // Enum describing possible Demand Gen campaign errors.
  enum DemandGenCampaignError {
    // Enum unspecified.
    UNSPECIFIED = 0;

    // The received error code is not known in this version.
    UNKNOWN = 1;

    // Cannot activate a migrated campaign before the original campaign is
    // removed. In addition, only one migrated campaign for each original
    // campaign can be activated at a time.
    CANNOT_ACTIVATE_MIGRATED_CAMPAIGN = 2;
  }
}
