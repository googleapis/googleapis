syntax = "proto3";

package google.ads.googleads.v26.resources;

import "google/ads/googleads/v26/common/criteria.proto";
import "google/ads/googleads/v26/enums/bid_modifier_source.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Ads.GoogleAds.V26.Resources";
option go_package = "google.golang.org/genproto/googleapis/ads/googleads/v26/resources;resources";
option java_multiple_files = true;
option java_outer_classname = "AdGroupBidModifierProto";
option java_package = "com.google.ads.googleads.v26.resources";
option objc_class_prefix = "GAA";
option php_namespace = "Google\\Ads\\GoogleAds\\V26\\Resources";
option ruby_package = "Google::Ads::GoogleAds::V26::Resources";

// Proto file describing the ad group bid modifier resource.

// Represents an ad group bid modifier.
message AdGroupBidModifier {
  option (google.api.resource) = {
    type: "googleads.googleapis.com/AdGroupBidModifier"
    pattern: "customers/{customer_id}/adGroupBidModifiers/{ad_group_id}~{criterion_id}"
  };

  // Immutable. The resource name of the ad group bid modifier.
  // Ad group bid modifier resource names have the form:
  //
  // `customers/{customer_id}/adGroupBidModifiers/{ad_group_id}~{criterion_id}`
  string resource_name = 1 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference) = {
      type: "googleads.googleapis.com/AdGroupBidModifier"
    }
  ];

  // Immutable. The ad group to which this criterion belongs.
  optional string ad_group = 13 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference) = {
      type: "googleads.googleapis.com/AdGroup"
    }
  ];

  // Output only. The ID of the criterion to bid modify.
  //
  // This field is ignored for mutates.
  optional int64 criterion_id = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The modifier for the bid when the criterion matches. The modifier must be
  // in the range: 0.1 - 10.0. Use 0 to opt out of a Device type.
  optional double bid_modifier = 15;

  // Output only. The base ad group from which this draft/trial adgroup bid
  // modifier was created. If ad_group is a base ad group then this field will
  // be equal to ad_group. If the ad group was created in the draft or trial and
  // has no corresponding base ad group, then this field will be null. This
  // field is readonly.
  optional string base_ad_group = 16 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
      type: "googleads.googleapis.com/AdGroup"
    }
  ];

  // Output only. Bid modifier source.
  google.ads.googleads.v26.enums.BidModifierSourceEnum.BidModifierSource
      bid_modifier_source = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The criterion of this ad group bid modifier.
  //
  // Required in create operations starting in V5.
  oneof criterion {
    // Immutable. A device criterion.
    google.ads.googleads.v26.common.DeviceInfo device = 11
        [(google.api.field_behavior) = IMMUTABLE];

    // Immutable. Criterion for the date selection (default dates versus user
    // selected).
    google.ads.googleads.v26.common.UserSetDatesInfo user_set_dates = 18
        [(google.api.field_behavior) = IMMUTABLE];

    // Immutable. Criterion for the number of days prior to the start date of
    // the booking.
    google.ads.googleads.v26.common.AdvanceBookingWindowInfo
        advance_booking_window = 19 [(google.api.field_behavior) = IMMUTABLE];

    // Immutable. Criterion for the length of the booking in days.
    google.ads.googleads.v26.common.LengthOfBookingInfo length_of_booking = 20
        [(google.api.field_behavior) = IMMUTABLE];

    // Immutable. Criterion for the day of the week of the booking start date.
    google.ads.googleads.v26.common.StartDayOfWeekInfo start_day_of_week = 21
        [(google.api.field_behavior) = IMMUTABLE];

    // Immutable. Criterion for the date range of the start of the booking.
    google.ads.googleads.v26.common.StartDateRangeInfo start_date_range = 22
        [(google.api.field_behavior) = IMMUTABLE];
  }
}
