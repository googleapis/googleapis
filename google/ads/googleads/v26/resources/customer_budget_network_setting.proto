syntax = "proto3";

package google.ads.googleads.v26.resources;

import "google/ads/googleads/v26/common/budget_network_common.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Ads.GoogleAds.V26.Resources";
option go_package = "google.golang.org/genproto/googleapis/ads/googleads/v26/resources;resources";
option java_multiple_files = true;
option java_outer_classname = "CustomerBudgetNetworkSettingProto";
option java_package = "com.google.ads.googleads.v26.resources";
option objc_class_prefix = "GAA";
option php_namespace = "Google\\Ads\\GoogleAds\\V26\\Resources";
option ruby_package = "Google::Ads::GoogleAds::V26::Resources";

// Proto file describing the CustomerBudgetNetworkSetting resource.

// Account-level default waterfall priorities and budget caps. Applies to every
// campaign budget whose `budget_network_settings` is unset.
message CustomerBudgetNetworkSetting {
  option (google.api.resource) = {
    type: "googleads.googleapis.com/CustomerBudgetNetworkSetting"
    pattern: "customers/{customer_id}/customerBudgetNetworkSettings"
  };

  // Immutable. The resource name of the customer budget network setting.
  // Customer budget network setting resource names have the form:
  //
  // `customers/{customer_id}/customerBudgetNetworkSettings`
  string resource_name = 1 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference) = {
      type: "googleads.googleapis.com/CustomerBudgetNetworkSetting"
    }
  ];

  // Account default settings, at most one entry per advertising channel type.
  google.ads.googleads.v26.common.BudgetNetworkSettings
      budget_network_settings = 2;
}
