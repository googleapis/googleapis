syntax = "proto3";

package google.ads.googleads.v26.common;

import "google/ads/googleads/v26/enums/advertising_channel_type.proto";
import "google/ads/googleads/v26/enums/budget_network_ineligible_reason.proto";
import "google/ads/googleads/v26/enums/channel_priority_tier.proto";
import "google/ads/googleads/v26/enums/network_channel_type.proto";
import "google/api/field_behavior.proto";

option csharp_namespace = "Google.Ads.GoogleAds.V26.Common";
option go_package = "google.golang.org/genproto/googleapis/ads/googleads/v26/common;common";
option java_multiple_files = true;
option java_outer_classname = "BudgetNetworkCommonProto";
option java_package = "com.google.ads.googleads.v26.common";
option objc_class_prefix = "GAA";
option php_namespace = "Google\\Ads\\GoogleAds\\V26\\Common";
option ruby_package = "Google::Ads::GoogleAds::V26::Common";

// Proto file describing shared budget network messages.

// Container for budget network settings (waterfall channel prioritization and
// budget allocation).
message BudgetNetworkSettings {
  // List of network allocation settings per advertising channel type. Each
  // advertising channel type can appear at most once in this list.
  repeated BudgetNetworkSetting settings = 1;
}

// Budget allocation setting for a specific advertising channel type (e.g.,
// SEARCH, SHOPPING, PERFORMANCE_MAX).
message BudgetNetworkSetting {
  // The advertising channel type this setting applies to (e.g., SEARCH,
  // SHOPPING, or PERFORMANCE_MAX).
  google.ads.googleads.v26.enums.AdvertisingChannelTypeEnum
      .AdvertisingChannelType advertising_channel_type = 1;

  // Budget caps restricting spend per secondary network channel. Caps can only
  // be applied to channels assigned to secondary priority tiers, and each
  // network channel can appear at most once in this list.
  repeated BudgetCapConfig budget_caps = 2;

  // Waterfall priority tiers per network channel.
  repeated ChannelPriorityConfig channel_priorities = 3;
}

// Configures a maximum percentage of the total budget that a network channel
// can spend.
message BudgetCapConfig {
  // The network channel being capped.
  google.ads.googleads.v26.enums.NetworkChannelTypeEnum.NetworkChannelType
      network_channel = 1;

  // The maximum percentage of the total budget that this network channel can
  // spend, specified in milli-percent units (for example, 100,000 = 100%,
  // 50,000 = 50%, and 1,000 = 1%). Valid range is 0 to 100,000, where 0
  // represents a complete 0% opt-out.
  optional int64 cap_percent_millis = 2;
}

// Configures which network channels belong to a priority tier.
message ChannelPriorityConfig {
  // The priority tier (e.g., TIER1, TIER2).
  google.ads.googleads.v26.enums.ChannelPriorityTierEnum.ChannelPriorityTier
      priority_tier = 1;

  // The network channels assigned to this priority tier.
  repeated
      google.ads.googleads.v26.enums.NetworkChannelTypeEnum.NetworkChannelType
          network_channels = 2;
}

// Read-only eligibility status and reasons for budget network allocation on a
// CampaignBudget.
message BudgetNetworkEligibility {
  // Output only. True if the budget is eligible for waterfall and budget cap
  // allocation.
  optional bool eligible = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Reasons why the budget is ineligible, if eligible is false.
  repeated google.ads.googleads.v26.enums.BudgetNetworkIneligibleReasonEnum
      .BudgetNetworkIneligibleReason ineligible_reasons = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];
}
