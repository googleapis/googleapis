syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/targeting.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "TrafficForecastSegmentMessagesProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// An entity that defines a segment of traffic that will be adjusted or
// explored.
message TrafficForecastSegment {
  option (google.api.resource) = {
    type: "admanager.googleapis.com/TrafficForecastSegment"
    pattern: "networks/{network_code}/trafficForecastSegments/{traffic_forecast_segment}"
    plural: "trafficForecastSegments"
    singular: "trafficForecastSegment"
  };

  // Identifier. The resource name of the `TrafficForecastSegment`.
  // Format:
  // `networks/{network_code}/trafficForecastSegments/{trafficForecastSegmentId}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. Name of the TrafficForecastSegment. This field must be unique
  // among all segments for this network.
  optional string display_name = 3 [(google.api.field_behavior) = REQUIRED];

  // Required. Immutable. The targeting that defines a segment of traffic.
  optional Targeting targeting = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Output only. The number of active forecast adjustments associated with the
  // TrafficForecastSegment.
  optional int32 forecast_adjustment_count = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The date and time that the TrafficForecastSegment was created.
  optional google.protobuf.Timestamp create_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The ad units that are targeted by the TrafficForecastSegment.
  repeated string targeted_ad_units = 20 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/AdUnit"
    }
  ];
}
