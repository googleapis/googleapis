// Provides methods for handling `TrafficForecastSegment` objects.
service TrafficForecastSegmentService {
  option (google.api.default_host) = "admanager.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/admanager,"
      "https://www.googleapis.com/auth/admanager.readonly";

  // Retrieves a `TrafficForecastSegment` object.
  rpc GetTrafficForecastSegment(GetTrafficForecastSegmentRequest)
      returns (TrafficForecastSegment) {
    option (google.api.http) = {
      get: "/v1/{name=networks/*/trafficForecastSegments/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists `TrafficForecastSegment` objects.
  rpc ListTrafficForecastSegments(ListTrafficForecastSegmentsRequest)
      returns (ListTrafficForecastSegmentsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=networks/*}/trafficForecastSegments"
    };
    option (google.api.method_signature) = "parent";
  }

  // Creates a `TrafficForecastSegment` object.
  rpc CreateTrafficForecastSegment(CreateTrafficForecastSegmentRequest)
      returns (TrafficForecastSegment) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/trafficForecastSegments"
      body: "traffic_forecast_segment"
    };
    option (google.api.method_signature) = "parent,traffic_forecast_segment";
  }

  // Creates `TrafficForecastSegment` objects.
  rpc BatchCreateTrafficForecastSegments(
      BatchCreateTrafficForecastSegmentsRequest)
      returns (BatchCreateTrafficForecastSegmentsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/trafficForecastSegments:batchCreate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,requests";
  }

  // Updates a `TrafficForecastSegment` object.
  rpc UpdateTrafficForecastSegment(UpdateTrafficForecastSegmentRequest)
      returns (TrafficForecastSegment) {
    option (google.api.http) = {
      patch: "/v1/{traffic_forecast_segment.name=networks/*/trafficForecastSegments/*}"
      body: "traffic_forecast_segment"
    };
    option (google.api.method_signature) =
        "traffic_forecast_segment,update_mask";
  }

  // Batch updates `TrafficForecastSegment` objects.
  rpc BatchUpdateTrafficForecastSegments(
      BatchUpdateTrafficForecastSegmentsRequest)
      returns (BatchUpdateTrafficForecastSegmentsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/trafficForecastSegments:batchUpdate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,requests";
  }
}

// Request object for `GetTrafficForecastSegment` method.
message GetTrafficForecastSegmentRequest {
  // Required. The resource name of the TrafficForecastSegment.
  // Format:
  // `networks/{network_code}/trafficForecastSegments/{trafficForecastSegmentId}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/TrafficForecastSegment"
    }
  ];
}

// Request object for `ListTrafficForecastSegments` method.
message ListTrafficForecastSegmentsRequest {
  // Required. The parent, which owns this collection of
  // TrafficForecastSegments. Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Optional. The maximum number of `TrafficForecastSegments` to return. The
  // service may return fewer than this value. If unspecified, at most 50
  // `TrafficForecastSegments` will be returned. The maximum value is 1000;
  // values greater than 1000 will be coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous
  // `ListTrafficForecastSegments` call. Provide this to retrieve the subsequent
  // page.
  //
  // When paginating, all other parameters provided to
  // `ListTrafficForecastSegments` must match the call that provided the page
  // token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to filter the response.
  //  See syntax details at
  //  https://developers.google.com/ad-manager/api/beta/filters
  //
  // **Filterable fields:**
  //
  // * `createTime`
  // * `displayName`
  // * `forecastAdjustmentCount`
  // * `name`
  // * `targetedAdUnits`
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to specify sorting order.
  // See syntax details at
  // https://developers.google.com/ad-manager/api/beta/filters#order
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Number of individual resources to skip while paginating.
  int32 skip = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response object for `ListTrafficForecastSegmentsRequest` containing matching
// `TrafficForecastSegment` objects.
message ListTrafficForecastSegmentsResponse {
  // The `TrafficForecastSegment` objects from the specified network.
  repeated TrafficForecastSegment traffic_forecast_segments = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;

  // Total number of `TrafficForecastSegment` objects.
  // If a filter was included in the request, this reflects the total number
  // after the filtering is applied.
  //
  // `total_size` won't be calculated in the response unless it has been
  // included in a response field mask. The response field mask can be provided
  // to the method by using the URL parameter `$fields` or `fields`, or by using
  // the HTTP/gRPC header `X-Goog-FieldMask`.
  //
  // For more information, see
  // https://developers.google.com/ad-manager/api/beta/field-masks
  int32 total_size = 3;
}

