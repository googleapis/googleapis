syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "ForecastAdjustmentEnumsProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [ForecastAdjustmentVolumeType][google.ads.admanager.v1.ForecastAdjustmentVolumeTypeEnum.ForecastAdjustmentVolumeType]
message ForecastAdjustmentVolumeTypeEnum {
  // Options for how the volume settings of a ForecastAdjustment are defined.
  enum ForecastAdjustmentVolumeType {
    // Default value. This value is unused.
    FORECAST_ADJUSTMENT_VOLUME_TYPE_UNSPECIFIED = 0;

    // Volume is defined by a series of daily ad opportunity counts.
    DAILY_VOLUME = 1;

    // Volume is defined by historical volume data.
    HISTORICAL_BASIS_VOLUME = 2;

    // Volume is defined by a single total ad opportunity count.
    TOTAL_VOLUME = 3;
  }
}

// Wrapper message for
// [ForecastAdjustmentStatus][google.ads.admanager.v1.ForecastAdjustmentStatusEnum.ForecastAdjustmentStatus]
message ForecastAdjustmentStatusEnum {
  // The status of a forecast adjustment. Inactive adjustments are not applied
  // during forecasting.
  enum ForecastAdjustmentStatus {
    // Default value. This value is unused.
    FORECAST_ADJUSTMENT_STATUS_UNSPECIFIED = 0;

    // Indicates the current adjustment is active.
    ACTIVE = 1;

    // Indicates the current adjustment is inactive.
    INACTIVE = 2;
  }
}
