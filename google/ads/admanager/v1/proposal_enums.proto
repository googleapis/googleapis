syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "ProposalEnumsProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [BuyerRfpType][google.ads.admanager.v1.BuyerRfpTypeEnum.BuyerRfpType]
message BuyerRfpTypeEnum {
  // Decribes the type of BuyerRfp.
  enum BuyerRfpType {
    // Default value. This value is unused.
    BUYER_RFP_TYPE_UNSPECIFIED = 0;

    // Indicates the BuyerRfp is a Preferred Deal RFP.
    PREFERRED_DEAL = 1;

    // Indicates the BuyerRfp is a Programmatic Guaranteed RFP.
    PROGRAMMATIC_GUARANTEED = 2;
  }
}

// Wrapper message for
// [ProposalCompanyAssociationType][google.ads.admanager.v1.ProposalCompanyAssociationTypeEnum.ProposalCompanyAssociationType]
message ProposalCompanyAssociationTypeEnum {
  // Describes the type of a Company associated with a Proposal.
  enum ProposalCompanyAssociationType {
    // Default value. This value is unused.
    PROPOSAL_COMPANY_ASSOCIATION_TYPE_UNSPECIFIED = 0;

    // The company is a billing agency.
    BILLING_AGENCY = 2;

    // The company is a branding agency.
    BRANDING_AGENCY = 3;

    // The company is other type of agency.
    OTHER_AGENCY = 4;

    // The company is a primary agency.
    PRIMARY_AGENCY = 5;
  }
}
