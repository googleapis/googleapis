syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/change_event_enums.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "ChangeEventMessagesProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Represents a single entity change.
message ChangeEvent {
  option (google.api.resource) = {
    type: "admanager.googleapis.com/ChangeEvent"
    pattern: "networks/{network_code}/changeEvents/{change_event}"
    plural: "changeEvents"
    singular: "changeEvent"
  };

  // Identifier. The resource name of the `ChangeEvent`.
  // Format: `networks/{network_code}/changeEvents/{change_event}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. Time when the change happened.
  google.protobuf.Timestamp change_time = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The type of the resource that was changed.
  optional ChangeEventResourceTypeEnum.ChangeEventResourceType resource_type = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The id of the resource that was changed. Typically, this is a
  // part of the resource name for that entity. It is represented here as a long
  // for legacy reasons.
  optional int64 entity_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The user that made the change.
  // Format: `networks/{network_code}/users/{user}`
  optional string user = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = { type: "admanager.googleapis.com/User" }
  ];

  // Output only. The type of operation associated with the `ChangeEvent`.
  optional OperationTypeEnum.OperationType operation_type = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];
}
