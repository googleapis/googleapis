syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "YieldFormatEnumProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [YieldFormat][google.ads.admanager.v1.YieldFormatEnum.YieldFormat]
message YieldFormatEnum {
  // Represents possible formats for a yield group.
  enum YieldFormat {
    // Default value. This value is unused.
    YIELD_FORMAT_UNSPECIFIED = 0;

    // App open format when users open their app.
    APP_OPEN = 1;

    // Banner format, some fixed wxh size.
    BANNER = 2;

    // Interstitial ad format.
    INTERSTITIAL = 3;

    // Native ad format.
    NATIVE = 4;

    // Rewarded format.
    REWARDED = 5;

    // Rewarded interstitial format.
    REWARDED_INTERSTITIAL = 6;

    // Vast video ad format.
    VIDEO_VAST = 7;
  }
}
