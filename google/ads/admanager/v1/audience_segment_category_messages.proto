syntax = "proto3";

package google.ads.admanager.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "AudienceSegmentCategoryMessagesProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// The category of an audience segment.
message AudienceSegmentCategory {
  option (google.api.resource) = {
    type: "admanager.googleapis.com/AudienceSegmentCategory"
    pattern: "networks/{network_code}/audienceSegmentCategories/{audience_segment_category}"
    plural: "audienceSegmentCategories"
    singular: "audienceSegmentCategory"
  };

  // Identifier. The resource name of the `AudienceSegmentCategory`.
  // Format:
  // `networks/{network_code}/audienceSegmentCategories/{audience_segment_category_id}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The display name of the audience segment category.
  optional string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The audience segment category's parent.
  // Format:
  // `networks/{network_code}/audienceSegmentCategories/{audience_segment_category}`
  optional string parent = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/AudienceSegmentCategory"
    }
  ];
}
