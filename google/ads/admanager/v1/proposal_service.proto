// Request object for `BatchCreateProposals` method.
message BatchCreateProposalsRequest {
  // Required. The parent resource where `Proposals` will be created.
  // Format: `networks/{network_code}`
  // The parent field in the CreateProposalRequest must match this
  // field.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The `Proposal` objects to create.
  // A maximum of 100 objects can be created in a batch.
  repeated CreateProposalRequest requests = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Response object for `BatchCreateProposals` method.
message BatchCreateProposalsResponse {
  // The `Proposal` objects created.
  repeated Proposal proposals = 1;
}

