// Request message for `FetchMarketplaceComments` method.
message FetchMarketplaceCommentsRequest {
  // Required. The parent resource where MarketplaceComments will be fetched
  // from. Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The resource names of the Proposals for which to fetch
  // marketplace comments. A maximum of 50 proposal names can be specified.
  // Format: `networks/{network_code}/proposals/{proposal_id}`
  repeated string names = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Proposal"
    }
  ];

  // Optional. The maximum number of `MarketplaceComment` objects to return.
  // The service may return fewer than this value. If unspecified, at most 50
  // `MarketplaceComments` will be returned. The maximum value is 1000;
  // values greater than 1000 will be coerced to 1000.
  int32 page_size = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `FetchMarketplaceComments`
  // call. Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to
  // `FetchMarketplaceComments` must match the call that provided the page
  // token.
  string page_token = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Number of individual resources to skip while paginating.
  int32 skip = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `FetchMarketplaceComments` method.
