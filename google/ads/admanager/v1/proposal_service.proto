// Provides methods for handling `Proposal` objects.
service ProposalService {
  option (google.api.default_host) = "admanager.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/admanager,"
      "https://www.googleapis.com/auth/admanager.readonly";

  // Retrieves a `Proposal` object.
  rpc GetProposal(GetProposalRequest) returns (Proposal) {
    option (google.api.http) = {
      get: "/v1/{name=networks/*/proposals/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists `Proposal` objects.
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=networks/*}/proposals"
    };
    option (google.api.method_signature) = "parent";
  }

  // Creates a `Proposal` object.
  rpc CreateProposal(CreateProposalRequest) returns (Proposal) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals"
      body: "proposal"
    };
    option (google.api.method_signature) = "parent,proposal";
  }

  // Creates `Proposal` objects.
  rpc BatchCreateProposals(BatchCreateProposalsRequest)
      returns (BatchCreateProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchCreate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,requests";
  }

  // Updates a `Proposal` object.
  rpc UpdateProposal(UpdateProposalRequest) returns (Proposal) {
    option (google.api.http) = {
      patch: "/v1/{proposal.name=networks/*/proposals/*}"
      body: "proposal"
    };
    option (google.api.method_signature) = "proposal,update_mask";
  }

  // Batch updates `Proposal` objects.
  rpc BatchUpdateProposals(BatchUpdateProposalsRequest)
      returns (BatchUpdateProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchUpdate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,requests";
  }

  // Archives `Proposal` objects.
  rpc BatchArchiveProposals(BatchArchiveProposalsRequest)
      returns (BatchArchiveProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchArchive"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Unarchives `Proposal` objects.
  rpc BatchUnarchiveProposals(BatchUnarchiveProposalsRequest)
      returns (BatchUnarchiveProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchUnarchive"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Pauses `Proposal` objects.
  rpc BatchPauseProposals(BatchPauseProposalsRequest)
      returns (BatchPauseProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchPause"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names,reason";
  }

  // Resumes `Proposal` objects.
  rpc BatchResumeProposals(BatchResumeProposalsRequest)
      returns (BatchResumeProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchResume"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Requests buyer review for `Proposal` objects.
  rpc BatchRequestBuyerReviewProposals(BatchRequestBuyerReviewProposalsRequest)
      returns (BatchRequestBuyerReviewProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchRequestBuyerReview"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Requests buyer acceptance for `Proposal` objects.
  rpc BatchRequestBuyerAcceptProposals(BatchRequestBuyerAcceptProposalsRequest)
      returns (BatchRequestBuyerAcceptProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchRequestBuyerAccept"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Reserves inventory for `Proposal` objects.
  rpc BatchReserveProposals(BatchReserveProposalsRequest)
      returns (BatchReserveProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchReserve"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Redrafts `Proposal` objects for negotiation.
  rpc BatchRedraftProposals(BatchRedraftProposalsRequest)
      returns (BatchRedraftProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchRedraft"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Discards drafts, or revert local modifications, of `Proposal` objects.
  rpc BatchDiscardDraftProposals(BatchDiscardDraftProposalsRequest)
      returns (BatchDiscardDraftProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchDiscardDraft"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Terminates negotiation on `Proposal` objects.
  rpc BatchTerminateProposals(BatchTerminateProposalsRequest)
      returns (BatchTerminateProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchTerminate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Push changes on `Proposal`s to corresponding `Order`s, after negotiations
  // have been finalized.
  rpc BatchPushToOrderProposals(BatchPushToOrderProposalsRequest)
      returns (BatchPushToOrderProposalsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/proposals:batchPushToOrder"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Fetches MarketplaceComments made on `Proposal`s.
  rpc FetchMarketplaceComments(FetchMarketplaceCommentsRequest)
      returns (FetchMarketplaceCommentsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=networks/*}/proposals:fetchMarketplaceComments"
    };
    option (google.api.method_signature) = "parent,names";
  }
}

// Request object for `GetProposal` method.
message GetProposalRequest {
  // Required. The resource name of the Proposal.
  // Format: `networks/{network_code}/proposals/{proposal_id}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Proposal"
    }
  ];
}

// Request object for `ListProposals` method.
message ListProposalsRequest {
  // Required. The parent, which owns this collection of Proposals.
  // Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Optional. The maximum number of `Proposals` to return. The service may
  // return fewer than this value. If unspecified, at most 50 `Proposals` will
  // be returned. The maximum value is 1000; values greater than 1000 will be
  // coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListProposals` call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to `ListProposals` must
  // match the call that provided the page token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to filter the response.
  //  See syntax details at
  //  https://developers.google.com/ad-manager/api/beta/filters
  //
  // Syntax summary: double-quoted `"..."` (never `'...'`) strings and RFC 3339
  // timestamps, full resource names on reference fields (for example, `order =
  // "networks/123/orders/456"`, not `*Id` or bare IDs), prefix or suffix `*`
  // wildcards with `=` (`displayName = "foo*"`), `:` for substring or
  // repeated-field matching, unquoted enums and booleans, uppercase
  // `AND`/`OR`/`NOT`, and standalone `IN(field, SET(v1, v2))` (not `field IN
  // (...)`).
  //
  // **Filterable fields:**
  //
  // * `advertiser`
  // * `agencies.company`
  // * `appliedTeams`
  // * `archived`
  // * `currencyCode`
  // * `displayName`
  // * `endTime`
  // * `marketplaceInfo.negotiationStatus`
  // * `name`
  // * `order`
  // * `primarySalesperson`
  // * `salesPlannerUsers`
  // * `sellerContactUsers`
  // * `sold`
  // * `startTime`
  // * `supplyPath`
  // * `trafficker`
  // * `updateTime`
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to specify sorting order.
  // See syntax details at
  // https://developers.google.com/ad-manager/api/beta/filters#order
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Number of individual resources to skip while paginating.
  int32 skip = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response object for `ListProposalsRequest` containing matching `Proposal`
// objects.
message ListProposalsResponse {
  // The `Proposal` objects from the specified network.
  repeated Proposal proposals = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;

  // Total number of `Proposal` objects.
  // If a filter was included in the request, this reflects the total number
  // after the filtering is applied.
  //
  // `total_size` won't be calculated in the response unless it has been
  // included in a response field mask. The response field mask can be provided
  // to the method by using the URL parameter `$fields` or `fields`, or by using
  // the HTTP/gRPC header `X-Goog-FieldMask`.
  //
  // For more information, see
  // https://developers.google.com/ad-manager/api/beta/field-masks
  int32 total_size = 3;
}

