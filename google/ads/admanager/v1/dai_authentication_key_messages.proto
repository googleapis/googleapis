syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/dai_authentication_key_enums.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "DaiAuthenticationKeyMessagesProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// A DaiAuthenticationKey is used to authenticate stream requests to the IMA SDK
// API.
message DaiAuthenticationKey {
  option (google.api.resource) = {
    type: "admanager.googleapis.com/DaiAuthenticationKey"
    pattern: "networks/{network_code}/daiAuthenticationKeys/{dai_authentication_key}"
    plural: "daiAuthenticationKeys"
    singular: "daiAuthenticationKey"
  };

  // Identifier. The resource name of the `DaiAuthenticationKey`.
  // Format:
  // `networks/{network_code}/daiAuthenticationKeys/{dai_authentication_key}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The status of this DaiAuthenticationKey.
  //
  // DAI authentication keys are created in the
  // [`ACTIVE`][google.ads.admanager.v1.DaiAuthenticationKeyStatusEnum.DaiAuthenticationKeyStatus.ACTIVE]
  // state.
  //
  // Only active keys will be accepted by the IMA SDK API as valid.
  optional DaiAuthenticationKeyStatusEnum.DaiAuthenticationKeyStatus status = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The name for this DaiAuthenticationKey.
  optional string display_name = 5 [(google.api.field_behavior) = REQUIRED];

  // Optional. The type of this key, which determines how it should be used on
  // stream create requests.
  optional DaiAuthenticationKeyTypeEnum.DaiAuthenticationKeyType key_type = 6
      [(google.api.field_behavior) = OPTIONAL];
}
