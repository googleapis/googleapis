syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "AdSpotFillTypeEnumProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [AdSpotFillType][google.ads.admanager.v1.AdSpotFillTypeEnum.AdSpotFillType]
message AdSpotFillTypeEnum {
  // The different options for how ad spots are filled. Only some allocations of
  // ads to subpods produce a valid final pod.
  enum AdSpotFillType {
    // Default value. This value is unused.
    AD_SPOT_FILL_TYPE_UNSPECIFIED = 0;

    // The ad spot may only contain an ad when all ad spots with higher fill
    // priority are "satisfied".
    CONDITIONAL = 1;

    // The ad spot is always "satisfied", whether empty or nonempty.
    OPTIONAL = 2;

    // If this ad spot is empty, the overall pod is invalid.
    REQUIRED = 3;
  }
}
