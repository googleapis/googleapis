syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/applied_label.proto";
import "google/ads/admanager/v1/creative_placeholder.proto";
import "google/ads/admanager/v1/custom_field_value.proto";
import "google/ads/admanager/v1/proposal_enums.proto";
import "google/ads/admanager/v1/proposal_environment_type_enum.proto";
import "google/ads/admanager/v1/proposal_negotiation_status_enum.proto";
import "google/ads/admanager/v1/supply_path_type_enum.proto";
import "google/ads/admanager/v1/targeting.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/money.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "ProposalMessagesProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// A Proposal represents an agreement between an interactive advertising seller
// and a buyer that specifies the details of an advertising campaign.
message Proposal {
  option (google.api.resource) = {
    type: "admanager.googleapis.com/Proposal"
    pattern: "networks/{network_code}/proposals/{proposal}"
    plural: "proposals"
    singular: "proposal"
  };

  // Identifier. The resource name of the Proposal.
  // Format: `networks/{network_code}/proposals/{proposal_id}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The resource name of the corresponding Order. This will not be
  // set if the Proposal has not been pushed to Ad Manager. Format:
  // `networks/{network_code}/orders/{order_id}`
  optional string order = 41 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = { type: "admanager.googleapis.com/Order" }
  ];

  // Required. The display name of the Proposal. This value has a maximum length
  // of 255 characters. This value is copied to
  // [Order.displayName][google.ads.admanager.v1.Order.display_name] when the
  // proposal turns into an order.
  optional string display_name = 5 [(google.api.field_behavior) = REQUIRED];

  // Output only. The time at which the [Order][google.ads.admanager.v1.Order]
  // and [LineItems][google.ads.admanager.v1.LineItem] associated with the
  // Proposal are eligible to begin serving. This attribute is derived from the
  // [ProposalLineItem][] with the earliest
  // [startTime][ProposalLineItem.start_time]. This attribute will be empty if
  // this Proposal has no associated [ProposalLineItems][ProposalLineItem] or if
  // none of its [ProposalLineItems][ProposalLineItem] have a start time.
  optional google.protobuf.Timestamp start_time = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time at which the [Order][google.ads.admanager.v1.Order]
  // and [LineItems][google.ads.admanager.v1.LineItem] associated with the
  // Proposal stop serving. This attribute is derived from the
  // [ProposalLineItem][] with the latest [endTime][ProposalLineItem.end_time].
  // This attribute will be empty if this Proposal has no associated
  // [ProposalLineItems][ProposalLineItem] or if none of its
  // [ProposalLineItems][ProposalLineItem] have an end time.
  optional google.protobuf.Timestamp end_time = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether the Proposal is archived or not.
  optional bool archived = 50 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The resource name of the
  // [Company][google.ads.admanager.v1.Company] of type
  // [ADVERTISER][google.ads.admanager.v1.CompanyTypeEnum.CompanyType.ADVERTISER]
  // to which this Proposal belongs. This attribute is required when the
  // proposal turns into an order, and will be copied to
  // [Order.advertiser][google.ads.admanager.v1.Order.advertiser].  This
  // attribute becomes read-only once the Proposal has been pushed. Format:
  // `networks/{network_code}/companies/{company_id}`
  optional string advertiser = 57 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Company"
    }
  ];

  // Optional. List of agencies and the set of
  // [Contacts][google.ads.admanager.v1.Contact] associated with each agency. A
  // Proposal can have at most one [Company][google.ads.admanager.v1.Company]
  // with
  // [PRIMARY_AGENCY][google.ads.admanager.v1.ProposalCompanyAssociationTypeEnum.ProposalCompanyAssociationType.PRIMARY_AGENCY]
  // type, but a [Company][google.ads.admanager.v1.Company] can appear more than
  // once with different
  // [ProposalCompanyAssociationType][google.ads.admanager.v1.ProposalCompanyAssociationTypeEnum.ProposalCompanyAssociationType]
  // values. If a primary agency exists, its
  // [ProposalCompanyAssociation.company][google.ads.admanager.v1.ProposalCompanyAssociation.company]
  // will be copied to [Order.agency][google.ads.admanager.v1.Order.agency] when
  // the proposal turns into an order.
  repeated ProposalCompanyAssociation agencies = 11
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Provides any additional notes that may annotate the Proposal.
  // This attribute has a maximum length of 65,535 characters.
  optional string notes = 12 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The resource name of the [User][google.ads.admanager.v1.User]
  // representing the primary salesperson who brokered the transaction with the
  // [advertiser][google.ads.admanager.v1.Proposal.advertiser]. This attribute
  // is required when the proposal turns into an order. Format:
  // `networks/{network_code}/users/{user_id}`
  optional string primary_salesperson = 14 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = { type: "admanager.googleapis.com/User" }
  ];

  // Optional. The resource names of the [Users][google.ads.admanager.v1.User]
  // representing the sales planners of the Proposal. A Proposal can have at
  // most 8 sales planners. Format: `networks/{network_code}/users/{user_id}`
  repeated string sales_planner_users = 16 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = { type: "admanager.googleapis.com/User" }
  ];

  // Optional. The resource name of the [User][google.ads.admanager.v1.User] who
  // is the primary trafficker and is responsible for trafficking the Proposal.
  // This attribute is required when the proposal turns into an order, and will
  // be copied to [Order.trafficker][google.ads.admanager.v1.Order.trafficker].
  // Format: `networks/{network_code}/users/{user_id}`
  optional string trafficker = 18 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = { type: "admanager.googleapis.com/User" }
  ];

  // Optional. The resource names of the [Users][google.ads.admanager.v1.User]
  // who are the seller's contacts. Format:
  // `networks/{network_code}/users/{user_id}`
  repeated string seller_contact_users = 20 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = { type: "admanager.googleapis.com/User" }
  ];

  // Optional. The resource names of the teams directly applied to the Proposal.
  // Format: `networks/{network_code}/teams/{team_id}`
  repeated string applied_teams = 24 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = { type: "admanager.googleapis.com/Team" }
  ];

  // Optional. The values of the custom fields associated with the Proposal.
  repeated CustomFieldValue custom_field_values = 25
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The set of labels applied directly to the Proposal.
  repeated AppliedLabel applied_labels = 26
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The set of labels applied to the Proposal including inherited
  // values. Only labels that directly affect the entity are listed here. If
  // they are negated, only the negated version is visible.
  repeated AppliedLabel effective_applied_labels = 27
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The currency code of this Proposal. If not directly set, the
  // currency code will be the network's currency code.
  string currency_code = 29 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Indicates whether the proposal has been sold, i.e.,
  // corresponds to whether the status of an Order is
  // [APPROVED][google.ads.admanager.v1.OrderStatusEnum.OrderStatus.APPROVED]
  // or
  // [PAUSED][google.ads.admanager.v1.OrderStatusEnum.OrderStatus.PAUSED].
  optional bool sold = 30 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time this Proposal was last modified.
  optional google.protobuf.Timestamp update_time = 34
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The marketplace info of this Proposal if it has a corresponding
  // Order in Marketplace.
  ProposalMarketplaceInfo marketplace_info = 36
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. The buyer RFP associated with this Proposal. This field will
  // be unset if the proposal is not initiated from an RFP.
  BuyerRfp buyer_rfp = 38 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Non-empty default. Whether delivery of the Proposal can be
  // paused. Defaults to `true`. If `false`, the buyer and the seller agree that
  // the Proposal should not be paused.
  optional bool delivery_pausing_enabled = 40 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = NON_EMPTY_DEFAULT
  ];

  // Optional. Non-empty default. The supply path type of this Proposal. If no
  // value is provided on creation, defaults to
  // [DEMAND_SIDE_PLATFORM][google.ads.admanager.v1.SupplyPathTypeEnum.SupplyPathType.DEMAND_SIDE_PLATFORM].
  optional SupplyPathTypeEnum.SupplyPathType supply_path = 42 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = NON_EMPTY_DEFAULT
  ];
}

// Represents the buyer RFP information associated with a Proposal describing
// the requirements from the buyer.
message BuyerRfp {
  // Output only. CPM for the Proposal in question. Given that this field
  // belongs to a request for proposal (for which initially a Proposal does not
  // yet exist), this field should serve as guidance for publishers to create a
  // Proposal with [LineItems][google.ads.admanager.v1.LineItem] reflecting this
  // CPM.
  google.type.Money cost_per_unit = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The number of impressions per day that a buyer wishes to see
  // in the Proposal derived from the request for proposal in question.
  optional int64 units = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Total amount of money available to spend on this deal. In the
  // case of a Preferred Deal, the budget is equal to the maximum amount of
  // money a buyer is willing to spend on a given Proposal, even though the
  // budget might not be spent entirely, as impressions are not guaranteed.
  google.type.Money budget = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time at which the proposed deal should start serving.
  google.protobuf.Timestamp start_time = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time at which the proposed deal should end serving.
  google.protobuf.Timestamp end_time = 8
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A description of the proposed deal. This can be used for the
  // buyer to tell the publisher more detailed information about the deal in
  // question.
  optional string description = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A list of inventory sizes in which creatives will eventually
  // be served.
  repeated CreativePlaceholder creative_placeholders = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Targeting information for the proposal in question. Currently
  // this field only contains GeoTargeting information.
  Targeting targeting = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Additional terms of the deal in question. This field can be
  // used to state more specific targeting information for the deal, as well as
  // any additional information regarding this deal. Given that this field
  // belongs to a request for proposal (for which initially a Proposal does not
  // yet exist), this field can be populated by buyers to specify additional
  // information that they wish publishers to incorporate into the Proposal
  // derived from this request for proposal.
  optional string additional_terms = 12
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Identifies the format of the inventory or "channel" through
  // which the ad serves. Environments currently supported include
  // [DISPLAY][google.ads.admanager.v1.ProposalEnvironmentTypeEnum.ProposalEnvironmentType.DISPLAY],
  // [VIDEO][google.ads.admanager.v1.ProposalEnvironmentTypeEnum.ProposalEnvironmentType.VIDEO],
  // and
  // [MOBILE][google.ads.admanager.v1.ProposalEnvironmentTypeEnum.ProposalEnvironmentType.MOBILE].
  optional ProposalEnvironmentTypeEnum.ProposalEnvironmentType
      ad_exchange_environment = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Deal type; either Programmatic Guaranteed or Preferred Deal.
  // This field corresponds to the type of Proposal that a buyer wishes to
  // negotiate with a seller.
  optional BuyerRfpTypeEnum.BuyerRfpType rfp_type = 14
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A ProposalCompanyAssociation represents a
// [Company][google.ads.admanager.v1.Company] associated with the Proposal and a
// set of [Contacts][google.ads.admanager.v1.Contact] belonging to the company.
message ProposalCompanyAssociation {
  // Required. The resource name of the
  // [Company][google.ads.admanager.v1.Company] associated with the Proposal.
  // Format: `networks/{network_code}/companies/{company_id}`
  optional string company = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Company"
    }
  ];

  // Required. The association type between the
  // [Company][google.ads.admanager.v1.Company] and the Proposal.
  optional ProposalCompanyAssociationTypeEnum.ProposalCompanyAssociationType
      type = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. The resource names of the
  // [Contacts][google.ads.admanager.v1.Contact] associated with the
  // [Company][google.ads.admanager.v1.Company].
  // Format: `networks/{network_code}/contacts/{contact_id}`
  repeated string seller_contacts = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Contact"
    }
  ];
}

// Marketplace info for a Proposal with a corresponding order in Marketplace.
message ProposalMarketplaceInfo {
  // Output only. The marketplace ID of this Proposal. This is a shared ID
  // between Ad Manager and the buy-side platform. This value is null if the
  // Proposal has not been sent to the buyer.
  optional string marketplace_order_id = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether the non-free-editable fields of a Proposal are opened
  // for edit. A Proposal that is open for edit will not receive buyer updates
  // from Marketplace. If the buyer updates the Proposal while this is open for
  // local editing, Google will set
  // [newVersionFromBuyer][google.ads.admanager.v1.ProposalMarketplaceInfo.new_version_from_buyer]
  // to `true`. You will then need to call
  // [ProposalService.BatchDiscardDraftProposals][google.ads.admanager.v1.ProposalService.BatchDiscardDraftProposals]
  // to revert your edits to get the buyer's latest changes.
  optional bool draft_proposal = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The negotiation status of the Proposal.
  optional ProposalNegotiationStatusEnum.ProposalNegotiationStatus
      negotiation_status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The comment on the Proposal to be sent to the buyer.
  optional string marketplace_comment = 5
      [(google.api.field_behavior) = OPTIONAL];

  // Output only. Indicates that the buyer has made updates to the Proposal on
  // Marketplace. This attribute is only meaningful if the Proposal is open for
  // edit (i.e.,
  // [draftProposal][google.ads.admanager.v1.ProposalMarketplaceInfo.draft_proposal]
  // is `true`).
  optional bool new_version_from_buyer = 7
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The account ID of the buyer that this Proposal is being
  // negotiated with.
  optional int64 buyer_account_id = 9 [(google.api.field_behavior) = REQUIRED];

  // Output only. The ID used to represent the Display & Video 360 client buyer
  // partner ID (if Display & Video 360) or the Authorized Buyers client buyer
  // account ID.
  optional string partner_client_id = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Comment associated with a programmatic Proposal that has been sent to
// Marketplace.
message MarketplaceComment {
  // Role of the user who created the comment.
  enum CommenterRole {
    // Default value. This value is unused.
    COMMENTER_ROLE_UNSPECIFIED = 0;

    // The comment was created by the buyer.
    BUYER = 1;

    // The comment was created by the seller.
    SELLER = 2;
  }

  // Output only. The resource name of the `Proposal` the comment belongs to.
  // Format: `networks/{network_code}/proposals/{proposal}`
  optional string proposal = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Proposal"
    }
  ];

  // Output only. The comment made on the Proposal.
  optional string comment = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time at which the comment was created.
  google.protobuf.Timestamp create_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The role of the user who created the comment.
  optional CommenterRole commenter_role = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];
}
