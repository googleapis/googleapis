syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "DaypartingTimeZoneEnumProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [DaypartingTimeZone][google.ads.admanager.v1.DaypartingTimeZoneEnum.DaypartingTimeZone]
message DaypartingTimeZoneEnum {
  // Represents the time zone to be used for daypart targeting.
  enum DaypartingTimeZone {
    // Default value. This value is unused.
    DAYPARTING_TIME_ZONE_UNSPECIFIED = 0;

    // Use the time zone of the publisher for daypart targeting.
    PUBLISHER = 1;

    // Use the time zone of the browser for daypart targeting.
    USER = 2;
  }
}
