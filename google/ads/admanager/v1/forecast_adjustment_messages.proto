syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/date_range.proto";
import "google/ads/admanager/v1/forecast_adjustment_enums.proto";
import "google/ads/admanager/v1/targeting.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "ForecastAdjustmentMessagesProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Provides information about the expected volume and composition of traffic
// over a date range for a traffic forecast segment.
message ForecastAdjustment {
  option (google.api.resource) = {
    type: "admanager.googleapis.com/ForecastAdjustment"
    pattern: "networks/{network_code}/forecastAdjustments/{forecast_adjustment}"
    plural: "forecastAdjustments"
    singular: "forecastAdjustment"
  };

  // Settings that specify the volume of ad opportunities. Only one of the
  // following volume settings can be provided depending on the value of
  // `volume_type`.
  oneof volume_settings {
    // Optional. The daily number of ad opportunities for each day in the
    // adjustment date range. This field is required if volumeType is
    // [ForecastAdjustmentVolumeType.DAILY_VOLUME][google.ads.admanager.v1.ForecastAdjustmentVolumeTypeEnum.ForecastAdjustmentVolumeType.DAILY_VOLUME]
    // and ignored otherwise.
    DailyVolumeSettings daily_volume_settings = 9
        [(google.api.field_behavior) = OPTIONAL];

    // Optional. The total number of ad opportunities for the entire adjustment
    // date range. This field is required if volumeType is
    // [ForecastAdjustmentVolumeType.TOTAL_VOLUME][google.ads.admanager.v1.ForecastAdjustmentVolumeTypeEnum.ForecastAdjustmentVolumeType.TOTAL_VOLUME]
    // and ignored otherwise.
    TotalVolumeSettings total_volume_settings = 10
        [(google.api.field_behavior) = OPTIONAL];

    // Optional. The daily number of ad opportunities for each day in the
    // adjustment date range, determined by reference to the ad opportunity
    // volume of a historical reference period. This field is required if
    // volumeType is
    // [ForecastAdjustmentVolumeType.HISTORICAL_BASIS_VOLUME][google.ads.admanager.v1.ForecastAdjustmentVolumeTypeEnum.ForecastAdjustmentVolumeType.HISTORICAL_BASIS_VOLUME]
    // and ignored otherwise.
    HistoricalBasisVolumeSettings historical_basis_volume_settings = 11
        [(google.api.field_behavior) = OPTIONAL];
  }

  // Identifier. The resource name of the `ForecastAdjustment`.
  // Format:
  // `networks/{network_code}/forecastAdjustments/{forecastAdjustmentId}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. Immutable. The resource name of the `TrafficForecastSegment` that
  // this adjustment is associated with. Format:
  // `networks/{network_code}/trafficForecastSegments/{trafficForecastSegmentId}`
  optional string traffic_forecast_segment = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/TrafficForecastSegment"
    }
  ];

  // Required. Display name of the ForecastAdjustment.
  optional string display_name = 4 [(google.api.field_behavior) = REQUIRED];

  // Required. The date range of the adjustment.
  DateRange date_range = 5 [(google.api.field_behavior) = REQUIRED];

  // Output only. The status of the adjustment.
  optional ForecastAdjustmentStatusEnum.ForecastAdjustmentStatus status = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The volume type of the adjustment.
  optional ForecastAdjustmentVolumeTypeEnum.ForecastAdjustmentVolumeType
      volume_type = 7 [(google.api.field_behavior) = REQUIRED];

  // Input only. Whether to allow provided volume settings to increase the
  // current forecast by more than 300%. Due to system constraints, adjusting
  // the forecast by more than 300% may have unintended consequences for other
  // parts of the forecast. Note that this field will not persist on the
  // adjustment itself, and will only affect the current request.
  optional bool allow_adjusting_forecast_above_recommended_limit = 8
      [(google.api.field_behavior) = INPUT_ONLY];

  // Output only. The daily number of ad opportunities calculated to satisfy the
  // provided volume settings. Each value in this list represents the calculated
  // ad opportunities on the corresponding day of the adjustment date range. For
  // example: for a dateRange of 2001-8-15 to 2001-8-17, this field will contain
  // one value for 2001-8-15, one value for 2001-8-16, and one value for
  // 2001-8-17. This field is read-only and is populated by Google after
  // forecast adjustment creation or update.
  repeated int64 calculated_daily_ad_opportunity_counts = 12
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Settings to specify the volume of ad opportunities per day over the
// ForecastAdjustment date range based on the traffic volume of a historical
// reference period. The daily historical traffic for the provided targeting and
// date range is fetched, multiplied by the provided multiplier, and used as the
// daily expected traffic for the adjustment. The number of days included in the
// historical date range does not need to be the same as the number of days
// included in the adjustment date range.
message HistoricalBasisVolumeSettings {
  // Whether the parent traffic forecast segment targeting's or the targeting's
  // historical volume data should be used.
  optional bool use_parent_traffic_forecast_segment_targeting = 1;

  // Optional. The targeting criteria to use as the source of the historical
  // volume data. This field is required if
  // useParentTrafficForecastSegmentTargeting is false and ignored otherwise.
  Targeting targeting = 2 [(google.api.field_behavior) = OPTIONAL];

  // Required. The date range to use for the historical ad opportunity volume.
  DateRange historical_date_range = 3 [(google.api.field_behavior) = REQUIRED];

  // Required. The multiplier to apply to the historical traffic volume,
  // expressed in thousandths of a percent. For example, to set the forecasted
  // traffic as 130% of the historical traffic, this value would be 130,000.
  optional int64 multiplier_milli_percent = 4
      [(google.api.field_behavior) = REQUIRED];
}

// Settings to specify a single total traffic volume that will be used as the
// expected total future volume for a forecast adjustment. For example, an
// adOpportunityCount of 3,000 indicates a forecast goal for the targeting
// specified on the parent traffic forecast segment of 3,000 ad opportunities
// over the entire duration of the adjustment.
message TotalVolumeSettings {
  // Required. The total ad opportunity count over the entire forecast
  // adjustment date range.
  optional int64 ad_opportunity_count = 1
      [(google.api.field_behavior) = REQUIRED];
}

// Settings to specify daily ad opportunity counts that will be used as the
// expected future traffic volume for a forecast adjustment. For example:
// [10000, 20000, 5000] indicates expected traffic for the targeting specified
// on the parent traffic forecast segment of 10,000 ad opportunities for the
// first day, 20,000 ad opportunities for the second, and 5,000 for the third.
message DailyVolumeSettings {
  // Required. The list of ad opportunity counts. Each value in this list
  // represents the expected number of ad opportunities on the corresponding day
  // of the adjustment date range. The number of values provided must match the
  // number of days in the adjustment date range, inclusive. For example, an
  // adjustment date range of June 5-June 7 would need 3 values in this list,
  // one for June 5, one for June 6, and one for June 7.
  repeated int64 ad_opportunity_counts = 1
      [(google.api.field_behavior) = REQUIRED];
}
