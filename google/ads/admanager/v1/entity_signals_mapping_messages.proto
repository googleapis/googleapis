syntax = "proto3";

package google.ads.admanager.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "EntitySignalsMappingMessagesProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// The `EntitySignalsMapping` resource.
message EntitySignalsMapping {
  option (google.api.resource) = {
    type: "admanager.googleapis.com/EntitySignalsMapping"
    pattern: "networks/{network_code}/entitySignalsMappings/{entity_signals_mapping}"
    plural: "entitySignalsMappings"
    singular: "entitySignalsMapping"
  };

  // The ID of the entity that the mapping belongs to.
  oneof entity {
    // Deprecated: ID of an AudienceSegment that this mapping belongs to.
    int64 audience_segment_id = 3 [deprecated = true];

    // Deprecated: ID of a ContentBundle that this mapping belongs to.
    int64 content_bundle_id = 4 [deprecated = true];

    // Deprecated: ID of a CustomTargetingValue that this mapping belongs to.
    int64 custom_targeting_value_id = 5 [deprecated = true];
  }

  // The entity that the mapping belongs to.
  oneof entity_name {
    // The resource name of an
    // [AudienceSegment][google.ads.admanager.v1.AudienceSegment] that this
    // mapping belongs to. Format:
    // `networks/{network_code}/audienceSegments/{audience_segment_id}`
    string audience_segment = 10 [(google.api.resource_reference) = {
      type: "admanager.googleapis.com/AudienceSegment"
    }];

    // The resource name of a
    // [ContentBundle][google.ads.admanager.v1.ContentBundle] that this mapping
    // belongs to. Format:
    // `networks/{network_code}/contentBundles/{content_bundle_id}`
    string content_bundle = 11 [(google.api.resource_reference) = {
      type: "admanager.googleapis.com/ContentBundle"
    }];

    // The resource name of a
    // [CustomTargetingValue][google.ads.admanager.v1.CustomTargetingValue] that
    // this mapping belongs to. Format:
    // `networks/{network_code}/customTargetingValues/{custom_targeting_value_id}`
    string custom_targeting_value = 12 [(google.api.resource_reference) = {
      type: "admanager.googleapis.com/CustomTargetingValue"
    }];
  }

  // Identifier. The resource name of the `EntitySignalsMapping`.
  // Format:
  // `networks/{network_code}/entitySignalsMappings/{entity_signals_mapping_id}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. Deprecated: `EntitySignalsMapping` ID.
  optional int64 entity_signals_mapping_id = 2
      [deprecated = true, (google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Deprecated: The IDs of the categories that are associated with
  // the referencing entity.
  repeated int64 taxonomy_category_ids = 6
      [deprecated = true, (google.api.field_behavior) = OPTIONAL];

  // Optional. The resource names of the
  // [TaxonomyCategory][google.ads.admanager.v1.TaxonomyCategory] that are
  // associated with the referencing entity. Format:
  // `networks/{network_code}/taxonomyCategories/{taxonomyCategoryId}`
  repeated string taxonomy_categories = 13 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/TaxonomyCategory"
    }
  ];
}
