syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/third_party_data_declaration_type_enum.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "ThirdPartyDataDeclarationProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Represents a set of declarations about what (if any) third party companies
// are associated with a given creative. This can also be set on the Network to
// serve as a default for those creatives that don't have such field set.
message ThirdPartyDataDeclaration {
  // Optional. The declaration about third party data usage on the associated
  // entity.
  ThirdPartyDataDeclarationTypeEnum.ThirdPartyDataDeclarationType
      declaration_type = 1 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A list of ThirdPartyCompanies associated with this entity.
  // Format: "networks/{network_code}/thirdPartyCompanies/{third_party_company}"
  repeated string third_party_companies = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/ThirdPartyCompany"
    }
  ];
}
