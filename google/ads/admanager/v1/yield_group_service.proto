syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/yield_group_messages.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "YieldGroupServiceProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Provides methods for handling `YieldGroup` objects.
service YieldGroupService {
  option (google.api.default_host) = "admanager.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/admanager,"
      "https://www.googleapis.com/auth/admanager.readonly";

  // Retrieves a `YieldGroup` object.
  rpc GetYieldGroup(GetYieldGroupRequest) returns (YieldGroup) {
    option (google.api.http) = {
      get: "/v1/{name=networks/*/yieldGroups/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists `YieldGroup` objects.
  rpc ListYieldGroups(ListYieldGroupsRequest)
      returns (ListYieldGroupsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=networks/*}/yieldGroups"
    };
    option (google.api.method_signature) = "parent";
  }

  // Creates a `YieldGroup` object.
  rpc CreateYieldGroup(CreateYieldGroupRequest) returns (YieldGroup) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/yieldGroups"
      body: "yield_group"
    };
    option (google.api.method_signature) = "parent,yield_group";
  }

  // Batch creates `YieldGroup` objects.
  rpc BatchCreateYieldGroups(BatchCreateYieldGroupsRequest)
      returns (BatchCreateYieldGroupsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/yieldGroups:batchCreate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,requests";
  }

  // Updates a `YieldGroup` object.
  rpc UpdateYieldGroup(UpdateYieldGroupRequest) returns (YieldGroup) {
    option (google.api.http) = {
      patch: "/v1/{yield_group.name=networks/*/yieldGroups/*}"
      body: "yield_group"
    };
    option (google.api.method_signature) = "yield_group,update_mask";
  }

  // Batch updates `YieldGroup` objects.
  rpc BatchUpdateYieldGroups(BatchUpdateYieldGroupsRequest)
      returns (BatchUpdateYieldGroupsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/yieldGroups:batchUpdate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,requests";
  }

  // Activates a list of `YieldGroup` objects.
  rpc BatchActivateYieldGroups(BatchActivateYieldGroupsRequest)
      returns (BatchActivateYieldGroupsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/yieldGroups:batchActivate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Deactivates a list of `YieldGroup` objects.
  rpc BatchDeactivateYieldGroups(BatchDeactivateYieldGroupsRequest)
      returns (BatchDeactivateYieldGroupsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/yieldGroups:batchDeactivate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Archives a list of `YieldGroup` objects.
  rpc BatchArchiveYieldGroups(BatchArchiveYieldGroupsRequest)
      returns (BatchArchiveYieldGroupsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/yieldGroups:batchArchive"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }
}

// Request object for `GetYieldGroup` method.
message GetYieldGroupRequest {
  // Required. The resource name of the `YieldGroup`.
  // Format: `networks/{network_code}/yieldGroups/{yield_group_id}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/YieldGroup"
    }
  ];
}

// Request object for `ListYieldGroups` method.
message ListYieldGroupsRequest {
  // Required. The parent, which owns this collection of `YieldGroups`.
  // Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Optional. The maximum number of `YieldGroups` to return. The service may
  // return fewer than this value. If unspecified, at most 50 `YieldGroups` will
  // be returned. The maximum value is 1000; values greater than 1000 will be
  // coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListYieldGroups` call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to `ListYieldGroups` must
  // match the call that provided the page token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to filter the response.
  //  See syntax details at
  //  https://developers.google.com/ad-manager/api/beta/filters
  //
  // Syntax summary: double-quoted `"..."` (never `'...'`) strings and RFC 3339
  // timestamps, full resource names on reference fields (for example, `order =
  // "networks/123/orders/456"`, not `*Id` or bare IDs), prefix or suffix `*`
  // wildcards with `=` (`displayName = "foo*"`), `:` for substring or
  // repeated-field matching, unquoted enums and booleans, uppercase
  // `AND`/`OR`/`NOT`, and standalone `IN(field, SET(v1, v2))` (not `field IN
  // (...)`).
  //
  // **Filterable fields:**
  //
  // * `displayName`
  // * `name`
  // * `status`
  // * `targeting.geoTargeting.targetedGeos`
  // * `targeting.inventoryTargeting.targetedAdUnits.adUnit`
  // * `targeting.mobileApplicationTargeting.firstPartyTargeting.targetedApplications`
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to specify sorting order.
  // See syntax details at
  // https://developers.google.com/ad-manager/api/beta/filters#order
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Number of individual resources to skip while paginating.
  int32 skip = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response object for `ListYieldGroupsRequest` containing matching `YieldGroup`
// objects.
message ListYieldGroupsResponse {
  // The `YieldGroup` objects from the specified network.
  repeated YieldGroup yield_groups = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;

  // Total number of `YieldGroup` objects.
  // If a filter was included in the request, this reflects the total number
  // after the filtering is applied.
  //
  // `total_size` won't be calculated in the response unless it has been
  // included in a response field mask. The response field mask can be provided
  // to the method by using the URL parameter `$fields` or `fields`, or by using
  // the HTTP/gRPC header `X-Goog-FieldMask`.
  //
  // For more information, see
  // https://developers.google.com/ad-manager/api/beta/field-masks
  int32 total_size = 3;
}

// Request object for `CreateYieldGroup` method.
message CreateYieldGroupRequest {
  // Required. The parent resource where this `YieldGroup` will be created.
  // Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The `YieldGroup` to create.
  YieldGroup yield_group = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request object for `BatchCreateYieldGroups` method.
message BatchCreateYieldGroupsRequest {
  // Required. The parent resource where `YieldGroups` will be created.
  // Format: `networks/{network_code}`
  // The parent field in the `CreateYieldGroupRequest` must match this
  // field.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The `YieldGroup` objects to create.
  // A maximum of 100 objects can be created in a batch.
  repeated CreateYieldGroupRequest requests = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Response object for `BatchCreateYieldGroups` method.
message BatchCreateYieldGroupsResponse {
  // The `YieldGroup` objects created.
  repeated YieldGroup yield_groups = 1;
}

// Request object for `UpdateYieldGroup` method.
message UpdateYieldGroupRequest {
  // Required. The `YieldGroup` to update.
  //
  // The `YieldGroup`'s `name` is used to identify the `YieldGroup` to update.
  YieldGroup yield_group = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Request object for `BatchUpdateYieldGroups` method.
message BatchUpdateYieldGroupsRequest {
  // Required. The parent resource where `YieldGroups` will be updated.
  // Format: `networks/{network_code}`
  // The parent field in the `UpdateYieldGroupRequest` must match this
  // field.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The `YieldGroup` objects to update.
  // A maximum of 10 objects can be updated in a batch.
  repeated UpdateYieldGroupRequest requests = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Response object for `BatchUpdateYieldGroups` method.
message BatchUpdateYieldGroupsResponse {
  // The `YieldGroup` objects updated.
  repeated YieldGroup yield_groups = 1;
}

// Request object for `BatchActivateYieldGroups` method.
message BatchActivateYieldGroupsRequest {
  // Required. The parent, which owns this collection of `YieldGroups`.
  // Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The resource names of the `YieldGroups` to activate.
  // Format: `networks/{network_code}/yieldGroups/{yield_group_id}`
  repeated string names = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/YieldGroup"
    }
  ];
}

// Response object for `BatchActivateYieldGroups` method.
message BatchActivateYieldGroupsResponse {}

// Request object for `BatchDeactivateYieldGroups` method.
message BatchDeactivateYieldGroupsRequest {
  // Required. The parent, which owns this collection of `YieldGroups`.
  // Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The resource names of the `YieldGroups` to deactivate.
  // Format: `networks/{network_code}/yieldGroups/{yield_group_id}`
  repeated string names = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/YieldGroup"
    }
  ];
}

// Response object for `BatchDeactivateYieldGroups` method.
message BatchDeactivateYieldGroupsResponse {}

// Request object for `BatchArchiveYieldGroups` method.
message BatchArchiveYieldGroupsRequest {
  // Required. The parent, which owns this collection of `YieldGroups`.
  // Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The resource names of the `YieldGroups` to archive.
  // Format: `networks/{network_code}/yieldGroups/{yield_group_id}`
  repeated string names = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/YieldGroup"
    }
  ];
}

// Response object for `BatchArchiveYieldGroups` method.
message BatchArchiveYieldGroupsResponse {}
