syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/targeting.proto";
import "google/ads/admanager/v1/yield_enums.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/type/money.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "YieldGroupMessagesProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Represents a segment of inventory and a set of yield partners
// that can monetize that inventory.
message YieldGroup {
  option (google.api.resource) = {
    type: "admanager.googleapis.com/YieldGroup"
    pattern: "networks/{network_code}/yieldGroups/{yield_group}"
    plural: "yieldGroups"
    singular: "yieldGroup"
  };

  // Identifier. The resource name of the `YieldGroup`.
  // Format: `networks/{network_code}/yieldGroups/{yield_group_id}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. The display name of the `YieldGroup`. This value has a maximum
  // length of 255 characters.
  optional string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Output only. Status of the `YieldGroup`.
  optional YieldEntityStatusEnum.YieldEntityStatus status = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The targeting of the `YieldGroup`.
  optional Targeting targeting = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The ad sources that belong to the `YieldGroup`.
  repeated YieldAdSource ad_sources = 7
      [(google.api.field_behavior) = OPTIONAL];
}

// Represents an opportunity for a third party network to be mediated on a
// segment of inventory described in a `YieldGroup`.
message YieldAdSource {
  // Configuration for Open Bidding in a `YieldAdSource`.
  message OpenBiddingSettings {
    // Required. The integration type of the yield partner.
    optional YieldIntegrationTypeEnum.YieldIntegrationType integration_type = 1
        [(google.api.field_behavior) = REQUIRED];
  }

  // Display settings for mobile SDK adapters.
  message SdkMediationSettings {
    // Required. The integration type of the yield partner.
    optional YieldIntegrationTypeEnum.YieldIntegrationType integration_type = 1
        [(google.api.field_behavior) = REQUIRED];

    // Optional. The parameters for the mobile SDK adapter.
    map<string, string> parameters = 2 [(google.api.field_behavior) = OPTIONAL];

    // Required. The platform of the adapter.
    optional YieldPlatformEnum.YieldPlatform platform = 3
        [(google.api.field_behavior) = REQUIRED];
  }

  // The specific settings for the integration type.
  oneof display_settings {
    // Settings for Open Bidding.
    OpenBiddingSettings open_bidding_settings = 6;

    // Settings for mobile app display.
    SdkMediationSettings sdk_mediation_settings = 7;
  }

  // Optional. Non-empty default. The ID of the ad source. This field is
  // assigned by Google when the ad source is created. Provide this ID when
  // updating an existing ad source; omit it when adding a new ad source.
  optional int64 ad_source_id = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = NON_EMPTY_DEFAULT
  ];

  // Required. Immutable. The resource name of the `Company`.
  // Format: `networks/{network_code}/companies/{company_id}`
  optional string company = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Company"
    }
  ];

  // Optional. User-assigned status of the ad source.
  optional YieldEntityStatusEnum.YieldEntityStatus status = 3
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. CPM manually assigned to this source.
  optional google.type.Money manual_cpm = 4
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, then the automatically collected CPM is ignored in favor
  // of `manualCpm`.
  optional bool override_dynamic_cpm = 5
      [(google.api.field_behavior) = OPTIONAL];
}
