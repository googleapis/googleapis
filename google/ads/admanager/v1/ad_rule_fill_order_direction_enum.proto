syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "AdRuleFillOrderDirectionEnumProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [AdRuleFillOrderDirection][google.ads.admanager.v1.AdRuleFillOrderDirectionEnum.AdRuleFillOrderDirection]
message AdRuleFillOrderDirectionEnum {
  // Defines the fill order direction of ad breaks with
  // AdBreakOptimizationType.POSITION.
  enum AdRuleFillOrderDirection {
    // Default value. This value is unused.
    AD_RULE_FILL_ORDER_DIRECTION_UNSPECIFIED = 0;

    // A break template should be filled from edge to center.
    EDGE_TO_CENTER = 1;

    // A break template should be filled from left to right.
    LEFT_TO_RIGHT = 2;

    // A break template should be filled from right to left.
    RIGHT_TO_LEFT = 3;
  }
}
