syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/forecast_adjustment_messages.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "ForecastAdjustmentServiceProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Provides methods for handling `ForecastAdjustment` objects.
service ForecastAdjustmentService {
  option (google.api.default_host) = "admanager.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/admanager,"
      "https://www.googleapis.com/auth/admanager.readonly";

  // Retrieves a `ForecastAdjustment` object.
  rpc GetForecastAdjustment(GetForecastAdjustmentRequest)
      returns (ForecastAdjustment) {
    option (google.api.http) = {
      get: "/v1/{name=networks/*/forecastAdjustments/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists `ForecastAdjustment` objects.
  rpc ListForecastAdjustments(ListForecastAdjustmentsRequest)
      returns (ListForecastAdjustmentsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=networks/*}/forecastAdjustments"
    };
    option (google.api.method_signature) = "parent";
  }

  // Creates a `ForecastAdjustment` object.
  rpc CreateForecastAdjustment(CreateForecastAdjustmentRequest)
      returns (ForecastAdjustment) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/forecastAdjustments"
      body: "forecast_adjustment"
    };
    option (google.api.method_signature) = "parent,forecast_adjustment";
  }

  // Creates `ForecastAdjustment` objects.
  rpc BatchCreateForecastAdjustments(BatchCreateForecastAdjustmentsRequest)
      returns (BatchCreateForecastAdjustmentsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/forecastAdjustments:batchCreate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,requests";
  }

  // Activates a list of `ForecastAdjustment` objects.
  rpc BatchActivateForecastAdjustments(BatchActivateForecastAdjustmentsRequest)
      returns (BatchActivateForecastAdjustmentsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/forecastAdjustments:batchActivate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Deactivates a list of `ForecastAdjustment` objects.
  rpc BatchDeactivateForecastAdjustments(
      BatchDeactivateForecastAdjustmentsRequest)
      returns (BatchDeactivateForecastAdjustmentsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/forecastAdjustments:batchDeactivate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,names";
  }

  // Updates a `ForecastAdjustment` object.
  rpc UpdateForecastAdjustment(UpdateForecastAdjustmentRequest)
      returns (ForecastAdjustment) {
    option (google.api.http) = {
      patch: "/v1/{forecast_adjustment.name=networks/*/forecastAdjustments/*}"
      body: "forecast_adjustment"
    };
    option (google.api.method_signature) = "forecast_adjustment,update_mask";
  }

  // Batch updates `ForecastAdjustment` objects.
  rpc BatchUpdateForecastAdjustments(BatchUpdateForecastAdjustmentsRequest)
      returns (BatchUpdateForecastAdjustmentsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/forecastAdjustments:batchUpdate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,requests";
  }

  // Calculates daily ad opportunity counts for a prospective
  // `ForecastAdjustment` object.
  rpc CalculateDailyAdOpportunityCounts(
      CalculateDailyAdOpportunityCountsRequest)
      returns (CalculateDailyAdOpportunityCountsResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/forecastAdjustments:calculateDailyAdOpportunityCounts"
      body: "*"
    };
    option (google.api.method_signature) = "parent,forecast_adjustment";
  }
}

// Request object for `GetForecastAdjustment` method.
message GetForecastAdjustmentRequest {
  // Required. The resource name of the ForecastAdjustment.
  // Format:
  // `networks/{network_code}/forecastAdjustments/{forecastAdjustmentId}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/ForecastAdjustment"
    }
  ];
}

// Request object for `ListForecastAdjustments` method.
message ListForecastAdjustmentsRequest {
  // Required. The parent, which owns this collection of ForecastAdjustments.
  // Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Optional. The maximum number of `ForecastAdjustments` to return. The
  // service may return fewer than this value. If unspecified, at most 50
  // `ForecastAdjustments` will be returned. The maximum value is 1000; values
  // above 1000 will be coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListForecastAdjustments`
  // call. Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to `ListForecastAdjustments`
  // must match the call that provided the page token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to filter the response.
  //  See syntax details at
  //  https://developers.google.com/ad-manager/api/beta/filters
  //
  // **Filterable fields:**
  //
  // * `dateRange.endDate`
  // * `dateRange.startDate`
  // * `displayName`
  // * `name`
  // * `status`
  // * `trafficForecastSegment`
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to specify sorting order.
  // See syntax details at
  // https://developers.google.com/ad-manager/api/beta/filters#order
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Number of individual resources to skip while paginating.
  int32 skip = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response object for `ListForecastAdjustmentsRequest` containing matching
// `ForecastAdjustment` objects.
message ListForecastAdjustmentsResponse {
  // The `ForecastAdjustment` objects from the specified network.
  repeated ForecastAdjustment forecast_adjustments = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;

  // Total number of `ForecastAdjustment` objects.
  // If a filter was included in the request, this reflects the total number
  // after the filtering is applied.
  //
  // `total_size` won't be calculated in the response unless it has been
  // included in a response field mask. The response field mask can be provided
  // to the method by using the URL parameter `$fields` or `fields`, or by using
  // the HTTP/gRPC header `X-Goog-FieldMask`.
  //
  // For more information, see
  // https://developers.google.com/ad-manager/api/beta/field-masks
  int32 total_size = 3;
}

// Request object for `CreateForecastAdjustment` method.
message CreateForecastAdjustmentRequest {
  // Required. The parent resource where this `ForecastAdjustment` will be
  // created. Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The `ForecastAdjustment` to create.
  ForecastAdjustment forecast_adjustment = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Request object for `BatchCreateForecastAdjustments` method.
message BatchCreateForecastAdjustmentsRequest {
  // Required. The parent resource where `ForecastAdjustments` will be created.
  // Format: `networks/{network_code}`
  // The parent field in the CreateForecastAdjustmentRequest must match this
  // field.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The `ForecastAdjustment` objects to create.
  // A maximum of 100 objects can be created in a batch.
  repeated CreateForecastAdjustmentRequest requests = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Response object for `BatchCreateForecastAdjustments` method.
message BatchCreateForecastAdjustmentsResponse {
  // The `ForecastAdjustment` objects created.
  repeated ForecastAdjustment forecast_adjustments = 1;
}

// Request object for `UpdateForecastAdjustment` method.
message UpdateForecastAdjustmentRequest {
  // Required. The `ForecastAdjustment` to update.
  //
  // The `ForecastAdjustment`'s `name` is used to identify the
  // `ForecastAdjustment` to update.
  ForecastAdjustment forecast_adjustment = 1
      [(google.api.field_behavior) = REQUIRED];

  // Optional. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Request object for `BatchUpdateForecastAdjustments` method.
message BatchUpdateForecastAdjustmentsRequest {
  // Required. The parent resource where `ForecastAdjustments` will be updated.
  // Format: `networks/{network_code}`
  // The parent field in the UpdateForecastAdjustmentRequest must match this
  // field.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The `ForecastAdjustment` objects to update.
  // A maximum of 100 objects can be updated in a batch.
  repeated UpdateForecastAdjustmentRequest requests = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Response object for `BatchUpdateForecastAdjustments` method.
message BatchUpdateForecastAdjustmentsResponse {
  // The `ForecastAdjustment` objects updated.
  repeated ForecastAdjustment forecast_adjustments = 1;
}

// Request message for `BatchActivateForecastAdjustments` method.
message BatchActivateForecastAdjustmentsRequest {
  // Required. Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The resource names of the `ForecastAdjustment` objects to
  // activate.
  repeated string names = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response object for `BatchActivateForecastAdjustments` method.
message BatchActivateForecastAdjustmentsResponse {}

// Request message for `BatchDeactivateForecastAdjustments` method.
message BatchDeactivateForecastAdjustmentsRequest {
  // Required. Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The resource names of the `ForecastAdjustment` objects to
  // deactivate.
  repeated string names = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response object for `BatchDeactivateForecastAdjustments` method.
message BatchDeactivateForecastAdjustmentsResponse {}

// Request message for `CalculateDailyAdOpportunityCounts` method.
message CalculateDailyAdOpportunityCountsRequest {
  // Required. The parent resource where this `ForecastAdjustment` will be
  // calculated. Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The prospective `ForecastAdjustment` to calculate daily ad
  // opportunity counts for.
  ForecastAdjustment forecast_adjustment = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Response message for `CalculateDailyAdOpportunityCounts` method.
message CalculateDailyAdOpportunityCountsResponse {
  // The `ForecastAdjustment` with its `calculated_daily_ad_opportunity_counts`
  // populated.
  ForecastAdjustment forecast_adjustment = 1;
}
