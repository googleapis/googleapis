syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "AdBreakOptimizationTypeEnumProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [AdBreakOptimizationType][google.ads.admanager.v1.AdBreakOptimizationTypeEnum.AdBreakOptimizationType]
message AdBreakOptimizationTypeEnum {
  // Defines how non-required ad spots within in an ad break are filled.
  enum AdBreakOptimizationType {
    // Default value. This value is unused.
    AD_BREAK_OPTIMIZATION_TYPE_UNSPECIFIED = 0;

    // Non-required ad spots within the ad break will be filled according to the
    // fill order direction, potentially reducing revenue for the break.
    POSITION = 1;

    // Non-required ad spots within the ad break will be filled using a revenue
    // optimizing algorithm.
    REVENUE = 2;
  }
}
