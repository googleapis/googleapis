syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "ThirdPartyDataDeclarationTypeEnumProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [ThirdPartyDataDeclarationTypeEnum][google.ads.admanager.v1.ThirdPartyDataDeclarationTypeEnum]
message ThirdPartyDataDeclarationTypeEnum {
  // The declaration about third party data usage on the associated entity.
  enum ThirdPartyDataDeclarationType {
    // Default value. This value is unused.
    THIRD_PARTY_DATA_DECLARATION_TYPE_UNSPECIFIED = 0;

    // There is a set of ThirdPartyCompanies associated with this entity.
    DECLARED = 1;

    // There are no companies associated.  Functionally the same as DECLARED,
    // combined with an empty company list.
    NONE = 2;
  }
}
