syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/company_messages.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "CompanyServiceProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Provides methods for handling [Company][google.ads.admanager.v1.Company]
// objects.
service CompanyService {
  option (google.api.default_host) = "admanager.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/admanager,"
      "https://www.googleapis.com/auth/admanager.readonly";

  // Retrieves a [Company][google.ads.admanager.v1.Company] object.
  rpc GetCompany(GetCompanyRequest) returns (Company) {
    option (google.api.http) = {
      get: "/v1/{name=networks/*/companies/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists [Company][google.ads.admanager.v1.Company] objects.
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=networks/*}/companies"
    };
    option (google.api.method_signature) = "parent";
  }

  // Creates a [Company][google.ads.admanager.v1.Company] object.
  rpc CreateCompany(CreateCompanyRequest) returns (Company) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/companies"
      body: "company"
    };
    option (google.api.method_signature) = "parent,company";
  }

  // Creates [Company][google.ads.admanager.v1.Company] objects.
  rpc BatchCreateCompanies(BatchCreateCompaniesRequest)
      returns (BatchCreateCompaniesResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/companies:batchCreate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,requests";
  }

  // Updates a [Company][google.ads.admanager.v1.Company] object.
  rpc UpdateCompany(UpdateCompanyRequest) returns (Company) {
    option (google.api.http) = {
      patch: "/v1/{company.name=networks/*/companies/*}"
      body: "company"
    };
    option (google.api.method_signature) = "company,update_mask";
  }

  // Batch updates [Company][google.ads.admanager.v1.Company] objects.
  rpc BatchUpdateCompanies(BatchUpdateCompaniesRequest)
      returns (BatchUpdateCompaniesResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=networks/*}/companies:batchUpdate"
      body: "*"
    };
    option (google.api.method_signature) = "parent,requests";
  }
}

// Request object for [GetCompany][] method.
message GetCompanyRequest {
  // Required. The resource name of the Company.
  // Format: `networks/{network_code}/companies/{company_id}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Company"
    }
  ];
}

// Request object for [ListCompanies][] method.
message ListCompaniesRequest {
  // Required. The parent, which owns this collection of [Companies][].
  // Format: `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Optional. The maximum number of [Companies][] to return. The service may
  // return fewer than this value. If unspecified, at most 50 [Companies][] will
  // be returned. The maximum value is 1000; values greater than 1000 will be
  // coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous [ListCompanies][] call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to [ListCompanies][] must
  // match the call that provided the page token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to filter the response.
  //  See syntax details at
  //  https://developers.google.com/ad-manager/api/beta/filters
  //
  // **Filterable fields:**
  //
  // * `address`
  // * `comment`
  // * `companyId`
  // * `creditStatus`
  // * `displayName`
  // * `email`
  // * `externalId`
  // * `fax`
  // * `name`
  // * `phone`
  // * `thirdPartyCompanyId`
  // * `type`
  // * `updateTime`
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to specify sorting order.
  // See syntax details at
  // https://developers.google.com/ad-manager/api/beta/filters#order
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Number of individual resources to skip while paginating.
  int32 skip = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response object for
// [ListCompaniesRequest][google.ads.admanager.v1.ListCompaniesRequest]
// containing matching [Company][google.ads.admanager.v1.Company] objects.
message ListCompaniesResponse {
  // The [Company][google.ads.admanager.v1.Company] objects from the specified
  // network.
  repeated Company companies = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;

  // Total number of [Company][google.ads.admanager.v1.Company] objects.
  // If a filter was included in the request, this reflects the total number
  // after the filtering is applied.
  //
  // `total_size` won't be calculated in the response unless it has been
  // included in a response field mask. The response field mask can be provided
  // to the method by using the URL parameter `$fields` or `fields`, or by using
  // the HTTP/gRPC header `X-Goog-FieldMask`.
  //
  // For more information, see
  // https://developers.google.com/ad-manager/api/beta/field-masks
  int32 total_size = 3;
}

// Request object for [CreateCompany][] method.
message CreateCompanyRequest {
  // Required. The parent resource where this
  // [Company][google.ads.admanager.v1.Company] will be created. Format:
  // `networks/{network_code}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The [Company][google.ads.admanager.v1.Company] to create.
  Company company = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request object for [BatchCreateCompanies][] method.
message BatchCreateCompaniesRequest {
  // Required. The parent resource where [Companies][] will be created.
  // Format: `networks/{network_code}`
  // The parent field in the CreateCompanyRequest must match this
  // field.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The [Company][google.ads.admanager.v1.Company] objects to create.
  // A maximum of 100 objects can be created in a batch.
  repeated CreateCompanyRequest requests = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Response object for [BatchCreateCompanies][] method.
message BatchCreateCompaniesResponse {
  // The [Company][google.ads.admanager.v1.Company] objects created.
  repeated Company companies = 1;
}

// Request object for [UpdateCompany][] method.
message UpdateCompanyRequest {
  // Required. The [Company][google.ads.admanager.v1.Company] to update.
  //
  // The [Company][google.ads.admanager.v1.Company]'s `name` is used to identify
  // the [Company][google.ads.admanager.v1.Company] to update.
  Company company = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2
      [(google.api.field_behavior) = OPTIONAL];
}

// Request object for [BatchUpdateCompanies][] method.
message BatchUpdateCompaniesRequest {
  // Required. The parent resource where [Companies][] will be updated.
  // Format: `networks/{network_code}`
  // The parent field in the UpdateCompanyRequest must match this
  // field.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Network"
    }
  ];

  // Required. The [Company][google.ads.admanager.v1.Company] objects to update.
  // A maximum of 100 objects can be updated in a batch.
  repeated UpdateCompanyRequest requests = 2
      [(google.api.field_behavior) = REQUIRED];
}

// Response object for [BatchUpdateCompanies][] method.
message BatchUpdateCompaniesResponse {
  // The [Company][google.ads.admanager.v1.Company] objects updated.
  repeated Company companies = 1;
}
