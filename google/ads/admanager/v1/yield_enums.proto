syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "YieldEnumsProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [YieldIntegrationType][google.ads.admanager.v1.YieldIntegrationTypeEnum.YieldIntegrationType]
message YieldIntegrationTypeEnum {
  // Represents the possible types of adapters a buyer can have.
  enum YieldIntegrationType {
    // Default value. This value is unused.
    YIELD_INTEGRATION_TYPE_UNSPECIFIED = 0;

    // Custom event mediation integration type
    CUSTOM_EVENT_MEDIATION = 1;

    // Open bidding integration type
    OPEN_BIDDING = 2;

    // SDK mediation integration type
    SDK_MEDIATION = 3;

    // Third party SDK bidding integration type
    THIRD_PARTY_SDK_BIDDING = 4;
  }
}

// Wrapper message for
// [YieldPartnerSettingStatus][google.ads.admanager.v1.YieldPartnerSettingStatusEnum.YieldPartnerSettingStatus]
message YieldPartnerSettingStatusEnum {
  // Status of a partner setting, representing a partner capability.
  enum YieldPartnerSettingStatus {
    // Default value. This value is unused.
    YIELD_PARTNER_SETTING_STATUS_UNSPECIFIED = 0;

    // Active setting
    ACTIVE = 1;

    // Deprecated setting
    DEPRECATED = 2;
  }
}

// Wrapper message for
// [YieldPlatform][google.ads.admanager.v1.YieldPlatformEnum.YieldPlatform]
message YieldPlatformEnum {
  // Represents possible platforms for a mediation ad source.
  enum YieldPlatform {
    // Default value. This value is unused.
    YIELD_PLATFORM_UNSPECIFIED = 0;

    // Android platform.
    ANDROID = 1;

    // iOS platform.
    IOS = 2;
  }
}

// Wrapper message for
// [YieldEntityStatus][google.ads.admanager.v1.YieldEntityStatusEnum.YieldEntityStatus]
message YieldEntityStatusEnum {
  // Status of the yield group or ad source.
  enum YieldEntityStatus {
    // Default value. This value is unused.
    YIELD_ENTITY_STATUS_UNSPECIFIED = 0;

    // Indicates that the associated object is currently eligible to serve.
    ACTIVE = 1;

    // Indicates that the associated object is under experiment (only applicable
    // to yield groups).
    EXPERIMENTING = 2;

    // Indicates that the associated object is not currently eligible to serve.
    INACTIVE = 3;

    // Indicates that the associated object is archived (deleted).
    ARCHIVED = 4;
  }
}
