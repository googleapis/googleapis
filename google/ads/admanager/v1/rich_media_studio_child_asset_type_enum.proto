syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "RichMediaStudioChildAssetTypeEnumProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [RichMediaStudioChildAssetType][google.ads.admanager.v1.RichMediaStudioChildAssetTypeEnum.RichMediaStudioChildAssetType]
message RichMediaStudioChildAssetTypeEnum {
  // Type of RichMediaStudioChildAssetProperty
  enum RichMediaStudioChildAssetType {
    // Default value. This value is unused.
    RICH_MEDIA_STUDIO_CHILD_ASSET_TYPE_UNSPECIFIED = 0;

    // The rest of the supported file types .txt, .xml, etc.
    DATA = 1;

    // SWF files
    FLASH = 2;

    // Image files
    IMAGE = 3;

    // FLVS and any other video file types
    VIDEO = 4;
  }
}
