syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/line_item_creative_association_messages.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "LineItemCreativeAssociationServiceProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Provides methods for handling `LineItemCreativeAssociation` objects.
service LineItemCreativeAssociationService {
  option (google.api.default_host) = "admanager.googleapis.com";
  option (google.api.oauth_scopes) =
      "https://www.googleapis.com/auth/admanager,"
      "https://www.googleapis.com/auth/admanager.readonly";

  // Retrieves a `LineItemCreativeAssociation` object.
  rpc GetLineItemCreativeAssociation(GetLineItemCreativeAssociationRequest)
      returns (LineItemCreativeAssociation) {
    option (google.api.http) = {
      get: "/v1/{name=networks/*/lineItems/*/creatives/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Lists `LineItemCreativeAssociation` objects.
  rpc ListLineItemCreativeAssociations(ListLineItemCreativeAssociationsRequest)
      returns (ListLineItemCreativeAssociationsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=networks/*/lineItems/*}/creatives"
    };
    option (google.api.method_signature) = "parent";
  }
}

// Request object for `GetLineItemCreativeAssociation` method.
message GetLineItemCreativeAssociationRequest {
  // Required. The resource name of the LineItemCreativeAssociation.
  // Format:
  // `networks/{network_code}/lineItems/{line_item_id}/creatives/{creative_id}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/LineItemCreativeAssociation"
    }
  ];
}

// Request object for `ListLineItemCreativeAssociations` method.
message ListLineItemCreativeAssociationsRequest {
  // Required. The parent, which owns this collection of
  // LineItemCreativeAssociations. This request supports using the "-" character
  // as a wildcard for resources that span across multiple LineItem parents.
  // Format: `networks/{network_code}/lineItems/{line_item_id}`
  // Format: `networks/{network_code}/lineItems/-`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/LineItem"
    }
  ];

  // Optional. The maximum number of `LineItemCreativeAssociations` to return.
  // The service may return fewer than this value. If unspecified, at most 50
  // `LineItemCreativeAssociations` will be returned. The maximum value is 1000;
  // values greater than 1000 will be coerced to 1000.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous
  // `ListLineItemCreativeAssociations` call. Provide this to retrieve the
  // subsequent page.
  //
  // When paginating, all other parameters provided to
  // `ListLineItemCreativeAssociations` must match the call that provided the
  // page token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to filter the response.
  //  See syntax details at
  //  https://developers.google.com/ad-manager/api/beta/filters
  //
  // **Filterable fields:**
  //
  // * `creative`
  // * `creativeSet`
  // * `destinationUrl`
  // * `endTime`
  // * `lineItem`
  // * `manualCreativeRotationWeight`
  // * `name`
  // * `sequentialCreativeRotationIndex`
  // * `sizes.canonicalName`
  // * `startTime`
  // * `status`
  // * `targetingDisplayName`
  // * `updateTime`
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Expression to specify sorting order.
  // See syntax details at
  // https://developers.google.com/ad-manager/api/beta/filters#order
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Number of individual resources to skip while paginating.
  int32 skip = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response object for `ListLineItemCreativeAssociationsRequest` containing
// matching `LineItemCreativeAssociation` objects.
message ListLineItemCreativeAssociationsResponse {
  // The `LineItemCreativeAssociation` objects from the specified network.
  repeated LineItemCreativeAssociation line_item_creative_associations = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;

  // Total number of `LineItemCreativeAssociation` objects.
  // If a filter was included in the request, this reflects the total number
  // after the filtering is applied.
  //
  // `total_size` won't be calculated in the response unless it has been
  // included in a response field mask. The response field mask can be provided
  // to the method by using the URL parameter `$fields` or `fields`, or by using
  // the HTTP/gRPC header `X-Goog-FieldMask`.
  //
  // For more information, see
  // https://developers.google.com/ad-manager/api/beta/field-masks
  int32 total_size = 3;
}
