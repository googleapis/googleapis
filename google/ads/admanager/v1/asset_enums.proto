syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "AssetEnumsProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [AssetImageDensity][google.ads.admanager.v1.AssetImageDensityEnum.AssetImageDensity]
message AssetImageDensityEnum {
  // Image densities.
  enum AssetImageDensity {
    // Default value. This value is unused.
    ASSET_IMAGE_DENSITY_UNSPECIFIED = 0;

    // Indicates that there is a 1:1 ratio between the dimensions of the raw
    // image and the dimensions that it should be displayed at in
    // device-independent pixels.
    ONE_TO_ONE = 1;

    // Indicates that there is a 3:2 ratio between the dimensions of the raw
    // image and the dimensions that it should be displayed at in
    // device-independent pixels.
    THREE_TO_TWO = 2;

    // Indicates that there is a 2:1 ratio between the dimensions of the raw
    // image and the dimensions that it should be displayed at in
    // device-independent pixels.
    TWO_TO_ONE = 3;
  }
}
