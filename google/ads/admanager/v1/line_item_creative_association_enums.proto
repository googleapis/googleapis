syntax = "proto3";

package google.ads.admanager.v1;

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "LineItemCreativeAssociationEnumsProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Wrapper message for
// [LineItemCreativeAssociationStatus][google.ads.admanager.v1.LineItemCreativeAssociationStatusEnum.LineItemCreativeAssociationStatus]
message LineItemCreativeAssociationStatusEnum {
  // Describes the status of the association.
  enum LineItemCreativeAssociationStatus {
    // Default value. This value is unused.
    LINE_ITEM_CREATIVE_ASSOCIATION_STATUS_UNSPECIFIED = 0;

    // The association is active and the associated Creative can be served.
    ACTIVE = 1;

    // The association is inactive and the associated Creative is ineligible for
    // being served.
    INACTIVE = 2;
  }
}
