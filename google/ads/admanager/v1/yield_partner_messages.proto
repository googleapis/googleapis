syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/yield_enums.proto";
import "google/ads/admanager/v1/yield_environment_type_enum.proto";
import "google/ads/admanager/v1/yield_format_enum.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "YieldPartnerMessagesProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// Represents a third-party ad network or exchange, configured within the
// context of a Company, that publishers partner with to monetize their ad
// inventory.
message YieldPartner {
  option (google.api.resource) = {
    type: "admanager.googleapis.com/YieldPartner"
    pattern: "networks/{network_code}/yieldPartners/{yield_partner}"
    plural: "yieldPartners"
    singular: "yieldPartner"
  };

  // Identifier. The resource name of the `YieldPartner`.
  // Format: `networks/{network_code}/yieldPartners/{yieldPartnerId}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. The name of the yield partner. This refers to the name of the
  // company associated with the partner, if there is one.
  optional string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The company associated with this yield partner.
  optional string company = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {
      type: "admanager.googleapis.com/Company"
    }
  ];

  // Optional. The settings of the partner, representing its capabilities.
  repeated YieldPartnerSettings settings = 4
      [(google.api.field_behavior) = OPTIONAL];
}

// Settings for a yield partner.
message YieldPartnerSettings {
  // Describes a field used by a mobile adapter to call an ad network. For
  // example, `pubid`.
  message YieldParameter {
    // Output only. Identifier of the parameter.
    optional string key = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Whether or not this parameter is optional.
    optional bool optional = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Output only. The status of this yield partner setting.
  optional YieldPartnerSettingStatusEnum.YieldPartnerSettingStatus status = 1
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The environment of this yield partner setting.
  optional YieldEnvironmentTypeEnum.YieldEnvironmentType environment = 2
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The format of this yield partner setting.
  optional YieldFormatEnum.YieldFormat format = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The integration type of this yield partner setting.
  optional YieldIntegrationTypeEnum.YieldIntegrationType integration_type = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The parameters of this yield partner setting.
  repeated YieldParameter parameters = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The platform of this yield partner setting.
  optional YieldPlatformEnum.YieldPlatform platform = 6
      [(google.api.field_behavior) = OUTPUT_ONLY];
}
