syntax = "proto3";

package google.ads.admanager.v1;

import "google/ads/admanager/v1/creative_asset.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option csharp_namespace = "Google.Ads.AdManager.V1";
option go_package = "google.golang.org/genproto/googleapis/ads/admanager/v1;admanager";
option java_multiple_files = true;
option java_outer_classname = "CustomCreativeAssetProto";
option java_package = "com.google.ads.admanager.v1";
option php_namespace = "Google\\Ads\\AdManager\\V1";
option ruby_package = "Google::Ads::AdManager::V1";

// A `CustomCreativeAsset` is an association between a `CustomCreative` and an
// asset. Any assets that are associated with a creative can be inserted into
// its HTML snippet.
message CustomCreativeAsset {
  // Optional. The name by which the associated asset will be referenced. For
  // example, if the value is "foo", then the asset can be inserted into an HTML
  // snippet using the macro: "%%FILE:foo%%".
  optional string macro_name = 1 [(google.api.field_behavior) = OPTIONAL];

  // Required. The asset.
  // To view the asset, use `CreativeAsset.asset_url`.
  CreativeAsset asset = 6 [(google.api.field_behavior) = REQUIRED];
}
