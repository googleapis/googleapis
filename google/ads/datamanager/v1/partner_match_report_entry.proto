syntax = "proto3";

package google.ads.datamanager.v1;

import "google/type/money.proto";

option csharp_namespace = "Google.Ads.DataManager.V1";
option go_package = "cloud.google.com/go/datamanager/apiv1/datamanagerpb;datamanagerpb";
option java_multiple_files = true;
option java_outer_classname = "PartnerMatchReportEntryProto";
option java_package = "com.google.ads.datamanager.v1";
option php_namespace = "Google\\Ads\\DataManager\\V1";
option ruby_package = "Google::Ads::DataManager::V1";

// A row/entry in a Partner Match report.
message PartnerMatchReportEntry {
  // The advertiser account details.
  PartnerMatchAdvertiserAccount advertiser_account = 1;

  // The campaign details.  Only returned for Google Ads advertisers.
  PartnerMatchCampaign campaign = 2;

  // The ad group details.
  PartnerMatchAdGroup ad_group = 3;

  // The user list details.
  PartnerMatchUserList user_list = 4;

  // The number of impressions for this entry.
  int64 impression_count = 5;

  // The media cost associated for this entry.
  google.type.Money media_cost = 6;

  // The line item details.  Only returned for DV360 advertisers.
  PartnerMatchLineItem line_item = 7;

  // The data fees for this entry. Only returned for DV360 advertisers
  google.type.Money data_fees = 8;
}

// The advertiser account details.
message PartnerMatchAdvertiserAccount {
  // The type of account (e.g. GOOGLE_ADS, DISPLAY_VIDEO_ADVERTISER).
  string account_type = 1;

  // The Customer ID of the account.
  string account_id = 2;

  // The descriptive name of the account.
  string display_name = 3;
}

// The campaign details.
message PartnerMatchCampaign {
  // The ID of the campaign.
  int64 campaign_id = 1;

  // The descriptive name of the campaign.
  string display_name = 2;
}

// The ad group details.
message PartnerMatchAdGroup {
  // The ID of the ad group.
  int64 ad_group_id = 1;

  // The descriptive name of the ad group.
  string display_name = 2;
}

// The user list details.
message PartnerMatchUserList {
  // The ID of the user list.
  int64 user_list_id = 1;

  // The descriptive name of the user list.
  string display_name = 2;
}

// The line item details.
message PartnerMatchLineItem {
  // The ID of the line item.
  int64 line_item_id = 1;

  // The descriptive name of the line item.
  string display_name = 2;
}
