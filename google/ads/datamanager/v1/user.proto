syntax = "proto3";

package google.ads.datamanager.v1;

import "google/ads/datamanager/v1/audience.proto";
import "google/ads/datamanager/v1/user_data.proto";
import "google/api/field_behavior.proto";

option csharp_namespace = "Google.Ads.DataManager.V1";
option go_package = "cloud.google.com/go/datamanager/apiv1/datamanagerpb;datamanagerpb";
option java_multiple_files = true;
option java_outer_classname = "UserProto";
option java_package = "com.google.ads.datamanager.v1";
option php_namespace = "Google\\Ads\\DataManager\\V1";
option ruby_package = "Google::Ads::DataManager::V1";

// Represents a single user, containing identifiers like PII and mobile device
// IDs that all refer to the same user.
message User {
  // Required. Multiple pieces of user-provided data, used as the means of
  // identifying the user.
  UserData user_data = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Multiple mobile device ID strings to represent a single user.
  MobileData mobile_data = 2 [(google.api.field_behavior) = REQUIRED];
}
