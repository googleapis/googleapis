syntax = "proto3";

package google.apps.script.type;

import "google/api/field_behavior.proto";
import "google/protobuf/wrappers.proto";

option csharp_namespace = "Google.Apps.Script.Type";
option go_package = "google.golang.org/genproto/googleapis/apps/script/type";
option java_multiple_files = true;
option java_package = "com.google.apps.script.type";
option php_namespace = "Google\\Apps\\Script\\Type";
option ruby_package = "Google::Apps::Script::Type";

// Common Manifest protos for Google Workspace extension-point configuration.

// Common format for declaring a  menu item or button that appears within a
// host app.
message MenuItemExtensionPoint {
  // Required. The endpoint to execute when this extension point is
  // activated.
  string run_function = 1;

  // Required. User-visible text that describes the action taken by activating
  // this extension point. For example, "Insert invoice."
  string label = 2;

  // The URL for the logo image shown in the add-on toolbar.
  //
  // If not set, defaults to the add-on's primary logo URL.
  string logo_url = 3;
}

// Common format for declaring an add-on's homepage view.
message HomepageExtensionPoint {
  // Required. The endpoint to execute when this extension point is
  // activated.
  string run_function = 1;

  // Optional. If set to `false`, deactivates the homepage view in this context.
  //
  // Defaults to `true` if unset.
  //
  // If an add-on's custom homepage view is disabled, a generic overview
  // card is provided for users instead.
  google.protobuf.BoolValue enabled = 2;
}

// Format for declaring a universal action menu item extension point.
message UniversalActionExtensionPoint {
  // Required. User-visible text that describes the action taken by activating
  // this extension point, for example, "Add a new contact."
  string label = 1;

  // Required. The action type supported on a universal action menu item. It
  // can either be a link to open or an endpoint to execute.
  oneof action_type {
    // URL to be opened by the UniversalAction.
    string open_link = 2;

    // Endpoint to be run by the UniversalAction.
    string run_function = 3;
  }
}

// The configuration for each URL pattern that triggers a link preview.
message UriPattern {
  // Required for each URL pattern to preview. The domain of the URL pattern.
  // The add-on previews links that contain this domain in the URL. To preview
  // links for a specific subdomain, like `subdomain.example.com`, include the
  // subdomain. To preview links for the entire domain, specify a wildcard
  // character with an asterisk (`*`) as the subdomain.
  //
  // For example, `*.example.com` matches `subdomain.example.com` and
  // `another.subdomain.example.com`.
  string host_pattern = 1;

  // Optional. The path that appends the domain of the `hostPattern`.
  //
  // For example, if the URL host pattern is `support.example.com`, to match
  // URLs for cases hosted at `support.example.com/cases/`, enter `cases`.
  //
  // To match all URLs in the host pattern domain, leave `pathPrefix` empty.
  string path_prefix = 2;
}

// The configuration for a trigger that fires when a user types or pastes a link
// from a third-party or non-Google service into a Google Docs, Sheets, or
// Slides file.
message LinkPreviewExtensionPoint {
  // Required. The text for an example smart chip that prompts users to preview
  // the link, such as `Example: Support case`. This text is static and displays
  // before users execute the add-on.
  string label_text = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. A map of `labelText` to localize into other languages. Format
  // the language in [ISO 639](https://wikipedia.org/wiki/ISO_639_macrolanguage)
  // and the country/region in [ISO 3166](https://wikipedia.org/wiki/ISO_3166),
  // separated by a hyphen `-`. For example, `en-US`.
  //
  // If a user's locale is present in the map's keys, the user sees the
  // localized version of the `labelText`.
  map<string, string> localized_label_text = 4;

  // Required. An array of URL patterns that trigger the add-on to preview
  // links.
  repeated UriPattern patterns = 1;

  // Required. Endpoint to execute when a link preview is triggered.
  string run_function = 2;

  // Optional. The icon that displays in the smart chip and preview card. If
  // omitted, the add-on uses its toolbar icon,
  // [`logoUrl`](https://developers.google.com/workspace/add-ons/reference/rest/v1/projects.deployments#CommonAddOnManifest.FIELDS.logoUrl).
  string logo_url = 5;
}

// The configuration for a trigger that fires when a user invokes the
// resource creation workflow in a Google Workspace application. For more
// information, see [Create third-party resources from the @
// menu](https://developers.google.com/workspace/add-ons/guides/create-insert-resource-smart-chip).
message CreateActionExtensionPoint {
  // Required. The unique ID to differentiate this extension point.
  // The ID can have up to 64 characters
  // and should be in the format of `[a-zA-Z0-9-]+`.
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The text that displays alongside an icon for the
  // resource creation entry point, such as `Create support case`. This text is
  // static and displays before users execute the add-on.
  string label_text = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. A map of `labelText` to localize into other languages. Format
  // the language in [ISO 639](https://wikipedia.org/wiki/ISO_639_macrolanguage)
  // and the country/region in [ISO 3166](https://wikipedia.org/wiki/ISO_3166),
  // separated by a hyphen `-`. For example, `en-US`.
  //
  // If a user's locale is present in the map's keys, the user sees the
  // localized version of the `labelText`.
  map<string, string> localized_label_text = 3;

  // Required. Endpoint to execute when a resource creation workflow is
  // triggered to create a link.
  string run_function = 5;

  // Optional. The icon that displays for the resource creation entry point. If
  // omitted, the menu uses your add-on's toolbar icon,
  // [`logoUrl`](https://developers.google.com/workspace/add-ons/reference/rest/v1/projects.deployments#CommonAddOnManifest.FIELDS.logoUrl).
  string logo_url = 7;
}
