syntax = "proto3";

package google.apps.script.type.meet;

import "google/apps/script/type/extension_point.proto";

option csharp_namespace = "Google.Apps.Script.Type.Meet";
option go_package = "cloud.google.com/go/apps/script/type/meet/meetpb;meetpb";
option java_multiple_files = true;
option java_outer_classname = "MeetAddOnManifestProto";
option java_package = "com.google.apps.script.type.meet";
option php_namespace = "Google\\Apps\\Script\\Type\\Meet";
option ruby_package = "Google::Apps::Script::Type::Meet";

// Manifest section specific to Meet add-ons.

// Meet add-on manifest.
message MeetAddOnManifest {
  // If present, this overrides the configuration from
  // `addOns.common.homepageTrigger`.
  google.apps.script.type.HomepageExtensionPoint homepage_trigger = 2;

  // Details for addons that enhance the Meet web client.
  Web web = 3;

  // A link to the terms of service for the add-on, if any should be shown.
  optional string terms_uri = 6;

  // Whether the addon supports collaboration or inviting others into the addon
  // experience.
  bool supports_collaboration = 7;
}

// Details for addons that enhance the Meet web client.
message Web {
  // Enum for specifying initial addon opening state.
  enum State {
    // Initial state has not been specified with the addon.
    STATE_UNSPECIFIED = 0;

    // The addon opens with only the side panel active.
    SIDE_PANEL_ONLY = 1;

    // The addon opens with only the main stage active.
    MAIN_STAGE_ONLY = 2;

    // The addon opens with both the side panel and the main stage active.
    SIDE_PANEL_AND_MAIN_STAGE = 3;
  }

  // Enum for specifying the display flow the add-on will follow when launched
  enum DisplayFlow {
    // Display flow has not been specified.
    DISPLAY_FLOW_UNSPECIFIED = 0;

    // Add-on should launch in the "focus" display flow.
    FOCUS = 1;

    // Add-on should launch in the "augment" display flow.
    AUGMENT = 2;
  }

  // The URI for the side panel iframe.
  string side_panel_uri = 1 [deprecated = true];

  // The URL for the side panel iframe.
  string side_panel_url = 12;

  // The URI for the "main stage" iframe.
  string main_stage_uri = 2 [deprecated = true];

  // Whether the addon supports screen sharing the main stage.
  bool supports_screen_sharing = 3;

  // Whether the addon supports collaboration or inviting others into the addon
  // experience. This field is deprecated now, please use the top level field in
  // MeetAddOnManifest.
  bool supports_collaboration = 4 [deprecated = true];

  // Whether the addon supports popping out to a browser PiP experience.
  bool supports_pop_out = 5;

  // Deprecated, legacy name. Origins that should be added to the frame-src
  // property of the iframe containing the third party site. Use add_on_origins
  // instead.
  repeated string host_origins = 6 [deprecated = true];

  // Origins that should be added to the frame-src property of the iframe
  // containing the third party site.
  repeated string add_on_origins = 11;

  // The initial state when the addon is opened.
  State open_state = 7;

  // Whether the collaboration add-on supports host controls.
  bool supports_collaboration_host_controls = 8;

  // The URL of the logo to be displayed for the addon. If not specified, the
  // logo defaults to the logo in the common section of the manifest.
  string logo_url = 9;

  // A dark mode version of the logo_url.
  string dark_mode_logo_url = 13;

  // The display flow the add-on will follow when launched.
  DisplayFlow display_flow = 10 [deprecated = true];
}
