syntax = "proto3";

package google.apps.script.type.calendar;

import "google/api/field_behavior.proto";
import "google/apps/script/type/extension_point.proto";

option csharp_namespace = "Google.Apps.Script.Type.Calendar";
option go_package = "google.golang.org/genproto/googleapis/apps/script/type/calendar";
option java_multiple_files = true;
option java_outer_classname = "CalendarAddOnManifestProto";
option java_package = "com.google.apps.script.type.calendar";
option php_namespace = "Google\\Apps\\Script\\Type\\Calendar";
option ruby_package = "Google::Apps::Script::Type::Calendar";

// Manifest section specific to Calendar add-ons.

// Properties customizing the appearance and execution of a Calendar add-on.
message CalendarAddOnManifest {
  // An enum that defines the level of data access event triggers require.
  enum EventAccess {
    // Default value when nothing is set for eventAccess.
    UNSPECIFIED = 0;

    // Gives event triggers the permission to access the metadata of
    // events, such as event ID and calendar ID.
    METADATA = 1;

    // Gives event triggers access to all provided event fields including
    // the metadata, attendees, and conference data.
    READ = 3;

    // Gives event triggers access to the metadata of events and the
    // ability to perform all actions, including adding attendees and setting
    // conference data.
    WRITE = 4;

    // Gives event triggers access to all provided event fields
    // including the metadata, attendees, and conference data and the ability to
    // perform all actions.
    READ_WRITE = 5;
  }

  // Optional. Defines an endpoint that is executed in contexts that don't match
  // a declared contextual trigger. Any cards generated by this function will
  // always be available to the user, but might be eclipsed by contextual
  // content when this add-on declares more targeted triggers.
  //
  // If present, this overrides the configuration from
  // `addOns.common.homepageTrigger`.
  google.apps.script.type.HomepageExtensionPoint homepage_trigger = 6
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Defines conference solutions provided by this add-on.
  repeated ConferenceSolution conference_solution = 3
      [(google.api.field_behavior) = OPTIONAL];

  // An endpoint to execute that creates a URL to the add-on's settings page.
  string create_settings_url_function = 5;

  // An endpoint that triggers when an event is opened to be viewed or edited.
  CalendarExtensionPoint event_open_trigger = 10;

  // An endpoint that triggers when the open event is updated.
  CalendarExtensionPoint event_update_trigger = 11;

  // Optional. Triggers when an event is created or updated for a calendar that
  // the user is subscribed to. Applies only to triggers created by
  // [`HTTP
  // endpoints`](https://developers.google.com/workspace/add-ons/guides/alternate-runtimes)
  // using
  // [`CalendarSubscriptionActionMarkup`](https://developers.google.com/workspace/add-ons/reference/rpc/apps.extensions.markup#apps.extensions.markup.CalendarClientActionMarkup.CalendarSubscriptionActionMarkup).
  //
  // To prevent recursive notification loops, when an add-on modifies a Google
  // Calendar event using Calendar API with authentication credentials from the
  // same Google Cloud project that hosts the add-on deployment, the platform
  // suppresses modification notifications. Self-triggering your own project's
  // Calendar API calls isn't supported.
  //
  // Not applicable to `Apps Script add-ons` and [`Apps Script installable
  // triggers`](https://developers.google.com/apps-script/guides/triggers/installable).
  CalendarExtensionPoint calendar_notification_trigger = 14
      [(google.api.field_behavior) = OPTIONAL];

  // A configuration for a contextual trigger that fires when the user clicks
  // on the add-on attachment provider in the Calendar dropdown menu.
  google.apps.script.type.MenuItemExtensionPoint event_attachment_trigger = 13;

  // Defines the level of data access when an event add-on is triggered.
  EventAccess current_event_access = 12;
}

// Defines conference-related values.
message ConferenceSolution {
  // Required. The endpoint to call when conference data should be created.
  string on_create_function = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. IDs should be uniquely assigned across conference solutions
  // within one add-on, otherwise the wrong conference solution might be used
  // when the add-on is triggered. While you can change the display name of an
  // add-on, the ID shouldn’t be changed.
  string id = 4 [(google.api.field_behavior) = REQUIRED];

  // Required. The display name of the conference solution.
  string name = 5 [(google.api.field_behavior) = REQUIRED];

  // Required. The URL for the logo image of the conference solution.
  string logo_url = 6 [(google.api.field_behavior) = REQUIRED];
}

// Common format for declaring a calendar add-on's triggers.
message CalendarExtensionPoint {
  // Required. The endpoint to execute when this extension point is
  // activated.
  string run_function = 1 [(google.api.field_behavior) = REQUIRED];
}
