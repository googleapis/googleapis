type: google.api.Service
config_version: 3
name: health.googleapis.com
title: Google Health API

apis:
- name: google.devicesandservices.health.v4beta.DataPointsService
- name: google.devicesandservices.health.v4beta.DataSubscriptionService
- name: google.devicesandservices.health.v4beta.HealthProfileService

types:
- name: google.devicesandservices.health.v4beta.DataType
- name: google.devicesandservices.health.v4beta.User
- name: google.devicesandservices.health.v4beta.WebhookNotificationCloudLog

documentation:
  summary: |-
    The Google Health API lets you view and manage health and fitness metrics
    and measurement data.

authentication:
  rules:
  - selector: 'google.devicesandservices.health.v4beta.DataPointsService.*'
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly,
        https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly,
        https://www.googleapis.com/auth/googlehealth.ecg.readonly,
        https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly,
        https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.writeonly,
        https://www.googleapis.com/auth/googlehealth.irn.readonly,
        https://www.googleapis.com/auth/googlehealth.location.readonly,
        https://www.googleapis.com/auth/googlehealth.logged_symptoms.readonly,
        https://www.googleapis.com/auth/googlehealth.logged_symptoms.writeonly,
        https://www.googleapis.com/auth/googlehealth.mindfulness.readonly,
        https://www.googleapis.com/auth/googlehealth.mindfulness.writeonly,
        https://www.googleapis.com/auth/googlehealth.nutrition.writeonly,
        https://www.googleapis.com/auth/googlehealth.reproductive_health.readonly,
        https://www.googleapis.com/auth/googlehealth.reproductive_health.writeonly,
        https://www.googleapis.com/auth/googlehealth.sleep.readonly,
        https://www.googleapis.com/auth/googlehealth.sleep.writeonly
  - selector: google.devicesandservices.health.v4beta.DataPointsService.BatchDeleteDataPoints
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly,
        https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.writeonly,
        https://www.googleapis.com/auth/googlehealth.logged_symptoms.writeonly,
        https://www.googleapis.com/auth/googlehealth.mindfulness.writeonly,
        https://www.googleapis.com/auth/googlehealth.nutrition.writeonly,
        https://www.googleapis.com/auth/googlehealth.reproductive_health.writeonly,
        https://www.googleapis.com/auth/googlehealth.sleep.writeonly
  - selector: google.devicesandservices.health.v4beta.DataPointsService.CreateDataPoint
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly,
        https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.writeonly,
        https://www.googleapis.com/auth/googlehealth.logged_symptoms.writeonly,
        https://www.googleapis.com/auth/googlehealth.mindfulness.writeonly,
        https://www.googleapis.com/auth/googlehealth.nutrition.writeonly,
        https://www.googleapis.com/auth/googlehealth.reproductive_health.writeonly,
        https://www.googleapis.com/auth/googlehealth.sleep.writeonly
  - selector: google.devicesandservices.health.v4beta.DataPointsService.ExportExerciseTcx
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly,
        https://www.googleapis.com/auth/googlehealth.location.readonly
  - selector: google.devicesandservices.health.v4beta.DataPointsService.UpdateDataPoint
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.activity_and_fitness.writeonly,
        https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.writeonly,
        https://www.googleapis.com/auth/googlehealth.logged_symptoms.writeonly,
        https://www.googleapis.com/auth/googlehealth.mindfulness.writeonly,
        https://www.googleapis.com/auth/googlehealth.nutrition.writeonly,
        https://www.googleapis.com/auth/googlehealth.reproductive_health.writeonly,
        https://www.googleapis.com/auth/googlehealth.sleep.writeonly
  - selector: 'google.devicesandservices.health.v4beta.DataSubscriptionService.*'
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/cloud-platform
  - selector: google.devicesandservices.health.v4beta.HealthProfileService.GetIdentity
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly,
        https://www.googleapis.com/auth/googlehealth.ecg.readonly,
        https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly,
        https://www.googleapis.com/auth/googlehealth.irn.readonly,
        https://www.googleapis.com/auth/googlehealth.logged_symptoms.readonly,
        https://www.googleapis.com/auth/googlehealth.mindfulness.readonly,
        https://www.googleapis.com/auth/googlehealth.profile.readonly,
        https://www.googleapis.com/auth/googlehealth.reproductive_health.readonly,
        https://www.googleapis.com/auth/googlehealth.settings.readonly,
        https://www.googleapis.com/auth/googlehealth.sleep.readonly
  - selector: google.devicesandservices.health.v4beta.HealthProfileService.GetIrnProfile
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.irn.readonly
  - selector: google.devicesandservices.health.v4beta.HealthProfileService.GetPairedDevice
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.settings.readonly
  - selector: google.devicesandservices.health.v4beta.HealthProfileService.GetProfile
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.profile.readonly
  - selector: google.devicesandservices.health.v4beta.HealthProfileService.GetSettings
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.settings.readonly
  - selector: google.devicesandservices.health.v4beta.HealthProfileService.ListPairedDevices
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.settings.readonly
  - selector: google.devicesandservices.health.v4beta.HealthProfileService.UpdateProfile
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.profile.writeonly
  - selector: google.devicesandservices.health.v4beta.HealthProfileService.UpdateSettings
    oauth:
      canonical_scopes: |-
        https://www.googleapis.com/auth/googlehealth.settings.writeonly

publishing:
  new_issue_uri: https://issuetracker.google.com/issues/new?component=1914241
  documentation_uri: https://developers.google.com/health/api
  api_short_name: health
  github_label: 'api: health'
  doc_tag_prefix: health
  organization: HEALTH
  library_settings:
  - version: google.devicesandservices.health.v4beta
    launch_stage: BETA
    java_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    python_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    node_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
    dotnet_settings:
      common:
        destinations:
        - PACKAGE_MANAGER
  proto_reference_documentation_uri: https://developers.google.com/health/api/reference/rpc
