syntax = "proto3";

package google.maps.weather.v1;

option csharp_namespace = "Google.Geo.Weather.V1";
option go_package = "cloud.google.com/go/maps/weather/apiv1/weatherpb;weatherpb";
option java_multiple_files = true;
option java_outer_classname = "MapTypesProto";
option java_package = "com.google.maps.weather.v1";
option objc_class_prefix = "GMWV1";
option php_namespace = "Google\\Geo\\Weather\\V1";

// The type of the weather map. Defines the weather event that the
// map will graphically represent. Additional values may be added in the future.
enum MapType {
  option allow_alias = true;

  // The default value. Ignores the value if passed as a parameter.
  MAP_TYPE_UNSPECIFIED = 0;

  // Represents a US precipitation map.
  US_PRECIPITATION = 2;

  // Represents an EU precipitation map.
  EU_PRECIPITATION = 3;

  // Deprecated: Use `US_PRECIPITATION` instead.
  US_PRECIPITATION_CURRENT = 2 [deprecated = true];

  // Deprecated: Use `EU_PRECIPITATION` instead.
  EU_PRECIPITATION_CURRENT = 3 [deprecated = true];
}
