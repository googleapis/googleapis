syntax = "proto3";

package google.chromeos.moblab.v1beta1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "google.golang.org/genproto/googleapis/chromeos/moblab/v1beta1;moblab";
option java_multiple_files = true;
option java_outer_classname = "ResourcesProto";
option java_package = "com.google.chromeos.moblab.v1beta1";
option optimize_for = SPEED;

// Resource that represents a build target.
message BuildTarget {
  option (google.api.resource) = {
    type: "chromeosmoblab.googleapis.com/BuildTarget"
    pattern: "buildTargets/{build_target}"
  };

  // The resource name of the build target.
  // Format: buildTargets/{build_target}
  string name = 1;
}

// Resource that represents a model. Each model belongs to a build target. For
// non-unified build, the model name is the same as its build target name.
message Model {
  option (google.api.resource) = {
    type: "chromeosmoblab.googleapis.com/Model"
    pattern: "buildTargets/{build_target}/models/{model}"
  };

  // The resource name of the model.
  // Format: buildTargets/{build_target}/models/{model}
  string name = 1;
}

// Resource that represents a chrome OS milestone.
// -- NEXT_TAG: 2 --
message Milestone {
  option (google.api.resource) = {
    type: "chromeosmoblab.googleapis.com/Milestone"
    pattern: "milestones/{milestone}"
  };

  // The resource name of the milestone.
  // Format: milestones/{milestone}
  string name = 1;
}

// Resource that represents a build for the given build target, model, milestone
// and build version.
message Build {
  option (google.api.resource) = {
    type: "chromeosmoblab.googleapis.com/Build"
    pattern: "buildTargets/{build_target}/models/{model}/builds/{build}"
  };

  // The build status types.
  enum BuildStatus {
    // No build status is specified.
    BUILD_STATUS_UNSPECIFIED = 0;

    // Complete Status: The build passed.
    PASS = 1;

    // Complete Status: The build failed.
    FAIL = 2;

    // Intermediate Status: The build is still running.
    RUNNING = 3;

    // Complete Status: The build was aborted.
    ABORTED = 4;
  }

  // The build types.
  enum BuildType {
    // Invalid build type.
    BUILD_TYPE_UNSPECIFIED = 0;

    // The release build.
    RELEASE = 1;

    // The firmware build.
    FIRMWARE = 2;
  }

  // The resource name of the build.
  // Format: buildTargets/{build_target}/models/{model}/builds/{build}
  // Example: buildTargets/octopus/models/bobba/builds/1234.0.0
  string name = 1;

  // The milestone that owns the build.
  // Format: milestones/{milestone}
  string milestone = 2 [(google.api.resource_reference) = {
    type: "chromeosmoblab.googleapis.com/Milestone"
  }];

  // The build version of the build, e.g. 1234.0.0.
  string build_version = 3;

  // The status of the build.
  BuildStatus status = 4;

  // The type of the build.
  BuildType type = 5;

  // The branch of the build.
  string branch = 6;

  // The firmware version of the software that is flashed to the chip on the
  // Chrome OS device.
  string rw_firmware_version = 7;

  // The labels of the build.
  repeated string labels = 8;
}

// Resource that represents a build artifact stored in Google Cloud Storage for
// the given build target, model, build version and bucket.
message BuildArtifact {
  option (google.api.resource) = {
    type: "chromeosmoblab.googleapis.com/BuildArtifact"
    pattern: "buildTargets/{build_target}/models/{model}/builds/{build}/artifacts/{artifact}"
  };

  // The resource name of the build artifact.
  // Format:
  // buildTargets/{build_target}/models/{model}/builds/{build}/artifacts/{artifact}
  // Example:
  // buildTargets/octopus/models/bobba/builds/1234.0.0/artifacts/chromeos-moblab-peng-staging
  string name = 1;

  // The build metadata of the build artifact.
  string build = 2 [(google.api.resource_reference) = {
    type: "chromeosmoblab.googleapis.com/Build"
  }];

  // The bucket that stores the build artifact.
  string bucket = 3;

  // The path of the build artifact in the bucket.
  string path = 4;

  // The number of objects in the build artifact folder. The object number can
  // be used to calculated the stage progress by comparing the source build
  // artifact with the destination build artifact.
  uint32 object_count = 5;
}

// Cloud build message for staging a build artifact.
// This message is partially copied from the source proto
// devtools/cloudbuild/v1/cloudbuild.proto
message CloudBuild {
  // The CloudBuild states.
  enum State {
    // No cloud build state is specified.
    STATE_UNSPECIFIED = 0;

    // The cloud build is queued.
    QUEUED = 1;

    // The cloud build is pending.
    PENDING = 2;

    // The cloud build is working.
    WORKING = 3;

    // The cloud build is successful.
    SUCCEEDED = 4;

    // The cloud build is failed.
    FAILED = 5;

    // The cloud build is failed due to internal error.
    INTERNAL_ERROR = 6;

    // The cloud build is failed due to timeout.
    TIMEOUT = 7;

    // The cloud build is cancelled.
    CANCELLED = 8;

    // The cloud build is expired.
    EXPIRED = 9;
  }

  // Output only. Unique identifier of the cloud build.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. State of the cloud build.
  State status = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Time at which the request to create the build was received.
  google.protobuf.Timestamp create_time = 3
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Time at which execution of the build was started.
  google.protobuf.Timestamp start_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Time at which execution of the build was finished.
  //
  // The difference between finish_time and start_time is the duration of the
  // build's execution.
  google.protobuf.Timestamp finish_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A session to run on-demand tests.
message Session {
  option (google.api.resource) = {
    type: "moblab.googleapis.com/Session"
    pattern: "sessions/{session}"
    plural: "sessions"
    singular: "session"
  };

  // The possible lifecycle states of a session.
  enum State {
    // No state is specified.
    STATE_UNSPECIFIED = 0;

    // The session is new and not started.
    NEW = 1;

    // The session is assigned with a device but hasn't started running.
    ASSIGNED = 2;

    // The session is running.
    RUNNING = 3;

    // The session is finished.
    DONE = 4;

    // The session is suspended.
    SUSPENDED = 5;
  }

  // The possible execution results of a session.
  enum Result {
    // No result is specified.
    RESULT_UNSPECIFIED = 0;

    // The session result is unknown or unfinished.
    UNKNOWN = 1;

    // The session passed.
    PASSED = 2;

    // The session finished but failed.
    FAILED = 3;

    // An error occurred during the session.
    ERRORED = 4;

    // The session timed out.
    TIMED_OUT = 5;

    // The session finished abnormally.
    ABORTED = 6;

    // The session was skipped.
    SKIPPED = 7;
  }

  // The type of the test (e.g. suite, testplan).
  enum Type {
    // Default value.
    TYPE_UNSPECIFIED = 0;

    // The test is a suite.
    SUITE = 1;

    // The test is a testplan.
    TESTPLAN = 2;
  }

  // Identifier. The resource name of the session.
  // Format: sessions/{session}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. The ID of the Satlab that the request comes from.
  string satlab_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // Required. Input only. The dimensions of the device(s) to run tests on.
  map<string, string> dimensions = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];

  // Optional. Input only. The timeout settings for the test run.
  Timeout timeout = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = INPUT_ONLY
  ];

  // Optional. Input only. The number of shards to use for the test run.
  int32 shard_count = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = INPUT_ONLY
  ];

  // The test to run.
  oneof test {
    // Input only. A Tradefed-based test.
    TradefedTest tradefed_test = 6 [(google.api.field_behavior) = INPUT_ONLY];
  }

  // Output only. The state of the session.
  State state = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The result of the session.
  Result result = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Time at which the session was created.
  google.protobuf.Timestamp create_time = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Time at which execution of the session was started.
  google.protobuf.Timestamp start_time = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Time at which execution of the session was finished.
  google.protobuf.Timestamp finish_time = 11
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The ResultDB root invocation ID for the session.
  string resultdb_root_invocation_id = 12
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. The ResultDB work unit ID for the session.
  string resultdb_work_unit_id = 15 [(google.api.field_behavior) = OPTIONAL];

  // Input only. The ResultDB work unit update token for the session.
  string resultdb_work_unit_update_token = 16
      [(google.api.field_behavior) = INPUT_ONLY];

  // Optional. The type of the test.
  Type type = 13 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The display name of the test (e.g. dummy_suite, dummy_testplan).
  string display_name = 14 [(google.api.field_behavior) = OPTIONAL];
}

// Timeout settings for the test run.
message Timeout {
  // Optional. Max execution time of a job.
  google.protobuf.Duration job_timeout = 1
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Max execution time of a single test.
  google.protobuf.Duration test_timeout = 2
      [(google.api.field_behavior) = OPTIONAL];

  // Optional. Timeout for starting the job and waiting for allocating the first
  // device.
  google.protobuf.Duration start_timeout = 3
      [(google.api.field_behavior) = OPTIONAL];
}

// Configuration for a Tradefed-based test.
message TradefedTest {
  // Required. The command to run the Tradefed test.
  string command = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Map from shard index to extra arguments to append to the command.
  // The key is the 0-based shard index (i.e. 0, 1, ..., shard_count - 1).
  // If shard_count is 0 or 1, only key 0 is valid.
  map<int32, string> shard_args = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Summary information for an entire test effort
message TestEffort {
  option (google.api.resource) = {
    type: "chromeosmoblab.googleapis.com/TestEffort"
    pattern: "testEfforts/{test_effort}"
    plural: "testEfforts"
    singular: "testEffort"
  };

  // The board and model of the test effort.
  message BoardModel {
    // Required. The board name.
    string board = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The model name.
    string model = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // The pool of the test effort.
  message Pool {
    // The category of pool to schedule tests against.
    enum PoolType {
      // Not used. Exists to distinguish between an unset value and DEFAULT.
      POOL_TYPE_UNSPECIFIED = 0;

      // Pools used when scheduling tests without any special exceptions
      DEFAULT_POOL = 1;

      // Pools to use when scheduling FAFT PD tests.
      FAFT_PD = 2;

      // Pools to schedule tests with extremely long runtimes (3+ hours)
      EXTENDED_DURATION = 3;
    }

    // Required. The label of the pool.
    string label = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The category of pool to schedule tests against.
    PoolType type = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // Represents the Android build target.
  message AndroidBuildTarget {
    // Required. Represents the name of a configured branch in the Android Build
    // system
    string branch = 1 [(google.api.field_behavior) = REQUIRED];

    // Optional. Specifies the release configuration of the build target.
    string release_config = 2 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Specifies the build variant for the target.
    string build_variant = 3 [(google.api.field_behavior) = OPTIONAL];

    // Required. The build ID of the test effort.
    string build_id = 4 [(google.api.field_behavior) = REQUIRED];

    // Optional. Product name of the build target.
    string product = 5 [(google.api.field_behavior) = OPTIONAL];

    // Optional. Directly specifies the build target name.
    // When it is used, product, build_variant, and release_config are
    // overridden.
    string target = 6 [(google.api.field_behavior) = OPTIONAL];
  }

  // The possible states of a test effort.
  //
  // `SUCCEEDED`, `NOT_APPLICABLE`, `FAILED` and `CANCELLED` are final (see
  // `FAILED` for an exception); all other values may still change. New
  // values may be added in the future. Clients should treat unrecognized
  // values as a state that is not final.
  enum State {
    // No test effort state is specified.
    STATE_UNSPECIFIED = 0;

    // Created. Superseded by `QUEUED`; clients should treat both values the
    // same way.
    CREATED = 1;

    // Has incomplete results. Superseded by `RUNNING` and `INVESTIGATING`:
    // servers that do not report `INVESTIGATING` report those test efforts as
    // `INCOMPLETE`; when set, `status_message` describes the actual state.
    INCOMPLETE = 2;

    // Failed. Servers that do not report `BLOCKED`, or that do not report a
    // time-limit stop as `CANCELLED`, report those test efforts as `FAILED`;
    // when set, `status_message` describes the actual state.
    FAILED = 3;

    // The test effort has unreported results.
    UNREPORTED = 4;

    // The test effort is not applicable.
    NOT_APPLICABLE = 5;

    // Passed.
    SUCCEEDED = 6;

    // The test effort is requested to be cancelled.
    CANCEL_REQUESTED = 7;

    // Stopped, either because the requester cancelled it or because it reached
    // its time limit. See `status_message` for the reason.
    CANCELLED = 8;

    // Cancelling the test effort failed.
    CANCEL_FAILED = 9;

    // Waits to start; no test has run yet because it is waiting for pickup, for
    // a free device, or for a previous stage to finish.
    QUEUED = 10;

    // Starts testing: tests are running, retrying, awaiting results, or being
    // re-checked by Google, or a later stage is waiting to start after an
    // earlier stage finished.
    RUNNING = 11;

    // Cannot make progress until the requester acts, for example by fixing the
    // request settings or repairing a device.
    BLOCKED = 12;

    // Delayed by a problem on Google's side, such as a lab, test harness, or
    // system problem, or its status is temporarily unknown. Google is
    // investigating; no action is needed from the requester.
    INVESTIGATING = 13;
  }

  // The firmware type.
  enum FirmwareType {
    // No firmware type is specified.
    FIRMWARE_TYPE_UNSPECIFIED = 0;

    // The read only firmware type.
    READ_ONLY = 1;

    // The read write firmware type.
    READ_WRITE = 2;
  }

  // The version of the firmware test effort.
  message FirmwareTestEffortVersion {
    // Required. The major version of the firmware test effort.
    int32 major_version = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The minor version of the firmware test effort.
    int32 minor_version = 2 [(google.api.field_behavior) = REQUIRED];

    // Required. The patch number of the firmware test effort.
    int32 patch_number = 3 [(google.api.field_behavior) = REQUIRED];

    // Optional. The URI of the firmware.
    string uri = 4 [(google.api.field_behavior) = OPTIONAL];
  }

  // The version of the GSC test effort.
  message GscTestEffortVersion {
    // Required. The major version of the GSC test effort
    int32 major_version = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The minor version of the GSC test effort.
    int32 minor_version = 2 [(google.api.field_behavior) = REQUIRED];

    // Required. The epoch of the GSC test effort.
    int32 generation = 3 [(google.api.field_behavior) = REQUIRED];

    // Optional. The URI of the GSC.
    string uri = 4 [(google.api.field_behavior) = OPTIONAL];
  }

  // The target of the firmware.
  message FirmwareTarget {
    // The firmware content.
    oneof fw {
      // The EC firmware version.
      FirmwareTestEffortVersion ec = 1;

      // The AP firmware version.
      FirmwareTestEffortVersion ap = 2;

      // The GSC firmware version.
      GscTestEffortVersion gsc = 3;

      // The FPMCU firmware version.
      FirmwareTestEffortVersion fpmcu = 4;
    }
  }

  // The configuration of the firmware.
  message FirmwareConfig {
    // Required. The firmware target.
    FirmwareTarget firmware_target = 1 [(google.api.field_behavior) = REQUIRED];

    // Required. The firmware types.
    repeated FirmwareType firmware_types = 2
        [(google.api.field_behavior) = REQUIRED];
  }

  // Identifier. The resource name of the test effort.
  // Format: testEfforts/{test_effort}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The ID of the test effort.
  string test_effort_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The satlab ID that the test effort comes from.
  string satlab_id = 3 [(google.api.field_behavior) = OPTIONAL];

  // The test target of the test effort.
  oneof test_target {
    // The board and model of the test effort.
    BoardModel board_model = 4;
  }

  // Required. The pools of the test effort.
  repeated Pool pools = 5 [(google.api.field_behavior) = REQUIRED];

  // Required. Test plan reference.
  string test_plan = 6 [(google.api.field_behavior) = REQUIRED];

  // Specifies the Operating System build targets to test against.
  oneof os {
    // Test against an Android build.
    AndroidBuildTarget android = 7;

    // Deprecated: Use android.target instead.
    // Directly specifies the build target name.
    string build_target_override = 13 [deprecated = true];
  }

  // Output only. Specifies the current state of the test effort.
  State state = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time when the test effort was created.
  google.protobuf.Timestamp create_time = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Testhaus link.
  string testhaus_url = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The firmware configuration of the test effort.
  repeated FirmwareConfig firmware_configs = 11
      [(google.api.field_behavior) = OPTIONAL];

  // Test target details if different from the main build target.
  oneof test_source {
    // Test against an Android build target.
    AndroidBuildTarget android_test_target = 12;

    // Deprecated: Use android_test_target.target instead.
    // Directly specifies the test target name.
    string test_target_override = 14 [deprecated = true];
  }

  // Optional. Option to make boot tests optional.
  bool skip_boot_prerequisite = 15 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The number of static shards to use for this test effort.
  int32 static_shard_count = 16 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Explains the current state in a human-readable sentence in
  // English, for example "Waiting for a lab device" or "Stopped: time limit
  // reached". Intended for display only and its wording may change; use `state`
  // for programmatic decisions.
  string status_message = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A checklist of presets assigned to one device (a board and model) of the
// caller's partner account.
message PresetAssignment {
  option (google.api.resource) = {
    type: "chromeosmoblab.googleapis.com/PresetAssignment"
    pattern: "presetAssignments/{preset_assignment}"
    plural: "presetAssignments"
    singular: "presetAssignment"
  };

  // The possible states of a preset assignment.
  // Unknown values are treated as not launchable.
  enum State {
    // No state is specified.
    STATE_UNSPECIFIED = 0;

    // The assignment is active.
    ACTIVE = 1;

    // The assignment is upcoming. It is shown but cannot be launched yet.
    UPCOMING = 2;

    // The assignment is completed. New launches are supplemental and do not
    // replace the completed results.
    COMPLETED = 3;
  }

  // The hardware development phases of a device.
  enum DevicePhase {
    // No device phase is specified.
    DEVICE_PHASE_UNSPECIFIED = 0;

    // Bring-up.
    BRINGUP = 1;

    // Prototype.
    PROTO = 2;

    // Engineering validation test.
    EVT = 3;

    // Design validation test.
    DVT = 4;

    // Production validation test.
    PVT = 5;

    // Final software image release candidate.
    FSI_RC = 6;

    // Mass production.
    MP = 7;
  }

  // Identifier. The resource name of the preset assignment.
  // Format: presetAssignments/{preset_assignment}
  // The last segment is the assignment ID that clients use in run tags.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The title of the assigned checklist.
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The state of the preset assignment.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The board name.
  string board = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The model name.
  string model = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The phase of the device that the checklist is assigned for.
  DevicePhase device_phase = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The current cycle of the assignment, starting at 1. A new
  // cycle starts the checklist over.
  int32 cycle = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The recommended OS build ID of the current cycle. If empty,
  // the OS build is entered at launch. The partner can replace it at launch.
  string os_build = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The presets of the assignment, in checklist order. Excluded
  // presets are already removed.
  repeated AssignedPreset presets = 9
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One preset of a preset assignment, ready to launch.
message AssignedPreset {
  // The operating system types of a preset.
  // Unknown values are treated as not launchable.
  enum OsType {
    // No OS type is specified.
    OS_TYPE_UNSPECIFIED = 0;

    // Android desktop.
    ANDROID_DESKTOP = 1;
  }

  // Launch inputs of a preset that runs through `satlab run`.
  message SatlabRun {
    // How the DUTs of a run are selected.
    // Unknown values are treated as not launchable.
    enum DutSelection {
      // No DUT selection is specified.
      DUT_SELECTION_UNSPECIFIED = 0;

      // The run is scheduled on any DUTs of a pool, which is picked at launch.
      POOL = 1;

      // The run uses a single DUT, which is picked at launch.
      SINGLE_DUT = 2;
    }

    // Output only. The `satlab run` flags of the preset, keyed by flag name
    // without the leading dash, for example "skip-provisioning" -> "true". Each
    // value is one flag argument as the flag parser accepts it: list values are
    // joined by commas and map values are written as key=value. Never contains
    // host-only flags, which the client sets itself, such as board, model,
    // pool, build, target and dims. Clients validate the flags again before
    // launch.
    map<string, string> flags = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The `-target` value, already chosen for the user or
    // userdebug image that the preset needs. Empty if and only if `flags` sets
    // "skip-provisioning" to "true"; then the client passes neither `-target`
    // nor `-build`.
    string os_target = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. How the DUTs of the run are selected.
    DutSelection dut_selection = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Launch inputs of a LabQual preset. DUTs are picked at launch.
  message Labqual {
    // Output only. The OS build target. The client passes it only when the
    // launch has an OS build, either the assignment's os_build or one entered
    // at launch.
    string os_target = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. The firmware version without the "Google_<Board>." prefix,
    // for example "12345.67.0". If empty, the stable version is used.
    string firmware_version = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Output only. The ID of the preset. Unique within the assignment.
  string preset_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The version of the preset that the assignment uses.
  int32 preset_version = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The title of the preset.
  string display_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Notes from the preset author, shown before launch.
  string description = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether the preset is required for sign-off.
  bool signoff_required = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether the assignment overrides the preset spec for this
  // device.
  bool overridden = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The OS type of the preset.
  OsType os_type = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // How the preset is launched. If no known member is set, the preset is not
  // launchable by this client.
  oneof launch {
    // Output only. Launch through `satlab run`.
    SatlabRun satlab_run = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Output only. Launch through the LabQual path.
    Labqual labqual = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  }
}
